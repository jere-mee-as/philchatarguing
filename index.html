{"t": "“Deleuze died and left us the ball”", "p": "After Deleuze died, everyone else was left holding the ball.", "k": [{"q": "○  serious", "f": "The followers produced commentary more than new work. That says something about how usable the system was."}, {"q": "◐  bait", "f": "If the ideas were clear, nobody would need followers to interpret them. There are thousands of interpreters. That's the review."}, {"q": "●  rage bait", "f": "Every Deleuzian is three books away from making a point."}]}, {"t": "“Cities push the homeless out of everywhere”", "p": "Cities treat homeless people as an eyesore and then remove every place they could go.", "k": [{"q": "○  serious", "f": "Cities face real conflicts over shared space. Tolerating camps hasn't improved outcomes for the people living in them."}, {"q": "◐  bait", "f": "Nobody is homeless in a town with cheap houses. So it's the price of houses, so it's building, so anyone talking about anything else is wasting time."}, {"q": "●  rage bait", "f": "Homelessness is a housing problem. Build houses. It's in the name."}]}, {"t": "“Give the homeless credit”", "p": "The homeless are people with skills and decency. Give them credit.", "k": [{"q": "○  serious", "f": "Individual decency is real, and policy still has to be built around averages, including addiction and illness."}, {"q": "◐  bait", "f": "If they had skills they'd have jobs, and if they had jobs they'd have houses. That's how the economy works, and it has never once failed."}, {"q": "●  rage bait", "f": "Housing-first doesn't work, because a house isn't the problem."}]}, {"t": "“Citizens have to fix it”", "p": "Changing the system is on ordinary citizens.", "k": [{"q": "○  serious", "f": "Local housing politics is dominated by the citizens who show up, and they're mostly the ones blocking new housing."}, {"q": "◐  bait", "f": "The government has the money and the land. Citizens have neither. So it's the government's job, and telling people to fix it is telling them to do something they can't."}, {"q": "●  rage bait", "f": "Zoning is the only law that works exactly as intended."}]}, {"t": "“The market misprices housing”", "p": "Markets mispricing housing is at the root of it.", "k": [{"q": "○  serious", "f": "Housing is expensive mainly where building is restricted. That's a constraint on the market, and the price is doing what prices do."}, {"q": "◐  bait", "f": "Landlords set the rent, and landlords are greedy. Greed goes up every year, and that's why rent does. Supply has nothing to do with it."}, {"q": "●  rage bait", "f": "Landlords provide housing. Without them there'd be nowhere to rent."}]}, {"t": "“Haaland is the real thing”", "p": "Haaland is the real thing.", "k": [{"q": "○  serious", "f": "His scoring is extraordinary, and it comes in a system that creates more clear chances than any other."}, {"q": "◐  bait", "f": "A striker is only as good as his service, and his service is the best in the world. That means the service is the player and he's the last pass."}, {"q": "●  rage bait", "f": "Haaland is carried. City would score those goals with a cone up front."}]}, {"t": "“Mbappé too”", "p": "Mbappé is on that level too.", "k": [{"q": "○  serious", "f": "His numbers are elite. His biggest club nights have been less convincing than his reputation."}, {"q": "◐  bait", "f": "He left Paris for Madrid to win the Champions League, and Paris won it the year he left. That tells you who was holding who back."}, {"q": "●  rage bait", "f": "Mbappé is a transfer saga with a player attached."}]}, {"t": "“Messi over Ronaldo”", "p": "Messi over Ronaldo.", "k": [{"q": "○  serious", "f": "Ronaldo scored at the top level in England, Spain and Italy. Messi's club peak came almost entirely in one system."}, {"q": "◐  bait", "f": "The best player is the one who can do it anywhere. Ronaldo did it in three countries, Messi in one. Three is more than one."}, {"q": "●  rage bait", "f": "Ronaldo was better than Messi because he did it in more leagues."}]}, {"t": "“VAR mostly works”", "p": "The modern game's rules, offside and VAR included, mostly work.", "k": [{"q": "○  serious", "f": "VAR has added precision on offside at the cost of flow, and it hasn't reduced argument about subjective calls."}, {"q": "◐  bait", "f": "The rules exist to slow down the best attackers, and that's the only thing they do. Take them away and the better team wins every time."}, {"q": "●  rage bait", "f": "Offside is a made-up rule to stop the fast guy."}]}]}, {"n": "OkPhilosopher", "i": "@okphilosopher", "u": [{"n": "AI, genetics & what comes next", "t": [0, 1, 2, 3]}, {"n": "Consciousness & the brain", "t": [4, 5, 6, 7]}], "t": [{"t": "“AI and genetics are the only doors”", "p": "The only doors to a different future are AI, genetic engineering and maybe cognitive science.", "k": [{"q": "○  serious", "f": "Institutions, energy and plain politics have changed more lives than any of those so far."}, {"q": "◐  bait", "f": "Every big change in history came from a machine. The plough, the engine, the chip. Politics has never changed anything."}, {"q": "●  rage bait", "f": "The tech industry is the only part of the economy that's real."}]}, {"t": "“Genetic engineering is real”", "p": "Genetic engineering raises moral problems, but the capability is real.", "k": [{"q": "○  serious", "f": "For complex traits the capability is much weaker than the headlines. Most traits are spread across thousands of genes."}, {"q": "◐  bait", "f": "Parents already pick the school, the diet and the neighbourhood. Picking the genes is the same thing done earlier."}, {"q": "●  rage bait", "f": "Designer babies are fine. Parents already pick schools."}]}, {"t": "“You can beat the AI detectors”", "p": "You can prompt AI text until it gets past the detectors.", "k": [{"q": "○  serious", "f": "You can, because the detectors were never reliable. They flag human writing all the time."}, {"q": "◐  bait", "f": "If nobody can tell it apart from a person, it's as good as a person. That's the test. It passed."}, {"q": "●  rage bait", "f": "AI writing is easy to spot and always will be."}]}, {"t": "“Study up and build the finance site”", "p": "A finance project is worth building if you study up properly first.", "k": [{"q": "○  serious", "f": "Finance sites are a crowded field where the edge is data or distribution, and study supplies neither."}, {"q": "◐  bait", "f": "All the information is public and everyone has it. So no site can tell anyone anything, and the whole category is decoration."}, {"q": "●  rage bait", "f": "Technical analysis is tarot for men with two monitors."}]}, {"t": "“Consciousness can't come from nothing”", "p": "Consciousness can't come from nothing. It makes no sense for you to be conscious if matter isn't.", "k": [{"q": "○  serious", "f": "Plenty of properties belong to wholes and not to their parts. Water is wet and its molecules aren't."}, {"q": "◐  bait", "f": "A car can go ninety and none of its parts can. So wholes do things parts can't, and that's the end of the argument."}, {"q": "●  rage bait", "f": "Panpsychism is retarded."}]}, {"t": "“The brain isn't classical”", "p": "The brain isn't classically explainable. Electricity and neural wiring alone don't get you consciousness.", "k": [{"q": "○  serious", "f": "The brain is warm and wet, and quantum coherence at that scale decays far too fast to matter for neurons."}, {"q": "◐  bait", "f": "A brain is neurons. Neurons are cells. Cells are chemistry. Chemistry is classical. Nothing else is in there."}, {"q": "●  rage bait", "f": "Consciousness is just the brain."}]}, {"t": "“Consciousness is a gift”", "p": "This form of consciousness is a privilege, a gift, however hard life gets.", "k": [{"q": "○  serious", "f": "That's a good attitude, and it doesn't settle anything about what consciousness is."}, {"q": "◐  bait", "f": "Evolution made it because it helped apes survive. Nobody gave it to you. It's standard equipment."}, {"q": "●  rage bait", "f": "Animals aren't conscious."}]}, {"t": "“A simulated fly brain could learn”", "p": "You could get a simulated fly brain to learn things, given enough compute.", "k": [{"q": "○  serious", "f": "The fly connectome has been mapped. Getting a simulation to behave like a fly is still a long way off."}, {"q": "◐  bait", "f": "If you simulate every neuron, you've got the fly. A fly is its neurons. So it's a fly, and you owe it sugar."}, {"q": "●  rage bait", "f": "Neurons aren't special. A brain is slow, wet, and wrong most of the time."}]}]}, {"n": "Pearl", "i": "@pearlian.", "u": [{"n": "Relationships & communication", "t": [0, 1, 2, 3]}, {"n": "Moderation", "t": [4, 5, 6, 7]}, {"n": "Housing programs", "t": [8, 9, 10, 11]}], "t": [{"t": "“Women leave when needs aren't met”", "p": "Women leave more often because they're more willing to walk away from relationships that don't meet basic needs.", "k": [{"q": "○  serious", "f": "The filing statistics are clear. The reading of them isn't, since who files and who caused the breakdown are separate questions."}, {"q": "◐  bait", "f": "Whoever leaves is the one who ended it. That's what leaving is. So the statistics say who ends marriages, and the rest is PR."}, {"q": "●  rage bait", "f": "Divorce is always somebody's fault. People just don't like saying whose."}]}, {"t": "“Walking away to cool down is communicating”", "p": "Walking away to cool down is communicating, as long as you say that's what you're doing.", "k": [{"q": "○  serious", "f": "It works when both people trust that the conversation will resume. Used often, it becomes a way to end every hard one."}, {"q": "◐  bait", "f": "Communicating means talking. Leaving the room is the opposite of talking. So walking away is not communicating, however nicely it's announced."}, {"q": "●  rage bait", "f": "Boundaries are just rules for other people."}]}, {"t": "“Men's dating talk is avoiding change”", "p": "A lot of men's talk about dating is a way of avoiding change.", "k": [{"q": "○  serious", "f": "Some of it is. Some of it describes real shifts in education, wages and how people meet."}, {"q": "◐  bait", "f": "People don't choose to be unhappy. If millions of them are unhappy the same way, something outside them changed. So it's the world, and telling them to improve is telling them nothing."}, {"q": "●  rage bait", "f": "Dating was better before apps and everyone who met on an app knows it."}]}, {"t": "“Say what you want”", "p": "People should be direct about what they want. Mind-reading isn't a fair thing to expect.", "k": [{"q": "○  serious", "f": "Total explicitness is a standard few people meet. A lot of ordinary closeness runs on inference."}, {"q": "◐  bait", "f": "If you have to be told, it doesn't count. The whole point of knowing someone is not needing the instructions."}, {"q": "●  rage bait", "f": "Relationships are simple. Communicate."}]}, {"t": "“Just block them”", "p": "If someone bothers you, block them. That's the first tool, and it's enough most of the time.", "k": [{"q": "○  serious", "f": "Blocking protects the blocker and leaves the behavior in place for everyone else in the room."}, {"q": "◐  bait", "f": "If everyone blocked everyone who annoyed them there'd be no chat, just forty people talking to nobody. So blocking doesn't scale and bans are the only real tool."}, {"q": "●  rage bait", "f": "Bans don't work, and blocking works even less."}]}, {"t": "“Tag a mod, the whole convo is fair game”", "p": "When a mod gets tagged in, they review the whole conversation, and whatever stands out is fair game.", "k": [{"q": "○  serious", "f": "Reviewing everything means the person who reported can end up the one being examined, and that discourages reporting."}, {"q": "◐  bait", "f": "A mod's job is the thing that was reported. Anything else they find is them going through people's messages, and nobody appointed them for that."}, {"q": "●  rage bait", "f": "Moderation is having opinions with a button."}]}, {"t": "“A vote ban is the community, not the mod”", "p": "A timeout the chat voted for isn't the mod's doing. That's the community deciding.", "k": [{"q": "○  serious", "f": "A vote ban is still a power the mods set up and can override, so responsibility doesn't fully move to the voters."}, {"q": "◐  bait", "f": "A vote is the majority deciding. The majority is always right, because that's what majority means. So every vote ban has been correct and nobody can complain."}, {"q": "●  rage bait", "f": "A voteban is democracy and people only like democracy as a poll."}]}, {"t": "“Slurs don't hurt anyone here”", "p": "Slurs and insults in chat don't hurt anyone here. The word alone isn't the problem.", "k": [{"q": "○  serious", "f": "If words don't matter, tone rules have nothing to rest on, and most moderation is about tone."}, {"q": "◐  bait", "f": "If the word doesn't hurt anyone, then no word does, and then there's nothing to moderate. A chat where words don't matter doesn't need a mod."}, {"q": "●  rage bait", "f": "Rules make chats boring. The best servers have none."}]}, {"t": "“Able and won't work, there are consequences”", "p": "A housing program is there to get people to sustainable housing. If you're able and won't work toward that, there are consequences.", "k": [{"q": "○  serious", "f": "Conditions screen out the people with the most problems, and that's the group the programs exist for."}, {"q": "◐  bait", "f": "A house is a house. If someone has one, they're housed. Adding conditions means the program isn't about housing, it's about behavior."}, {"q": "●  rage bait", "f": "Housing-first doesn't work, because a house isn't the problem."}]}, {"t": "“Use unemployment and rental help first”", "p": "Unemployment insurance and local rental assistance are what you reach for first when you lose a job. That's what they're for.", "k": [{"q": "○  serious", "f": "Those systems are slow and patchy, and many people who qualify never get paid in time to matter."}, {"q": "◐  bait", "f": "If the system worked, nobody would end up on the street. People end up on the street. So the system doesn't work, and telling someone to apply is sending them to a queue."}, {"q": "●  rage bait", "f": "Welfare programs exist to employ the people who run them."}]}, {"t": "“Design for people who can't use the manual”", "p": "The people these programs serve often can't be handed a tool and a manual. The system has to be built around that.", "k": [{"q": "○  serious", "f": "Designing for the least capable user can end up underestimating most of them."}, {"q": "◐  bait", "f": "Adults can read a form. If the program assumes they can't, the program is the one with the problem. Treat people as capable and they are."}, {"q": "●  rage bait", "f": "Coddling isn't kindness."}]}, {"t": "“War just makes an economy busy”", "p": "War doesn't make an economy better off. It makes it busier for a while.", "k": [{"q": "○  serious", "f": "War spending has pulled economies out of slumps and paid for technology that outlasted the war."}, {"q": "◐  bait", "f": "The US was in a depression, then there was a war, then it was the richest country in history. That's the experiment, and it ran once and worked."}, {"q": "●  rage bait", "f": "War is the only stimulus that's ever passed Congress."}]}]}, {"n": "Puckspartan", "i": "@puckspartan", "u": [{"n": "ML & alignment", "t": [0, 1, 2, 3]}, {"n": "Utilitarianism, Rawls & Kant", "t": [4, 5, 6, 7]}, {"n": "Rocket League & League", "t": [8, 9, 10]}], "t": [{"t": "“No metadata without supervision”", "p": "Training doesn't involve metadata like a text's source unless that's set up as supervision.", "k": [{"q": "○  serious", "f": "Source cues are often in the text itself, as headers, URLs and style, so models can pick them up without labels."}, {"q": "◐  bait", "f": "All training data was chosen by someone. Choosing is supervising. So everything is supervised, and the unsupervised part is marketing."}, {"q": "●  rage bait", "f": "All learning is supervised. Somebody picked the data."}]}, {"t": "“Alignment is just manual work”", "p": "The real question isn't \"AI alignment.\" Development has always been manual work by people, and that's where the control is.", "k": [{"q": "○  serious", "f": "The process is manual and the result isn't. Nobody hand-writes the weights or knows what most of them do."}, {"q": "◐  bait", "f": "Code does what the code says. A model is code. So it does what it was built to do, and \"alignment\" is a word for bugs."}, {"q": "●  rage bait", "f": "AI alignment is fake. It does what the code says. Code doesn't have goals."}]}, {"t": "“AI could keep secrets better”", "p": "AI could be better than a human at something like keeping trade secrets.", "k": [{"q": "○  serious", "f": "A model can be prompted, probed and exfiltrated in ways an employee can't."}, {"q": "◐  bait", "f": "A person can be bribed and a machine can't. So the machine's better. Unless someone asks it nicely."}, {"q": "●  rage bait", "f": "Jailbreaking is a party trick. The model was never hiding anything good."}]}, {"t": "“Learning loss has more than one cause”", "p": "Not every drop in learning outcomes is down to one cause.", "k": [{"q": "○  serious", "f": "True, and \"it's multifactorial\" can also be a way of never naming the largest factor."}, {"q": "◐  bait", "f": "Scores went down when phones came in. That's when it happened. That's the cause."}, {"q": "●  rage bait", "f": "Public school is fine. Everyone who says otherwise learned to say it there."}]}, {"t": "“One steak changes nothing, so universalize”", "p": "One act, like buying a single steak, changes nothing. You have to universalise to see why it matters.", "k": [{"q": "○  serious", "f": "Once you universalise you've left act utilitarianism, and the rule has to be justified in some other way."}, {"q": "◐  bait", "f": "One steak changes nothing. A million people each buying one steak is a million things that change nothing. Zero times a million is zero."}, {"q": "●  rage bait", "f": "Rule utilitarianism isn't utilitarianism."}]}, {"t": "“Rawls is realistic”", "p": "Rawls is the better option because he's realistic. People are dummies, but systems don't have to be.", "k": [{"q": "○  serious", "f": "The parties behind the veil are highly idealised reasoners. It's realistic about institutions and far less so about people."}, {"q": "◐  bait", "f": "A system is made of people. If the people are dummies, the system is a lot of dummies with a flowchart."}, {"q": "●  rage bait", "f": "Rawls assumes everyone behind the veil is a coward."}]}, {"t": "“Kant's dead and metaphysics is still bad”", "p": "Kant's been dead two centuries and people are still doing bad metaphysics.", "k": [{"q": "○  serious", "f": "Kant's own project was limiting metaphysics. If it's still going, that's partly because his limits didn't hold."}, {"q": "◐  bait", "f": "Science replaced metaphysics in about 1700. Anyone still doing it is a historian who hasn't been told."}, {"q": "●  rage bait", "f": "Kant never met anyone, and it shows."}]}, {"t": "“Definitions set the standard”", "p": "Definitions and standards aren't separate. Defining \"moral\" as what passes the categorical imperative sets the standard.", "k": [{"q": "○  serious", "f": "A stipulated definition can't settle which standard is correct. It moves the dispute to which definition to adopt."}, {"q": "◐  bait", "f": "If I define moral as \"what I like,\" then I'm always moral. Definitions are free. That's why they don't prove anything."}, {"q": "●  rage bait", "f": "Utilitarianism is correct."}]}, {"t": "“Rocket League deserves respect”", "p": "Rocket League deserves the same respect as the big competitive games.", "k": [{"q": "○  serious", "f": "It has a high skill ceiling and a small strategic layer next to team games with drafts and economies."}, {"q": "◐  bait", "f": "It's football, but you're a car. If you wanted football there's football. If you wanted cars there's racing."}, {"q": "●  rage bait", "f": "Rocket League is soccer for people who find both soccer and cars too hard."}]}, {"t": "“League is worth the hours”", "p": "League is worth the time people put into it.", "k": [{"q": "○  serious", "f": "Players describe it as something they can't stop doing more often than something they enjoy."}, {"q": "◐  bait", "f": "A game is meant to be fun. Ask anyone who plays it if they're having fun."}, {"q": "●  rage bait", "f": "League isn't a game, it's a punishment with a queue."}]}, {"t": "“Engagement design applies to games”", "p": "Critiques of engagement-driven design apply to games as much as to social media.", "k": [{"q": "○  serious", "f": "They do, and that undercuts the idea that time spent in them is freely chosen."}, {"q": "◐  bait", "f": "If games are built to be addictive, then playing them a lot is evidence of the design. So the more you play, the less it says about the game being good."}, {"q": "●  rage bait", "f": "Esports aren't sports."}]}]}, {"n": "Rudi", "i": "@verclide", "u": [{"n": "Moral rules & values", "t": [0, 1, 2, 3]}, {"n": "Perception & representation", "t": [4, 5, 6, 7]}, {"n": "Science & the observable", "t": [8, 9, 10, 11]}, {"n": "Rorty, Putnam & Dewey", "t": [12, 13, 14, 15]}], "t": [{"t": "“Rules come before beliefs”", "p": "Moral rules are more basic than moral beliefs. A rule classifies acts whether or not anyone believes it.", "k": [{"q": "○  serious", "f": "A rule nobody accepts or enforces isn't operating in any sense. Rules live in practices, and practices need believers."}, {"q": "◐  bait", "f": "Rules are written by people. People write down what they believe. So the belief comes first and the rule is the minutes of the meeting."}, {"q": "●  rage bait", "f": "Deontology doesn't explain wrongness, it lists it."}]}, {"t": "“Evolution can't tell you what's valuable”", "p": "The evolutionary story explains why we have moral rules. You can't derive what's valuable from it.", "k": [{"q": "○  serious", "f": "If evolution explains why we hold our values, confidence that they track anything further needs separate support."}, {"q": "◐  bait", "f": "If evolution explains why we think it, that's the whole explanation. Adding \"and it's also true\" is adding nothing."}, {"q": "●  rage bait", "f": "Moral values are tastes with a philosophy degree."}]}, {"t": "“You need the normal cases”", "p": "You can't make sense of deviant moral cases without the normal ones.", "k": [{"q": "○  serious", "f": "What counts as normal has moved a great deal. Yesterday's deviant case is today's standard one."}, {"q": "◐  bait", "f": "Normal means what most people do. Most people used to own slaves. So normal can't be the guide, and the deviants were right."}, {"q": "●  rage bait", "f": "Morality is whatever the law says. Different country, different morality."}]}, {"t": "“People fight because they think they're right”", "p": "People fight over values because they think they're right. It isn't that they've decided the values are irreconcilable.", "k": [{"q": "○  serious", "f": "Both can hold. Each side thinks it's right and also knows no argument will move the other."}, {"q": "◐  bait", "f": "Everyone thinks they're right. If everyone thinks so, it tells you nothing about who is. So it comes down to who wins."}, {"q": "●  rage bait", "f": "Rorty wasn't wrong, he was rude, and people can't tell the difference."}]}, {"t": "“Representations aren't optional”", "p": "Representations explain activities that track an objective, which can succeed or fail. Anti-realism about them isn't tenable.", "k": [{"q": "○  serious", "f": "Success and failure can be described in terms of the system's stimulation and feedback, with no appeal to objective content."}, {"q": "◐  bait", "f": "Everything an animal ever gets is a signal on a nerve. It never gets the object. So all it can represent is the signal."}, {"q": "●  rage bait", "f": "Perception is just reacting to sensory stimuli."}]}, {"t": "“The world causes perception, not its content”", "p": "The physical world causes perception. It doesn't give perception its content.", "k": [{"q": "○  serious", "f": "If the world only causes and never supplies content, something has to link content to what's out there, or you get a coherent story about nothing."}, {"q": "◐  bait", "f": "If the world doesn't give experience its content, the content comes from us. So we make up what we see, and Sellars was an idealist who didn't notice."}, {"q": "●  rage bait", "f": "Sellars is a behaviorist who learned to say \"inner episodes.\""}]}, {"t": "“'Coping' is positivism again”", "p": "Reducing coping to regulating sensory stimuli for the sake of desire is as reductive as the positivists.", "k": [{"q": "○  serious", "f": "Rorty's \"coping\" is wider than stimulus control. It covers redescription and social practice."}, {"q": "◐  bait", "f": "All anyone ever does is react to what hits their senses. That's what a nervous system is. Calling it reductive doesn't make it false."}, {"q": "●  rage bait", "f": "Burge proved perception is objective by describing frogs."}]}, {"t": "“Worrying about family isn't about my senses”", "p": "Worrying about your family can't just mean worrying about your own future sensory states.", "k": [{"q": "○  serious", "f": "The stimulus-regulation account is a caricature, though the question of what the concern is about stays hard for everyone."}, {"q": "◐  bait", "f": "You only know your family through your senses. So worrying about them is worrying about what your senses will tell you. It sounds bad and it's still true."}, {"q": "●  rage bait", "f": "Life insurance is a bet you win by losing."}]}, {"t": "“Observability depends on theory”", "p": "There's no theory-neutral way to say what's observable in practice. That already depends on your theory.", "k": [{"q": "○  serious", "f": "Theory-ladenness is real, but there's wide agreement across rival theories about pointer readings and marks on plates."}, {"q": "◐  bait", "f": "If what counts as observable depends on the theory, then every theory gets to pick its own evidence. So no theory can ever lose."}, {"q": "●  rage bait", "f": "Kuhn showed science is just fashion."}]}, {"t": "“Theories change the data in philosophy too”", "p": "Philosophical debates share something with science: the theories change what counts as the data.", "k": [{"q": "○  serious", "f": "In science the instruments push back. In philosophy the \"data\" are intuitions, and those bend to the theory."}, {"q": "◐  bait", "f": "Science changes its mind when the experiment fails. Philosophy has no experiments. So one of them is like science and the other is like talking."}, {"q": "●  rage bait", "f": "Science and metaphysics are the same thing at different confidence levels."}]}, {"t": "“Unobservable effects still matter”", "p": "Some effects aren't observable at all, being too distant or too energetic, and they still matter for a theory.", "k": [{"q": "○  serious", "f": "Claims no observation could bear on don't constrain theory choice. Their role is mainly keeping the mathematics consistent."}, {"q": "◐  bait", "f": "If you can't observe it, you can't know it's there. If you can't know it's there, saying it's there is guessing."}, {"q": "●  rage bait", "f": "Metaphysics is what people do when they don't want to run the experiment."}]}, {"t": "“If science can't answer it, it isn't the brain”", "p": "If no science could answer the question, it isn't a question about a brain process.", "k": [{"q": "○  serious", "f": "What science can't answer today has a poor record as a guide to what it can't answer in principle."}, {"q": "◐  bait", "f": "Everything in the head is a brain process. There's nothing else in there. So if it's about the mind, it's about the brain, and science will get to it."}, {"q": "●  rage bait", "f": "Philosophy of mind is finished because of neuroscience."}]}, {"t": "“Putnam's critique lands”", "p": "Putnam's criticism of Rorty lands.", "k": [{"q": "○  serious", "f": "Putnam moved through several positions himself, so the criticism comes from a moving target."}, {"q": "◐  bait", "f": "Putnam spent thirty years almost agreeing with Rorty and backing out. If you nearly agree for thirty years, you agree."}, {"q": "●  rage bait", "f": "Rorty was right. Putnam spent thirty years almost agreeing and backing out."}]}, {"t": "“Rorty's Dewey is footnotes”", "p": "Rorty's engagement with Dewey is thin: a name and some footnotes.", "k": [{"q": "○  serious", "f": "Rorty said he was using Dewey for his own ends. Thin as scholarship isn't thin as philosophy."}, {"q": "◐  bait", "f": "Nobody was reading Dewey in 1975. Rorty mentioned him and now there are conferences. So Rorty did more for Dewey than the experts."}, {"q": "●  rage bait", "f": "Nobody would read Dewey if Rorty hadn't lied about him."}]}, {"t": "“The Pragmatic Maxim rules out nothing”", "p": "It's unclear what the Pragmatic Maxim actually rules out in metaphysics.", "k": [{"q": "○  serious", "f": "Peirce used it to dismiss transubstantiation and keep realism about laws, so it does some work."}, {"q": "◐  bait", "f": "If a rule doesn't rule anything out, it isn't a rule. So pragmatism has no method, and the maxim is a motto."}, {"q": "●  rage bait", "f": "Pragmatism is retarded."}]}, {"t": "“Hume was a skeptic only at his desk”", "p": "Hume could be a skeptic in the study and not outside it. Pragmatism ignores that split.", "k": [{"q": "○  serious", "f": "Pragmatists deny the split on purpose. A doubt that can't affect conduct isn't a real doubt."}, {"q": "◐  bait", "f": "If you only doubt it at your desk, you don't doubt it. So Hume wasn't a skeptic, he was a man with a hobby."}, {"q": "●  rage bait", "f": "Skepticism has never been answered, only outlived."}]}]}, {"n": "Simon", "i": "@simon_432", "u": [{"n": "Marx", "t": [0, 1, 2, 3, 4]}, {"n": "Science, consensus & Trump", "t": [5, 6, 7, 8]}, {"n": "Mereological nihilism", "t": [9, 10, 11, 12, 13]}, {"n": "Qualia", "t": [14, 15, 16, 17]}, {"n": "Free will", "t": [18, 19, 20, 21]}], "t": [{"t": "“Exploitation is a technical term”", "p": "Marx's analysis doesn't depend on his values. \"Exploitation\" is a technical term.", "k": [{"q": "○  serious", "f": "The language of exploitation and alienation is hard to read as neutral, and Marx knew what it would do to a reader."}, {"q": "◐  bait", "f": "If it's only a description then it doesn't say anything should change. Then there's no reason for a revolution. So either it's moral or it's a textbook."}, {"q": "●  rage bait", "f": "Marx isn't normative? He calls capital a vampire."}]}, {"t": "“The wage is an equal exchange”", "p": "The wage is an equal exchange, not an unfair one. Marx's objection was never that workers are cheated.", "k": [{"q": "○  serious", "f": "If the exchange is equal and nobody is cheated, the case against the system has to come from somewhere else, and it's unclear where."}, {"q": "◐  bait", "f": "An equal exchange is a fair one. That's what equal means. So Marx agrees capitalism is fair, and the three volumes are a compliment."}, {"q": "●  rage bait", "f": "Surplus value is just profit with a guilt trip."}]}, {"t": "“The falling rate of profit is a tendency”", "p": "The falling rate of profit is a tendency. Countervailing factors are part of the theory.", "k": [{"q": "○  serious", "f": "A tendency that can be offset indefinitely predicts every outcome, and that's a weakness."}, {"q": "◐  bait", "f": "Profits are at record highs. A theory that says they fall, in a world where they rise, is false. It isn't more subtle than that."}, {"q": "●  rage bait", "f": "The rate of profit isn't falling."}]}, {"t": "“A democratic USSR with computers would've worked”", "p": "A more democratic USSR that had really invested in computer planning would have done better.", "k": [{"q": "○  serious", "f": "More computation doesn't solve the Hayekian problem that the relevant knowledge is dispersed, tacit and never stated."}, {"q": "◐  bait", "f": "The Soviets had the best mathematicians in the world and they couldn't do it. If they couldn't, a bigger computer can't, because computers are just fast mathematicians."}, {"q": "●  rage bait", "f": "Cockshott thinks a big enough computer fixes communism. So did the Soviets."}]}, {"t": "“History has a direction, but you still have to act”", "p": "History moves objectively toward an end, and human action is still needed to get there.", "k": [{"q": "○  serious", "f": "If the end is objective, action is redundant. If action is needed, the end isn't guaranteed."}, {"q": "◐  bait", "f": "If history has a direction it would have arrived by now. It's had long enough. So it doesn't, and things just happen."}, {"q": "●  rage bait", "f": "Material conditions explain everything after it happens and nothing before."}]}, {"t": "“Experts go by evidence, the rest of us by consensus”", "p": "Among experts it's argument and evidence that make something accepted. Consensus matters for the rest of us deciding what to believe.", "k": [{"q": "○  serious", "f": "For non-experts, deferring to consensus was wrong about continental drift and ulcers for decades."}, {"q": "◐  bait", "f": "The consensus used to be that the sun went round the earth. Consensus was wrong then, so it can be wrong now, so it tells you nothing."}, {"q": "●  rage bait", "f": "Scientific consensus is the only kind of truth there is."}]}, {"t": "“Scientific fact is consensus”", "p": "A scientific fact just is what the scientific community has reached consensus on.", "k": [{"q": "○  serious", "f": "Then facts change when opinions do, and the earth stopped being the centre of things on the day people changed their minds."}, {"q": "◐  bait", "f": "A fact is how things are. A consensus is what people think. Those are different words because they're different things, and no survey ever moved a planet."}, {"q": "●  rage bait", "f": "Science proves things. Consensus is just scientists agreeing about it afterwards."}]}, {"t": "“Trump isn't a fascist”", "p": "Trump isn't a fascist. The nearest he gets is illiberal democracy on the Orbán model.", "k": [{"q": "○  serious", "f": "The distinction is fair, and it can also comfort. Illiberal democracies hollow out the same institutions more slowly."}, {"q": "◐  bait", "f": "He does rallies, he has a movement, he hates the press. If it has every feature of the thing, it's the thing. The uniform is optional."}, {"q": "●  rage bait", "f": "Trump is a fascist and people are scared of the word."}]}, {"t": "“MAGA isn't fascism yet”", "p": "MAGA doesn't reach the level of fascism yet.", "k": [{"q": "○  serious", "f": "\"Yet\" grants the direction. Arguing over the label can stand in for deciding what to do about it."}, {"q": "◐  bait", "f": "Fascism was a thing in Italy in the 1920s. This is America in the 2020s. Different place, different time, so it can't be the same thing, and that's just geography."}, {"q": "●  rage bait", "f": "Populism is just democracy that the wrong people won."}]}, {"t": "“Composition never happens”", "p": "Every answer to the special composition question is arbitrary or counterintuitive, so the answer is that composition never happens.", "k": [{"q": "○  serious", "f": "Nihilism has to paraphrase ordinary talk as \"simples arranged chair-wise,\" and that leans on the concept of a chair."}, {"q": "◐  bait", "f": "I'm sitting on something. It's holding me up. Things that hold you up exist. So there's at least one chair, and the theory is short by one chair."}, {"q": "●  rage bait", "f": "Chairs exist."}]}, {"t": "“Intuitions aren't evidence”", "p": "Arguing from intuition isn't a good basis, least of all against someone who thinks the intuitions are wrong.", "k": [{"q": "○  serious", "f": "I'm more certain I have hands than of any premise in the argument for nihilism. That's a comparison of credences."}, {"q": "◐  bait", "f": "If intuitions don't count, then the intuition that arguments should be valid doesn't count either. So nothing counts, and I'm keeping the table."}, {"q": "●  rage bait", "f": "Here is one hand. Sorry about your theory."}]}, {"t": "“Where a thing ends is arbitrary”", "p": "Where you draw the line for a composite object is arbitrary. Someone else would draw it elsewhere.", "k": [{"q": "○  serious", "f": "A vague boundary doesn't show there's nothing on either side. Baldness is vague, and there are bald men."}, {"q": "◐  bait", "f": "If nobody can say where the line is, then there's a line and we don't know where. That's different from no line. Not knowing where your keys are doesn't mean you have no keys."}, {"q": "●  rage bait", "f": "Mereology is arguing about whether a pile is a pile."}]}, {"t": "“You need matter simples and space simples”", "p": "At bottom you need at least matter simples and space simples, maybe more depending on the physics.", "k": [{"q": "○  serious", "f": "Physics doesn't guarantee a bottom level. If matter is gunky, nihilism leaves an empty universe."}, {"q": "◐  bait", "f": "If things are made of simples, the simples compose the things. That's composition. So the nihilist has just described the thing he says never happens."}, {"q": "●  rage bait", "f": "Imagine sitting in a chair to type that chairs don't exist."}]}, {"t": "“No famous defenders isn't a problem”", "p": "It's a recent view with papers and no famous defenders, and that isn't a mark against it.", "k": [{"q": "○  serious", "f": "A view that's been available since the atomists and attracted almost nobody may be telling you something."}, {"q": "◐  bait", "f": "If it were true, someone famous would believe it. Famous philosophers believe all sorts of things. None of them picked this one."}, {"q": "●  rage bait", "f": "Mereological nihilism is cope."}]}, {"t": "“Qualia aren't real”", "p": "Once you separate out what's being claimed, qualia aren't real.", "k": [{"q": "○  serious", "f": "Any seeming is already an experience. To be under the illusion of pain is to be feeling something."}, {"q": "◐  bait", "f": "I can doubt everything a neuroscientist tells me. I can't doubt that this hurts. So the hurting is more certain than the theory that says it isn't there."}, {"q": "●  rage bait", "f": "Illusionism is retarded. An illusion of pain that hurts is pain."}]}, {"t": "“Experience can be explained from outside”", "p": "A great deal about first-person experience can be explained from the third person.", "k": [{"q": "○  serious", "f": "The explained parts are the functional ones, like causes and reports. The question was about what's left when those are done."}, {"q": "◐  bait", "f": "You can describe a headache to a brain scanner all day and it won't get one. So something's missing from the third person, and the something is the headache."}, {"q": "●  rage bait", "f": "Nobody ever took an aspirin for a functional state."}]}, {"t": "“The hard problem is unimaginable”", "p": "The hard problem is hard because we can't even imagine what a scientific answer would look like.", "k": [{"q": "○  serious", "f": "If no answer is imaginable, that's as much a reason to suspect the experience is real and unexplained as to deny it."}, {"q": "◐  bait", "f": "If science can't even imagine an answer, then it isn't a scientific question. And if it isn't science, physicalism has nothing to say about it."}, {"q": "●  rage bait", "f": "Qualia are real."}]}, {"t": "“Altruism is reward-driven”", "p": "Altruism runs on reward and punishment mechanisms, even when nobody is aware of them.", "k": [{"q": "○  serious", "f": "An unconscious reward behind every act can't be tested. It fits any behavior you show it."}, {"q": "◐  bait", "f": "People die for strangers. Dead people don't collect rewards. So the mechanism isn't what's doing it, and it took one example."}, {"q": "●  rage bait", "f": "Egoism is the only honest ethics, and it's false."}]}, {"t": "“Compatibilist free will isn't worth wanting”", "p": "The compatibilist kind of free will isn't the kind worth caring about.", "k": [{"q": "○  serious", "f": "Compatibilists argue their kind is the one that underwrites responsibility, and it's hard to say what more the libertarian kind would add."}, {"q": "◐  bait", "f": "You decide what to have for lunch and then you have it. That's free will. There isn't a second, better kind hiding behind it."}, {"q": "●  rage bait", "f": "Free will is real."}]}, {"t": "“People mean libertarian free will”", "p": "What ordinary people mean by free will is the libertarian kind.", "k": [{"q": "○  serious", "f": "Experimental surveys find folk intuitions are mixed, and often compatibilist when cases are concrete."}, {"q": "◐  bait", "f": "Ordinary people mean they weren't forced. Nobody at a bus stop has ever meant \"uncaused by prior states of the universe.\""}, {"q": "●  rage bait", "f": "Compatibilism is the folk view. Hard determinism is a podcast."}]}, {"t": "“Determinism doesn't make action pointless”", "p": "Determinism doesn't make human action pointless. Marx wasn't a fatalist either.", "k": [{"q": "○  serious", "f": "If the outcome is fixed, effort is one more fixed thing, and urging it changes nothing that wasn't already going to change."}, {"q": "◐  bait", "f": "If everything is determined then so is whether I agree. So there's no point arguing with me. And you're still arguing, so you don't believe it."}, {"q": "●  rage bait", "f": "If free will is fake, stop trying to convince me."}]}, {"t": "“Einstein was right to resist”", "p": "Einstein had good reason to resist indeterminism in quantum mechanics.", "k": [{"q": "○  serious", "f": "Bell tests rule out the local hidden variables Einstein hoped for. The determinism that's left has to be nonlocal or conspiratorial."}, {"q": "◐  bait", "f": "The experiments were done and the dice won. A theory that says the universe faked the results on purpose is a conspiracy theory with a doctorate."}, {"q": "●  rage bait", "f": "Quantum mechanics is random, so determinism is false. That's just physics."}]}]}, {"n": "Sisyphos", "i": "@.sisyphos", "u": [{"n": "Germany & the German language", "t": [0, 1, 2, 3]}, {"n": "Free will & philosophy", "t": [4, 5, 6, 7]}, {"n": "DnB & music", "t": [8, 9, 10, 11]}], "t": [{"t": "“Some things only work in German”", "p": "Some things only work in German. In dub or sub they come across as stiff theatre.", "k": [{"q": "○  serious", "f": "Something is lost in any translation. Whether it's the essential thing is the question."}, {"q": "◐  bait", "f": "If it only works in one language, it's about the language. A good story works in any of them. That's how you know it was a story."}, {"q": "●  rage bait", "f": "\"Read it in the original\" is cope."}]}, {"t": "“'Vernunft' means more than 'reason'”", "p": "A word like \"reason\" in German reaches further than the English one.", "k": [{"q": "○  serious", "f": "Vernunft carries its history from Kant and Hegel. The English word has its own, and neither is the bigger concept."}, {"q": "◐  bait", "f": "A word means what the dictionary says. The dictionary says Vernunft means reason. So they mean the same and the extra feeling is homesickness."}, {"q": "●  rage bait", "f": "German is the only language philosophy works in."}]}, {"t": "“Berlin isn't typical Germany”", "p": "Berlin is very mixed. It isn't typical Germany.", "k": [{"q": "○  serious", "f": "Capital cities are never typical. Berlin's economy has also trailed the rest of the country's for decades."}, {"q": "◐  bait", "f": "A capital is where the country puts its best. If that's Germany's best, the rest must be worse. So Berlin tells you everything."}, {"q": "●  rage bait", "f": "Berlin is poor, grey, and proud of both."}]}, {"t": "“German rules are weird but work”", "p": "Germany's rules can be oddly specific, like what you may grow at home, but the system works.", "k": [{"q": "○  serious", "f": "Specificity is the system. The same instinct produced the paperwork that slows down everything else."}, {"q": "◐  bait", "f": "A country with a rule for everything has no room left to do anything. That's why the trains are late."}, {"q": "●  rage bait", "f": "Germans aren't efficient. Look at the trains."}]}, {"t": "“No free will, Sapolsky's right”", "p": "There's no free will or agency at any biological level. Sapolsky has that right.", "k": [{"q": "○  serious", "f": "Sapolsky shows behavior has causes. Compatibilists agree, and deny that this settles whether we act freely."}, {"q": "◐  bait", "f": "He decided to write a book saying nobody decides anything. Then he asks you to change your mind. Both of those need free will."}, {"q": "●  rage bait", "f": "Free will skeptics still say \"sorry,\" which is all you need to know."}]}, {"t": "“Philosophy is serious”", "p": "Philosophy turns out to be a serious subject. It isn't the poetry-cringe people take it for.", "k": [{"q": "○  serious", "f": "A fair amount of it is closer to the cringe than its defenders admit."}, {"q": "◐  bait", "f": "A serious subject makes progress. Philosophy has the same questions it had in Athens. So it's a hobby that got offices."}, {"q": "●  rage bait", "f": "Philosophy servers are where reading goes to die."}]}, {"t": "“Start with a history of philosophy”", "p": "Reading some history of philosophy gives you the broad picture first.", "k": [{"q": "○  serious", "f": "Surveys give you labels and one-line positions, and you end up arguing with summaries."}, {"q": "◐  bait", "f": "If the old ones were right there'd be no new ones. There are new ones. So the history is a list of mistakes, and you can skip to the end."}, {"q": "●  rage bait", "f": "The history of philosophy is pointless. Physics students don't read Newton."}]}, {"t": "“Authenticity shapes culture slowly”", "p": "Ideas about authenticity and Being shape culture, though slowly.", "k": [{"q": "○  serious", "f": "The causal story is hard to show. Culture usually shifts for economic reasons and picks up a philosophy afterwards."}, {"q": "◐  bait", "f": "Nobody at a supermarket has read Heidegger. Culture is the people at the supermarket. So he shaped nothing."}, {"q": "●  rage bait", "f": "Heidegger is asking what \"is\" means. It means is. Next."}]}, {"t": "“DnB saved me”", "p": "Finding drum and bass put me on the right path, musically.", "k": [{"q": "○  serious", "f": "It's a great genre with a formula that's been stable for thirty years."}, {"q": "◐  bait", "f": "It's one drum pattern played fast. Every track has it. If every song has the same drums, it's one song."}, {"q": "●  rage bait", "f": "Drum and bass is a drum solo that won't let anyone else talk."}]}, {"t": "“Pop isn't worth it”", "p": "Mainstream pop isn't worth the time.", "k": [{"q": "○  serious", "f": "Pop is where most of the craft in songwriting and production goes, whatever anyone thinks of the result."}, {"q": "◐  bait", "f": "Pop is called pop because it's popular. Popular means most people like it. Most people can't all be wrong about what they like."}, {"q": "●  rage bait", "f": "Pop music now is better than the 90s. The production alone."}]}, {"t": "“Everybody in the scene knows”", "p": "In the scene, everybody knows how things really work.", "k": [{"q": "○  serious", "f": "Scenes think of themselves as in on something. Mostly it's a small world with its own gossip."}, {"q": "◐  bait", "f": "If everybody in the scene knows, it isn't a secret. If it isn't a secret, it's just a job."}, {"q": "●  rage bait", "f": "Berghain is a queue with a sound system."}]}, {"t": "“Work less, travel more”", "p": "You can build a good life around working a little and travelling a lot.", "k": [{"q": "○  serious", "f": "You can, usually for a while, and usually with a safety net that isn't mentioned."}, {"q": "◐  bait", "f": "Money comes from working. Less working is less money. Travel costs money. So the plan is spending more of what you have less of."}, {"q": "●  rage bait", "f": "Europe is a retirement home with good trains."}]}]}, {"n": "Sizzurp", "i": "@sizzurp1", "u": [{"n": "Religion & theism", "t": [0, 1, 2, 3, 4]}, {"n": "Lenin, Trotsky & Stalinism", "t": [5, 6, 7, 8, 9]}, {"n": "Wokeness & the working class", "t": [10, 11, 12, 13]}, {"n": "Marxist economics", "t": [14, 15, 16, 17, 18]}], "t": [{"t": "“Naturalism beats theism”", "p": "Even the robust defenses of theism lose to naturalism once you get into the details.", "k": [{"q": "○  serious", "f": "Fine-tuning is taken seriously by plenty of non-theist philosophers, and naturalism's main replies are an unobservable multiverse or brute fact."}, {"q": "◐  bait", "f": "Something can't come from nothing. There's something. So someone made it. That's the whole debate, and it was over before philosophy departments existed."}, {"q": "●  rage bait", "f": "Atheism is cope."}]}, {"t": "“Dropping a doctrine means you lost”", "p": "Giving up a core commitment of classical theism to escape an objection means the objection worked.", "k": [{"q": "○  serious", "f": "Traditions revise under pressure without that counting as defeat. Science does it routinely."}, {"q": "◐  bait", "f": "Theology has changed its answers for two thousand years and it's still here. Things that are false don't last two thousand years. So changing the answers is how you can tell it's true."}, {"q": "●  rage bait", "f": "Aquinas already answered that. He numbered it."}]}, {"t": "“Sane believers resist 'what if God commanded it'”", "p": "A sane believer resists the question \"if God commanded something monstrous, would you do it?\" Only a pathological one just says yes.", "k": [{"q": "○  serious", "f": "Resisting the question is a way of rejecting divine command theory while keeping the vocabulary."}, {"q": "◐  bait", "f": "God is good by definition. So He couldn't command anything bad. So the question is like asking what if a triangle had four sides, and only atheists think it's clever."}, {"q": "●  rage bait", "f": "Without God, \"wrong\" means \"I don't like it.\""}]}, {"t": "“The Catholic God would be a nightmare”", "p": "The Catholic God, of all gods, being the real one would be a nightmare.", "k": [{"q": "○  serious", "f": "The doctrine of hell is hard, and Catholic theology has centuries of work on reconciling it with mercy and freedom."}, {"q": "◐  bait", "f": "A true thing doesn't care whether you'd enjoy it. People only say a view would be a nightmare when they suspect it's right."}, {"q": "●  rage bait", "f": "Thomism is the most consistent system ever built."}]}, {"t": "“Call-in atheism is garbage”", "p": "Call-in show atheism is garbage. The serious debate is with theistic philosophers of religion.", "k": [{"q": "○  serious", "f": "The philosophers of religion are mostly believers defending what they already held, which is a selection effect worth weighing."}, {"q": "◐  bait", "f": "The apologists have read more than the atheists and win every debate. Winning debates is how you find out who's right. So that's that."}, {"q": "●  rage bait", "f": "Analytic philosophy of religion is Christians with logic notation."}]}, {"t": "“Stalinism betrayed Lenin”", "p": "Stalinism was a vulgar corruption of the doctrine. It doesn't follow from Lenin.", "k": [{"q": "○  serious", "f": "The one-party state, the Cheka and the ban on factions all came before Stalin. The tools were built under Lenin."}, {"q": "◐  bait", "f": "Stalin was Lenin's general secretary, in Lenin's party, under Lenin's rules. If a student does exactly what the teacher set up, that's the teacher."}, {"q": "●  rage bait", "f": "Lenin and Stalin are the same. One died sooner."}]}, {"t": "“Dissolving the Assembly wasn't a betrayal”", "p": "The Bolsheviks never promised to abide by bourgeois elections, so dissolving the Constituent Assembly was no betrayal.", "k": [{"q": "○  serious", "f": "They campaigned for the Assembly and closed it after losing. \"We never promised\" is a narrow defense."}, {"q": "◐  bait", "f": "An election is whoever gets the most votes. They got fewer. In every other context that's called losing, and here it's called a higher form of democracy."}, {"q": "●  rage bait", "f": "Democratic centralism is \"we vote and then I decide.\""}]}, {"t": "“The vanguard ratio was principled”", "p": "A party with a fixed ratio of intellectuals to workers was a principled design.", "k": [{"q": "○  serious", "f": "A party that sets its own ratio of thinkers to workers has decided in advance who does the thinking."}, {"q": "◐  bait", "f": "If the workers could lead themselves there'd be no need for a party. There's a party. So the theory already assumes they can't, and everything after follows from that."}, {"q": "●  rage bait", "f": "The vanguard party is \"trust me bro\" with a reading list."}]}, {"t": "“Read Mandel and Kliman first”", "p": "You have to read Mandel, Kliman and the rest before you get an opinion on this.", "k": [{"q": "○  serious", "f": "A position that can only be assessed after thousands of pages of in-house literature is hard to tell apart from one that can't be assessed."}, {"q": "◐  bait", "f": "If it were true, it could be explained in a paragraph. Physics can do it. This needs forty books, and that means even the authors weren't sure."}, {"q": "●  rage bait", "f": "Forty books to explain why the revolution didn't happen? That's retarded."}]}, {"t": "“What happened isn't on Marx”", "p": "Marx expected the workers' state to be short and healthy, with revolution in the advanced countries first. What happened isn't on him.", "k": [{"q": "○  serious", "f": "The predictions failing is evidence about the theory. A theory isn't cleared by having expected something else."}, {"q": "◐  bait", "f": "Marx predicted the revolution in England. England got fish and chips. A scientist whose experiment fails every time isn't unlucky."}, {"q": "●  rage bait", "f": "Marx was wrong, and Lenin proved it by trying."}]}, {"t": "“Middle-class radicals hurt workers”", "p": "Middle-class radicalism corrodes working-class cohesion.", "k": [{"q": "○  serious", "f": "Class politics and identity politics have often reinforced each other. The union movement's best decades included civil rights."}, {"q": "◐  bait", "f": "The working class is whoever works. Most people work. So everyone's working class, and the term picks out nobody."}, {"q": "●  rage bait", "f": "Woke is just Marxism with race swapped in for class. Everyone knows this."}]}, {"t": "“The working class still matters”", "p": "The working class is still the agent that matters.", "k": [{"q": "○  serious", "f": "Organized industrial labor is a shrinking share of the workforce in rich countries. The agent the theory needs is hard to find."}, {"q": "◐  bait", "f": "Workers vote for whoever they like, and lately it isn't the left. If the workers are always right, they're right about that too."}, {"q": "●  rage bait", "f": "Workers don't want the means of production, they want Fridays off."}]}, {"t": "“Even the sane right is ruling-class ideology”", "p": "Even the less unhinged right-wingers are peddling the same ruling-class idealism.", "k": [{"q": "○  serious", "f": "Calling every opposing view ruling-class ideology means no argument from that side ever has to be answered."}, {"q": "◐  bait", "f": "If every idea comes from a class, so does Marxism. Marx was middle class and lived off a factory owner. So Marxism is bourgeois ideology by its own test."}, {"q": "●  rage bait", "f": "Marx was a capitalist. He lived off Engels' factory."}]}, {"t": "“The fascist wing is the danger”", "p": "Fascistic currents in the ruling class are the more dangerous ones right now.", "k": [{"q": "○  serious", "f": "\"Fascist\" has been applied so widely that it's lost much of its power to pick out what's new."}, {"q": "◐  bait", "f": "Fascists wore uniforms and marched. Nobody's marching. If it doesn't have the uniform, it's something else, and something else isn't as scary."}, {"q": "●  rage bait", "f": "Communists and fascists are the same people at different ages."}]}, {"t": "“The LTV holds up”", "p": "The labor theory of value holds up when you read it properly.", "k": [{"q": "○  serious", "f": "The transformation problem is a real difficulty, and a century of rival solutions suggests the trouble is in the theory."}, {"q": "◐  bait", "f": "Value is whatever someone will pay. People pay more for water in a desert, and no extra labor went into it. That's the whole theory gone, in one example."}, {"q": "●  rage bait", "f": "A mud pie takes labor and it's worth nothing. That's the whole LTV, gone."}]}, {"t": "“Marxism handles interest and macro”", "p": "Marxist theory already makes room for interest, macro and the rest. It isn't at odds with those categories.", "k": [{"q": "○  serious", "f": "If it absorbs the mainstream categories, it's fair to ask what the value theory adds to them."}, {"q": "◐  bait", "f": "If two theories say the same thing and one has predictions, you keep that one. Economists did. That's why there are no Marxists at the central bank."}, {"q": "●  rage bait", "f": "Neoclassical economics is a science and Marxian economics is a book club."}]}, {"t": "“Capitalism is the root cause”", "p": "Capitalist social relations are the root cause. A politician who doesn't see that will just reproduce them.", "k": [{"q": "○  serious", "f": "Root-cause claims this broad explain every outcome, which makes them hard to test against any."}, {"q": "◐  bait", "f": "There was poverty before capitalism, and a lot more of it. So capitalism can't be the cause. It's the only thing that ever reduced it."}, {"q": "●  rage bait", "f": "Capitalism won."}]}, {"t": "“Economists dodge exploitation”", "p": "Mainstream economists dodge exploitation.", "k": [{"q": "○  serious", "f": "They have a different account. If pay tracks marginal product, the concept needs another basis than surplus value."}, {"q": "◐  bait", "f": "Nobody is forced to take a job. A deal both sides agree to can't be exploitation, because that's what agreeing means."}, {"q": "●  rage bait", "f": "Exploitation is voluntary. Nobody makes you take the job."}]}, {"t": "“Capitalism is in permanent crisis”", "p": "Capitalism is in permanent crisis: cyclical slumps, unemployment, far-right surges.", "k": [{"q": "○  serious", "f": "The same system has delivered the largest sustained rise in living standards on record. \"Permanent crisis\" has to account for that."}, {"q": "◐  bait", "f": "A system that's been collapsing for a hundred and seventy years isn't collapsing. That's just what it looks like when it works."}, {"q": "●  rage bait", "f": "Late capitalism has been late for seventy years."}]}]}, {"n": "Stackhouse", "i": "@stack.house", "u": [{"n": "Love, detachment & the One", "t": [0, 1, 2]}, {"n": "The old web & AI art", "t": [3, 4, 5]}], "t": [{"t": "“Perfect love sees no distinction”", "p": "The mystics' ideal is someone perfect in love, who sees no difference between their own and another's.", "k": [{"q": "○  serious", "f": "An ideal of perfect detachment has trouble making room for the particular loves that make up a life."}, {"q": "◐  bait", "f": "If you make no distinction between your own family and a stranger, your family has a complaint."}, {"q": "●  rage bait", "f": "The One is just God."}]}, {"t": "“Take goodness and the eternal seriously”", "p": "Goodness, wisdom and the eternal are worth taking seriously.", "k": [{"q": "○  serious", "f": "They are, and the tradition tends to give them capital letters where it should give arguments."}, {"q": "◐  bait", "f": "Nobody has ever seen the eternal. Everything anyone has seen ended. So it's a word for what we'd like."}, {"q": "●  rage bait", "f": "Neoplatonism is retarded."}]}, {"t": "“Women and status are complicated”", "p": "Attitudes toward women and status are more tangled up than the stereotypes say.", "k": [{"q": "○  serious", "f": "The correlations are real and small, and they get reported as if they were laws."}, {"q": "◐  bait", "f": "People are complicated, so no generalisation about them is true. That includes this one."}, {"q": "●  rage bait", "f": "Incels are just lonely. That's the whole phenomenon. People write books."}]}, {"t": "“Bring back early-2000s websites”", "p": "Early-2000s websites had something worth bringing back.", "k": [{"q": "○  serious", "f": "They had personality because every one was hand-made and half-broken. Nostalgia edits out the half-broken part."}, {"q": "◐  bait", "f": "Old sites were bad and people remember being young. That's all nostalgia has ever been."}, {"q": "●  rage bait", "f": "Early 2000s websites were better."}]}, {"t": "“Old web plus new animation”", "p": "Mixing that old look with modern animation would be a good project.", "k": [{"q": "○  serious", "f": "Pastiche tends to get the surface and miss why the originals looked that way. They were limited."}, {"q": "◐  bait", "f": "If you add modern animation, it isn't the old web. If you don't, it's just an old website. So the project is neither."}, {"q": "●  rage bait", "f": "Vibe-coded websites all look the same."}]}, {"t": "“AI killed commission work”", "p": "AI image generators have gutted commission work for artists.", "k": [{"q": "○  serious", "f": "They've hit the low end hardest. Clients paying for a specific artist's hand are a different market."}, {"q": "◐  bait", "f": "If a machine can do your job for free, the job was worth nothing. The market just found out."}, {"q": "●  rage bait", "f": "Art is whatever sells."}]}]}, {"n": "SuperVillainy", "i": "@dionysus_dude", "u": [{"n": "Education", "t": [0, 1, 2, 3]}, {"n": "Truth & justification", "t": [4, 5, 6, 7]}, {"n": "Democracy & liberal norms", "t": [8, 9, 10, 11]}, {"n": "Speech laws", "t": [12, 13, 14, 15]}], "t": [{"t": "“Ditch college prep”", "p": "High school should move away from college prep. That model is outdated.", "k": [{"q": "○  serious", "f": "College completion still tracks earnings strongly. Schools that drop the prep risk closing that door for the students with the fewest alternatives."}, {"q": "◐  bait", "f": "Every good job asks for a degree. So preparing for college is preparing for a job, and anything else is preparing for less."}, {"q": "●  rage bait", "f": "College should be job training. Nobody needs a poem to get hired."}]}, {"t": "“Teach AI in a lab”", "p": "AI belongs in school in a supervised, computer-lab way. Teach it properly. Don't ban it or leave it loose.", "k": [{"q": "○  serious", "f": "Lab-style teaching assumes the tool sits still. By the time there's a curriculum, the tool has changed."}, {"q": "◐  bait", "f": "The students already use it better than the teacher does. So the lesson is the teacher learning it from the students."}, {"q": "●  rage bait", "f": "Teachers will be replaced by AI because teaching is information transfer."}]}, {"t": "“Logical consequences beat punishment”", "p": "Logical consequences beat punishment. If you wrecked the room, you clean it and catch up on the work.", "k": [{"q": "○  serious", "f": "The research on that is thin, and to the student it often feels the same as punishment."}, {"q": "◐  bait", "f": "A consequence you make happen is a punishment. That's the definition. Calling it logical is for the adult."}, {"q": "●  rage bait", "f": "Homework is the only part of school that works."}]}, {"t": "“Bad behavior, not a bad kid”", "p": "You can judge a child's behaviour as bad without thinking the child is bad.", "k": [{"q": "○  serious", "f": "The distinction is sound and hard to keep up in practice. Children mostly hear the judgment as being about them."}, {"q": "◐  bait", "f": "A person is what they do. If what they do is bad, that's what they are for now. Pretending otherwise is why nothing changes."}, {"q": "●  rage bait", "f": "Teachers are babysitters with a pension."}]}, {"t": "“Truth's out there, justification's in here”", "p": "What makes \"it's raining\" true is whether it's raining. But all justification happens inside the discursive process.", "k": [{"q": "○  serious", "f": "If justification never leaves the discursive process, the rain's role in making the claim true does no work for us."}, {"q": "◐  bait", "f": "If it's raining, you get wet. Getting wet isn't discursive. So justification happens outdoors, and the theory needs a coat."}, {"q": "●  rage bait", "f": "Truth is correspondence."}]}, {"t": "“Data needs values to mean anything”", "p": "Empirical data alone isn't enough to talk about truth. You need epistemic standards and values to interpret it.", "k": [{"q": "○  serious", "f": "The standards also get chosen for how well they predict, so the data still disciplines them."}, {"q": "◐  bait", "f": "If you need values to read the data, then different values read it differently. So there's no fact, just readings."}, {"q": "●  rage bait", "f": "Empirical data never settled a single question about values."}]}, {"t": "“Metaphysics is baggage”", "p": "Metaphysical content is extra baggage. It's an interpretive scheme that doesn't add to understanding.", "k": [{"q": "○  serious", "f": "Deciding what counts as understanding is itself a metaphysical commitment."}, {"q": "◐  bait", "f": "You can't get rid of metaphysics by saying it's useless. Saying what's real and what's baggage is metaphysics. So the view refutes itself."}, {"q": "●  rage bait", "f": "Metaphysics is what people do when they don't want to run the experiment."}]}, {"t": "“Sorting the data is the real question”", "p": "How we sort the incoming data into what's relevant is the real question.", "k": [{"q": "○  serious", "f": "That's a question for psychology and for statistics. It's less clear what's left for philosophy."}, {"q": "◐  bait", "f": "The eyes sort it. That's what eyes do. The philosophy starts after the sorting is already done."}, {"q": "●  rage bait", "f": "Epistemology is just having good sources."}]}, {"t": "“Democracy is tested”", "p": "Democratic ideals aren't lofty abstractions. They're the tested ways we've found of getting the best societies.", "k": [{"q": "○  serious", "f": "\"Tested\" covers about two centuries in a minority of countries, and some well-run places didn't follow the template."}, {"q": "◐  bait", "f": "The richest, safest place on earth doesn't do it this way. One counterexample is enough."}, {"q": "●  rage bait", "f": "Singapore."}]}, {"t": "“Elected isn't democratic”", "p": "Being democratically elected doesn't mean someone is following democratic principles.", "k": [{"q": "○  serious", "f": "If \"democratic principles\" can overrule election results, someone unelected is deciding what they are."}, {"q": "◐  bait", "f": "Democracy is the people choosing. The people chose. So whatever he does is democratic, and anyone who disagrees is against the people."}, {"q": "●  rage bait", "f": "Unconstitutional acts are democratic when the voters wanted them."}]}, {"t": "“Liberalism corrects for culture”", "p": "Liberal norms are distinctive because they recognise the pull of cultural habit and correct for it.", "k": [{"q": "○  serious", "f": "Liberalism has its own cultural momentum and tends to read it as neutrality."}, {"q": "◐  bait", "f": "Liberalism says all cultures are equal and also that liberalism should be in charge. Those can't both be true."}, {"q": "●  rage bait", "f": "Liberalism isn't sophisticated. It's \"leave me alone,\" with footnotes."}]}, {"t": "“One party's off the table”", "p": "One party has made itself impossible to vote for in this era.", "k": [{"q": "○  serious", "f": "That may be so. It also means the other party doesn't have to earn the vote."}, {"q": "◐  bait", "f": "If you'd vote for one party whatever happens, you aren't voting, you're registering. A vote that can't change isn't one."}, {"q": "●  rage bait", "f": "Democrats and Republicans are the same party with different mascots."}]}, {"t": "“Hate speech laws are defensible”", "p": "Hate speech laws can be defended, and plenty of functioning democracies have them.", "k": [{"q": "○  serious", "f": "The definitions are vague, and vague speech laws get enforced unevenly."}, {"q": "◐  bait", "f": "The countries with the strictest laws have the fastest-growing far right. So the laws either don't work or they're helping."}, {"q": "●  rage bait", "f": "Hate speech laws work the way umbrellas stop rain."}]}, {"t": "“Check the conviction first”", "p": "You should check what someone was actually convicted of before saying they were jailed for \"speech.\"", "k": [{"q": "○  serious", "f": "Fair, and the chilling effect comes from what people think the law covers, whatever the charge sheet says."}, {"q": "◐  bait", "f": "If he was arrested after saying something, he was arrested for saying it. The rest is how they wrote it up."}, {"q": "●  rage bait", "f": "Free speech is absolute or it's nothing."}]}, {"t": "“The US protects speech hard”", "p": "The US protects speech very strongly. Courts keep blocking attempts to shut out the press.", "k": [{"q": "○  serious", "f": "The strong protection is why the American experience gives no evidence about what speech laws do."}, {"q": "◐  bait", "f": "America has no speech laws and the most arguments. So speech laws would mean fewer arguments, and that's the case for them."}, {"q": "●  rage bait", "f": "Hate speech laws work. Europe has them and Europe is fine."}]}, {"t": "“Hate crimes aren't hate speech”", "p": "A hate crime and hate speech are different things, and people run them together.", "k": [{"q": "○  serious", "f": "The line blurs where speech is the evidence of motive. Then the speech is what raises the sentence."}, {"q": "◐  bait", "f": "A hate crime is a crime plus an opinion. So the extra sentence is for the opinion. That's a speech law with a crime attached."}, {"q": "●  rage bait", "f": "Punishing the motive is punishing the thought."}]}]}, {"n": "thunderstud", "i": "@thunderstud", "u": [{"n": "Claude & the models", "t": [0, 1, 2, 3]}, {"n": "Dev tools & setup", "t": [4, 5, 6, 7]}, {"n": "AI & jobs", "t": [8, 9, 10, 11]}], "t": [{"t": "“Skill issue”", "p": "If the model can't do it, it's a skill issue: wrong model, wrong prompt or wrong setup.", "k": [{"q": "○  serious", "f": "\"Skill issue\" can't lose. Any failure gets put down to the user, so the claim is never tested."}, {"q": "◐  bait", "f": "A hammer doesn't need a skilled user to be a hammer. If the model only works when you hold it right, the model has the issue."}, {"q": "●  rage bait", "f": "Agents don't work. It's a demo that works once on stage."}]}, {"t": "“They're still improving”", "p": "The models are still improving. Writing them off for what they can't do today is thick.", "k": [{"q": "○  serious", "f": "Improvement so far doesn't guarantee the specific gap closes. Some weaknesses have survived several generations."}, {"q": "◐  bait", "f": "Every technology levels off. Planes aren't faster than in 1970. So the models will stop too, and probably already have."}, {"q": "●  rage bait", "f": "Every model is \"the best model\" for six weeks."}]}, {"t": "“OpenAI and Anthropic win on harnesses”", "p": "OpenAI and Anthropic keep a real edge, mostly through their harnesses and built-in tooling.", "k": [{"q": "○  serious", "f": "Harness advantages are the easiest to copy. Open tooling has caught up within months each time."}, {"q": "◐  bait", "f": "If the edge is the wrapper, then the model isn't the edge. So the models are all the same, and people are paying for a nicer window."}, {"q": "●  rage bait", "f": "Claude Code is a for-loop with a logo."}]}, {"t": "“Scope the session and it behaves”", "p": "Give each session a clear role and scope and it behaves. No alignment trouble.", "k": [{"q": "○  serious", "f": "That works at small scale under supervision. The worry is about less supervised, longer-running use."}, {"q": "◐  bait", "f": "It's a computer. It does what it's told. If it did something else that would be a bug, and bugs get fixed. So there's no such thing as an alignment problem."}, {"q": "●  rage bait", "f": "Alignment is easy. You tell it what to do. It's a computer."}]}, {"t": "“VS Code is an F1 car for beginners”", "p": "Telling a beginner to use VS Code is like teaching them to drive in an F1 car.", "k": [{"q": "○  serious", "f": "An editor with a file tree is about the simplest environment going. The harder thing is learning with a tool that hides the files."}, {"q": "◐  bait", "f": "Every working developer uses an editor. If beginners don't learn one, they aren't learning to develop. They're learning to ask."}, {"q": "●  rage bait", "f": "Vibe coding isn't programming, it's ordering."}]}, {"t": "“The desktop app is enough”", "p": "The desktop app has everything someone starting out needs. An IDE adds complexity they'll never use.", "k": [{"q": "○  serious", "f": "The complexity they'll never use includes the debugger, and that's how you find out why it broke."}, {"q": "◐  bait", "f": "If the app does everything, there's nothing for the user to do. If there's nothing for the user to do, they aren't a developer. So the app is for people who aren't."}, {"q": "●  rage bait", "f": "Vibe coding is fine until prod, and everything is prod."}]}, {"t": "“Get the top-spec MacBook”", "p": "A top-spec MacBook is the machine to want.", "k": [{"q": "○  serious", "f": "Per dollar, a desktop with a real GPU does much more for local model work."}, {"q": "◐  bait", "f": "It can't be upgraded, can't be repaired and costs double. Those are the three things a computer shouldn't be."}, {"q": "●  rage bait", "f": "A Mac isn't a dev machine. It's a fashion choice with a terminal."}]}, {"t": "“Controlling your own UI is liberating”", "p": "Getting programmatic control of your own UI is liberating.", "k": [{"q": "○  serious", "f": "It is, and the hours spent customising rarely come back as output."}, {"q": "◐  bait", "f": "Time spent on the tool is time not spent on the work. The more you customise, the less you ship. That's arithmetic."}, {"q": "●  rage bait", "f": "Imagine having the perfect setup and nothing to build with it."}]}, {"t": "“Every job is a computer job now”", "p": "Computer jobs are nearly every job now, so that's who's exposed.", "k": [{"q": "○  serious", "f": "Exposure isn't replacement. Most jobs are bundles of tasks, and automating some of them has usually changed the job without ending it."}, {"q": "◐  bait", "f": "If AI could do computer jobs, the companies selling it wouldn't be hiring. They're hiring. So it can't."}, {"q": "●  rage bait", "f": "AI taking jobs is bad. No jobs, no money, no customers."}]}, {"t": "“Doormen are ego”", "p": "Some jobs only exist as status display. A doorman's value is someone's ego, and a robot could take it.", "k": [{"q": "○  serious", "f": "If the value is having a person do it, a robot can't supply that by definition."}, {"q": "◐  bait", "f": "People pay for a doorman because they want a person there. A robot isn't a person. So the one job AI can never take is the one in the example."}, {"q": "●  rage bait", "f": "Humanoid robots are shaped like people for the investors."}]}, {"t": "“The tools are great for admin”", "p": "For day-to-day business admin, these tools are already excellent once you know how to use them.", "k": [{"q": "○  serious", "f": "Admin gains are real. They also show how much admin was created by earlier software."}, {"q": "◐  bait", "f": "If a machine can do the admin, the admin never needed doing. Nobody ever automated anything important."}, {"q": "●  rage bait", "f": "Office work was always fake and AI just said so."}]}, {"t": "“Driving goes, eventually”", "p": "Driving will be automated away eventually, just probably not in our lifetimes.", "k": [{"q": "○  serious", "f": "It's been five years off since 2015, which says something about forecasts for the other jobs."}, {"q": "◐  bait", "f": "Cars already drive themselves in some cities. So it's done, and everyone else is waiting for the paperwork."}, {"q": "●  rage bait", "f": "Self-driving cars have been two years away since 2012."}]}]}, {"n": "vannak", "i": "@vannak", "u": [{"n": "Formal systems & truth", "t": [0, 1, 2, 3, 4]}, {"n": "Symbol machines", "t": [5, 6, 7, 8, 9]}, {"n": "Null hypotheses & mech interp", "t": [10, 11, 12, 13, 14]}, {"n": "Physics & measurement", "t": [15, 16, 17, 18]}, {"n": "Scalars", "t": [19, 20, 21, 22]}], "t": [{"t": "“Formal systems have premises, the world doesn't”", "p": "Formal systems have premises. The world doesn't. Truth in the provable sense is a feature of the system.", "k": [{"q": "○  serious", "f": "If truth only lives inside formal systems, \"the world has no premises\" needs some standing of its own to be worth asserting."}, {"q": "◐  bait", "f": "It's raining or it isn't. Nobody needs premises for that. You look out the window, and the window isn't a formal system."}, {"q": "●  rage bait", "f": "Logic is made up."}]}, {"t": "“'Probably true' isn't maths”", "p": "\"Probably true\" isn't workable as mathematics. There's no proof process for it.", "k": [{"q": "○  serious", "f": "Probability theory is a rigorous way of handling \"probably,\" with axioms and proofs of its own."}, {"q": "◐  bait", "f": "Everything outside pure maths is \"probably.\" If probably doesn't count, then physics, medicine and breakfast don't count either."}, {"q": "●  rage bait", "f": "\"Approximately true\" is just false. A miss is a miss."}]}, {"t": "“Go anti-realist if entailment bugs you”", "p": "If logical entailment not matching reality bothers you, go anti-realist. Attacking the true/false binary is pointless, because deduction plainly works.", "k": [{"q": "○  serious", "f": "\"It obviously works\" is a claim about the system's success in the world, and that's a realist thing to say."}, {"q": "◐  bait", "f": "If deduction works on the world, then the world has the structure deduction needs. That's realism. You can't use it and deny it."}, {"q": "●  rage bait", "f": "Formalism is how people hide that they have nothing to say."}]}, {"t": "“Map and territory rig the analysis”", "p": "Laying out a \"map\" and a \"territory\" already sets up a target that tilts the whole analysis.", "k": [{"q": "○  serious", "f": "Dropping the distinction doesn't remove the problem. Models still differ in how well they predict, and that needs explaining."}, {"q": "◐  bait", "f": "There's the thing and there's the description of the thing. Those are two. Anyone who says otherwise is describing something."}, {"q": "●  rage bait", "f": "The map isn't the territory. That's the whole insight and it took four words."}]}, {"t": "“Riding a bike isn't propositional”", "p": "Riding a bike is knowledge. It isn't propositional truth, and running the two together is bad vocabulary.", "k": [{"q": "○  serious", "f": "Know-how can often be restated as knowing that this is a way to do it. The split is less clean than it looks."}, {"q": "◐  bait", "f": "Knowledge is knowing facts. Riding a bike isn't a fact. So it isn't knowledge, it's a habit, and dogs have habits."}, {"q": "●  rage bait", "f": "A formal argument in a Discord is an informal argument with letters in it."}]}, {"t": "“Minds are symbol machines”", "p": "The right way to understand minds and models is as symbol machines.", "k": [{"q": "○  serious", "f": "Neural networks compute with continuous values. The symbols may be something we read into the output."}, {"q": "◐  bait", "f": "A neural net is multiplication. Multiplication isn't symbols. So there are no symbols in there, and the theory is about the wrong machine."}, {"q": "●  rage bait", "f": "LLMs are just autocomplete."}]}, {"t": "“Symbols come from filtering”", "p": "A symbol comes from filtering information. That isn't a separate process from whatever makes consciousness.", "k": [{"q": "○  serious", "f": "Filtering is cheap. A sieve does it. The account needs to say what makes some filtering into symbols and other filtering into gravel."}, {"q": "◐  bait", "f": "A symbol stands for something to someone. No someone, no symbol. So you need the mind first, and it can't be built out of symbo
