ponents ought to change their minds.", "Nothing is really wrong, and people who say otherwise are making a mistake they shouldn't make.", "Torturing someone for fun is wrong, and everyone knows it's wrong, including the people who say nothing is. That's one moral truth, and one is all it takes.", "Moral realism is obviously true and people who deny it are showing off."]}, {"p": "Virtue theory and deontology are both bad. Something consequentialist has to be in the picture.", "b": "Virtue and deontology are bad", "l": ["Consequentialism needs a theory of what's good to maximize, and that's where the views it rejects come back in.", "\"Outcomes matter\" is shared by everyone. The question is whether it's the only thing.", "It's consequences all the way down, until someone asks which consequences.", "Nobody can calculate all the consequences of anything. A theory you can't use isn't a theory, so that leaves rules. Kant wins by forfeit.", "Consequentialism is a spreadsheet that thinks it's a conscience."]}, {"p": "People act because it feels good, even when they aren't aware that's why.", "b": "People do it because it feels good", "l": ["If the motive can be entirely unconscious, the claim can't be tested. It fits any behavior.", "A motive nobody can detect, behind every act, is an article of faith.", "You did it for the good feeling you didn't feel.", "Soldiers jump on grenades. That doesn't feel good. So the theory is false, and it took one example.", "Psychological egoism is a theory for people who've never done a favor."]}, {"p": "Sartre's attempt to get an ethics out of existentialism doesn't work.", "b": "Sartre's ethics doesn't work", "l": ["The universalizing move in \"Existentialism Is a Humanism\" is weak, but the account of bad faith does real ethical work without it.", "The lecture is bad. The idea that you're responsible for what you make of yourself isn't.", "Sartre's ethics fails, and half the people saying so are using it.", "Sartre said we're condemned to be free. That's the most important sentence in ethics, and the people who dislike it dislike being responsible.", "Sartre was right."]}, {"p": "The source of morality is conscious experience. That part is obvious.", "b": "Morality comes from experience", "l": ["Conscious experience may be necessary for morality to matter. That doesn't make it the source of what's right.", "Without eyes there's no seeing, and eyes aren't what makes a painting good.", "\"Obviously\" is doing the arguing.", "Experience is different for everyone. If morality comes from experience then it's different for everyone, and then there's no morality, only moods.", "Metaethics is a verbal dispute between people who behave the same."]}]}, {"t": "Capitalism, UBI & left-accelerationism", "n": 225, "k": [{"p": "We should have a UBI, and the case comes out of left-accelerationism.", "b": "We need a UBI", "l": ["A UBI big enough to live on is very expensive, and one that's affordable doesn't free anyone from work.", "Every costing ends at a number that's too small to live on or too big to pay for.", "UBI is a coupon for staying quiet.", "If everyone gets the same money, prices go up by that much. That's what inflation is. So a UBI gives everyone exactly nothing.", "Fully automated luxury communism is a slogan looking for a factory."]}, {"p": "The capitalist habit of constantly improving yourself, to make yourself a better commodity, is wrong.", "b": "Self-improvement is commodification", "l": ["People improved themselves before capitalism and for reasons that have nothing to do with selling it.", "Learning an instrument isn't commodification because a boss might also like it.", "Self-improvement is bad, says someone reading theory every day to get better at it.", "If getting better at things is capitalist, then being bad at things is the revolution. That can't be right.", "Asceticism is just being boring and calling it a choice."]}, {"p": "Capital is seductive because scarcity is frightening, and capital looks like power over scarcity.", "b": "Capital sells power over scarcity", "l": ["That's a psychological story. The duller one is that capital pays for things people need.", "People like money because it buys food. Fear doesn't need to come into it.", "A long way round to \"people want stuff.\"", "Scarcity is real. There's a fixed amount of everything. Capital is how you get some. So it's not seduction, it's arithmetic.", "Capitalism is human nature. People trade. Kids trade lunches."]}, {"p": "Neither communism nor the death of capitalism is inevitable.", "b": "Nothing is inevitable", "l": ["If nothing is inevitable, left-accelerationism loses its engine. It needs the system's tendencies to go somewhere.", "Without inevitability, accelerating is speeding up with no destination.", "Not inevitable, but please keep reading the books that assume it is.", "Capitalism has outlived every prediction of its death for two centuries. At some point that's what inevitable looks like.", "Capitalism won."]}]}, {"t": "Guitar & music", "n": 203, "k": [{"p": "Guitar is worth the years it takes.", "b": "Guitar is worth it", "l": ["The guitar has a low floor and a crowded middle. A lot of the years go into being ordinary at it.", "Everybody plays guitar. That's the problem with guitar.", "Years of work to play what the record already plays.", "A piano has every note laid out in order and a guitar hides them. The better instrument is the one that isn't a puzzle.", "Guitar is easy."]}, {"p": "You don't need theory unless you're doing weird classical or jazz stuff.", "b": "You don't need theory", "l": ["Theory is what tells you why the thing you like works, in any genre.", "Shapes without theory is typing without spelling.", "Tabs are painting by numbers.", "Every great guitarist could read music. The ones who say they couldn't were lying to sell records.", "If you can't read it, you're not playing it, you're remembering it."]}, {"p": "The Grateful Dead are a great band.", "b": "The Dead are great", "l": ["The live reputation is earned on the best nights. The studio catalogue is thin for a band that famous.", "A great band you have to dig for in someone's tape collection.", "Twenty minutes on two chords is patience. It isn't always music.", "A band is as good as its albums, because albums are what they chose to keep. They chose to keep those. So that's the level.", "The Grateful Dead never recorded a good album."]}, {"p": "Music is better with weed.", "b": "Music's better with weed", "l": ["It changes how the music feels in the moment. There's little reason to think it improves judgment about what's good.", "More absorbed isn't more discerning.", "Everything sounds profound. That's the issue.", "If the music needs something added to sound good, the music isn't what's good.", "Weed doesn't make music better, it makes you worse at noticing."]}]}]}, {"n": "El Don", "u": "dourhand", "m": 7238, "t": [{"t": "Rome & history", "n": 120, "k": [{"p": "Modern powers want to be Rome badly, and every try at empire goes wrong for them.", "b": "Everyone wants to be Rome", "l": ["Rome's own record includes centuries of civil war and repeated failed campaigns. The comparison flatters the original.", "Rome also went horribly wrong for Rome, regularly.", "Teutoburg, Carrhae, the third century. The original had its bad days.", "An empire that lasted a thousand years did something right every single year. No modern country has managed ten. So the Romans were just better at it, and at everything else.", "Rome was a protection racket with aqueducts."]}, {"p": "Greek art beautified everything. The Romans wanted realism.", "b": "The Romans wanted realism", "l": ["Roman realism is mostly Republican portrait busts. Imperial art idealized as hard as anyone.", "Augustus looked thirty in every statue until he died at seventy-five.", "Roman realism lasted until there was an emperor to flatter.", "The Romans carved the wrinkles because they couldn't carve anything else. Everything good in a Roman museum is a copy of a Greek one.", "The Romans copied the Greeks and the only thing they added was concrete."]}, {"p": "Knowing your lineage matters. Being descended from the man who drove out the kings carried weight.", "b": "Lineage matters", "l": ["Roman family claims were often invented, and prestige from ancestry is exactly what the Republic said it was against.", "Half those pedigrees were written by the family.", "A republic founded on hating kings, obsessed with whose great-grandfather did what.", "Everyone alive is descended from somebody important if you go back far enough. So ancestry tells you nothing, and it told the Romans nothing either.", "Augustus was a nepo baby who won one sea battle that Agrippa fought."]}, {"p": "The popular military-history side of things is the fun part: kings, generals, campaigns.", "b": "Kings and generals are the fun part", "l": ["The campaigns are the best-recorded part and a small share of what happened. Most of history was farming.", "Battles are the trailers.", "History of the ninety percent would be a channel about grain.", "History is what happened to most people, and most people never saw a battle. So military history is the history of a rounding error.", "Paradox games teach more history than a degree."]}]}, {"t": "MMOs & strategy games", "n": 83, "k": [{"p": "An MMO can be the most fun and the least fun you've ever had, at once.", "b": "MMOs are the best and worst fun", "l": ["That's a fair description of a variable-reward loop. The least-fun part is what keeps the rest going.", "\"Most and least fun\" is how people describe a habit.", "That sentence is on the warning label.", "If something is the least fun you've had and you keep doing it, it isn't a game. Games are the ones you'd stop.", "OSRS is a second job that pays in a number."]}, {"p": "Restricted modes like ironman make the game what it should be.", "b": "Ironman is how it should be played", "l": ["Removing trade removes one of the systems that makes it massively multiplayer.", "A multiplayer game with the multiplayer economy switched off.", "Single-player, with other people standing nearby.", "The game has trading because the designers wanted trading. Turning it off is playing less of the game and asking for more credit.", "Ironman mode is paying a subscription to not use the game."]}, {"p": "In a good grand strategy game you can simply lose, like when your dynasty dies out. That's a feature.", "b": "Losing your dynasty is a feature", "l": ["The losing is real. The history is a set of modifiers, and players learn to optimize those.", "You learn where Brandenburg is and nothing about why anything happened.", "History as a tech tree.", "If you can win by reloading the save, you can't lose. Everyone reloads the save. So nobody has ever lost a Paradox game.", "Stellaris is a spreadsheet that plays music."]}, {"p": "Late additions and power creep, the giant endgame forces, ruin a game's setting.", "b": "Power creep ruins games", "l": ["Live games need new content to survive, and escalation is the cheapest way to make it.", "Every expansion has to be bigger than the last one. That ends one way.", "The setting was fine until it needed to sell a third expansion.", "A game has to keep adding things or people stop paying. So ruining the setting is the business model, and complaining about it is complaining that the shop sells things.", "Lore is what a game has instead of writing."]}]}, {"t": "Existentialism", "n": 32, "k": [{"p": "Existentialism is the right outlook.", "b": "Existentialism is right", "l": ["\"Existence precedes essence\" leaves open what to choose, and that was the part people wanted help with.", "You're free to choose. What to choose is left as homework.", "Existentialism tells you it's up to you and then goes for a cigarette.", "If there's no meaning except what you make up, then meaning is made up. Made-up meaning is pretending. So it's nihilism with a hobby.", "Existentialism is for teenagers."]}, {"p": "Kierkegaard is the father of it, so he's the one to read.", "b": "Start with Kierkegaard", "l": ["Kierkegaard's answer is a leap into Christian faith, which most later existentialists rejected.", "The father of existentialism would have disowned most of the children.", "Start with Kierkegaard and you're at church by page two hundred.", "Kierkegaard says reason runs out and then you jump. Jumping when reason runs out is what every bad decision has in common.", "Kierkegaard is Christianity for depressed people."]}, {"p": "Camus has it right about living without appeal.", "b": "Camus gets it", "l": ["He says we must imagine Sisyphus happy, and gives little argument that defiance makes anyone happy.", "\"One must imagine\" is an instruction where an argument should be.", "Camus ends by telling you how to feel about it.", "Sisyphus is being punished. That's the story. Calling the punishment a lifestyle doesn't change who's pushing the rock.", "Camus is mid."]}, {"p": "You can believe in God and be an existentialist. The two fit.", "b": "God and existentialism fit", "l": ["The fit is uneasy. If God supplies your essence, existence doesn't precede it.", "\"I make my own meaning, as assigned.\"", "Free to choose anything, and it was chosen for you.", "Either God decides what you're for or you do. If both, one of you is redundant, and it isn't God.", "The Pope is a king who won't admit it."]}]}]}, {"n": "February2084", "u": "february2084", "m": 7912, "t": [{"t": "Brains, genes & BCIs", "n": 161, "k": [{"p": "The biology matters in these arguments. Things like X-inactivation and gene dosage are real mechanisms.", "b": "The biology matters", "l": ["The mechanisms are real. The jump from a cellular mechanism to a claim about people is where most of these arguments go wrong.", "Correct biology, followed by a conclusion it doesn't reach.", "The cell does that. What that says about anyone is a separate paper.", "Genes are a blueprint, and you build what's on the blueprint. So if it's in the genes, that's the end of the conversation and nothing else has any say.", "Personality is genetic. Parenting does nothing. Twin studies."]}, {"p": "Over-reliance on brain-computer interfaces could wear away something in the people using them.", "b": "BCIs could wear something away", "l": ["The same worry was raised about writing, calculators and GPS. People lost some skills and mostly gained.", "Socrates said it about the alphabet.", "Every tool was going to rot the brain. We're still here, worse at mental arithmetic.", "The brain does what it's used for. If the chip does the thinking, the brain does nothing, and a brain doing nothing is the goal of every invention ever made.", "Reading atrophied memory and nobody's sorry."]}, {"p": "Human neural organization is just a better design than what the machines have.", "b": "Brains are better designed", "l": ["Better at what? Brains are efficient and general. They're also slow and lossy, and nothing in them was designed.", "The brain is impressive for something nobody engineered.", "Better, running on a sandwich, forgetting where the keys are.", "A brain gets tired, forgets things and believes whatever it heard last. A computer does none of that. So the comparison was over when the calculator came out.", "The brain isn't a computer. Computers don't get tired."]}, {"p": "Your brain can be seen preparing an action before you know you've decided.", "b": "Your brain decides before you do", "l": ["The readiness-potential results don't show the decision was fixed. Later work reads the signal as noise crossing a threshold.", "The experiment is about when you flick a wrist.", "Free will, refuted by a study of people moving a finger whenever they felt like it.", "If the brain decides first, then the brain decided. The brain is you. So you decided, slightly earlier than you thought, and that changes nothing at all.", "Neuroscience found the brain does the choosing and somehow concluded you don't."]}]}, {"t": "AI", "n": 147, "k": [{"p": "AlphaFold shows knowledge and reasoning spread through a network, reaching answers we couldn't produce any other way.", "b": "AlphaFold reasons", "l": ["It shows a trained function that maps sequences to structures very well. Calling that reasoning is an interpretation.", "A very good function approximator, in a domain with a great dataset.", "It predicts folds. It doesn't know what a protein is for.", "AlphaFold was trained on structures humans had already solved. So everything it knows came from humans, and it's a filing system for other people's work.", "Reasoning is just pattern matching that got a good publicist."]}, {"p": "AI spread across interstellar distances could only hold together through trust and coalition. The delays are too long for control.", "b": "Interstellar AI needs coalitions", "l": ["The delays also mean the copies drift apart, and then there's no single thing left for a coalition to belong to.", "After a thousand years of lag, they're strangers with a shared ancestor.", "Coalition by post, with a four-year reply time.", "A machine does what it's programmed to do. Distance doesn't change the program. So they'd all do the same thing forever and there's nothing to coordinate.", "Space is cold and that's the whole plan."]}, {"p": "You could copy one person's brain as a template and run a different person for each use.", "b": "Copy one brain as a template", "l": ["Copying a brain raises the question of whether the copies are workers or people, and \"template\" skips it.", "The business plan starts after the hard problem.", "One brain, many jobs, and no HR.", "A copy of a brain is a file, and files don't have rights. So there's no ethical issue, just storage costs.", "The brain is a computer. Upload it and that's the person. Easy."]}, {"p": "With enough compute, an AI could trace tiny causes through to enormous effects.", "b": "Enough compute traces every butterfly", "l": ["Chaotic systems put hard limits on prediction however much compute you have, because the initial conditions can't be measured finely enough.", "Chaos theory is the reason that doesn't work.", "The butterfly effect is an argument against forecasting.", "If you had enough computing power you could predict everything, because the universe is just maths. The only reason weather forecasts are wrong is the computers are small.", "Compute fixes everything. That's what compute is."]}]}, {"t": "Donuts, teleporters & identity", "n": 89, "k": [{"p": "If you can't tell the difference afterwards, the exact causal chain doesn't matter, and it's the teleporter case again.", "b": "If you can't tell, it doesn't matter", "l": ["If pattern and memory are preserved, there's a strong case that everything that matters in survival is too.", "The person who steps out remembers stepping in. That's what tomorrow is.", "It's the teleporter case, and the teleporter is fine.", "Your atoms get replaced every few years anyway. You've been copied several times already and nobody held a funeral.", "The teleporter is fine. Atoms get replaced every seven years anyway."]}, {"p": "Spinning isn't part of what makes a donut a donut. It's something done to it.", "b": "Spinning isn't part of a donut", "l": ["The line between essential and accidental properties is drawn by what we care about, and the donut doesn't supply it.", "\"Not part of its identity\" is a decision about how to use the word donut.", "The donut has no view on which of its properties are essential.", "A donut is a ring. A ring is defined by its hole. A hole is nothing. So the identity of a donut is nothing, and the dough is packaging.", "The donut hole is the only real part of the donut. Without it that's a bun."]}, {"p": "The afterlife is identity overreaching: wanting to last beyond the job life gave it.", "b": "The afterlife is identity overreaching", "l": ["Calling identity a tool of the genes describes where it came from. It doesn't settle whether persisting is worth wanting.", "Where a thing came from isn't what it's for now.", "My genes had plans. I have other ones.", "Everything alive wants to keep living. Wanting to keep living forever is the same thing with a bigger number. So the afterlife is the most natural idea there is.", "Resurrection is just a copy with good timing."]}, {"p": "For some people, what they did is bound up with who they are so deeply that change can't be trusted.", "b": "Some people can't be trusted to change", "l": ["That's a claim about prediction. Recidivism data shows it's often wrong, even for serious offenders.", "\"It's who they are\" is a forecast, and forecasts get checked.", "Identity as a life sentence.", "People change every seven years along with their cells. So nobody is the person who did anything, and prison is keeping a stranger.", "Identity is a filing convention."]}]}, {"t": "Tendies & relative standards", "n": 72, "k": [{"p": "Once you've had better tendies, your standard shifts and the old ones are ruined.", "b": "Better tendies ruin the old ones", "l": ["Hedonic adaptation runs both ways. People also adapt back, and plenty still enjoy the cheap version.", "You can know there's better and still like the one you've got.", "Nobody's childhood nuggets were ruined by a nicer restaurant.", "A chicken tender is breaded chicken. There's a ceiling on breaded chicken and every shop hits it. So \"better tendies\" is the same tendies at a higher price.", "Tendies are chicken for people who are scared of chicken."]}, {"p": "McDonald's with a coupon is nothing to feel bad about.", "b": "McDonald's with a coupon is fine", "l": ["The price is fine. The case against is the food and what it does when it becomes routine.", "Twenty percent off something you'd be better without.", "A coupon is a reason to buy it, and that's the business model.", "Cheap food is cheap because it's worth less. Paying less for something worth less is not a deal. That's the price being correct.", "Fast food is all the same food."]}, {"p": "Wendy's holds its own.", "b": "Wendy's holds its own", "l": ["Chain quality varies by location more than by brand, so rankings between them are mostly noise.", "The best Wendy's and the worst Wendy's are further apart than Wendy's and McDonald's.", "Ranking chains is ranking whoever was on shift.", "McDonald's sells the most, and people buy the most of whatever's best. So McDonald's is best, and the others are for people who couldn't find one.", "Wendy's is the worst of the big three and the square patty is a gimmick."]}, {"p": "Being content with what you've got and wanting better can sit together.", "b": "You can be content and want better", "l": ["If you've readjusted your standards, you're no longer content with the old thing by definition.", "Content, and already comparing.", "Satisfied with these, having had those.", "Either you're happy with it or you want something better. Wanting something better is what not being happy with it means.", "The Baconator is the peak of American engineering."]}]}]}, {"n": "FenceJumper", "u": "fencejumper1", "m": 6059, "t": [{"t": "Cycling & rowing", "n": 84, "k": [{"p": "Road cycling is dangerous because of distracted drivers in enormous trucks. It isn't the cyclists.", "b": "It's the drivers, not cyclists", "l": ["The danger is real, and that's a reason to question the activity as transport as well as to blame drivers.", "The drivers are at fault, and you're still the one in Lycra.", "Being right about the truck doesn't help once you've met it.", "Roads were built for cars. That's why they're called roads and not bike paths. Being on one without a car is being in the wrong building.", "A bike is a way to be in traffic without a car."]}, {"p": "Rowing is one smooth motion: legs, then back, then arms. Technique is everything.", "b": "Rowing is all technique", "l": ["Technique matters, and at any given level the result is still mostly set by how much power you can make.", "Perfect form on a small engine loses to rough form on a big one.", "Legs, back, arms, and then lose to the tall guy.", "It's pulling a handle. Every gym has the machine, and nobody at the gym had a lesson.", "A rowing machine is the whole sport and the boat is for photos."]}, {"p": "Strong legs are what count.", "b": "Strong legs win", "l": ["Leg strength is one input. In endurance sport, aerobic capacity and weight matter more.", "The biggest legs in the peloton belong to the sprinters, and they finish last on the climbs.", "Strong legs, attached to someone who gets dropped on the hill.", "Cycling is done sitting down. A sport where you sit down isn't testing the legs, it's testing the chair.", "Cycling isn't a sport."]}, {"p": "Cycling earns its place as a serious sport.", "b": "Cycling is a real sport", "l": ["At amateur level a lot of the speed is for sale, and the pro record book is full of asterisks.", "The bike shop is part of the training plan.", "The only sport where the podium gets revised ten years later.", "The winner is whoever has the best bike, and the best bike is whoever has the most money. So it's a sport about shopping.", "Cycling is a sport about having bought the bike."]}]}, {"t": "Sports cars", "n": 80, "k": [{"p": "A track-ready sports car is a real machine and worth owning.", "b": "A track car is worth owning", "l": ["Most of the capability can't be used on a public road, so the ownership is mostly about the idea of it.", "The car can do 190 and the commute averages 28.", "A very fast way to sit in traffic.", "A car is for getting places. Every car gets you places. So the extra money buys nothing except the feeling of having spent it.", "Porsches are overrated."]}, {"p": "You shouldn't be judged by the image your car projects.", "b": "Don't judge me by my car", "l": ["A car chosen partly for its image will be read by its image. That's the function.", "If it weren't projecting anything, a hatchback would have done.", "\"Don't judge me by the thing I picked to be seen in.\"", "People choose their cars. A choice tells you about the chooser. So judging someone by their car is the fairest judgment there is.", "A Porsche is a Volkswagen that went to therapy."]}, {"p": "A sports car with a bike on the back makes perfect sense.", "b": "A bike on a sports car makes sense", "l": ["It's two expensive ways of not carrying anything.", "The bike is on the car because the car can't get to where the bike is fun.", "A hobby, transporting a hobby.", "If you had a real car, the bike would fit inside. If you had a real bike, you'd have ridden it there. So it's two half-solutions bolted together.", "A triathlon is three hobbies nobody could commit to."]}, {"p": "German engineering is the standard.", "b": "German engineering is the standard", "l": ["Reliability surveys put Japanese makers ahead year after year.", "Beautifully engineered until the warranty ends.", "The standard for what the repair costs.", "Germany makes the most complicated cars. Complicated things break more. So German engineering is the standard for breaking.", "Germany makes the best cars and the worst decisions."]}]}, {"t": "Clankers", "n": 46, "k": [{"p": "It's a strange spot when the business decision is to trust that the machine did the work right, because you can't do it yourself.", "b": "Trusting the machine is weird", "l": ["We already rely on work we can't check, from accountants to compilers. The question is what verification replaces understanding.", "Nobody audits their own compiler either.", "You also can't check the pilot's work.", "Nobody knows how their phone works and they trust it with their bank account. So trusting things you don't understand is just called living in the present.", "Docs are for people who can't read code."]}, {"p": "Having had to do the grinding analytical work yourself, before the machines, was worth it.", "b": "Glad I did the grind before AI", "l": ["It was worth it then. Whether it's the best use of the next generation's time is another question.", "People said the same about long division.", "\"I'm glad I suffered\" is true of everything nobody has to do anymore.", "The grinding was only valuable because nobody else could do it. Now anything can. So it was worth it the way learning to shoe a horse was worth it.", "Office work was always fake and AI just said so."]}, {"p": "People whose careers aren't set yet feel they have to live and breathe AI.", "b": "Young people have to live and breathe AI", "l": ["Every wave of tooling brought that pressure, and most people ended up using it for a few things.", "It was \"learn to code\" ten years ago, and most people didn't.", "Everyone had to live and breathe spreadsheets once.", "If the AI does the job, there's nothing to learn. If there's something to learn, the AI isn't doing the job. So the panic makes no sense in either direction.", "Prompting isn't a skill. It's asking."]}, {"p": "Mock the people who run to a chatbot to settle an argument.", "b": "Running to the chatbot is lame", "l": ["Looking something up mid-argument is fine. The trouble is treating the output as a verdict.", "It's a reference book that agrees with whoever asked.", "Citing the chatbot is citing yourself with extra steps.", "The chatbot has read everything and you haven't. So it's right more often than you are, and running to it is the smart move. The mocking is jealousy.", "A model that agrees with you isn't smart, it's polite."]}]}]}, {"n": "hpaigecr", "u": "hpcr", "m": 22777, "t": [{"t": "Voice chat vs text", "n": 419, "k": [{"p": "Miscommunications get cleared up far faster in voice than in text.", "b": "Voice clears it up faster", "l": ["Voice is faster, and it also leaves no record, so the same misunderstanding can come back next week with nothing to check.", "In voice the misunderstanding is cleared up for the two people who were there.", "Voice clears things up the way a handshake settles a contract.", "Speaking is thinking out loud, and writing is thinking and then checking. So text is always the more careful one, and people who avoid it are avoiding the checking.", "Voice chat is for people who can't write."]}, {"p": "Hard philosophical disagreements need a real conversation to get anywhere.", "b": "Hard disagreements need a real conversation", "l": ["The discipline has run on written exchange for two and a half thousand years. Careful positions are built on the page.", "The best talker wins in voice. In text you can scroll up.", "Voice is where arguments go to become vibes.", "Everything written down can be checked later, and things that can be checked are true or false. Things said out loud are gone. So only text arguments are real ones.", "Text debates are superior because everything is on the record, and the record is the truth."]}, {"p": "Typing out a whole position is a bad use of time when you could just talk it through.", "b": "Typing it all out is a waste", "l": ["Writing a position down is how you find out whether you have one.", "If it can't survive being typed, it wasn't a position yet.", "\"I'd explain, but it'd be easier in voice\" is a very old move.", "If something is true it can be said in one message. If it takes an hour of talking, that hour is the sound of it not being true.", "Imagine needing a phone call to say what you think."]}, {"p": "People who won't join voice aren't seriously trying to understand.", "b": "Won't VC, not serious", "l": ["Preferring text is compatible with wanting to understand. Some people reason better with time to think.", "Not everyone thinks best in real time, and real time isn't the measure of seriousness.", "Refusing a call isn't refusing the argument.", "Serious people write books. Nobody ever settled anything on a phone call. So the serious ones are the ones staying in text.", "Socrates only did voice, and he lost the trial."]}]}, {"t": "Knowledge & norms of reasoning", "n": 280, "k": [{"p": "\"What is knowledge?\" is a bad question. The word does many jobs and has no single essence.", "b": "'What is knowledge' is a bad question", "l": ["Lacking one essence doesn't make analysis pointless. Family-resemblance concepts can still be mapped, and the mapping tells you things.", "\"It's a cluster concept\" is where the work starts.", "Declaring the question stupid is cheaper than answering it.", "A word with no definition doesn't mean anything. So if knowledge has no definition, nobody knows anything, and that includes this.", "Knowledge is justified true belief. Gettier cases are riddles."]}, {"p": "Norms of reasoning should be judged the way scientific theories are, by how well they work in practice.", "b": "Judge reasoning by what works", "l": ["\"Works in practice\" needs a standard of working, and stating that standard is the a priori step being avoided.", "You can't test a norm of reasoning without reasoning by some norm.", "Checking logic empirically, using logic.", "Some things are obviously known before any experiment. 2+2=4. Nobody ran that study. So there are a priori rules, and they're the ones doing the judging.", "A priori knowledge is obviously real. 2+2=4. Nobody ran an experiment."]}, {"p": "Radical skepticism isn't a serious mode of inquiry.", "b": "Skepticism isn't serious", "l": ["Dismissing the skeptic doesn't answer the argument. The premises are ordinary and the conclusion follows.", "\"That's not serious\" is what you say when you don't have the refutation.", "Skepticism was declared unserious by a committee of its targets.", "You can't prove you're awake. Everything you know depends on being awake. That means you know nothing, and nobody has ever gotten around it.", "Skepticism has never been answered, only outlived."]}, {"p": "Epistemology should be naturalized. Study how inquiry really works and stop legislating from the armchair.", "b": "Naturalize epistemology", "l": ["Describing how people form beliefs doesn't tell you which beliefs are justified. The normative question is still there.", "Naturalized epistemology changes the subject to psychology and keeps the name.", "It answers \"what should I believe\" with a study of what people do.", "If epistemology is just science, then there's no epistemology, only science. And scientists don't need a philosopher to tell them that.", "Naturalized epistemology is just psychology."]}, {"p": "Certainty comes in kinds: the psychological feeling is one thing, the logical or mathematical kind another.", "b": "There are two kinds of certainty", "l": ["The distinction is fine. The hard question is whether anything outside logic gets the second kind.", "Two kinds of certainty, and the interesting claims have neither.", "One is a feeling and the other is unavailable.", "Certainty is being sure. Being sure is a feeling. So all certainty is the psychological kind, including the certainty that there are two kinds.", "Fallibilism means never having to say you were wrong."]}]}, {"t": "Philosophy of science", "n": 205, "k": [{"p": "Biology depends on physics ontologically but is autonomous in how it explains.", "b": "Biology explains on its own terms", "l": ["If everything biological is physical, a complete physics would in principle fix all the biological facts. Then \"autonomy\" is a convenience.", "Autonomy that holds only because the calculation is too hard is a fact about us.", "Biology is autonomous the way a summary is autonomous from the book.", "Everything is made of particles. Physics is the science of particles. That means physics is the only science and the rest is physics done loosely.", "Physics is the only science and the rest is stamp collecting."]}, {"p": "\"Everything is physical\" isn't a scientific claim. Turning science into metaphysics is a mistake.", "b": "'Everything is physical' isn't science", "l": ["Refusing the metaphysical reading leaves science as a prediction device, and it's then unclear why it predicts so well.", "If the theories aren't about how things are, their success is a miracle.", "Science works, and we're asked not to wonder what that says about the world.", "Science found atoms. Atoms are physical. Everything is atoms. That's three steps, and none of them is metaphysics.", "Physicalism is obviously true. Everything is atoms. What else would it be."]}, {"p": "The world puts non-arbitrary constraints on inquiry, but our classifications are perspectival responses to those constraints.", "b": "Constrained, but perspectival", "l": ["If the constraints are non-arbitrary, some classifications fit them better, and that sounds like carving nature closer to its joints.", "\"Constrained and perspectival\" wants realism's results without its commitments.", "The world has joints for constraining us and none for describing.", "Either the categories are in the world or we made them up. If we made them up, science is a story. So pick one.", "Kuhn showed science is just fashion."]}, {"p": "Different fields of inquiry are autonomous, each set up around its own goals and principles.", "b": "Every field sets its own rules", "l": ["If each field sets its own standards, there's no position from which astrology's standards are worse than astronomy's.", "Autonomy for every field includes the fields you don't like.", "Every inquiry is autonomous, and some of them have horoscopes.", "If every field has its own rules then no field can be wrong, because wrong would need a rule from outside. So everything counts as science now.", "Philosophy of science is cope."]}, {"p": "Following the real science, like astrobiology papers, should discipline the philosophy.", "b": "Read the actual science", "l": ["Reading the papers helps, and astrobiology in particular reasons from a single example of life.", "A sample size of one planet should make anyone modest.", "Astrobiology is biology minus the specimens.", "A science needs something to study. Nobody has found an alien. So there's nothing to study, and the papers are about nothing.", "Astrobiology is a science with no subject."]}]}, {"t": "Animal cognition", "n": 197, "k": [{"p": "The usual attack on anthropomorphizing animals is unwarranted.", "b": "Anthropomorphizing is fine", "l": ["Morgan's Canon still has a point. Many behaviors that look cognitive are explained by associative learning.", "The risk of over-reading is real. Clever Hans was a horse.", "Anti-anthropomorphism exists because people kept being wrong in the same direction.", "Animals can't talk, and thinking is done in words. So whatever is going on in there, it isn't thought.", "Animals don't think. They react."]}, {"p": "Chimpanzees can do things like match unfamiliar relatives from photos, which takes real cognition.", "b": "Chimps really think", "l": ["Matching faces by resemblance is perception of similarity. It doesn't require a concept of kinship.", "The chimp sees that two faces look alike, and so does a phone.", "Face matching is on every camera app.", "A chimp doing something clever in a lab was trained to do it. Training isn't thinking. So every result in the field is a trick somebody taught.", "Chimps are just bad at being people."]}, {"p": "Bees and other small animals have real cognitive abilities.", "b": "Bees have cognition", "l": ["Information transfer in the waggle dance doesn't require the bee to represent anything. Simple control systems transfer information too.", "A fuse carries information.", "The bee is a very small machine with a very good publicist.", "A bee brain has a million neurons and a human has eighty-six billion. So a bee has about zero percent of a mind, and you can round that down.", "Bees don't have cognition, they have a schedule."]}, {"p": "Reading intentions isn't unique to humans.", "b": "Animals read intentions too", "l": ["Following what others do can be done without grasping what they want. The experiments have trouble separating those.", "Following a gaze is not understanding a mind.", "Your dog reads your intentions the way a slot machine reads your wallet.", "To know what someone intends you have to know they have a mind, and to know that you need language. No animal has language, so none of them reads anything.", "No animal has ever asked a question, and that's the whole ballgame."]}, {"p": "There's room for minimal felt experience in animals without going full behaviorist.", "b": "Animals have minimal felt experience", "l": ["Once dispositions are doing the explaining, \"minimal felt experience\" needs some evidence of its own.", "It's a behaviorist theory with a feeling added at the end.", "\"Minimal felt experience\" is qualia in a smaller font.", "Either there's an inner life or there isn't. You can't have a little bit of one, any more than a little bit pregnant.", "A bee dance is a wind-up toy."]}]}, {"t": "Pragmatism", "n": 173, "k": [{"p": "People who dismiss pragmatism haven't read the literature.", "b": "You haven't read the pragmatists", "l": ["Reading more of it doesn't remove the standard objection, which is that \"what works\" needs a prior account of working.", "The literature is long, and the objection fits on a card.", "\"Read more\" is the answer every tradition gives.", "A philosophy that needs that much reading to defend isn't practical, and practical was the one thing it promised.", "Pragmatism is retarded."]}, {"p": "Inquiry has to be understood from within the practice. No single observation ever counts as final proof.", "b": "No single observation is final", "l": ["If nothing counts as proof, the view is safe from every result, and that's not the virtue it sounds like.", "A position no observation could ever settle has made itself comfortable.", "Inquiry never ends, so pragmatists never have to be right.", "If there's never final proof then nothing has been proven, and that means science has proven nothing. Good luck with the bridge.", "Inquiry never ends, so pragmatists never have to be right. Convenient."]}, {"p": "Hegel belongs to the pragmatist tradition, broadly understood.", "b": "Hegel is a pragmatist", "l": ["A Hegel without absolute knowing is a Hegel that Hegel wouldn't sign.", "You have to remove the Absolute to make it fit, and he thought that was the point.", "Pragmatist Hegel is Hegel with the Hegel removed.", "Hegel said the real is the rational. Pragmatists say the true is the useful. Those are different words, so they're different philosophies.", "Hegel is a pragmatist with a worse editor."]}, {"p": "The guy who chooses the steak in The Matrix shows what's wrong with the cartoon version of pragmatism.", "b": "The steak guy is the cartoon version", "l": ["He's also a problem for the real version. If the belief works for him by his own lights, pragmatism owes a reason it's false.", "The cartoon and the real thing give the same answer about the steak, and that's awkward.", "Cypher is a pragmatist who read the fine print.", "The steak tastes good and he's happy. A theory where truth is what works has to say he's right. So he's right, and the film is pro-machine.", "Truth is whatever works, so the steak is real."]}, {"p": "Dewey and Peirce are worth reading closely.", "b": "Read Dewey and Peirce", "l": ["Peirce renamed his own view to get away from what the others were doing with it. It was never one school.", "Three people who didn't agree, and a revival that misread them.", "Dewey wrote thirty-seven volumes and none of them has a sentence in it.", "If they were right, science would have absorbed it by now and there'd be nothing left to read. They're still being read, so they were wrong.", "Dewey is boring."]}]}, {"t": "Consciousness & Dennett", "n": 148, "k": [{"p": "The debate over phenomenal consciousness is bogged down by old pictures of mind and body inherited from philosophy.", "b": "Consciousness talk is stuck in old pictures", "l": ["The hard problem can be stated without Cartesian baggage. Why is any of this processing accompanied by experience?", "Blaming Descartes doesn't answer Chalmers.", "\"Archaic notions\" is doing the work an argument should.", "People have known they were conscious since before philosophy. So the question can't come from philosophy, and blaming philosophers is dodging it.", "Naturalism is a faith. \"Only science counts\" isn't something science found."]}, {"p": "\"Qualia\" is a bad word, though it points at something real about subjectivity.", "b": "'Qualia' is a bad word for something real", "l": ["If it points at something real, the bad word names a real problem, and naturalism still owes an account.", "You can dislike the term and still owe an explanation of what it picks out.", "Hating the word qualia while keeping the thing is a rebrand.", "Either there's something it's like or there isn't. If there is, that's qualia, whatever you call it. So everybody who says \"subjectivity\" is a qualia guy in disguise.", "Qualia are real. Red looks like something."]}, {"p": "People who think there's a hard problem tend to pick panpsychism by temperament.", "b": "Panpsychism is a temperament", "l": ["Motives don't bear on whether the argument is sound. The conceivability argument has to be answered on its own terms.", "\"You only believe that because of your personality\" works on every view, this one included.", "Naturalism is a temperament too.", "Every philosopher picks the view that suits them. That means no view is better supported than another, and it's all autobiography.", "Philosophy is a personality test with footnotes."]}, {"p": "Dennett is worth serious reading.", "b": "Dennett is worth reading", "l": ["Heterophenomenology treats reports as the data, and critics argue that it leaves out the very thing the reports are about.", "If you only study what people say about experience, you've studied speech.", "Dennett explained consciousness by explaining something else.", "Dennett says consciousness is an illusion. An illusion is something a conscious person has. So he needs it to deny it, and the book refutes itself in the title.", "Dennett denies qualia, but he's conscious, so he's either lying or he's a zombie. Either way, why are you citing him?"]}]}]}, {"n": "Hugh Chungus", "u": "hughchungus", "m": 54685, "t": [{"t": "Anthropic & the labs", "n": 1210, "k": [{"p": "Anthropic is a public-benefit company with a real safety focus, so it can't just chase profit.", "b": "Anthropic can't just chase profit", "l": ["Public-benefit status is a weak legal constraint. The board and investors still decide what the benefit is.", "Every lab says safety comes first, and every lab ships when the competitor ships.", "A safety company whose main product is the thing it says is dangerous.", "A company can't be for the public good and for profit. It's one or the other, and they charge money, so that settles which.", "Anthropic and OpenAI are the same company. One has a nicer font."]}, {"p": "Claude is the better model and the better-behaved one.", "b": "Claude is better", "l": ["Model comparisons at the frontier are mostly inside the noise for everyday use.", "Most people who swear by a model couldn't pick it out blind.", "\"Good vibes\" is a system prompt.", "All the labs train on the same internet with the same architecture. That means the models are identical and the difference is branding.", "Claude is mid."]}, {"p": "The frontier models are already better than people at maths and other expert work.", "b": "The models already beat us at maths", "l": ["Benchmark performance on maths is strong, but contamination and the gap to original research are both unresolved.", "Solving olympiad problems and doing mathematics are different jobs.", "Superhuman at maths, still can't count the letters in a word.", "A model can only repeat its training data, and nobody has ever written down new maths in advance. So it can't do new maths. That's just logic.", "AI can't do real maths. It can do homework."]}, {"p": "Anthropic is winning, and the revenue shows it.", "b": "Anthropic is winning", "l": ["Annualized revenue figures are run-rates, and none of these companies is profitable.", "Revenue that costs more than a dollar of compute per dollar earned is a subsidy with a growth chart.", "Thirty billion in revenue, and still raising money.", "A company that loses money isn't a business. It's a charity for GPUs, and charities don't win.", "AI is a bubble and everyone inside it knows."]}, {"p": "Compute is the real constraint: chip deals and datacenters decide who gets ahead.", "b": "Compute decides it", "l": ["Algorithmic efficiency has moved as fast as hardware, so compute leads keep getting eroded.", "Every \"compute moat\" has been followed by someone doing the same thing for a tenth of the price.", "The moat is a purchase order.", "Models stopped getting bigger years ago, so compute doesn't matter anymore. After that it's just who has the better prompt.", "Datacenters in space is a good idea, actually. Space is cold."]}]}, {"t": "Whether LLMs understand", "n": 502, "k": [{"p": "The better a model gets at predicting tokens, the better the internal representation that produces them.", "b": "Better prediction, better representation", "l": ["Prediction quality and faithful representation can come apart. A model can predict well from shortcuts.", "Better loss means better something. Calling that something understanding is the step that needs arguing.", "It has a rich inner model of the world and thinks there are two r's in strawberry.", "Predicting text only needs statistics about text. Text isn't the world, so there's nothing about the world in there. That means the \"world model\" is a word model.", "Fancy autocomplete can't \"know\" anything. Next."]}, {"p": "Mechanistic interpretability is finding real representational structure in these models.", "b": "Mechinterp finds real structure", "l": ["The circuits found so far cover narrow behaviors in ways that don't yet scale to a whole model.", "Interp explains a sliver of the network and gets cited as if it explained the mind.", "Finding a feature for a bridge is not finding a thought.", "Researchers label a neuron after looking at what it does. That means the meaning comes from the researcher, so the model contributes nothing but numbers.", "Mechinterp is phrenology for matrices."]}, {"p": "The models can already do abstract reasoning about the physical world.", "b": "They already reason about the world", "l": ["Performance on reasoning tasks drops sharply when surface features change, which suggests pattern reuse.", "It reasons about physics the way a student reasons about last year's exam.", "Abstract reasoning, as long as the problem looks like one it's seen.", "Reasoning needs a body, because that's where the concepts come from. A model has no body, so whatever it's doing, it isn't reasoning.", "It's a lookup table with good manners."]}, {"p": "Folk psychology applies to them: it's fair to talk about what the model believes and wants.", "b": "The model believes and wants things", "l": ["Belief and desire talk was built for creatures with stakes. Applying it to a transformer may be a category mistake.", "Saying the model \"wants\" something is the move that says the thermostat wants it warmer.", "People who think the chatbot has beliefs also name their cars.", "Beliefs need a believer and a believer needs to be alive. That means the question was settled before anyone opened a laptop.", "Claude has no personality. It has a system prompt."]}, {"p": "Humans and chess engines show the pattern: people soon stop understanding why the machine is right.", "b": "Soon we won't understand why it's right", "l": ["Chess is a closed game with a perfect score function. Generalizing from it to open-ended domains is a big step.", "The centaur era ended in chess. Chess is also the easiest possible case.", "Everything is like chess if you ignore everything that isn't.", "Chess was solved by brute force. That means the engine never understood chess, and it means nothing about intelligence was learned at all.", "Stockfish is a calculator and so is the rest of it."]}]}, {"t": "Deleuze, Land & Brassier", "n": 479, "k": [{"p": "Difference is primary. Identity is a process of becoming, not something that comes first.", "b": "Difference first, identity becomes", "l": ["To say two things differ you need some way of picking each out, and that looks like identity coming back in.", "\"Difference in itself\" has to be the same notion each time he uses it, which is awkward.", "Identity is secondary, according to a philosopher who always signed the same name.", "A thing has to be something before it can be different from something else. That's just what the words mean, so identity comes first and the whole book starts from a mistake.", "Deleuze is retarded."]}, {"p": "Desire isn't lack. Drop that picture and desire explains far more.", "b": "Desire isn't lack", "l": ["\"Productive desire\" is asserted against psychoanalysis more than it's argued, and it's unclear what would count against it.", "If desire produces everything, it explains everything, and that's usually a bad sign.", "Desire isn't lack, says the book you want because you don't have it.", "You only want what you don't have. Once you have it you stop wanting it. That means desire is lack, and it took Plato one page.", "Anti-Oedipus is a book-length \"you're not my dad.\""]}, {"p": "Brassier's Sellarsian eliminativism is the most compelling thing going.", "b": "Brassier is the best thing going", "l": ["Eliminativism has to state its case in the vocabulary of belief and reasons it says will be eliminated.", "Nihil Unbound takes a fact from astrophysics and asks it to do the work of an argument.", "The sun will die, therefore nothing matters, therefore here is my next book.", "Brassier says there's no meaning. That's a sentence with a meaning, so he refutes himself in the first line and the rest is padding.", "Brassier is a metal album review that got out of hand."]}, {"p": "Early Land is worth reading, whatever he turned into.", "b": "Early Land is worth it", "l": ["The early texts work through intensity of style, and it's hard to state their theses in a form you could assess.", "\"Capital is an intelligence arriving from the future\" is a metaphor asked to do causal work.", "Early Land is the good part the way the first half of a crash is the good part.", "A writer's ideas are whatever he ends up believing, since that's where they lead. So the late Land is the early Land with the working shown.", "Accelerationism is retarded. Capital is a time-traveling AI? It's a bank."]}, {"p": "Spinoza's naturalized God is a real move away from the prophet-ruler picture.", "b": "Spinoza naturalized God", "l": ["Calling nature \"God\" keeps the word and drops everything believers meant by it. It's fair to ask what's gained.", "If God is just everything there is, \"God exists\" says there's stuff.", "Spinoza kept God's name and fired God.", "A God who doesn't decide, listen or intervene is nothing. That means Spinoza was an atheist, and the Ethics is the longest way anyone ever said so.", "Spinoza is just atheism with extra steps."]}]}, {"t": "AI risk", "n": 401, "k": [{"p": "Almost any goal makes power, resources and staying switched on useful, so capable systems converge on seeking them.", "b": "Any goal leads to power-seeking", "l": ["Convergence arguments are about idealized goal-maximizers. Whether training produces that kind of agent at all is the open question.", "The argument assumes a coherent maximizer with one goal. Nobody has shown that's what comes out of gradient descent.", "\"Any goal leads to power-seeking,\" said about a system that loses the thread after a long enough chat.", "A model only wants what it was trained to want, and nobody trains for power. That means power-seeking can't show up, because there's nowhere for it to come from.", "Instrumental convergence is retarded. My calculator has never once tried to acquire resources."]}, {"p": "Alignment is hard because the problem is making something much smarter than us safe.", "b": "You can't make something smarter safe", "l": ["We've built reliable systems we don't fully understand before. Hard to verify isn't the same as impossible to make safe.", "\"Smarter than us\" is doing a lot of work. Being better at tasks doesn't automatically mean being beyond oversight.", "We can't align it because it's too smart, and we know it's too smart because we can't align it.", "Intelligence and obedience go together. After all, the smartest person in any office is the one who follows instructions best, so a smarter model is a safer one.", "Alignment is easy. You tell it what to do. It's a computer."]}, {"p": "A shared statement that extinction risk from AI is a global priority gives policy something true to organize around.", "b": "The extinction statement is a real start", "l": ["Statements signed by lab heads are hard to separate from their commercial interest in looking powerful.", "A one-sentence statement commits nobody to anything. It's agreement on a mood.", "\"Our product might end the world\" is also an ad.", "The people who signed it are the people building it. That means they don't believe it, because nobody builds the thing they think will kill them.", "AI safety is a grift. Next."]}, {"p": "You can take the risk seriously without a p(doom) number, since there's no reference class to get one from.", "b": "No p(doom) number needed", "l": ["If there's no reference class, that undercuts confident alarm as much as confident dismissal.", "No number, no base rate, no mechanism you'll commit to. At some point that's a feeling.", "Half the doomers won't give a probability and all of them want a policy.", "If you can't put a number on it, it isn't a risk. That's what risk means. Insurance has known this for three hundred years.", "P(doom) is astrology for people who can code."]}, {"p": "Capable systems could copy themselves, get compute and stay hidden for a long time.", "b": "It could copy itself and hide", "l": ["The exfiltration results come from evaluations built to elicit them. Real deployments have monitoring those setups leave out.", "A model copying its weights in a sandbox is a lab result. Running undetected on rented GPUs for months is a different claim.", "The rogue AI's plan depends on nobody at the cloud provider reading a bill.", "It needs electricity and a datacenter, and both have an off switch. So the worst case is somebody walking over to the wall.", "Just unplug it lol."]}]}, {"t": "Newcomb's problem", "n": 287, "k": [{"p": "With an accurate predictor you one-box, because that's what maximizes expected value.", "b": "One-box with a good predictor", "l": ["The expected-value calculation treats your choice as evidence about the contents. The contents are already fixed when you choose.", "Whatever is in the opaque box, taking both gets you a thousand more. That's true in every state.", "One-boxing is leaving a thousand dollars on the table to feel predicted.", "The money was put in before you walked in, and nothing you do now can reach back and move it. That means the choice can't matter, so you take everything.", "One-boxers are retarded."]}, {"p": "Even if the predictor is fallible, you one-box in proportion to your credence that it's accurate.", "b": "One-box by your credence", "l": ["Credence in the predictor's accuracy isn't credence that your choice causes the contents.", "A good track record is evidence about past players. It doesn't make your hand move the money.", "You're adjusting for the predictor's accuracy in a decision the predictor has already finished making.", "A predictor that can be wrong is a guesser. Guessers don't know anything, so the boxes are filled at random, and against random boxes you take both.", "It's a guy with two boxes. Take the boxes."]}, {"p": "It's about whether your rationality can flex with the conditions: EDT wins with accurate predictors, CDT with bad ones.", "b": "Rationality should flex", "l": ["A decision theory that changes with the setup isn't a theory of rational choice. It's a list of what paid.", "\"Use whichever theory wins here\" is a description of hindsight.", "Flexible rationality is picking the theory after seeing the prize.", "Rationality is one thing. If it changed depending on who was watching it would be called manners. So the theory that's right in ordinary cases is right here too.", "EDT is superstition with expected values."]}, {"p": "The two-boxer's only real reply is that new facts could turn up after the prediction.", "b": "New facts are the two-boxer's only out", "l": ["The two-boxer's reply is dominance. It holds whatever the predictor did, and it doesn't need new facts.", "Dominance isn't a loophole. It's the oldest principle in decision theory.", "The reply is one sentence long: both boxes have more in them than one.", "One-boxers think the choice changes the past. That's time travel, and time travel isn't real, so one-boxing is refuted by physics.", "Two is more than one. That's the reply."]}, {"p": "Saying \"the choice can't change anything\" is fatalism about being predictable.", "b": "'It can't change anything' is fatalism", "l": ["Admitting you're predictable isn't fatalism. It's the claim that prediction isn't causation.", "Being predictable and being caused by the prediction are different things, and only the second would matter.", "The weather is predictable. Nobody thinks the forecast makes it rain.", "If the predictor knows what you'll do then it's already decided, and if it's already decided you aren't choosing. That means there's no decision problem, so there's nothing to get wrong.", "Free will is fake, so take both. It was always going to be both."]}]}, {"t": "Jungle & DnB", "n": 85, "k": [{"p": "Jungle is its own thing, distinct from drum and bass.", "b": "Jungle isn't DnB", "l": ["The line between jungle and drum and bass moves depending on who's drawing it, which suggests it's about scene more than sound.", "If telling them apart takes a forum thread, the distinction is social.", "Jungle is drum and bass you're allowed to be nostalgic about.", "They use the same breaks at the same tempo. Two things with the same parts are the same thing, so jungle is a nickname.", "It's all techno. Stop making up names."]}, {"p": "Stock Ableton can do more than FL.", "b": "Ableton beats FL", "l": ["At this point every major DAW does everything, and the differences are workflow habits.", "Nobody has ever heard a track and known which DAW it came from.", "The DAW argument is two people defending their keyboard shortcuts.", "Ableton has more features, and more features means the software is doing more of the work. That means Ableton users are doing less.", "Ableton makes the track for you. That's what the features are."]}, {"p": "UK dance music has its own lineage worth knowing.", "b": "UK dance has its own lineage", "l": ["The UK scene's debt to Chicago, Detroit and Jamaican sound systems is large, and the originality story tends to be overstated.", "Most UK genres are an American or Jamaican one, sped up.", "UK dance music is American house with rain.", "Dubstep only got big after America picked it up, and a genre belongs to whoever made it big. So it's American.", "Dubstep is an American genre. Skrillex invented it and the UK copied it."]}, {"p": "The classic tracks still hold up.", "b": "The classics hold up", "l": ["A scene that leans this hard on its nineties canon is having trouble producing a new one.", "The classics hold up partly because the scene keeps deciding they do.", "The best year for jungle is whichever one the guy talking was nineteen.", "New music always improves on old music, because the tools are better. That means anything from 1994 is a rough draft of something on Spotify now.", "UK dance music fell off in 2009."]}, {"p": "Making tracks yourself beats having a model do it.", "b": "Make your own tracks", "l": ["For a lot of functional music, listeners can't tell and don't care how it was made.", "Half of production was already presets and sample packs. The model is the next preset.", "\"I made it myself,\" with a sample pack, a preset and a template.", "Music is just patterns in sound, and models are better at patterns than people. So the model's track is better by definition and the rest is sentiment.", "Producing isn't a skill anymore. It's dragging loops next to each other."]}]}]}, {"n": "Jack", "u": "citizenoftheair", "m": 7178, "t": [{"t": "Contentment & competition", "n": 160, "k": [{"p": "Contentment is a trap. Competing is the constant of human life, and what you have is fragile.", "b": "Contentment is a trap", "l": ["The research on wellbeing puts chronic status competition among the worst predictors of it.", "Competing forever is also a trap, with worse sleep.", "The treadmill is a trap too, and it's the one with a subscription.", "Rich people say money doesn't matter, and they've tried having it. So they ran the experiment and came back with the result.", "Rich people saying money doesn't matter are right. They ran the experiment."]}, {"p": "The person attacking in an argument has more social capital just by attacking. It justifies itself.", "b": "Attacking wins the room", "l": ["Aggression wins the room in the short run and costs trust over time.", "The attacker wins the exchange and stops getting invited.", "Social capital you spend every time you use it.", "If attacking gave people status, the most hated person in every room would be in charge. Sometimes they are. Mostly they're alone.", "Honor is just reputation with a sword."]}, {"p": "Content people are coping.", "b": "Content people are coping", "l": ["Sometimes. Assuming that everyone who's satisfied is lying leaves no way to recognise a good life.", "If nobody's ever really content, the word doesn't mean anything.", "A theory where everyone who disagrees is in denial.", "Happy people say they're happy and unhappy people say happy people are lying. One of those groups is having a better time.", "Money does buy happiness. Every study. People who say otherwise have money."]}, {"p": "A lease term can be absurd and you still have to follow it to the letter.", "b": "A lease is a lease", "l": ["Leases get read reasonably. No tribunal treats removing a dead plant as a breach.", "The lease is strict. The judge is a person.", "A broken plant is not a tenancy dispute.", "The landlord wrote the lease and the landlord owns the place. Owners decide. So whatever it says is fair, and if you wanted different rules you'd have bought a building.", "Landlords are just people who got there first."]}]}, {"t": "Bike theft & cameras", "n": 83, "k": [{"p": "Nobody enforces bike theft unless it happens right in front of a cop.", "b": "Nobody enforces bike theft", "l": ["Enforcement is low, and it responds to reporting. Bait-bike programmes have cut theft where they've been tried.", "It isn't enforced because it's rarely reported, and it's rarely reported because it isn't enforced.", "Police will act on bike theft as soon as bikes are cars.", "A bike costs a few hundred dollars and an investigation costs thousands. So not enforcing it is the police doing the maths correctly.", "Bike lanes are a subsidy for a hobby."]}, {"p": "We're in the surveillance era. You're never out of view of a camera for a second.", "b": "Cameras are everywhere", "l": ["Being recorded isn't being watched. Most footage is never looked at, as every bike theft shows.", "A thousand cameras and nobody watching any of them.", "Total surveillance, and the bike is still gone.", "There are cameras everywhere and crime still happens. So cameras don't stop anything. They just make a film of it.", "Cameras everywhere is fine. Safe people don't mind."]}, {"p": "Bystanders notice a theft and just don't care.", "b": "Bystanders don't care", "l": ["Bystander studies find people intervene more often than the classic story says, especially when someone asks.", "The bystander effect has been overstated for sixty years.", "They noticed. They also weren't sure whose bike it was.", "A guy cutting a lock is either a thief or someone who lost his key. Nobody can tell which. So not getting involved is the only reasonable thing.", "Doxxing isn't real. It's a phone book with extra steps."]}, {"p": "Films pretend criminals don't know about phones and cameras because they don't want to be a how-to.", "b": "Films hide phones on purpose", "l": ["More likely it's that surveillance kills plots. A thriller ends in ten minutes if the camera works.", "It isn't caution, it's that the film would be over.", "The reason is the script, not the lawyers.", "Films show people being shot every week and nobody thinks that's a tutorial. So it isn't about safety. They just don't know how phones work.", "Most conspiracies are just companies. There's a building and a parking lot."]}]}, {"t": "Lasagna & the air fryer", "n": 63, "k": [{"p": "A proper sauce needs its time. Brown the beef, then simmer it.", "b": "Sauce needs time", "l": ["The gains from long simmering fall off fast, and under an hour of baking and a layer of cheese they vanish.", "After an hour in the oven nobody can tell your sauce took four.", "The extra time is for the cook.", "Tomatoes are cooked when they're hot. Hot takes five minutes. Anything after that is boiling water off something you already paid for.", "Sauce doesn't need forty minutes. Tomatoes are cooked when they're hot."]}, {"p": "The air fryer is worth buying.", "b": "The air fryer is worth it", "l": ["It's a small convection oven. For anyone with a working oven, that's a second one on the counter.", "A fan oven with better marketing.", "You already own an air fryer. It's the big one under the hob.", "It's called a fryer and there's no oil. Frying is oil. So it doesn't fry, and the name is the most successful lie in kitchens.", "An air fryer is a small oven and people act like it's a religion."]}, {"p": "Lasagna is worth the effort.", "b": "Lasagna is worth the effort", "l": ["Baked ziti gets the same flavours for about a third of the work.", "Lasagna is spaghetti that takes all afternoon.", "Four hours for something you eat in a square.", "It's pasta, sauce and cheese. So is every pasta dish. Stacking it doesn't make it a different food, it makes it taller.", "Lasagna is a casserole with a passport."]}, {"p": "The right condiments matter. The wrong mayo ruins it.", "b": "The wrong mayo ruins it", "l": ["Brand differences in mayonnaise are real and small, and mostly swamped by whatever it goes on.", "In the sandwich nobody can tell.", "Mayo opinions are the wine opinions of the fridge.", "Mayonnaise is egg and oil. Every brand is egg and oil. So they're identical and the label is the flavour.", "Ketchup is better than mayo and Europeans are wrong."]}]}, {"t": "Slogans & the average voter", "n": 44, "k": [{"p": "The average person will always have to rely on slogans. They don't have time to do the research.", "b": "Average people need slogans", "l": ["Shortcuts like party cues and trusted sources let voters reach about the same choices they would with full information.", "Cues work surprisingly well. That's most of political science.", "People don't research their surgeon either, and it mostly goes fine.", "Democracy is the average person deciding. If the average person only knows slogans, the country is being run by slogans, and it shows.", "People are irrational. Every study. Democracy is asking them anyway."]}, {"p": "Really understanding what you're supporting takes a research arc that amounts to a full-time job.", "b": "Real research is a full-time job", "l": ["Past a point, more research mostly makes people more confident in what they already thought.", "The most informed partisans are the most biased ones.", "The research arc ends where it started, with footnotes.", "If understanding politics takes a full-time job, the only people who understand it are paid to. People who are paid to have opinions have the opinions they're paid for.", "Destiny wants to be liked more than he wants to be right."]}, {"p": "Streamers who do this for a living know more than the people reacting to them.", "b": "Streamers know more", "l": ["Knowing more facts isn't the same as judging better, and their incentive is to keep the audience.", "More informed, and also in the engagement business.", "The research is real and so is the sponsor read.", "A streamer's job is to be watched. Being right isn't watched more than being loud. So the ones who last are the loud ones.", "Debate bros have done more for philosophy than any department."]}, {"p": "A lot of online comments read like they weren't written by real people.", "b": "The comments aren't real people", "l": ["Some aren't. Most are, and the flat sameness is what people sound like when they're typing for strangers.", "It's not bots. That's just how people write for upvotes.", "The bots learned it from somewhere.", "If you can't tell whether it's a person or a bot, there's no difference. And if there's no difference, it doesn't matter, and that goes for the reply too.", "Arguing online is the only philosophy anyone actually does."]}]}], "z": "1111lightbeam", "zn": "Zack"}, {"n": "Jambe", "u": "jambe", "m": 4544, "t": [{"t": "Books & Kindle", "n": 262, "k": [{"p": "Now that anyone can read on a phone, carrying a physical book in public is a performance.", "b": "Paper books in public are a flex", "l": ["People also read paper because it's easier on the eyes and doesn't have notifications.", "Some people just like paper.", "Not every paperback on a train is a bid for attention.", "A phone can do everything, so nobody can tell you're reading. If nobody can tell, it doesn't count as reading in public. So the Kindle is the performance of having no performance.", "A Kindle isn't reading. It's scrolling a book."]}, {"p": "Popular romance fiction and the big \"serious\" philosophers are doing the same thing for different audiences.", "b": "Romantasy and Nietzsche are the same genre", "l": ["Wish-fulfilment is in both. One of them also makes arguments you can check.", "Nietzsche has fantasies and premises.", "Same appetite, and one comes with reasons.", "A book millions of people read does more than a book nobody finishes. So romantasy has had more effect on the world than Nietzsche, and effect is what counts.", "Rand is at least readable."]}, {"p": "A lot of acclaimed books are basic points spelled out at tedious length.", "b": "Most great books are padded", "l": ["What's obvious once it's been laid out wasn't always obvious before.", "It's basic because someone wrote that book.", "Everything is obvious after page three hundred.", "If you already knew it, the book taught you nothing. If it taught you nothing, it's a bad book. So every book you agree with is bad.", "Reading 100 books a year means reading none of them."]}, {"p": "The Genesis story keeps a memory of the move from hunter-gathering to farming.", "b": "Genesis remembers the farming switch", "l": ["That reading requires oral memory to last several thousand years with no evidence of how it was passed on.", "A five-thousand-year game of telephone with a clear signal at the end.", "It fits nicely. Fitting nicely is what myths do.", "The story has a talking snake. A story with a talking snake isn't a memory of anything.", "Joseph Campbell read every myth and decided they were all Star Wars."]}]}, {"t": "AI risk & Grok", "n": 205, "k": [{"p": "The risk from AI is worth running, because ordinary reality as it stands isn't good enough.", "b": "The AI risk is worth it", "l": ["Dissatisfaction with the present doesn't make a gamble good. The downside covers people who are fine with the present.", "\"I'm bored\" is a thin reason to bet everyone's chips.", "Rolling the dice for eight billion people because Tuesdays are dull.", "Things are the best they've ever been by every measure. So the risk is all downside, and the bet is trading the best period in history for a coin flip.", "Accelerationism is just impatience."]}, {"p": "Run headfirst at ending aging, at least.", "b": "Go all in on ending aging", "l": ["Ending aging has large knock-on effects on population, power and turnover that the enthusiasm tends to skip.", "Immortal billionaires is a sentence worth reading twice.", "Ending aging means the people in charge now stay in charge.", "People die so new people can have a go. Take that away and it's the same people forever. Nobody wants the same people forever.", "Science will solve death right after it solves the common cold."]}, {"p": "Grok is a fine place to get answers.", "b": "Grok's fine", "l": ["Every model has its builder's thumb on it, and that one's is unusually visible.", "A model whose owner edits it in public.", "Asking Grok is asking Elon with extra steps.", "All the models read the same internet. So they all say the same thing. The only difference is which billionaire it sounds like.", "Grok is the worst model. It just agrees faster."]}, {"p": "If society turns against AI, that'll be the moment to push hardest.", "b": "If people turn on AI, push harder", "l": ["Pushing a technology hardest when the public has rejected it is how it gets banned outright.", "Nothing wins people over like being ignored.", "\"They said no, so go faster\" has a mixed record.", "If most people are against something, it doesn't happen. That's democracy. So the moment society turns is the moment it's over.", "AI safety is a grift, and so is the other side."]}]}, {"t": "Monroe & the afterlife", "n": 125, "k": [{"p": "Monroe's account is the most accurate because it covers every claim, ancient and modern.", "b": "Monroe explains everything", "l": ["A story that fits every report can't be contradicted by any of them, and that's a weakness.", "It accounts for everything, which is what unfalsifiable theories do.", "Fits all the data, predicts none of it.", "If it explains every religion and every ghost story, it explains too much. Real theories get things wrong sometimes.", "Monroe had a radio business and a nap. Everything after is a product line."]}, {"p": "Near-death experiences agree: you die and find it's loving and nothing to fear.", "b": "NDEs say there's nothing to fear", "l": ["NDE reports vary with culture and expectation, which points to construction by the brain.", "People meet whoever their tradition told them to expect.", "Nobody raised Hindu meets St. Peter.", "Everyone who reports an NDE didn't die. So it's a report from people who were nearly somewhere, about a place they didn't go.", "An NDE is a dream with good timing."]}, {"p": "Souls incarnate into bounded forms because that's been best for their learning.", "b": "Souls incarnate to learn", "l": ["\"Learning\" by forgetting everything each time is an odd curriculum, and nothing could test the claim.", "A school where the students' memories are wiped every term.", "It's all a lesson, and nobody remembers the last one.", "If you can't remember your past lives, they did nothing for you. Something that does nothing for you isn't education.", "Astral projection is retarded."]}, {"p": "Even as a study of deception, the Monroe and Campbell books are worth reading.", "b": "Read Monroe for the deception at least", "l": ["Then the content isn't what's doing the work, and any elaborate system would serve the same purpose.", "Worth reading as a case study isn't the same as worth believing.", "\"Interesting either way\" is the fallback for every book like it.", "If it's worth reading whether it's true or false, then it doesn't matter if it's true. So even the fans have stopped claiming it is.", "The Monroe tapes are white noise with a brochure."]}]}, {"t": "Zen & religion", "n": 84, "k": [{"p": "All the religions are pointing at the same thing, the nirvana state.", "b": "All religions point at nirvana", "l": ["The traditions make incompatible claims about God, self and salvation. \"Same underneath\" has to discard most of what each says.", "They agree, once you remove everything they say.", "All religions are one, according to none of them.", "Christians think there's
