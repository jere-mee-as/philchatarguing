ls."}, {"q": "●  rage bait", "f": "Symbols were a wrong turn and the GPUs proved it."}]}, {"t": "“Reading symbols is optional”", "p": "Whether to read a system's symbolic content is a choice. Ignore it and your physics comes out the same.", "k": [{"q": "○  serious", "f": "If the physics comes out right without it, the symbolic content isn't doing any explaining."}, {"q": "◐  bait", "f": "If something makes no difference to anything, it doesn't exist. That's the test for existing. So symbolic content doesn't exist, on the theory's own description."}, {"q": "●  rage bait", "f": "Symbolic content is a caption someone added."}]}, {"t": "“Reality doesn't have provable parts”", "p": "Reality doesn't have \"parts\" in the strict, provable sense. Find that kind of truth and you were analysing something synthetic.", "k": [{"q": "○  serious", "f": "Chemistry gets on fine treating molecules as having parts, and its predictions hold."}, {"q": "◐  bait", "f": "A car has four wheels. You can count them. Counting is as strict as it gets. So reality has parts, starting with the wheels."}, {"q": "●  rage bait", "f": "Things are made of their parts. That's what \"made of\" means."}]}, {"t": "“'What it's like' is a cliché”", "p": "\"What it's like to be\" something is a cliché, a hallucination. The question doesn't make sense.", "k": [{"q": "○  serious", "f": "The question makes enough sense that everyone understands the difference between being awake and under anaesthetic."}, {"q": "◐  bait", "f": "It's like something to stub your toe. Everyone who has stubbed a toe knows what the question means. So it makes sense, and the theory hasn't stubbed a toe."}, {"q": "●  rage bait", "f": "Qualia are obviously real. Red looks like something."}]}, {"t": "“Mechinterp never tests the null”", "p": "Mechanistic interpretability only ever makes the positive case. The null is never addressed.", "k": [{"q": "○  serious", "f": "Causal interventions like ablation and activation patching are tests against alternatives, and features that fail them get dropped."}, {"q": "◐  bait", "f": "You can't prove a negative. So no field can address the null, and holding interp to it is holding it to something impossible."}, {"q": "●  rage bait", "f": "Null hypothesis testing is a ritual and everyone doing it knows."}]}, {"t": "“UFA fits contradictory stories”", "p": "Under universal function approximation, competing and even contradictory causal stories all fit, so finding a feature rules nothing out.", "k": [{"q": "○  serious", "f": "UFA is about what a network could represent. Which circuit this network uses is an empirical matter that interventions can test."}, {"q": "◐  bait", "f": "If a network can approximate any function then it can approximate one with clean features. So the features people find are the real ones. That's what the theorem says."}, {"q": "●  rage bait", "f": "Universal approximation means it's all the same machine."}]}, {"t": "“Probes can't exclude enough”", "p": "Yes, training a probe that finds a feature is evidence the feature is there. The trouble is everything it can't exclude.", "k": [{"q": "○  serious", "f": "All evidence leaves alternatives open. The live question is whether the alternatives predict anything different."}, {"q": "◐  bait", "f": "Evidence for a thing is evidence for the thing. If there's evidence, it's there. Wanting more than evidence is wanting something science doesn't have."}, {"q": "●  rage bait", "f": "Mechanistic interpretability is phrenology for matrices."}]}, {"t": "“No null tests, no trust”", "p": "Without a library of null tests, \"the predictions got better\" is suspect.", "k": [{"q": "○  serious", "f": "Better held-out prediction is a test against the null of no improvement. It doesn't need a library."}, {"q": "◐  bait", "f": "A prediction that comes true is right. That's all a prediction is. Adding a null hypothesis to something that already happened is paperwork."}, {"q": "●  rage bait", "f": "Baselines are for people who are scared of results."}]}, {"t": "“It's a functional manifold”", "p": "Treating a model's outputs as draws from a random variable is a framing. The model is a functional manifold.", "k": [{"q": "○  serious", "f": "Every useful description is a framing. The statistical one has earned its place by predicting how models behave."}, {"q": "◐  bait", "f": "A model gives different answers each time you ask. Different answers each time is random. So it's a random variable, and the manifold is the framing."}, {"q": "●  rage bait", "f": "A thing that gives a different answer every time isn't random? That's retarded."}]}, {"t": "“Rain isn't in particle physics”", "p": "If you say \"it's raining\" is true of reality, and particle physics has no such notion, you're saying the physics is wrong.", "k": [{"q": "○  serious", "f": "Higher-level truths can be consistent with a physics that doesn't mention them. Absence from the vocabulary isn't contradiction."}, {"q": "◐  bait", "f": "Physics is the complete description. If rain isn't in it, rain isn't real, and what's falling on you is an informal description."}, {"q": "●  rage bait", "f": "Physics is just math."}]}, {"t": "“Simulations don't tell you what reality is”", "p": "A good match between simulation and outcome is impressive, and it doesn't license claims about what reality \"is.\"", "k": [{"q": "○  serious", "f": "If the match isn't evidence about reality, its reliability is unexplained."}, {"q": "◐  bait", "f": "If the simulation gets the same answer as the world, the world is doing what the simulation does. That's what \"same answer\" means. So that's what reality is."}, {"q": "●  rage bait", "f": "The wavefunction is just math. It's not a thing. Nobody's seen one."}]}, {"t": "“You can't measure an indefinitely complex state”", "p": "You can't measure an indefinitely complex state. That limit is part of physics, and more than a practical nuisance.", "k": [{"q": "○  serious", "f": "A limit on what we can measure is a fact about instruments. It takes more argument to make it a fact about what's there."}, {"q": "◐  bait", "f": "If it can't be measured, it isn't physics. If it isn't physics, it isn't real. So the unmeasured state doesn't exist until someone pays for the instrument."}, {"q": "●  rage bait", "f": "If you can't measure it, it's a mood."}]}, {"t": "“A Fourier transform is just a change of outfit”", "p": "A Fourier transform is just a mathematical change of representation. No mystery in it.", "k": [{"q": "○  serious", "f": "The fact that the change of representation corresponds to physical operations, like what a lens does, is itself interesting."}, {"q": "◐  bait", "f": "It's the same information before and after. If nothing changes, nothing happened. So a Fourier transform does nothing, and people got Nobel prizes for it."}, {"q": "●  rage bait", "f": "A Fourier transform isn't deep. It's a change of outfit."}]}, {"t": "“Preferences aren't scalars”", "p": "Treat a preference as a scalar and you'll get scalar-like results, even when the preference isn't shaped that way.", "k": [{"q": "○  serious", "f": "Representation theorems show any consistent set of preferences can be put on a single scale. The scalar comes from consistency."}, {"q": "◐  bait", "f": "If you chose one thing over another, you ranked them. A ranking is a number line. So every preference is a scalar the moment you act on it."}, {"q": "●  rage bait", "f": "Everything can be ranked. You just have to be brave."}]}, {"t": "“Money flattens everything”", "p": "Money and scalar value flatten things that don't sit on one axis.", "k": [{"q": "○  serious", "f": "We trade unlike goods against each other in every budget. Refusing the common scale hides the exchange rate."}, {"q": "◐  bait", "f": "Everything has a price, and a price is one number. If it didn't have a price nobody could buy it. So everything fits on one axis, and the axis is dollars."}, {"q": "●  rage bait", "f": "One number is always enough if it's the right number."}]}, {"t": "“Rock-paper-scissors has no scalar”", "p": "Rock-paper-scissors shows it: there's no scalar you can assign to each that reproduces who beats who.", "k": [{"q": "○  serious", "f": "The cycle is about pairwise matchups. Each strategy still has a scalar win rate, and it's a third."}, {"q": "◐  bait", "f": "Rock breaks scissors and rock is a rock. Paper covering it does nothing to a rock. So rock is first, and the cycle is a rule somebody added."}, {"q": "●  rage bait", "f": "Rock is the best one and everyone knows it."}]}, {"t": "“Colours aren't scalar”", "p": "Colours aren't scalar. Hex codes don't order them in any way that means something.", "k": [{"q": "○  serious", "f": "Colours order along several axes, like luminance, hue and wavelength, and each of those is a scalar."}, {"q": "◐  bait", "f": "A hex code is a number. Numbers have an order. So blue is bigger than red, and it's right there in the code."}, {"q": "●  rage bait", "f": "Hex codes are numbers and numbers have an order."}]}]}, {"n": "Willow", "i": "@thewillowofdarkness", "u": [{"n": "Identity & distinction", "t": [0, 1, 2, 3]}, {"n": "Causality & bodies", "t": [4, 5, 6, 7]}, {"n": "Experience & awareness", "t": [8, 9, 10, 11]}, {"n": "Oughts & moral truth", "t": [12, 13, 14, 15]}, {"n": "Empiricism", "t": [16, 17, 18, 19]}], "t": [{"t": "“Identical twins are still two”", "p": "Two individuals could share every feature and still be distinct. Which one each is isn't given by any property.", "k": [{"q": "○  serious", "f": "A difference no property grounds is hard to tell from no difference."}, {"q": "◐  bait", "f": "If two things are the same in every way, they're the same thing. That's what \"same in every way\" means. So there's one."}, {"q": "●  rage bait", "f": "Identity is a filing convention."}]}, {"t": "“No alternate versions”", "p": "The one who came to exist is never the others who might have. There are no rewinds or alternate versions.", "k": [{"q": "○  serious", "f": "Talk of what might have been seems to need the alternatives to be something, if only abstractly."}, {"q": "◐  bait", "f": "Physics says every outcome happens somewhere. So there are other versions, and they're doing fine."}, {"q": "●  rage bait", "f": "Many worlds is correct."}]}, {"t": "“The necessary being doesn't act”", "p": "A necessary being is necessary because it takes no part in determinate action. It's never becoming one thing or another.", "k": [{"q": "○  serious", "f": "A being that does nothing and determines nothing can't be told apart from an abstraction."}, {"q": "◐  bait", "f": "If it doesn't do anything, it makes no difference. If it makes no difference, there's no reason to say it's there."}, {"q": "●  rage bait", "f": "Truthmakers are facts with a job title."}]}, {"t": "“Testimony doesn't make it true”", "p": "The fact has to be present for a claim to be true. Someone's testimony doesn't make it so.", "k": [{"q": "○  serious", "f": "Since we only ever reach the fact through evidence and testimony, \"the presence of the fact\" doesn't help us sort the true claims."}, {"q": "◐  bait", "f": "If only the fact matters and nobody can get at the fact except through what people say, then what people say is all there is."}, {"q": "●  rage bait", "f": "Something can be true for one person and not for another."}]}, {"t": "“There's one right way to talk about causation”", "p": "The usual way of talking about causation gets the phenomenon wrong. There's a correct usage, and only one.", "k": [{"q": "○  serious", "f": "Causal talk is used differently in physics, law and medicine, and each use works. That counts against a single correct one."}, {"q": "◐  bait", "f": "Words mean what people use them to mean. People use \"cause\" lots of ways. So there are lots of correct usages and \"only one\" is a mistake about dictionaries."}, {"q": "●  rage bait", "f": "Causation is just one thing after another."}]}, {"t": "“Predictions aren't causes”", "p": "A reliable prediction is an abstraction that holds across many different causal paths. It isn't one of the causes.", "k": [{"q": "○  serious", "f": "If the prediction holds across all the paths, it carries the information a decision needs, whichever path is actual."}, {"q": "◐  bait", "f": "If it's accurate, it's tracking the cause. If it's tracking the cause, it's about the cause. So the abstraction is the causal fact, written down."}, {"q": "●  rage bait", "f": "Laws of nature are just summaries. The universe doesn't obey anything."}]}, {"t": "“Your body isn't your identity”", "p": "A state of someone's body never amounts to an identity. No state of the body is the fact of who they are.", "k": [{"q": "○  serious", "f": "If no bodily state bears on identity, it's unclear what evidence ever could, or how anyone learns it."}, {"q": "◐  bait", "f": "You are your body. Change the body enough and it's a different person. That's what happens in every hospital."}, {"q": "●  rage bait", "f": "Thoughts are in the head. That's why hitting it changes them."}]}, {"t": "“A hallucinated oasis isn't an oasis”", "p": "A hallucinated oasis exists as an experience. That doesn't make it an existing oasis.", "k": [{"q": "○  serious", "f": "Agreed, and that distinction is the one the empiricist uses when asking for the evidence behind a claim."}, {"q": "◐  bait", "f": "If it exists in the experience then it exists. There's no second kind of existing. So there's an oasis, a small one, in his head."}, {"q": "●  rage bait", "f": "Everything is contingent. Even the oasis."}]}, {"t": "“You can experience red without knowing it”", "p": "There can be experiences that never enter awareness. Someone can have an experience of red and never be aware of it.", "k": [{"q": "○  serious", "f": "An experience nobody is aware of loses the feature that made it an experience and not just processing."}, {"q": "◐  bait", "f": "Experience means being aware of something. An experience you're not aware of is a square with no sides."}, {"q": "●  rage bait", "f": "Consciousness is on or off. Nothing is 3% conscious."}]}, {"t": "“Substance isn't a mind at large”", "p": "Substance isn't a \"mind at large.\" It isn't any of the minds that share in it.", "k": [{"q": "○  serious", "f": "If substance is none of the minds and none of the bodies, it's hard to say what the positive claim is."}, {"q": "◐  bait", "f": "Spinoza says there's one substance and it's God or Nature. So it's nature. So it's physics. So Spinoza was a materialist and this is a long way round."}, {"q": "●  rage bait", "f": "Spinoza was a determinist."}]}, {"t": "“Motivation isn't obligation”", "p": "Motivation has nothing to do with what's obligatory.", "k": [{"q": "○  serious", "f": "An obligation that gives no one any reason to act is a strange thing to call binding."}, {"q": "◐  bait", "f": "If something doesn't motivate anyone, nobody does it. If nobody does it, it's not an obligation, it's a suggestion."}, {"q": "●  rage bait", "f": "Deontology is consequentialism for people who don't want to look."}]}, {"t": "“Red is a fact, not a report”", "p": "The colour red is a fact about what's present. It isn't a report about a mind.", "k": [{"q": "○  serious", "f": "Colour experience varies with lighting, surroundings and the viewer. That makes \"what's present\" depend on who's looking."}, {"q": "◐  bait", "f": "Dogs don't see red. If red were in the thing, the dog would get it too. So it's in the looker."}, {"q": "●  rage bait", "f": "Color isn't in the world. Physics found wavelengths and stopped."}]}, {"t": "“Moral truths are objective”", "p": "A moral truth is objectively true in the instance. In a given case, it's the case that some act ought to happen.", "k": [{"q": "○  serious", "f": "If oughts are facts that aren't states of existence, we need an account of how anyone detects them."}, {"q": "◐  bait", "f": "A fact is something that exists. If oughts aren't states of existence, they don't exist. So they aren't facts, and \"objective ought\" means nothing."}, {"q": "●  rage bait", "f": "Morality is subjective."}]}, {"t": "“Oughts don't come from bodies”", "p": "Oughts aren't generated by bodies. Believing in one is a separate matter from its being so.", "k": [{"q": "○  serious", "f": "An ought that exists whether or not any mind grasps it leaves moral knowledge looking like luck."}, {"q": "◐  bait", "f": "Nobody had heard of morality before there were people. So people made it. Things people made aren't out there waiting."}, {"q": "●  rage bait", "f": "Deontology doesn't explain wrongness, it lists it."}]}, {"t": "“Desire isn't duty”", "p": "What people desire is just their desire. It isn't a duty, and it doesn't make one.", "k": [{"q": "○  serious", "f": "A morality with no tie to what anyone wants has trouble explaining why it should move anyone."}, {"q": "◐  bait", "f": "If nobody wanted anything, nothing would matter. So wanting is where mattering comes from, and duty is what you call the wants you approve of."}, {"q": "●  rage bait", "f": "Emotivism is correct."}]}, {"t": "“Power doesn't make it right”", "p": "That power exists doesn't make it right. If a power is immoral, it's immoral whatever it can enforce.", "k": [{"q": "○  serious", "f": "Moral change has tracked shifts in power closely enough that \"discovery\" needs defending."}, {"q": "◐  bait", "f": "Whoever wins decides what gets called immoral. That's been true every time. So immoral means \"lost.\""}, {"q": "●  rage bait", "f": "Might makes right. Everything else is a press release."}]}, {"t": "“Empiricism is a doxa”", "p": "Citing empiricism is a doxa of reduction. Empirical results can't touch all the claims that aren't empirical.", "k": [{"q": "○  serious", "f": "A claim nothing empirical bears on needs some other way of being checked, and it's fair to ask what that is."}, {"q": "◐  bait", "f": "If nothing you could ever observe would change your mind, that's not knowledge. Everybody has a name for that and it isn't philosophy."}, {"q": "●  rage bait", "f": "Empiricism is the only philosophy that's ever admitted it could be wrong."}]}, {"t": "“Truth doesn't need an event”", "p": "It's the populist-empiricist error to think objective truth needs a spatial or empirical event.", "k": [{"q": "○  serious", "f": "Mathematical truth is the best case for that, and it comes with proof. Other non-empirical claims don't have an equivalent."}, {"q": "◐  bait", "f": "Everything that's turned out true was found by looking. Germs, atoms, planets. Nothing true was ever found by not looking."}, {"q": "●  rage bait", "f": "Metaphysics is what's left after science takes everything useful."}]}, {"t": "“Some causes leave no evidence”", "p": "Some things affect what we observe and still can't be studied by the scientific method, because they offer no evidence to test a hypothesis against.", "k": [{"q": "○  serious", "f": "If something affects what we observe, those effects are evidence, and that's all the method needs."}, {"q": "◐  bait", "f": "If it makes a difference, you can measure the difference. If you can't measure a difference, it doesn't make one. So there's nothing left over."}, {"q": "●  rage bait", "f": "The noumenon is just the stuff we don't know yet. Science will get there."}]}, {"t": "“Definitions have to match the world”", "p": "You can stipulate any definition you like. The issue is whether it matches the world.", "k": [{"q": "○  serious", "f": "Checking whether a definition matches the world is an empirical procedure, and that's the one being criticised."}, {"q": "◐  bait", "f": "A definition can't be wrong. It's a decision about a word. So no definition has ever failed to match the world, because that's not what they do."}, {"q": "●  rage bait", "f": "Definitions are arbitrary. A word means whatever people decide."}]}]}, {"n": "Youvious", "i": "@youv.philip", "u": [{"n": "Maths", "t": [0, 1, 2, 3]}, {"n": "University", "t": [4, 5, 6, 7]}, {"n": "Quantum interpretations", "t": [8, 9, 10, 11]}, {"n": "Spacetime", "t": [12, 13, 14, 15]}], "t": [{"t": "“Maths has perfectly clear definitions”", "p": "Mathematics is the one place we have completely clear, unambiguous definitions.", "k": [{"q": "○  serious", "f": "Foundational disputes over choice, constructivism and what \"exists\" means show the clarity gives out at the base."}, {"q": "◐  bait", "f": "If the definitions were clear, nobody would fail maths. Most people fail maths. So they're not clear."}, {"q": "●  rage bait", "f": "Axioms are just the stuff you refuse to argue about."}]}, {"t": "“Points first, then structure”", "p": "You build a spacetime starting from a topological space: the set of points comes first, then the structure.", "k": [{"q": "○  serious", "f": "That's the order of the textbook construction. Whether nature is built in that order is a further claim."}, {"q": "◐  bait", "f": "You can't have a point without somewhere for it to be. Somewhere is space. So space comes first and the points go in it. The textbook has it backwards."}, {"q": "●  rage bait", "f": "Topology is geometry for people who can't measure."}]}, {"t": "“Just write the Euler-Lagrange equations”", "p": "A lot of this is easy once you write down the Euler-Lagrange equations and solve.", "k": [{"q": "○  serious", "f": "Setting up the Lagrangian is the modelling step. That's where the physical insight goes, and nobody tells you which one to write."}, {"q": "◐  bait", "f": "If it were easy, there wouldn't be a degree in it. There's a degree, a master's and a doctorate. That's eight years of \"fairly easy.\""}, {"q": "●  rage bait", "f": "The Lagrangian is a trick. Nobody knows why it works."}]}, {"t": "“AI only matters for maths research”", "p": "AI won't matter much for maths unless you want to do research.", "k": [{"q": "○  serious", "f": "If research is the part it changes, then the reason for the degree changes too, since the degree was preparation for research."}, {"q": "◐  bait", "f": "A degree is doing exercises. AI does the exercises. So AI can do the degree, and the only thing left is the bit you said it affects."}, {"q": "●  rage bait", "f": "AI can't do real math. It can do homework."}]}, {"t": "“Uni is slop, teach yourself”", "p": "Most university coursework is slop. The real learning is what you teach yourself.", "k": [{"q": "○  serious", "f": "Self-teaching follows interest. Coursework is the part that makes you learn what you wouldn't have picked."}, {"q": "◐  bait", "f": "If the courses were useless, employers wouldn't ask for the degree. They ask for the degree. So the courses are the part that counts and the self-teaching is a hobby."}, {"q": "●  rage bait", "f": "College should be job training. Nobody needs a poem to get hired."}]}, {"t": "“Cram the last month, it works”", "p": "Doing nothing all term and studying for a month before exams works fine.", "k": [{"q": "○  serious", "f": "It works for passing. What's kept six months later is much lower with cramming."}, {"q": "◐  bait", "f": "If you can learn it in a month, it's a month of material. So the other three months of the semester are padding, and the fees are for the padding."}, {"q": "●  rage bait", "f": "Oral exams are vibes with a grade."}]}, {"t": "“My own reading beats the course”", "p": "Knowing the material from your own reading beats how the course presents it.", "k": [{"q": "○  serious", "f": "Self-study rarely includes being tested by someone who knows where you're fooling yourself."}, {"q": "◐  bait", "f": "A professor has studied it for thirty years and you've read a book. Thirty years is more than a book. So the course version is the better one."}, {"q": "●  rage bait", "f": "College is a scam. Everything's on YouTube."}]}, {"t": "“A physics degree is serious”", "p": "A physics degree is a serious thing to be doing.", "k": [{"q": "○  serious", "f": "It's serious, and most graduates end up in software or finance using little of it."}, {"q": "◐  bait", "f": "The point of a degree is a job. Most physics graduates don't get physics jobs. So it's a degree in something else with harder homework."}, {"q": "●  rage bait", "f": "Physics majors are philosophy majors with job prospects."}]}, {"t": "“Many-worlds can't get you the classical state”", "p": "Many-worlds owes an account of how the classical-looking state you observe comes out of the universal wavefunction.", "k": [{"q": "○  serious", "f": "Decoherence supplies much of that. Branches become effectively independent very fast, even though the split is never exact."}, {"q": "◐  bait", "f": "The equation gives you everything happening at once. We see one thing. So either the equation's wrong or there's a lot of things we don't see, and the equation's never been wrong."}, {"q": "●  rage bait", "f": "Many worlds is correct."}]}, {"t": "“When is it a world?”", "p": "When does a superposition count as different worlds, and what is it before that? Many-worlds doesn't say cleanly.", "k": [{"q": "○  serious", "f": "\"World\" is an emergent, approximate notion, like \"storm.\" Vague boundaries don't make it unreal."}, {"q": "◐  bait", "f": "If you can't say how many worlds there are, there aren't any. Things that exist come in a number."}, {"q": "●  rage bait", "f": "Many worlds is nonsense. One world. Look around."}]}, {"t": "“Physicists know what they're doing”", "p": "The way working physicists and professors actually make sense of experiments is the standard picture.", "k": [{"q": "○  serious", "f": "The standard picture puts off the question of what a measurement is, and that's the question interpretations are for."}, {"q": "◐  bait", "f": "Physicists use it and it works. If it works, it's right. Asking what it means is for people who can't do the calculation."}, {"q": "●  rage bait", "f": "The measurement problem isn't a problem. You measure, you get a number."}]}, {"t": "“Bohm deserves respect”", "p": "Bohmian mechanics deserves more respect than it gets.", "k": [{"q": "○  serious", "f": "It reproduces the predictions and needs a preferred frame, which fits badly with relativity."}, {"q": "◐  bait", "f": "If it makes the same predictions as the normal theory, it's the normal theory with more parts. More parts for the same result is called worse."}, {"q": "●  rage bait", "f": "Bohmian mechanics is classical physics that won't take the hint."}]}, {"t": "“Spacetime is real”", "p": "Spacetime exists. Our best theories quantify over it as a mathematical object, and that's reason to be a substantivalist.", "k": [{"q": "○  serious", "f": "The hole argument suggests that taking the points as real brings differences no observation could ever reveal."}, {"q": "◐  bait", "f": "Everything we measure is a thing at a distance from another thing. Nobody has measured the space by itself. So space is the gaps, and gaps aren't objects."}, {"q": "●  rage bait", "f": "Spacetime is just a coordinate system. It's bookkeeping."}]}, {"t": "“Spacetime isn't matter or energy, still real”", "p": "Spacetime is neither matter nor energy, and it's still real.", "k": [{"q": "○  serious", "f": "In general relativity the metric carries energy and has its own dynamics, which makes it look like one more field."}, {"q": "◐  bait", "f": "If it isn't matter and it isn't energy, it isn't anything. Those are the two things there are."}, {"q": "●  rage bait", "f": "Space is fake and time is on its way out."}]}, {"t": "“You need a background spacetime”", "p": "Some of the geometric concepts in our best theories are hard to make sense of without a background spacetime.", "k": [{"q": "○  serious", "f": "Quantum gravity programmes mostly expect spacetime to be emergent, so being hard to picture without it may be a limit of ours."}, {"q": "◐  bait", "f": "Physicists say spacetime is doomed and they're the ones who'd know. So building a philosophy on it is building on something with a closing date."}, {"q": "●  rage bait", "f": "Physics is stuck."}]}, {"t": "“Points are real, coordinates are labels”", "p": "Spacetime points are the real elements. Coordinates are only labels for them.", "k": [{"q": "○  serious", "f": "Diffeomorphism invariance suggests point identity does no physical work. The content is in the relations."}, {"q": "◐  bait", "f": "If you can relabel every point and the physics doesn't change, the points weren't doing anything. So they're labels too, and it's labels all the way down."}, {"q": "●  rage bait", "f": "Laws of nature are just summaries. The universe doesn't obey anything."}]}]}, {"n": "Zone", "i": "@zone8383", "u": [{"n": "Existence & mind-independence", "t": [0, 1, 2, 3]}, {"n": "Concepts & meaning", "t": [4, 5, 6, 7]}, {"n": "Identity & logic", "t": [8, 9, 10, 11]}, {"n": "Truth as correspondence", "t": [12, 13, 14, 15]}], "t": [{"t": "“'Exists' can't mean mind-independent”", "p": "\"Exists\" can't mean \"mind-independent.\" The mind exists, and it isn't independent of itself.", "k": [{"q": "○  serious", "f": "Realists usually mean independent of anyone's beliefs about it. On that reading the mind qualifies fine."}, {"q": "◐  bait", "f": "The mind is in the brain, and the brain is there whether you think about it or not. So the mind is mind-independent, and the puzzle was a pun."}, {"q": "●  rage bait", "f": "Consciousness creates reality. Physics says so now."}]}, {"t": "“No definition doesn't mean it isn't there”", "p": "Definitions aren't existence. Failing to define a thing precisely doesn't show the thing isn't there.", "k": [{"q": "○  serious", "f": "If nothing can be said about what marks the thing off, the claim that it exists has very little content."}, {"q": "◐  bait", "f": "If you can't say what a thing is, you don't know what you're claiming exists. So you're claiming nothing, confidently."}, {"q": "●  rage bait", "f": "Definitions are arbitrary. A word means whatever people decide."}]}, {"t": "“You're committed to the consequences”", "p": "A view's logical consequences are part of what you've committed to, whether you noticed or not.", "k": [{"q": "○  serious", "f": "People hold inconsistent beliefs all the time. Commitment by entailment describes an ideal reasoner."}, {"q": "◐  bait", "f": "I can believe one thing and not the next thing. I do it daily. So beliefs don't come with their consequences attached, whatever logic says."}, {"q": "●  rage bait", "f": "Consistency is easy. Believe one thing. Being right is the hard part."}]}, {"t": "“Reality is the starting point”", "p": "There's a reality our claims answer to, and that's the starting point.", "k": [{"q": "○  serious", "f": "We never compare a belief with unconceptualized reality. We compare it with other beliefs and observations."}, {"q": "◐  bait", "f": "Everyone sees the world through their own eyes. Eyes are different. So there are as many realities as people, and no starting point."}, {"q": "●  rage bait", "f": "Objectivity is impossible because everyone has a perspective."}]}, {"t": "“Meaning comes first”", "p": "A concept has to have meaning before any epistemic evaluation of it can happen. Meaning comes first.", "k": [{"q": "○  serious", "f": "Meaning and evaluation may arrive together. On use theories, grasping a concept is knowing how its application gets assessed."}, {"q": "◐  bait", "f": "Babies learn words by pointing at things and being told yes or no. That's evaluation, from day one. So evaluation comes first and meaning is what's left."}, {"q": "●  rage bait", "f": "Meanings are in the head. Where else would they be."}]}, {"t": "“Believing doesn't make it so”", "p": "The idea of an assumption depends on a contrast with how the world is. Believing something doesn't make it so.", "k": [{"q": "○  serious", "f": "That contrast is what's in dispute. It can't also be the premise."}, {"q": "◐  bait", "f": "You only ever have beliefs. You never get the world without one. So the contrast is between a belief and another belief."}, {"q": "●  rage bait", "f": "Truth is whatever works. Correspondence is a picture people like."}]}, {"t": "“Fix Hume's meaning, fix causation”", "p": "Hume's doubts about causation come from his theory of meaning. Reject that theory and the doubts go with it.", "k": [{"q": "○  serious", "f": "The problem of induction can be stated without the copy principle. The gap between past and future cases is still there."}, {"q": "◐  bait", "f": "Hume proved that one thing following another is all we ever see. He didn't need a theory for that. You can check by looking."}, {"q": "●  rage bait", "f": "Hume proved cause and effect isn't real. One thing after another."}]}, {"t": "“Experience is reliable enough”", "p": "Something is credible if it's reliable. Experience is, so it doesn't need a further argument.", "k": [{"q": "○  serious", "f": "Reliability can only be checked using experience, which is the circle the skeptic points at."}, {"q": "◐  bait", "f": "Experience is all anyone has. If it needed backing up there'd be nothing to back it up with. So nothing's justified and everyone carries on anyway."}, {"q": "●  rage bait", "f": "Knowledge needs certainty, nothing's certain, so nobody knows anything."}]}, {"t": "“Acting against your identity is a contradiction”", "p": "How a thing acts expresses what it is. Acting against its own identity would be a contradiction.", "k": [{"q": "○  serious", "f": "That makes the principle true by definition. Whatever a thing does gets counted as its nature."}, {"q": "◐  bait", "f": "A is A. Fine. That's true of unicorns as well. So it tells you nothing about anything that exists."}, {"q": "●  rage bait", "f": "A is A tells you nothing. Unicorns are unicorns."}]}, {"t": "“Aim for the fewest problems”", "p": "That there will always be problems doesn't tell you how many to put up with. Aim for as few as possible.", "k": [{"q": "○  serious", "f": "\"As few as possible\" needs a way of counting and weighing problems, and that's where the disagreement is."}, {"q": "◐  bait", "f": "You can't count problems. They aren't objects. So \"fewest\" doesn't mean anything, and it's a sentence that sounds like a plan."}, {"q": "●  rage bait", "f": "\"Existence exists\" isn't an axiom, it's a stutter."}]}, {"t": "“You need axioms”", "p": "You need axioms, fundamental truths. Not everything can be derived.", "k": [{"q": "○  serious", "f": "Needing starting points doesn't show which ones. Calling them self-evident has gone wrong before."}, {"q": "◐  bait", "f": "An axiom is something you can't prove. Something you can't prove is something you just believe. So every system rests on faith, and that includes this one."}, {"q": "●  rage bait", "f": "Atheism is a faith position."}]}, {"t": "“Rand's critics never give examples”", "p": "Rand's critics rarely give concrete examples of what's wrong.", "k": [{"q": "○  serious", "f": "There are book-length critiques with page references, on her reading of Kant and on the move from life to egoism."}, {"q": "◐  bait", "f": "She said Kant was the most evil man in history. That's the example. Anyone who's read one page of Kant can take it from there."}, {"q": "●  rage bait", "f": "Rand never refuted Kant. She refuted the back cover."}]}, {"t": "“Correspondence separates truth from belief”", "p": "Correspondence separates what makes a claim true, which is reality, from why it's believed. Pragmatism collapses the two.", "k": [{"q": "○  serious", "f": "The distinction is clean. The trouble is saying what \"matching\" is without circularity."}, {"q": "◐  bait", "f": "A sentence is made of words and the world is made of stuff. Words don't look like stuff. So nothing matches, and the theory's been comparing apples to the word \"apples.\""}, {"q": "●  rage bait", "f": "Truth is cope."}]}, {"t": "“Truth is where evaluation stops”", "p": "You can't run epistemic evaluation on every concept all the way down. Truth is one of the ones it stops at.", "k": [{"q": "○  serious", "f": "Declaring a concept exempt from evaluation is what you'd expect from a view that couldn't pass it."}, {"q": "◐  bait", "f": "If truth can't be examined, then nobody knows what it is. If nobody knows what it is, there's no theory of it. So correspondence isn't a theory, it's a refusal."}, {"q": "●  rage bait", "f": "An axiom is a claim with a bodyguard."}]}, {"t": "“Define truth first”", "p": "You have to answer what truth is before committing to a theory. Otherwise you're reasoning with a bias.", "k": [{"q": "○  serious", "f": "Any answer to \"what is truth\" is a theory of truth. There's no neutral place to answer from first."}, {"q": "◐  bait", "f": "You can't say what truth is without saying something true. So you need truth before you start. So the question can't be answered, and everyone should stop."}, {"q": "●  rage bait", "f": "Epistemology is easy. Believe true things."}]}, {"t": "“The earth is round because it matches reality”", "p": "\"The earth is round\" is true because the statement matches how reality is.", "k": [{"q": "○  serious", "f": "Negative and general truths are harder. It's unclear what \"there are no unicorns\" matches."}, {"q": "◐  bait", "f": "The earth isn't perfectly round. It's lumpy. So the sentence doesn't match, so it's false, and the theory's favourite example is a counterexample."}, {"q": "●  rage bait", "f": "The nonexistent spoon refutes correspondence and it isn't even there."}]}]}]</script><script id="pfps" type="application/json">{"sizzurp1": "data:image/webp;base64,UklGRlARAABXRUJQVlA4IEQRAABQRACdASqgAKAAPm0uk0YkIqGhLDSsgIANiWUAyfjyVAbjibgS8IncS8688CXzl+M/7nwb8/QUdpX3Ezo/2Hf/8qdQLE/slrZeg73w86z8Pzn/mvUA4QmgH+k/Si0RKifTLSLPB1Oon19gC6zxqnPHBIYtwSfm894S5s7gu4QluigqKRwEg9kH/uGrexcs+OE81mPSgOFTEoqZ9xgC3XGfIvluK7jGtrvLg1jVgbpq8ezM/41jBYkSb/syhlhi/ZmBeE1Q4/gpx4GDoJ+kHwPfWmInY2w0Ryf3AMfDuy6q19Wk+aVBsVcrOuAIgJ1R2sqveV80jRLq3eMWmSDa6qrLWbjGMsIG7ly/Hi5NOKCqqd+DDav/DmUVxXZ1hqTWQX8sNQBG2XpuGs6MI/ircNg+AuQ5ad3iZ6tNa6JGtV3PdwOBr0V1665hFUXJMknIJJXEWd/jx71QEasKkoeqnbWu3n/1x0eYLU7Q+SKHkAfKnoUEq0vjDbgg/+nIA0P0dcbORdX9EaJ3/6pZIR+1Ukqf74A5Uorii7h <script>
const P = JSON.parse(document.getElementById('data').textContent), $ = id => document.getElementById(id);
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches, NS = 'http://www.w3.org/2000/svg';
const el = (tag, cls, text) => { const e = document.createElement(tag); if(cls) e.className = cls; if(text != null) e.textContent = text; return e; };
const CFG = {"w": ["chatter", "topic", "position", "reply"], "steps": ["chatter", "topic", "position", "replies"], "pl": {"reply": "replies"}}, W = CFG.w, PL = CFG.pl || {};
const plural = (n, w) => n + ' ' + (n === 1 ? w : (PL[w] || w + 's'));
function factEl(k, i){ const b = el('button', 'fact' + (k.m ? '' : ' nofold')); b.style.setProperty('--n', i);
  const m = el('span', 'more'); if(k.m) m.append(el('span', 'but', k.ml || 'But…'), el('span', 'lim', k.m));
  const say = el('span', 'say'); say.append(el('span', 'tx', k.f)); const cp = el('span', 'cp'); cp.setAttribute('role', 'button'); cp.tabIndex = 0; cp.title = 'Copy'; cp.setAttribute('aria-label', 'Copy this line');
  cp.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="9" width="12" height="12" rx="2.5"/><path d="M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1"/></svg>';
  const copy = e => { e.stopPropagation(); e.preventDefault(); try { navigator.clipboard.writeText(k.c || k.f).catch(() => {}); } catch(err){} cp.classList.add('ok'); SND.tick(1.5); setTimeout(() => cp.classList.remove('ok'), 1000); };
  cp.addEventListener('click', copy); cp.addEventListener('keydown', e => { if(e.key === 'Enter' || e.key === ' ') copy(e); }); say.append(cp);
  if(k.q) b.append(el('span', 'q', k.q)); b.append(say, m); b.onclick = e => { if(e.target.closest('a,.cp') || !k.m) return; b.classList.toggle('open'); SND.tick(b.classList.contains('open') ? 1.1 : .9); }; return b; }
/* the little picture or sigil left of a name: d = depth (0 or 1) */
const PF = (() => { try { return JSON.parse(document.getElementById('pfps').textContent); } catch(e){ return {}; } })();
function ico(d, si, gi){ const v = d === 0 ? P[si].i : (P[si].u[gi] || {}).i; if(!v) return null; const s = el('span', 'ic');
  if(v[0] === '@'){ const src = PF[v.slice(1)]; if(src){ const im = el('img'); im.alt = ''; im.src = src; s.appendChild(im); s.classList.add('pf'); } else { s.textContent = (d === 0 ? P[si].n : P[si].u[gi].n)[0]; s.classList.add('pf', 'let'); } }
  else s.textContent = v; return s; }
/* an optional paragraph that sits above a topic's items */
const leadEl = t => t.p ? el('div', 'lead', t.p) : null;
const nrm = x => x.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[’‘]/g,"'");
const LAYER = W;
/* underline the searched words inside a piece of text */
function gmark(txt){ const f = document.createDocumentFragment(), i = QRY ? nrm(txt).indexOf(QRY) : -1; if(i < 0){ f.append(txt); return f; }
  const m = document.createElement('mark'); m.textContent = txt.slice(i, i + QRY.length); f.append(txt.slice(0, i), m, txt.slice(i + QRY.length)); return f; }
function markFact(x){ if(!QRY) return x; x.querySelectorAll('.say .tx,:scope > .q').forEach(e => { const t = e.textContent; e.textContent = ''; e.append(gmark(t)); }); return x; }
let QRY = '';
/* search reaches through every layer: a topic counts only if its own name or one of its facts says the words; facts are culled the same way */
const TXT = P.map(s => s.t.map(t => nrm(t.t + ' ' + (t.p || '') + ' ' + t.k.map(k => (k.q || '') + ' ' + k.f + ' ' + (k.m || '')).join(' '))));
let HIT = {q: null, set: null};
function hits(){ if(HIT.q === QRY) return HIT.set; const set = new Set();
  if(QRY) P.forEach((s, si) => s.t.forEach((t, ti) => { if(TXT[si][ti].includes(QRY)) set.add(si + '.' + ti); }));
  HIT = {q: QRY, set}; return set; }
const tHit = (si, ti) => hits().has(si + '.' + ti);
const gHits = (si, gi) => P[si].u[gi].t.filter(ti => tHit(si, ti));
const sHits = si => P[si].t.map((t, ti) => ti).filter(ti => tHit(si, ti));
const totalHits = () => hits().size;
const fHit = k => nrm((k.q || '') + ' ' + k.f + ' ' + (k.m || '')).includes(QRY);
/* the facts to show for a topic: only those that mention the search; if just the title does, all of them */
const shownFacts = t => { if(!QRY || !totalHits()) return t.k; const m = t.k.filter(fHit); return m.length ? m : t.k; };
function ph(t){ const F = $('find'); if(F && F.placeholder !== t) F.placeholder = t; }
function fhint(t){ const h = $('fh'); if(h){ h.textContent = t || ''; h.classList.toggle('on', !!t); } }
const groupsOf = si => P[si].u, topicsOf = (si, gi) => P[si].u[gi].t.map(ti => [ti, P[si].t[ti]]);

/* ---------- sound: a small board of synthesized clicks, one chosen per layout ---------- */
const SND = (() => { let ctx = null, buf = null, out = null, on = true, last = 0, vol = .8;
  const pick = {sent: 'blip', outl: 'tick', stem: 'pop'};
  try { on = localStorage.getItem('aw-sound') !== 'off'; const v = parseFloat(localStorage.getItem('aw-vol')); if(v >= 0) vol = v; } catch(e){}
  function wake(){ try { if(!ctx){ ctx = new (window.AudioContext || window.webkitAudioContext)(); buf = ctx.createBuffer(1, Math.floor(ctx.sampleRate*.03), ctx.sampleRate);
      const d = buf.getChannelData(0); for(let i = 0; i < d.length; i++) d[i] = (Math.random()*2 - 1) * Math.pow(1 - i/d.length, 7);
      out = ctx.createGain(); out.gain.value = vol; out.connect(ctx.destination); }
    if(ctx.state === 'suspended') ctx.resume(); } catch(e){} }
  /* building blocks: a filtered noise hit and a decaying sine */
  function hit(t, type, freq, q, gain, rate = 1){ const s = ctx.createBufferSource(); s.buffer = buf; s.playbackRate.value = rate;
    const f = ctx.createBiquadFilter(); f.type = type; f.frequency.value = freq; f.Q.value = q; const g = ctx.createGain(); g.gain.value = gain;
    s.connect(f); f.connect(g); g.connect(out); s.start(t); }
  function tone(t, f0, f1, dur, gain, type = 'sine'){ const o = ctx.createOscillator(); o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + dur);
    const g = ctx.createGain(); g.gain.setValueAtTime(gain, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur); o.connect(g); g.connect(out); o.start(t); o.stop(t + dur + .02); }
  const PLAY = {
    tick:  (t, p) => hit(t, 'bandpass', 2600*p, 1.4, .55, p),
    wood:  (t, p) => { hit(t, 'bandpass', 950*p, 5, 1.6, .7); tone(t, 520*p, 380*p, .045, .35); },
    watch: (t, p) => hit(t, 'highpass', 5200*p, .7, .45, 2.2),
    watchlo: (t, p) => hit(t, 'highpass', 3900*p, .8, .22, 1.65),
    lock:  (t, p) => { hit(t, 'bandpass', 3300*p, 14, 2.4, 1.3); hit(t + .011, 'bandpass', 4800*p, 16, 1.6, 1.4); },
    type:  (t, p) => { hit(t, 'bandpass', 1900*p, .9, .8, .9); tone(t, 150*p, 90, .05, .45, 'triangle'); },
    pop:   (t, p) => tone(t, 760*p, 190*p, .06, .26),
    blip:  (t, p) => tone(t, 1150*p, 1100*p, .045, .22),
    glass: (t, p) => { tone(t, 2300*p, 2290*p, .22, .1); tone(t, 3460*p, 3450*p, .16, .06); } };
  const layout = () => { try { return real(); } catch(e){ return 'sent'; } };
  function play(voice, pitch = 1, force){ if((!on && !force) || !ctx || ctx.state !== 'running') return; const now = ctx.currentTime; if(!force && now - last < .028) return; last = now;
    try { PLAY[voice](now, pitch * (.96 + Math.random()*.08)); } catch(e){} }
  function tick(pitch = 1){ play(pick[layout()] || 'tick', pitch); }
  ['pointerdown','keydown','touchstart'].forEach(ev => addEventListener(ev, wake, {passive:true}));
  /* the speaker just mutes and unmutes; each layout has its own fixed sound */
  const btn = $('snd'); btn.classList.toggle('muted', !on);
  btn.onclick = () => { on = !on; btn.classList.toggle('muted', !on); try { localStorage.setItem('aw-sound', on ? 'on' : 'off'); } catch(e){} if(on){ wake(); setTimeout(() => tick(1), 30); } };
  return {tick, wake, play}; })();

/* =================== SENTENCE: the heading writes itself; each choice flies up into it =================== */
function makeSent(cfg){

  function filter(q){ QRY = q; for(let d = 0; d < 3; d++){ if(sel[d] != null && !items(d).some(x => x.i === sel[d])) for(let k = d; k < 3; k++) sel[k] = null; } drawn = ''; render(); }
  addEventListener('resize', () => { if(S.classList.contains('on')){ place(); wire(-1); } });
  return {start(){ render(); }, open(p){ sel = [p[0], p[1], p[2]]; drawn = ''; render(); }, filter, enter(){}, shown(){ ph('search…'); place(); wire(-1); }};
})();

/* =================== switching between the three layouts =================== */
const small = () => innerWidth <= 760;
let mode = 'outl'; try { const m = localStorage.getItem('aw-layout3'); if(m === 'wheel') mode = 'sent'; else if(['sent','outl','stem'].includes(m)) mode = m; } catch(e){}
const real = () => mode, MOD = {sent: T, outl: OL, stem: SM};
function show(m){ if(m) mode = m; fhint(''); try { localStorage.setItem('aw-layout3', mode); } catch(e){} const r = real();
  ['sent','outl','stem'].forEach(k => $(k).classList.toggle('on', k === r)); MOD[r].shown(); if(typeof applyQ === 'function') applyQ();
  const sw = $('sw'); sw.innerHTML = ''; [['outl', 'outline'], ['sent', 'sentence'], ['stem', 'stems']].forEach(([k, n]) => { const b = el('button', null, n); b.setAttribute('aria-pressed', String(k === real())); b.onclick = () => show(k); sw.appendChild(b); }); }
let lastSmall = small(); addEventListener('resize', () => { if(small() !== lastSmall){ lastSmall = small(); show(); } });
T.start(); OL.start(); SM.start(); show();
const IDX = []; P.forEach((s,si) => s.u.forEach((u,gi) => u.t.forEach(ti => IDX.push({p:[si,gi,ti], n:s.t[ti].t, low:nrm(s.t[ti].t), k:s.t[ti].k.map(k => nrm(k.f))}))));
/* anywhere-search, used when the layer you're on has nothing by that name */
function deep(q, scope){ return IDX.filter(x => (!scope || scope.every((v,j) => x.p[j] === v))).map(x => [x, x.low.startsWith(q) ? 3 : x.low.includes(q) ? 2 : q.length > 2 && x.k.some(k => k.includes(q)) ? 1 : 0]).filter(h => h[1]).sort((a,b) => b[1] - a[1]).map(h => h[0]); }
let jumpTo = null;
function searchNote(){ if(!QRY) return ''; const n = totalHits(); if(!n) return 'nothing mentions that'; const subs = new Set([...hits()].map(k => k.split('.')[0])).size;
  return 'in ' + plural(subs, W[0]) + ' · ' + plural(n, W[2]); }
function jumpHint(){ const h = deep(QRY)[0]; jumpTo = h ? h.p : null; return h ? ' · ↵ opens “' + h.n + '”' : ''; }
function jump(){ if(!jumpTo) return; const p = jumpTo; setQ(''); F.blur(); MOD[real()].open(p); }
/* one search for the whole site: the words in the box are always the words doing the culling, in every layout */
function applyQ(){ const M = MOD[real()]; if(M._q !== QRY){ M._q = QRY; M.filter(QRY); } }
function setQ(raw){ F.value = raw; const q = nrm(raw.trim()); QRY = q.length > 1 ? q : ''; document.documentElement.classList.toggle('nohits', !!QRY && !totalHits()); applyQ(); if(!QRY) fhint(''); }
const F = $('find');
document.querySelectorAll('.nhback').forEach(b => b.onclick = () => { SND.tick(.8); setQ(''); });
F.addEventListener('input', () => setQ(F.value));
F.addEventListener('keydown', e => { if(e.key === 'Enter'){ e.preventDefault(); MOD[real()].enter(); } if(e.key === 'Escape'){ setQ(''); F.blur(); } });
addEventListener('keydown', e => { if(e.key === '/' && e.target !== F){ e.preventDefault(); F.focus(); } });
/* themes: auto follows the device; the rest are fixed palettes. The half-circle opens the list */
(function(){ const r = document.documentElement, box = $('themes');
  const TH = [['', 'auto', '#fff', '#111'], ['day', 'day', '#fff', '#111'], ['night', 'night', '#0b0b0b', '#ebebeb'], ['paper', 'paper', '#f5efe3', '#2b241d'],
    ['newsprint', 'newsprint', '#ecebe6', '#151515'], ['rose', 'rose', '#fbf1f2', '#3d1f27'], ['ink', 'ink', '#0f2240', '#e9eef6'], ['slate', 'slate', '#1b1f24', '#dfe3e8'], ['phosphor', 'phosphor', '#060b06', '#9cf29c']];
  const set = k => { if(k) r.dataset.theme = k; else delete r.dataset.theme; try { localStorage.setItem('aw-theme', k); } catch(e){} draw(); };
  try { const t = localStorage.getItem('aw-theme'); if(t === null) r.dataset.theme = 'ink'; else if(t && TH.some(x => x[0] === t)) r.dataset.theme = t; else delete r.dataset.theme; } catch(e){ r.dataset.theme = 'ink'; }
  function draw(){ box.innerHTML = ''; const cur = r.dataset.theme || ''; TH.forEach(([k, name, bg, ink]) => { const b = el('button'); b.setAttribute('aria-pressed', String(k === cur));
      const i = el('i', null, 'Aa'); i.style.background = bg; i.style.color = ink; b.append(i, name); b.onclick = () => { set(k); SND.tick(1.2); }; box.appendChild(b); }); }
  $('theme').onclick = e => { e.stopPropagation(); box.classList.toggle('on'); draw(); };
  addEventListener('pointerdown', e => { if(box.classList.contains('on') && !e.target.closest('#themes,#theme')) box.classList.remove('on'); }); })();
</script></body></html>
