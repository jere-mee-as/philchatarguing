<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex"><script>try{var t=localStorage.getItem('aw-theme');if(t===null)document.documentElement.dataset.theme='ink';else if(t)document.documentElement.dataset.theme=t}catch(e){document.documentElement.dataset.theme='ink'}</script>
<style>
:root{--ink:#111;--dim:#9a9a9a;--faint:#e6e6e6;--bg:#fff;color-scheme:light dark}
@media (prefers-color-scheme:dark){:root:not([data-theme]){--ink:#ebebeb;--dim:#6c6c6c;--faint:#222;--bg:#0b0b0b}}
:root[data-theme=night]{--ink:#ebebeb;--dim:#6c6c6c;--faint:#222;--bg:#0b0b0b;color-scheme:dark}
:root[data-theme=paper]{--ink:#2b241d;--dim:#9a8c79;--faint:#e3d9c6;--bg:#f5efe3;color-scheme:light}
:root[data-theme=ink]{--ink:#e9eef6;--dim:#7f93ad;--faint:#22385a;--bg:#0f2240;color-scheme:dark}
:root[data-theme=phosphor]{--ink:#9cf29c;--dim:#3f7f3f;--faint:#163016;--bg:#060b06;color-scheme:dark}
:root[data-theme=phosphor] body,:root[data-theme=phosphor] button,:root[data-theme=phosphor] input{font-family:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;letter-spacing:-.01em}
:root[data-theme=rose]{--ink:#3d1f27;--dim:#b38791;--faint:#efd8dc;--bg:#fbf1f2;color-scheme:light}
:root[data-theme=slate]{--ink:#dfe3e8;--dim:#7b8590;--faint:#2b3138;--bg:#1b1f24;color-scheme:dark}
:root[data-theme=newsprint]{--ink:#151515;--dim:#8a8a84;--faint:#d9d8d2;--bg:#ecebe6;color-scheme:light}
:root[data-theme=newsprint] body{font-family:"Times New Roman",Times,serif}
#themes{position:fixed;top:56px;right:16px;z-index:25;background:var(--bg);border:1px solid var(--dim);border-radius:12px;padding:14px;display:none;font-size:15px;color:var(--ink);box-shadow:0 12px 34px rgba(0,0,0,.18)}#themes.on{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
#themes button{display:flex;align-items:center;gap:10px;color:var(--ink);padding:7px 12px 7px 8px;border-radius:8px;border:1px solid transparent}#themes button:hover{border-color:var(--faint)}#themes button[aria-pressed=true]{border-color:var(--ink)}
#themes i{width:34px;height:24px;border-radius:6px;border:1px solid var(--dim);display:inline-flex;align-items:center;justify-content:center;font-style:normal;font-size:13px;font-family:Georgia,serif;flex:none}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.4 "Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
a{color:inherit;text-decoration-color:var(--dim);text-underline-offset:3px}
.q{display:block;color:var(--dim);font-size:13.5px;line-height:1.35}
#bar{position:fixed;top:0;right:0;z-index:20;display:flex;align-items:center;gap:18px;padding:18px 20px 14px 28px;font-size:14px;color:var(--dim);background:var(--bg);border-bottom-left-radius:14px}
#bar .sw button{color:var(--dim)} #bar .sw button+button::before{content:"·";margin:0 8px;color:var(--dim)}
#bar .sw button[aria-pressed=true],#bar button:hover{color:var(--ink)}
#find{width:8em;border:0;border-bottom:1px solid var(--faint);background:none;color:var(--ink);font:inherit;padding:2px 0;outline:none}
#find:focus{border-color:var(--ink)}
#board{position:fixed;top:54px;right:16px;z-index:25;background:var(--bg);border:1px solid var(--faint);border-radius:10px;padding:14px 16px 6px;width:min(30em,calc(100vw - 32px));font-size:13.5px;display:none}#board.on{display:block}
#board .brow{display:flex;gap:12px;align-items:baseline;margin-bottom:12px}#board .bl{width:5.2em;flex:none;color:var(--dim)}#board .chips{display:flex;flex-wrap:wrap;gap:4px 12px}
#board .chip{color:var(--dim)}#board .chip:hover{color:var(--ink)}#board .chip[aria-pressed=true]{color:var(--ink);border-bottom:1px solid var(--ink)}#board .tg{color:var(--ink);width:5.2em;flex:none}#board input[type=range]{flex:1;accent-color:var(--ink)}
.nohit{display:none;position:absolute;left:28px;top:84px;z-index:6;font-size:26px;color:var(--dim)}.nohit button{display:block;font-size:15px;margin-top:10px;color:var(--dim)}.nohit button:hover{color:var(--ink)}.nohits .nohit{display:block}.nohits #fh,
mark{background:none;color:inherit;border-bottom:2px solid var(--ink)}
#fh{position:fixed;top:50px;right:20px;z-index:21;color:var(--dim);font-size:13px;max-width:24em;text-align:right;opacity:0;transition:opacity .2s}#fh.on{opacity:1}
#find{width:11em}
#bar svg{width:15px;height:15px;display:block}
#snd .off{display:none} #snd.muted .on{display:none} #snd.muted .off{display:block}
.stage{position:fixed;inset:0;display:none;overflow:hidden} .stage.on{display:block}
.fact{display:block;width:100%;margin:0 0 30px;cursor:pointer;opacity:0;transform:translateY(6px);animation:up .5s ease-out forwards;animation-delay:calc(var(--n,0)*.07s + var(--d,.2s))}
.fact .say{display:block}
.cp{display:inline-flex;align-items:center;justify-content:center;vertical-align:-2px;margin-left:8px;width:18px;height:18px;color:var(--dim);opacity:0;transition:opacity .2s,color .2s;cursor:pointer;border-radius:4px}
.cp svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.fact:hover .cp,.cp:focus-visible{opacity:.6} .cp:hover{opacity:1!important;color:var(--ink)} .cp.ok{opacity:1;color:var(--ink)} .cp.ok svg{display:none} .cp.ok::after{content:"✓";font-size:14px}
@media (hover:none){.cp{opacity:.4}} .fact .more{display:none;margin:12px 0 4px;padding:10px 0 10px 16px;border-left:2px solid var(--dim);font-size:15.5px;line-height:1.5;text-align:left}
.fact.open .more{display:block;animation:up .2s ease-out} .fact .more .but{display:block;font-style:italic;color:var(--dim);margin-bottom:3px}
.fact .more .lim{display:block;color:var(--ink);opacity:.86} .fact .more .srcl{display:block;margin-top:10px;font-size:13px;color:var(--dim)}
.fact .more .srcl a{color:var(--dim)} .fact .more .srcl a:hover{color:var(--ink)}
@keyframes up{to{opacity:1;transform:none}} @keyframes fade{from{opacity:0}}
.big{font:inherit;font-size:30px;line-height:1.2;margin:0 0 34px}
.back{color:var(--dim);font-size:14px;margin-bottom:18px;display:block}
/* ---------- sentence ---------- */
.sl{overflow-y:auto}
.sl .wrap{max-width:68em;margin:0 auto;padding:90px 28px 30vh}
.sl h1{font:inherit;font-size:clamp(26px,4.2vw,46px);line-height:1.18;margin:0 0 48px;max-width:22em}
.sl h1 button{border-bottom:1px solid var(--faint);transition:border-color .2s}
.sl h1 button:hover{border-color:var(--ink)}
.sl h1 .w{display:inline-block;animation:fade .8s ease-out both}
.sl .choices{columns:15em;column-gap:48px}
.sl .ch{display:block;break-inside:avoid;font-size:22px;line-height:1.25;padding:9px 0;opacity:0;animation:up .6s ease-out forwards;animation-delay:calc(var(--n)*.035s)}
.sl .ch:hover{opacity:.55!important}
.sl .ch .c{display:block;color:var(--dim);font-size:13px;margin-top:2px}
.sl .facts{max-width:40em}
.sl .fact .say{font-size:21px;line-height:1.38}

.sl h1 .goback{display:block;font-size:15px;color:var(--dim);margin-top:12px;border:0!important}.sl h1 .goback:hover{color:var(--ink)}
.credit{position:fixed;right:18px;bottom:16px;z-index:19;display:flex;align-items:center;gap:8px;font-size:13px;color:var(--dim);background:var(--bg);padding:4px 6px 4px 4px;border-radius:999px}.credit b{font-weight:400;color:var(--ink)}.credit img{width:20px;height:20px;border-radius:50%;object-fit:cover}
.sl .steps{display:flex;gap:10px;font-size:13.5px;color:var(--dim);margin:0 0 14px}.sl .steps span.on{color:var(--ink)}.sl .steps button.done{color:var(--dim);border-bottom:1px solid var(--faint)}.sl .steps button.done:hover{color:var(--ink);border-color:var(--ink)}.sl .steps span:not(.on){opacity:.55}.sl .steps i{font-style:normal;opacity:.6}
.sl .lay{color:var(--dim);font-size:13.5px;margin:0 0 14px}.sl .deeper{margin-top:30px}.sl .deeper .lay{margin-bottom:6px}
.sl .choices.quick .ch{animation-delay:0s!important;animation-duration:.2s}
.sl mark{background:none;color:inherit;border-bottom:2px solid var(--ink)}
.fly{position:fixed;z-index:30;white-space:nowrap;transform-origin:0 0;pointer-events:none;line-height:1.25}
.sl h1 .w.land{animation:land .5s ease-out}@keyframes land{0%{border-color:var(--ink)}100%{border-color:var(--faint)}}
.sl .ch{animation-delay:calc(var(--n)*.03s)!important;animation-duration:.42s!important} .sl .fact{animation-duration:.45s;animation-delay:calc(var(--n,0)*.09s + .05s)}.sl .fact{animation-duration:.45s}.sl .ch{position:relative}.sl .ch:hover{opacity:1!important;z-index:10}.sl .ch:hover>.t{opacity:.6}
.sl .ch .more-c::after{content:" ⌄";font-size:11px}
.sl .ch .hits{position:absolute;left:-12px;top:calc(100% - 2px);z-index:10;width:max(100% + 24px,19em);background:var(--bg);border:1px solid var(--faint);border-radius:8px;padding:9px 12px;font-size:14px;line-height:1.35;color:var(--ink);opacity:0;transform:translateY(-4px);pointer-events:none;transition:opacity .15s,transform .15s;box-shadow:0 6px 18px rgba(0,0,0,.06)}
.sl .ch:hover .hits,.sl .ch:focus-visible .hits{opacity:1;transform:none}
.sl .ch .hl{display:block;padding:3px 0}
@media (hover:none){.sl .ch .hits{position:static;opacity:1;transform:none;border:0;padding:4px 0 0;width:auto;box-shadow:none;color:var(--dim);font-size:13px}.sl .ch .more-c::after{content:""}}

/* ---------- outline ---------- */
#outl{overflow-y:auto} #outl .wrap{max-width:54em;margin:0 auto;padding:90px 28px 30vh}
#outl h1{font:inherit;font-size:clamp(26px,3.6vw,42px);line-height:1.2;margin:0 0 26px}
.goback{display:block;font-size:15px;color:var(--dim);margin-top:12px} .goback:hover{color:var(--ink)}
#outl .ocollapse{color:var(--dim);font-size:13.5px;margin-bottom:12px} #outl .ocollapse:hover{color:var(--ink)}
#outl .orow{display:flex;align-items:baseline;gap:10px;width:100%;padding:5px 0;text-align:left;transition:opacity .2s}
#outl .orow:hover .ot{opacity:.6} #outl .d0{font-size:22px} #outl .d1{font-size:19px} #outl .d2{font-size:17px}
#outl .car{width:14px;flex:none;color:var(--dim);font-size:15px} #outl .oc{color:var(--dim);font-size:13px;white-space:nowrap}
#outl .has>.onode>.orow:not(.open){opacity:.36} #outl .has>.onode>.orow:not(.open):hover{opacity:.8}
#outl .okids{margin:2px 0 8px 6px;padding-left:22px;border-left:1px solid var(--faint)} #outl .okids.fresh{animation:up .22s ease-out}
#outl .ofacts{padding-top:8px;max-width:40em} #outl .ofacts .fact{margin-bottom:20px}
#outl mark,#stem mark{background:none;color:inherit;border-bottom:2px solid var(--ink)} #outl .lay{color:var(--dim);font-size:13.5px}
/* ---------- stems ---------- */
#stem{overflow:auto} #stem .ssay{position:sticky;left:0;top:0;z-index:4;padding:20px 24px 8px;font-size:19px;line-height:1.3;max-width:calc(100vw - 460px);background:var(--bg)}
#stem .ssay b{font-weight:400;border-bottom:1px solid var(--faint)}
#scols{position:relative;display:flex;align-items:flex-start;gap:100px;padding:36px 28px 40vh;width:max-content}
#ssvg{position:absolute;left:0;top:0;overflow:visible;pointer-events:none} #ssvg path{fill:none;stroke:var(--ink);stroke-width:1;stroke-linecap:round;transition:opacity .3s} #ssvg path.off{opacity:.14}
#stem .scol{display:flex;flex-direction:column;flex:none;position:relative;z-index:1} #stem .scol.c3{width:min(27em,80vw)}
#stem .sit{display:block;white-space:nowrap;padding:6px 0;font-size:17px;transition:opacity .35s} #stem .sit.off{opacity:.3} #stem .sit.off:hover{opacity:.7}
#stem .scol.grow>*{animation:up .45s ease-out both;animation-delay:calc(var(--n,0)*.03s + .22s)} #stem .scol.c3 .fact{margin-bottom:22px}
@media (max-width:760px){#stem .ssay{max-width:none;font-size:16px}#scols{gap:56px}}


/* phones: the bar becomes two rows across the top, and every layout starts below it */
@media (max-width:760px){
  #bar{left:0;right:0;flex-wrap:wrap;gap:8px 16px;padding:12px 16px 10px;border-radius:0;border-bottom:1px solid var(--faint)}
  #find{flex:1;width:auto;min-width:0} #bar .sw{order:3;flex-basis:100%;white-space:nowrap;overflow-x:auto;scrollbar-width:none}
  .stage{top:86px} .sl .wrap,#outl .wrap{padding-top:22px} #stem .ssay{padding-top:12px} #scols{padding-top:18px}
  #fh{top:92px;left:16px;right:16px;text-align:left} #themes{top:92px} .credit{bottom:10px;right:10px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.fact,.sl .ch{opacity:1;transform:none}}
/* ---------- phones: the last word on small screens ---------- */
@media (max-width:760px){
  .credit{top:47px;bottom:auto;right:12px;font-size:12px;padding:2px 4px;background:none;z-index:21} .credit img{width:16px;height:16px}
  #themes{left:12px;right:12px;top:92px;padding:10px}
  #outl .wrap,#sent .wrap{padding-left:20px;padding-right:20px}
  #outl .orow{display:block;position:relative;padding:7px 0 7px 24px;line-height:1.3} #outl .orow .car{position:absolute;left:0;top:7px}
  #outl .orow .oc{margin-left:8px} #outl .d0{font-size:20px} #outl .d1{font-size:18px} #outl .d2{font-size:16.5px}
  #stem .sit.off{visibility:hidden} #stem .sit{padding:9px 0}
}
#stem .ssay .back1{cursor:pointer} #stem .ssay .back1:hover{color:var(--dim)}
.ic{display:inline-flex;align-items:center;justify-content:center;width:1.25em;min-width:22px;flex:none;margin-right:.45em;color:var(--dim);font-size:.9em;vertical-align:-.08em;font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Noto Sans Symbols 2","Segoe UI Symbol",serif}
.ic.pf{width:1.15em;height:1.15em;min-width:20px;min-height:20px;border-radius:50%;overflow:hidden;background:var(--faint);color:var(--ink);font-size:.7em;vertical-align:-.18em}.ic.pf img{width:100%;height:100%;object-fit:cover;display:block}
#outl .orow .ic{align-self:center} #stem .sit{display:flex;align-items:center} .sl .ch .t{display:inline}
.lead{color:var(--dim);font-size:15.5px;line-height:1.5;margin:0 0 22px;max-width:36em;font-style:italic}
.fact.nofold{cursor:default}
.foot{position:fixed;left:18px;bottom:16px;z-index:19;font-size:13px;color:var(--dim);background:var(--bg);padding:4px 6px;border-radius:999px;text-decoration:none}.foot:hover{color:var(--ink)}

<script id="data" type="application/json">[{"n": "AJ", "i": "@anonymousjohnson", "u": [{"n": "Shakespeare & literature", "t": [0, 1, 2, 3]}, {"n": "Plato", "t": [4, 5, 6]}], "t": [{"t": "“The famous lines are jokes”", "p": "Famous Shakespeare lines often come from comic characters riffing on stock ideas. They weren't meant as grand insight.", "k": [{"q": "○  serious", "f": "Context matters, and lines also outgrow their speakers. Plenty of what a fool says in Shakespeare is the play's best thinking."}, {"q": "◐  bait", "f": "If it's in the play, he wrote it. If he wrote it, he meant something by it. So every line is his opinion, and who says it is staging."}, {"q": "●  rage bait", "f": "Shakespeare is a plot thief with a thesaurus."}]}, {"t": "“Know the period conventions”", "p": "You have to know the conventions of the period to read him properly.", "k": [{"q": "○  serious", "f": "A work that needs a period glossary to land has lost part of what made it work."}, {"q": "◐  bait", "f": "A great writer is one you can read without help. He needs a page of notes per page of text. So that's half a writer."}, {"q": "●  rage bait", "f": "The comedies aren't funny and haven't been since 1610."}]}, {"t": "“The old books repay reading”", "p": "The older books, the Hebrew Bible and the classics, repay real reading.", "k": [{"q": "○  serious", "f": "They do, and a lot of their standing comes from having been required for centuries."}, {"q": "◐  bait", "f": "A book is good if people choose to read it. Nobody chooses these. They get them at school. So their readership is a captive audience."}, {"q": "●  rage bait", "f": "The Old Testament is the better half. The sequel ruined the pacing."}]}, {"t": "“Changing a word doesn't change the thing”", "p": "Changing how a word is used doesn't change what a thing is.", "k": [{"q": "○  serious", "f": "Usage is how words get their meanings. If enough people use a word differently, that is what it means now."}, {"q": "◐  bait", "f": "Words are sounds. A sound means whatever people agree it means. If they agree on something new, that's the meaning, and the old one is a hobby."}, {"q": "●  rage bait", "f": "Definitions are arbitrary. A word means whatever people decide."}]}, {"t": "“Plato wants numbers both ways”", "p": "Plato wants number as a transcendent cause and also has numbers at work inside the physical world. He tries to have both.", "k": [{"q": "○  serious", "f": "Participation is meant to bridge that, and Plato himself raises the objection that it doesn't."}, {"q": "◐  bait", "f": "A cause has to touch what it causes. Forms don't touch anything. So they cause nothing, and the theory is decoration."}, {"q": "●  rage bait", "f": "The Parmenides is Plato admitting the Forms don't work."}]}, {"t": "“The cave still works”", "p": "The cave still works as an image. Whoever brings the truth blinds people at first.", "k": [{"q": "○  serious", "f": "It also flatters whoever is telling it. Everyone who uses the cave puts themselves outside."}, {"q": "◐  bait", "f": "If everyone else is in the cave and you aren't, either you're a philosopher or you're the one who's confused. The odds aren't close."}, {"q": "●  rage bait", "f": "Plato was a fascist."}]}, {"t": "“Podcasts are a fine way in”", "p": "A popular podcast is a perfectly good way into philosophy.", "k": [{"q": "○  serious", "f": "It's a way into summaries of philosophy. The arguments are in the texts, and summaries lose them."}, {"q": "◐  bait", "f": "If a podcast can do it, a degree is a very expensive podcast. Either the podcast is missing something or the universities are a scam."}, {"q": "●  rage bait", "f": "Arguing online is the only philosophy anyone actually does."}]}]}, {"n": "Ape", "i": "@ape1284", "u": [{"n": "Epistemology", "t": [0, 1, 2, 3, 4]}, {"n": "Maths & statistics", "t": [5, 6, 7, 8]}, {"n": "Realism: colour, taste & morals", "t": [9, 10, 11, 12]}, {"n": "Analytic philosophy", "t": [13, 14, 15, 16]}], "t": [{"t": "“JTB is dead, Gettier won”", "p": "JTB is dead. The Gettier side wins that argument.", "k": [{"q": "○  serious", "f": "Gettier cases rest on intuitions about odd scenarios, and experimental work suggests those intuitions aren't shared as widely as assumed."}, {"q": "◐  bait", "f": "Knowledge is believing something true for a good reason. In Gettier cases the guy believes something true for a good reason. So he knows, and the puzzle is people refusing the answer."}, {"q": "●  rage bait", "f": "Knowledge is justified true belief. Gettier cases are riddles."}]}, {"t": "“Peers should stay confident”", "p": "If you really are someone's epistemic peer, you should hold on to your confidence when they disagree.", "k": [{"q": "○  serious", "f": "If you're peers, their dissent is as much evidence as your own judgment, and holding firm treats yours as special."}, {"q": "◐  bait", "f": "If two equally smart people disagree, each has a fifty percent chance of being right. So both should be at fifty percent, and anyone above that is bad at maths."}, {"q": "●  rage bait", "f": "Confidence is 90% of being right."}]}, {"t": "“It's all about the sample space”", "p": "The usual probability puzzles come down to setting up the sample space correctly.", "k": [{"q": "○  serious", "f": "Picking the sample space is where the modelling judgment goes, and the maths can't make that choice for you."}, {"q": "◐  bait", "f": "There are two outcomes: it happens or it doesn't. That's fifty-fifty. Every more complicated answer is someone showing off."}, {"q": "●  rage bait", "f": "Bayesianism is being wrong with decimals."}]}, {"t": "“Rejecting correspondence isn't flat-earth stuff”", "p": "Rejecting a correspondence theory of truth isn't like being a flat-earther. It's closer to rejecting the axiom of choice.", "k": [{"q": "○  serious", "f": "The axiom of choice is independent of the other axioms. Whether sentences answer to the world isn't obviously optional in that way."}, {"q": "◐  bait", "f": "A statement is true if it says how things are. Anyone who denies that is saying something they think is how things are. So they've agreed already."}, {"q": "●  rage bait", "f": "Truth is correspondence. Everything else is cope."}]}, {"t": "“Nobody flips on intuitions”", "p": "Philosophical views mostly come from intuitions, so expecting someone to flip their position is unrealistic.", "k": [{"q": "○  serious", "f": "If views rest on intuitions \"from God knows where,\" that's a reason to hold them loosely."}, {"q": "◐  bait", "f": "An intuition is a feeling. Feelings aren't evidence in any other subject. So philosophy runs on nothing, and that's why it never finishes."}, {"q": "●  rage bait", "f": "Intuitions aren't evidence. They're what you believed before you checked."}]}, {"t": "“Maths matters even as a language game”", "p": "Mathematics being a kind of language game doesn't stop it having real consequences.", "k": [{"q": "○  serious", "f": "If it's a game with rules we chose, its fit with physics needs explaining, and \"impact\" just renames the puzzle."}, {"q": "◐  bait", "f": "Games are made up. If maths is a game, maths is made up. Made-up things can't be true, so there are no mathematical truths, only moves."}, {"q": "●  rage bait", "f": "Maths is made up."}]}, {"t": "“Stats beats pure theory”", "p": "Statistics and stochastic processes are the better place to be than pure theory.", "k": [{"q": "○  serious", "f": "Applied work is useful, and it borrows its guarantees from the theory it's contrasted with."}, {"q": "◐  bait", "f": "Statistics is counting things and dividing. That's primary school. The symbols are there so it looks like a degree."}, {"q": "●  rage bait", "f": "Statisticians are mathematicians who gave up on proof."}]}, {"t": "“Do the manifolds properly”", "p": "A proper mathematical physics course should cover manifolds and the real machinery.", "k": [{"q": "○  serious", "f": "Physicists get results with far less rigor than mathematicians think is needed, and the results hold."}, {"q": "◐  bait", "f": "If physicists needed that maths, the physics would be wrong without it. It isn't. So they don't need it."}, {"q": "●  rage bait", "f": "Physics students don't learn the maths properly and the bridges are fine."}]}, {"t": "“Maths doesn't do verbal disputes”", "p": "Maths doesn't collapse into verbal disputes the way philosophy can.", "k": [{"q": "○  serious", "f": "Foundations has its own standoffs, between constructivists and classical mathematicians and over which axioms to accept."}, {"q": "◐  bait", "f": "In maths you prove it and it's over. Nothing in maths has ever been disputed for longer than a proof takes to read."}, {"q": "●  rage bait", "f": "Axioms are just the stuff you refuse to argue about."}]}, {"t": "“Red is in the thing”", "p": "\"This thing is red\" reports a property of the thing. People who say red is only in the mind are wrong.", "k": [{"q": "○  serious", "f": "Physically identical colour experiences come from very different reflectance profiles, so \"red\" doesn't map onto a single property of surfaces."}, {"q": "◐  bait", "f": "Red is a wavelength. Wavelengths aren't red, they're long. So the red has to be somewhere else, and the only other place is your head."}, {"q": "●  rage bait", "f": "Color isn't in the world. Physics found wavelengths and stopped."}]}, {"t": "“Some food is just better”", "p": "Gastronomic realism: some food really is better, and preferences play a smaller part than people think.", "k": [{"q": "○  serious", "f": "Taste varies with genetics and upbringing in ways that make a single standard of \"better\" hard to defend."}, {"q": "◐  bait", "f": "Taste is in the tongue, and tongues are different. So good food is whatever your tongue says, and no restaurant critic has ever been right."}, {"q": "●  rage bait", "f": "Well-done steak is better and that's an objective fact about food."}]}, {"t": "“Take Huemer seriously”", "p": "Moral realism deserves to be taken seriously. Huemer's case in particular isn't lazy.", "k": [{"q": "○  serious", "f": "Intuitionism makes moral knowledge depend on seemings, and seemings are what evolutionary debunking targets."}, {"q": "◐  bait", "f": "If there were moral facts, people would have agreed on them by now like they did on the boiling point of water. They haven't. So there aren't any."}, {"q": "●  rage bait", "f": "Moral realism is cope."}]}, {"t": "“Preferences retreat, they don't vanish”", "p": "Even in a realist account, preferences keep some role. They just retreat into the background.", "k": [{"q": "○  serious", "f": "If preferences can't be eliminated, the \"realism\" may be a sophisticated subjectivism with better manners."}, {"q": "◐  bait", "f": "Either it depends on what people like or it doesn't. If it depends a little, it depends. So it's subjectivism and the rest is vocabulary."}, {"q": "●  rage bait", "f": "Quasi-realism is realism for people who don't want to pay for it."}]}, {"t": "“Analytic philosophy is worth defending”", "p": "Standard analytic philosophy is substantive and useful, and worth defending.", "k": [{"q": "○  serious", "f": "Its clarity is real, and it tends to select questions for being tractable more than for mattering."}, {"q": "◐  bait", "f": "A subject that's useful produces things. Engineering makes bridges. Analytic philosophy makes replies to replies. So it isn't useful, by the ordinary meaning of the word."}, {"q": "●  rage bait", "f": "Analytic philosophy is arguing about definitions. Look it up and move on."}]}, {"t": "“Conties write loosely”", "p": "Continental philosophy gets misread so much because it's written loosely.", "k": [{"q": "○  serious", "f": "Much of the misreading comes from applying a premise-by-premise method to texts that argue historically and by reconstruction."}, {"q": "◐  bait", "f": "Hegel is hard and Russell is easy. The hard one must be saying more, because nobody would make it that hard for no reason."}, {"q": "●  rage bait", "f": "The analytic/continental split is simple. One side has ideas."}]}, {"t": "“Rigor is the difference”", "p": "Rigor is what separates the analytic side.", "k": [{"q": "○  serious", "f": "Symbolizing a weak argument doesn't strengthen it. Close reading and historical work are rigorous in a different way."}, {"q": "◐  bait", "f": "Putting a box in front of a sentence doesn't make it necessary. It makes it look like it went to university."}, {"q": "●  rage bait", "f": "Logic notation is a lab coat."}]}, {"t": "“Conties dodge the arguments”", "p": "Conties don't engage with the actual arguments.", "k": [{"q": "○  serious", "f": "They'd say the same in reverse: that analytic work ignores history, politics and the conditions under which the argument was made."}, {"q": "◐  bait", "f": "The analytics have had a hundred years on metaethics and the options are the same three. Whatever engaging with the arguments does, it doesn't finish anything."}, {"q": "●  rage bait", "f": "Metaethics is what people do instead of having ethics."}]}]}, {"n": "aura", "i": "@aurasurfer", "u": [{"n": "AI: help or replace", "t": [0, 1, 2]}, {"n": "Business & LLCs", "t": [3, 4, 5, 6]}, {"n": "Astrology", "t": [7, 8, 9]}], "t": [{"t": "“Wait for the evidence on AI”", "p": "It's fair not to bother with the big AI claims until the experts show more evidence.", "k": [{"q": "○  serious", "f": "Waiting for proof is reasonable for curiosity. It's less reasonable if being late has a cost."}, {"q": "◐  bait", "f": "The experts have been wrong about AI every year for seventy years. So waiting for them is waiting for people who don't know either."}, {"q": "●  rage bait", "f": "AI safety is a grift."}]}, {"t": "“Help or replace is a real question”", "p": "There's a real question about when a bot is helping with work and when it's replacing it.", "k": [{"q": "○  serious", "f": "The line moves. Most \"helping\" is replacing one task at a time."}, {"q": "◐  bait", "f": "A tool does the work or it doesn't. If it does the work, the person who used to isn't needed. That's replacing. There isn't a second kind."}, {"q": "●  rage bait", "f": "AI taking jobs is bad. No jobs, no money, no customers."}]}, {"t": "“Deterministic bots aren't doing anything”", "p": "A deterministic bot isn't really doing anything. Same input, same output.", "k": [{"q": "○  serious", "f": "Being deterministic doesn't make a system trivial. A chess engine can be deterministic and still beat everyone."}, {"q": "◐  bait", "f": "People are deterministic too. Same brain, same situation, same answer. So if that means the bot isn't doing anything, neither is anyone."}, {"q": "●  rage bait", "f": "A priest could be replaced by a recording. That's what liturgy is."}]}, {"t": "“Get clients first, LLC later”", "p": "You can have a working business with clients first and form the LLC later.", "k": [{"q": "○  serious", "f": "You can. Operating without one leaves personal assets exposed, and that's the thing the LLC is for."}, {"q": "◐  bait", "f": "A business is something registered. If it isn't registered, it's a guy doing favours for money. That's a different thing with a different tax form."}, {"q": "●  rage bait", "f": "An LLC doesn't make a business. It makes a hobby with a registered agent."}]}, {"t": "“One LLC for everything”", "p": "If you're trying lots of ventures, run them under one LLC and split one off only when it starts earning.", "k": [{"q": "○  serious", "f": "One LLC for everything means one lawsuit reaches everything."}, {"q": "◐  bait", "f": "If one LLC is enough for five businesses, then the LLC isn't doing anything for any of them. It's a folder."}, {"q": "●  rage bait", "f": "Most businesses shouldn't exist and the owners know by month four."}]}, {"t": "“Indoor farming is the path”", "p": "Scaling food production up into big controlled indoor facilities is a real path.", "k": [{"q": "○  serious", "f": "Indoor farming works for leafy greens and has struggled on energy costs for anything with calories."}, {"q": "◐  bait", "f": "Plants need light. The sun is free. Indoors you pay for the light. So it costs more to grow the same plant, forever."}, {"q": "●  rage bait", "f": "Farming is easy. Plants want to grow."}]}, {"t": "“Pro sex work means pro workers”", "p": "Being pro sex work is about the workers getting paid. It isn't a claim that the industry is great.", "k": [{"q": "○  serious", "f": "That's a coherent position. It also leaves open whether more of the industry is a good thing."}, {"q": "◐  bait", "f": "If the industry isn't great, supporting it isn't great. You can't be for the workers and against the work. The work is what pays them."}, {"q": "●  rage bait", "f": "Sex work is work the same way gambling is work."}]}, {"t": "“Astrology is fun heuristics”", "p": "Astrology is worth having as a set of fun heuristics.", "k": [{"q": "○  serious", "f": "A heuristic has to beat chance to be one, and matching tests put astrology at chance."}, {"q": "◐  bait", "f": "If it's only for fun, it doesn't tell you anything. If it tells you something, it isn't only for fun. So it has to pick one."}, {"q": "●  rage bait", "f": "Astrology has no mechanism, which is the only thing a theory needs."}]}, {"t": "“The types capture something”", "p": "The types capture something real about people.", "k": [{"q": "○  serious", "f": "Sun-sign descriptions are general enough to fit anyone, and people rate random ones as accurate."}, {"q": "◐  bait", "f": "Personality doesn't change by birth month in any dataset anyone's collected. Millions of people, no signal."}, {"q": "●  rage bait", "f": "Astrology is cope."}]}, {"t": "“Seasons shape people”", "p": "Seasons and cycles do shape people, and astrology is a way of talking about that.", "k": [{"q": "○  serious", "f": "Season-of-birth effects exist and are small, and they come down to things like school year. Planets don't come into it."}, {"q": "◐  bait", "f": "Everyone has central heating now. The seasons haven't affected anyone since about 1950."}, {"q": "●  rage bait", "f": "Seasons don't matter to anyone with central heating."}]}]}, {"n": "Bedbug", "i": "@bedbug0450", "u": [{"n": "Food & cooking", "t": [0, 1, 2, 3]}, {"n": "Pseudointellectuals", "t": [4, 5, 6, 7]}, {"n": "The red & blue button", "t": [8, 9, 10, 11]}], "t": [{"t": "“Eat ingredients one at a time”", "p": "Eat ingredients one at a time and your brain builds a map of what each food gives you.", "k": [{"q": "○  serious", "f": "There's little evidence for that. Dishes exist because combinations taste better and absorb better."}, {"q": "◐  bait", "f": "Your stomach mixes it all together thirty seconds later. So eating it separately does nothing, and you've just had a worse dinner."}, {"q": "●  rage bait", "f": "Mixing ingredients is called food."}]}, {"t": "“Cravings know what you need”", "p": "Cravings track what your body needs.", "k": [{"q": "○  serious", "f": "Cravings track sugar, salt and fat, and habit. The link to specific nutrient needs is weak in the research."}, {"q": "◐  bait", "f": "People crave cigarettes. Nobody's body needs a cigarette. So cravings are just wanting, and wanting isn't nutrition."}, {"q": "●  rage bait", "f": "Disgust is always right about food and always wrong about people."}]}, {"t": "“Cooking is simple”", "p": "Cooking is simple. Find good recipes, follow the steps, learn the basics like balancing flavour and getting the fond up.", "k": [{"q": "○  serious", "f": "\"Balance the flavour\" is the hard part. It's the judgment recipes can't give you."}, {"q": "◐  bait", "f": "If it were simple, restaurants wouldn't exist. Nobody pays forty dollars for something that's following steps."}, {"q": "●  rage bait", "f": "Fond is burnt. French cooking is scraping burnt off a pan with wine."}]}, {"t": "“Sour is worth acquiring”", "p": "Sour and fermented stuff is an acquired taste worth acquiring.", "k": [{"q": "○  serious", "f": "Acquired tastes are partly a matter of signalling. The acquiring is the point for a lot of people."}, {"q": "◐  bait", "f": "Sour means it's gone off. That's what the tongue is for. Learning to like it is teaching yourself to ignore the warning."}, {"q": "●  rage bait", "f": "Sour beer is beer that went wrong and got a label."}]}, {"t": "“Overconfidence doesn't make a pseudointellectual”", "p": "Being convinced you know more than you do isn't enough to make someone a pseudointellectual.", "k": [{"q": "○  serious", "f": "If overestimating your own knowledge isn't the mark, it's hard to say what is beyond \"people I find annoying.\""}, {"q": "◐  bait", "f": "An intellectual is someone who knows things. A pseudointellectual is someone who thinks they do. That's the definition, and it's everyone in a philosophy chat."}, {"q": "●  rage bait", "f": "Everyone on a philosophy server is a pseudointellectual. That's the genre."}]}, {"t": "“One act doesn't define you”", "p": "Doing something pseudointellectual doesn't make you a pseudointellectual. One act doesn't define a person.", "k": [{"q": "○  serious", "f": "People are what they repeatedly do. Enough of the activity and the label is earned."}, {"q": "◐  bait", "f": "You are what you do. If you do the activity, you're the thing. Nobody says \"I only murdered once.\""}, {"q": "●  rage bait", "f": "Humility is a brag."}]}, {"t": "“Normies are often right”", "p": "Normies have a more accurate picture of plenty of things than very online people do.", "k": [{"q": "○  serious", "f": "Offline people miss things as well. They're just wrong about different stuff, with more confidence."}, {"q": "◐  bait", "f": "Most people are average, and average people believe average things. Average things are half wrong. So normies are wrong half the time, the same as a coin."}, {"q": "●  rage bait", "f": "Normies are right about everything and that's what makes them normies."}]}, {"t": "“Ragebait gets the smart ones”", "p": "Good ragebait works on people who think they're too smart for it.", "k": [{"q": "○  serious", "f": "That makes it unfalsifiable. Whoever objects proves the point, and whoever doesn't wasn't the target."}, {"q": "◐  bait", "f": "If it only works on smart people, then getting annoyed proves you're smart. So the more it works on you, the better you're doing."}, {"q": "●  rage bait", "f": "Ragebait only works on people who think they're too smart for it."}]}, {"t": "“Blue is the immoral button”", "p": "Pressing blue is the immoral one. Blue pressers either can't think it through or don't mind dying, and you don't owe either your life.", "k": [{"q": "○  serious", "f": "Some blue pressers reason that enough others will press blue. Polls of the dilemma bear them out."}, {"q": "◐  bait", "f": "Polls say blue wins. If blue wins, nobody dies. So the blue pressers did the maths and the red ones were scared of a poll."}, {"q": "●  rage bait", "f": "Red is the coward's button. It only works if other people are braver."}]}, {"t": "“Blue is a hostage note”", "p": "\"Everyone should press blue to save me\" is the whole blue argument, and it's a hostage note.", "k": [{"q": "○  serious", "f": "The blue case is about coordination. If a majority is reachable, the only outcome with no deaths runs through it."}, {"q": "◐  bait", "f": "Red only works because someone else gets shot. Calling the people who'd save everyone hostage-takers is a brave way to describe hiding."}, {"q": "●  rage bait", "f": "Red is a free ride on other people's decency."}]}, {"t": "“Add a payoff, see who people are”", "p": "Add a private payoff to the choice and you see what people are really made of.", "k": [{"q": "○  serious", "f": "Changing the payoffs changes the problem. What people do for a million dollars says little about the original."}, {"q": "◐  bait", "f": "If you have to pay people to press red, then red isn't the natural choice. You don't have to bribe people to do the right thing."}, {"q": "●  rage bait", "f": "Blue is the only moral button."}]}, {"t": "“It's just a meme”", "p": "The whole thing is a meme. Nobody should care this much.", "k": [{"q": "○  serious", "f": "It's a meme that reliably sorts people by how they treat risk to others, which is why it won't die."}, {"q": "◐  bait", "f": "People only say \"it's just a meme\" about arguments they lost. Nobody has ever won one and then said it didn't matter."}, {"q": "●  rage bait", "f": "The button meme is the best philosophy this chat has done."}]}]}, {"n": "bossOnothin", "i": "@bossonothin", "u": [{"n": "Islam & Islamic philosophy", "t": [0, 1, 2, 3]}, {"n": "Aristotle & Plato", "t": [4, 5, 6, 7]}, {"n": "Newcomb's problem", "t": [8, 9, 10, 11]}, {"n": "The principle of sufficient reason", "t": [12, 13, 14, 15]}], "t": [{"t": "“Nothing about Islam is 'inherent'”", "p": "Any claim that Islam is \"inherently\" this or that is stupid.", "k": [{"q": "○  serious", "f": "Traditions have texts and core doctrines. Saying nothing is characteristic of a religion makes the word empty."}, {"q": "◐  bait", "f": "A religion is its book, and the book doesn't change. So whatever's in the book is what it inherently is. Christianity too. That's what a religion of the book means."}, {"q": "●  rage bait", "f": "Religion is just crowd control with songs."}]}, {"t": "“The Islamic philosophers were real metaphysicians”", "p": "The medieval Islamic philosophers are serious metaphysicians, not commentators.", "k": [{"q": "○  serious", "f": "Much of the work is commentary in form, and the original moves, like essence and existence, are fewer than the bulk suggests."}, {"q": "◐  bait", "f": "If they were original, they'd be taught in the first year like Descartes. They aren't. The syllabus is the ranking."}, {"q": "●  rage bait", "f": "Avicenna just translated Aristotle and added medicine."}]}, {"t": "“Let the philosophers rule”", "p": "The classical idea that those trained in philosophy should rule so everyone else can live virtuously deserves a hearing.", "k": [{"q": "○  serious", "f": "That's Plato's guardians, and it has Plato's problem. Nobody checks the philosophers."}, {"q": "◐  bait", "f": "Smart people make better decisions. That's what smart means. So the smartest should decide everything and elections are a way of choosing worse."}, {"q": "●  rage bait", "f": "The best government is a smart guy with no elections to worry about."}]}, {"t": "“No source is neutral”", "p": "On contested history, no source is neutral, so read with the author's side in mind.", "k": [{"q": "○  serious", "f": "If no source is neutral, weighing them still needs some standard that isn't just another side."}, {"q": "◐  bait", "f": "If every historian is biased then nobody knows what happened. So history is opinions, and yours is as good as a professor's."}, {"q": "●  rage bait", "f": "A steelman is a strawman somebody would like to be friends with."}]}, {"t": "“Twenty years with Plato, he got him”", "p": "Aristotle can't have misunderstood Plato. He studied with him for twenty years.", "k": [{"q": "○  serious", "f": "Long study doesn't prevent polemical readings. Aristotle had reasons to present Plato in the form that suited his own alternative."}, {"q": "◐  bait", "f": "If he'd understood Plato he'd have agreed with him, because Plato was right. He didn't agree. So he didn't understand."}, {"q": "●  rage bait", "f": "Aristotle is Plato with the good parts taken out and a filing system added."}]}, {"t": "“No Timaeus, no Metaphysics”", "p": "There'd be no Metaphysics without the Timaeus.", "k": [{"q": "○  serious", "f": "The Metaphysics answers the Presocratics and the Academy broadly. Making the Timaeus its source narrows it a lot."}, {"q": "◐  bait", "f": "The Timaeus says the world was built by a craftsman out of triangles. If Aristotle's whole system is a reply to that, the whole system is a reply to a bedtime story."}, {"q": "●  rage bait", "f": "Plato's cosmology is a creation myth with triangles."}]}, {"t": "“Learn ethics from a textbook first”", "p": "If you want to learn ethics as such, read a modern textbook. Aristotle, Kant and Mill deepen things, but they're not where you start.", "k": [{"q": "○  serious", "f": "The textbook's categories come from those three. Starting with the summary gives you the labels and leaves out the reasons."}, {"q": "◐  bait", "f": "If a textbook can say it better, then the originals are obsolete. Obsolete books are history. So the whole canon is a history course."}, {"q": "●  rage bait", "f": "The history of philosophy is pointless. Physics students don't read Newton."}]}, {"t": "“Read Maimonides through the Muslim philosophers”", "p": "Maimonides read Aristotle through the Muslim metaphysicians, and you have to read him knowing that.", "k": [{"q": "○  serious", "f": "True, and it's also true that his main arguments can be assessed directly, whatever their route."}, {"q": "◐  bait", "f": "If you need to know three other philosophers to understand one, that one didn't have anything of his own. That's what \"influenced by\" means when it goes that deep."}, {"q": "●  rage bait", "f": "Maimonides is Aristotle with a commentary track."}]}, {"t": "“Two-boxing is just grabbing the free thousand”", "p": "Two-boxing is only picking up the thousand dollars that's also sitting there.", "k": [{"q": "○  serious", "f": "It is, and the people who reliably do that walk out with a thousand, while the ones who don't walk out with a million."}, {"q": "◐  bait", "f": "The point of a decision is to end up with the most money. One-boxers end up with the most money. So their decision is the better one, because that's what better means."}, {"q": "●  rage bait", "f": "Two-boxing is cope."}]}, {"t": "“Why become a one-boxer for one hypothetical?”", "p": "Why would anyone turn themselves into a one-boxer, the lower-EV disposition, for one hypothetical that might never come up?", "k": [{"q": "○  serious", "f": "Being predictably one-boxing pays in ordinary life too, anywhere others act on what they expect you to do."}, {"q": "◐  bait", "f": "The disposition that gets a million has a higher EV than the one that gets a thousand. A million is higher than a thousand. So one-boxing is the higher-EV disposition, and the arithmetic has four steps."}, {"q": "●  rage bait", "f": "If you're so rational, why aren't you rich?"}]}, {"t": "“One-boxers deny there's a choice”", "p": "Two-boxers get accused of rejecting the predictor. It's one-boxers who reject the premise that there's a choice.", "k": [{"q": "○  serious", "f": "The one-boxer accepts both. The choice is real, and it's the same thing the predictor tracked."}, {"q": "◐  bait", "f": "If you really have a choice, the predictor can be wrong. The problem says it isn't wrong. So there isn't a choice, and one-boxing is just reading the instructions."}, {"q": "●  rage bait", "f": "The predictor knew you'd say that."}]}, {"t": "“One-boxers are too scared to grab the thousand”", "p": "If everything outside the room vanished, one-boxers would still be too scared to pick up the thousand.", "k": [{"q": "○  serious", "f": "In that case nothing depends on the prediction any more, and the one-boxer takes both. The reasoning is conditional on the setup."}, {"q": "◐  bait", "f": "Change the problem and you get a different answer. That's true of every problem. It's why exam questions don't let you edit them."}, {"q": "●  rage bait", "f": "Explain it with one more analogy. That'll fill the box."}]}, {"t": "“Things have sufficient reasons”", "p": "The PSR is a serious principle. Things have sufficient reasons.", "k": [{"q": "○  serious", "f": "An unrestricted PSR seems to entail that nothing could have been otherwise, since a sufficient reason leaves no slack."}, {"q": "◐  bait", "f": "An atom decays at one moment and not another, and physics says there's no reason for which. Physics works. So some things have no reason, and the principle is false."}, {"q": "●  rage bait", "f": "The PSR is retarded. Some stuff just happens."}]}, {"t": "“Indiscernibles are identical”", "p": "The identity of indiscernibles holds.", "k": [{"q": "○  serious", "f": "Max Black's two identical spheres alone in a universe share every property, and there are still two."}, {"q": "◐  bait", "f": "Two new coins from the same mint are identical in every way and there are two of them. Anyone with a pocket can check."}, {"q": "●  rage bait", "f": "Leibniz was a courtier with a calculator."}]}, {"t": "“Explanation ends in something necessary”", "p": "The chain of explanation has to end in something necessary.", "k": [{"q": "○  serious", "f": "A necessary being is one stopping point. \"It just is\" is another, and it's unclear the first explains more."}, {"q": "◐  bait", "f": "Everything needs a reason, except the first thing, which doesn't. So the principle has an exception on line one, and a principle with an exception isn't one."}, {"q": "●  rage bait", "f": "The universe doesn't owe anyone an explanation."}]}, {"t": "“Hume didn't refute it”", "p": "Hume didn't refute it.", "k": [{"q": "○  serious", "f": "Hume showed that an uncaused beginning is conceivable without contradiction, which means the PSR isn't a truth of logic."}, {"q": "◐  bait", "f": "Hume said you can imagine something popping up with no cause. You can. So it's possible, so the PSR is false, and that's the refutation."}, {"q": "●  rage bait", "f": "Hume ended metaphysics and Kant spent 800 pages pretending he didn't."}]}]}, {"n": "Brutus", "i": "@exso_lam", "u": [{"n": "Cooking", "t": [0, 1, 2, 3, 4]}, {"n": "Tokens & models", "t": [5, 6, 7, 8]}, {"n": "Newcomb's problem", "t": [9, 10, 11, 12, 13]}, {"n": "Microscopy & optics", "t": [14, 15, 16, 17, 18]}, {"n": "Voting", "t": [19, 20, 21, 22]}, {"n": "Coarse-graining & entropy", "t": [23, 24, 25, 26]}], "t": [{"t": "“Cooking never gets old”", "p": "Cooking stays interesting forever, because there's always another technique or ingredient.", "k": [{"q": "○  serious", "f": "Most home cooking is a small rotation of dishes. The endless-novelty part is a hobby on top of the feeding."}, {"q": "◐  bait", "f": "Food is fuel, and fuel doesn't need technique. Anything past making it hot is entertainment."}, {"q": "●  rage bait", "f": "Cooking is following instructions. If you can read, you can cook."}]}, {"t": "“Thighs are the best part”", "p": "Chicken thighs are the best part of the bird.", "k": [{"q": "○  serious", "f": "Thighs are forgiving, and that's a different thing from better. A well-cooked breast is a harder target."}, {"q": "◐  bait", "f": "Breast is the most expensive cut, and price tracks quality. That means breast is the best cut and thigh people are saving money."}, {"q": "●  rage bait", "f": "Chicken thighs are for people who can't cook breast properly."}]}, {"t": "“Cast iron earns its place”", "p": "Cast iron earns its place in the kitchen.", "k": [{"q": "○  serious", "f": "It holds heat well and conducts it poorly, so on most home burners it has hot spots that clad pans don't."}, {"q": "◐  bait", "f": "Restaurants cook better than anyone, and restaurants use stainless and aluminum. That means cast iron is what people use when they don't know."}, {"q": "●  rage bait", "f": "Cast iron is overrated."}]}, {"t": "“Dried beans are worth it”", "p": "Dried beans, cooked properly, are worth the effort over canned.", "k": [{"q": "○  serious", "f": "In blind tastings for soups and chili, most people can't tell canned from dried."}, {"q": "◐  bait", "f": "A bean is a bean. The can is just where it waits. So there's no difference, and the people who say there is are tasting the effort."}, {"q": "●  rage bait", "f": "Canned beans are the same as dried. A bean doesn't know how long it soaked."}]}, {"t": "“Season precisely”", "p": "Seasoning should be precise: the right paprika, the right mustard, no sugar where it doesn't belong.", "k": [{"q": "○  serious", "f": "A little sugar in an acidic sauce is ordinary balancing, and most ground spices in home kitchens are too old to be precise about."}, {"q": "◐  bait", "f": "Sugar makes things taste better. That's why it's in everything people like. So a sauce without it is a sauce that's been made worse on principle."}, {"q": "●  rage bait", "f": "Sugar goes in tomato sauce. Italians do it and don't tell Americans."}]}, {"t": "“Use the smarter model”", "p": "If the smarter model is much smarter, saving tokens on a worse one is a false economy.", "k": [{"q": "○  serious", "f": "For bulk, checkable work like OCR passes, a cheap model with verification often gets the same result for far less."}, {"q": "◐  bait", "f": "The cheap model gets 90% right. 90% is an A. So paying more is paying for a grade you already have."}, {"q": "●  rage bait", "f": "DeepSeek does 90% of it for 5% of the price."}]}, {"t": "“Burn tokens faster, profit sooner”", "p": "If tokens produce net value, burning through them faster just gets you the return sooner.", "k": [{"q": "○  serious", "f": "That holds only if value per token is constant. In practice returns fall as you throw more tokens at a task."}, {"q": "◐  bait", "f": "Spending is the opposite of saving, and saving is how people get rich. So the more tokens you burn, the poorer you are. It isn't complicated."}, {"q": "●  rage bait", "f": "Vibe coding is paying per word to be confused."}]}, {"t": "“Have models check each other”", "p": "Running several passes, with models checking each other's errors, gets the job done.", "k": [{"q": "○  serious", "f": "Models tend to share failure modes, so cross-checking catches fewer errors than independent review would."}, {"q": "◐  bait", "f": "If a model could find the errors, it wouldn't have made them. So a checking pass can't find anything, and it bills you to say so."}, {"q": "●  rage bait", "f": "Subagents are one model in different hats."}]}, {"t": "“Know which model to use where”", "p": "Different models get different things wrong, so it's worth knowing which to use where.", "k": [{"q": "○  serious", "f": "The differences move with every release, so that knowledge has a short shelf life."}, {"q": "◐  bait", "f": "They're all trained on the same data with the same method. Same in, same out. So they get the same things wrong and the differences are in your head."}, {"q": "●  rage bait", "f": "Nobody can tell the models apart blind."}]}, {"t": "“The boxes are set, take both”", "p": "Once you're in the room the boxes are set, so if you can choose at all you should take both.", "k": [{"q": "○  serious", "f": "The setup says the contents were fixed by a prediction of this very choice. Treating them as independent drops the one fact that defines the problem."}, {"q": "◐  bait", "f": "If you're so rational, why aren't you rich? One-boxers walk out with a million every time, and that means their reasoning is correct, because being correct is what getting the money is."}, {"q": "●  rage bait", "f": "Two-boxing is cope."}]}, {"t": "“One-boxing needs magic”", "p": "Thinking that leaving a box can get you more money means believing in something physically impossible.", "k": [{"q": "○  serious", "f": "No backward causation is needed. Your disposition caused both the prediction and the choice. That's a common cause."}, {"q": "◐  bait", "f": "The predictor is never wrong. So whatever you pick, it picked first. That means your choice does set the contents, and physics will have to deal with it."}, {"q": "●  rage bait", "f": "The predictor knew you'd say \"but physics\" and left the box empty."}]}, {"t": "“'Better to be a one-boxer' just means richer”", "p": "\"It's better to be a one-boxer\" only means it's better to end up with more money.", "k": [{"q": "○  serious", "f": "If one policy reliably ends with more money, that's close to what \"better choice\" means in a decision problem."}, {"q": "◐  bait", "f": "Rational means doing what gets the most. One-boxers get the most. So two-boxing is irrational by definition, and the definition isn't up for debate."}, {"q": "●  rage bait", "f": "Two-boxers get a thousand dollars and a proof lmao."}]}, {"t": "“You couldn't take both anyway”", "p": "A one-boxer in the room with a full box couldn't take both anyway. What you'd do is already settled.", "k": [{"q": "○  serious", "f": "If what you'll do is settled by what you're like, then being a one-boxer is the thing to be. That's the one-boxer's point."}, {"q": "◐  bait", "f": "If it's all determined then nobody chooses anything, and the problem is fake. And if the problem is fake you may as well have the million."}, {"q": "●  rage bait", "f": "You are not the one guy who beats the predictor."}]}, {"t": "“Newcomb isn't a real decision problem”", "p": "Maybe it isn't a real decision problem at all. Some decision theorists gave up on it.", "k": [{"q": "○  serious", "f": "Calling it ill-formed is an option, but real cases with good predictors of behavior exist and still need an answer."}, {"q": "◐  bait", "f": "A problem you can't answer isn't a problem, it's a trick. Tricks don't have right answers, so everyone's answer is as good as anyone's, including one-boxing."}, {"q": "●  rage bait", "f": "Imagine leaving a million dollars in a box to win an argument."}]}, {"t": "“Ptychography beats the diffraction limit”", "p": "Diffraction sets real limits, and techniques like Fourier ptychography are clever ways around what a lens alone can do.", "k": [{"q": "○  serious", "f": "Computational methods recover resolution by adding assumptions about the sample, and the result is only as good as those assumptions."}, {"q": "◐  bait", "f": "A picture the computer worked out isn't a picture, it's a drawing. So super-resolution is the microscope making things up, and the limit is still the limit."}, {"q": "●  rage bait", "f": "Diffraction limits are a suggestion. Software fixes that now."}]}, {"t": "“Read the old optics papers”", "p": "Oblique illumination and the old optics papers still have things to teach.", "k": [{"q": "○  serious", "f": "Most of what's in the classic papers is built into modern instruments, so reading them is closer to history than technique."}, {"q": "◐  bait", "f": "Science moves forward, so the newest paper contains all the old ones. That means anything from before 2010 is already inside something better."}, {"q": "●  rage bait", "f": "Reading old optics papers is churning your own butter."}]}, {"t": "“Microscopes and telescopes, same problem”", "p": "Microscopy and astronomy are the same problem at different scales.", "k": [{"q": "○  serious", "f": "The maths overlaps. The practical problems, like sample preparation against atmosphere, are very different."}, {"q": "◐  bait", "f": "One is looking at big things far away and the other at small things up close. Those are opposites. So nothing about one applies to the other."}, {"q": "●  rage bait", "f": "A microscope is just a small telescope pointed down."}]}, {"t": "“Mineral optics matter”", "p": "Mineral optics is worth caring about: pleochroism and the rest.", "k": [{"q": "○  serious", "f": "It's real physics, and for most collectors the interest is closer to connoisseurship than to science."}, {"q": "◐  bait", "f": "A mineral is valuable if it's rare and pretty. What it does to polarized light isn't on the price tag, so it doesn't matter."}, {"q": "●  rage bait", "f": "Minerals are rocks with a price tag."}]}, {"t": "“Glass over specs”", "p": "Good glass and real aperture matter more than specs on a box.", "k": [{"q": "○  serious", "f": "For most images at viewing size, sensor and processing differences swamp the lens differences people pay for."}, {"q": "◐  bait", "f": "A photo is made of pixels, and more pixels is more photo. Lenses don't have pixels. So the lens isn't the part that counts."}, {"q": "●  rage bait", "f": "Megapixels are all that matter."}]}, {"t": "“No single vote decides it”", "p": "No single vote decides an election, and that isn't the right way to think about what voting is.", "k": [{"q": "○  serious", "f": "If your vote has no causal effect on the result, the instrumental case for casting it is gone, and something else has to carry it."}, {"q": "◐  bait", "f": "The winner is whoever gets the most votes. Votes are made of single votes. So every single vote decides the election, and yours did last time."}, {"q": "●  rage bait", "f": "Imagine thinking your vote doesn't count. Every election comes down to one vote."}]}, {"t": "“Voting is just counting”", "p": "Casting and counting is just how a collective decision gets made concrete. Asking what your one vote \"contributes\" misses that.", "k": [{"q": "○  serious", "f": "Describing the mechanism doesn't answer the individual's question of why to take part."}, {"q": "◐  bait", "f": "A collective is just a lot of individuals. If no individual matters, the collective doesn't either, because zero times a million is zero."}, {"q": "●  rage bait", "f": "Voting is a survey with stickers."}]}, {"t": "“It's a threshold, not a sum”", "p": "The outcome is a threshold state. It isn't a sum of contributions.", "k": [{"q": "○  serious", "f": "Thresholds get crossed by increments. Somebody's vote is the marginal one, even if nobody knows whose."}, {"q": "◐  bait", "f": "If it's a threshold then nothing counts until the last vote. That means everyone who voted before the last guy wasted their time, which is everyone."}, {"q": "●  rage bait", "f": "The only vote that counts is the last one, so vote late."}]}, {"t": "“Stop obsessing over causation”", "p": "People get hung up on the causation and miss the point of taking part.", "k": [{"q": "○  serious", "f": "The point of taking part is usually stated as expression or duty, and both are open to the question of why this form."}, {"q": "◐  bait", "f": "Doing something that changes nothing is a ritual. Rituals are religion. So voting is church for people who say they don't go."}, {"q": "●  rage bait", "f": "Democracy is two wolves and a sheep voting on dinner."}]}, {"t": "“Coarse-graining is principled”", "p": "Coarse-graining is physically principled. The macrostates aren't arbitrary.", "k": [{"q": "○  serious", "f": "Entropy depends on the choice of macrostates. If a different carving gives a different entropy, something in the quantity belongs to the describer."}, {"q": "◐  bait", "f": "You choose the macrostates, so you choose the entropy. A number you choose isn't a fact about the world. It's a setting."}, {"q": "●  rage bait", "f": "Coarse-graining is rounding. They gave rounding a name."}]}, {"t": "“Entropy isn't just disorder”", "p": "Entropy is more subtle than \"disorder.\"", "k": [{"q": "○  serious", "f": "The subtle version still depends on a low-entropy start that's put in by hand to get an arrow of time."}, {"q": "◐  bait", "f": "My room gets messier over time and never cleaner. That's entropy. That's all of it. The rest is physicists protecting their jobs."}, {"q": "●  rage bait", "f": "Entropy is just disorder. Messy room. That's the whole concept."}]}, {"t": "“Only realistic models count”", "p": "A model has to be physically realistic to count. Arbitrarily small or idealized cases don't settle anything.", "k": [{"q": "○  serious", "f": "Statistical mechanics is built on idealizations. Phase transitions strictly exist only at infinite size."}, {"q": "◐  bait", "f": "Physics is equations, and equations are exact. Real systems aren't exact. So the equations are right and reality is the approximation."}, {"q": "●  rage bait", "f": "\"In the thermodynamic limit\" means \"not here.\""}]}, {"t": "“Listen to Sean Carroll”", "p": "Sean Carroll is worth listening to on this.", "k": [{"q": "○  serious", "f": "His presentations of entropy and the arrow of time state a contested Past Hypothesis picture with more confidence than the field has."}, {"q": "◐  bait", "f": "Real physicists publish papers and don't talk to the public. He talks to the public. Draw the conclusion."}, {"q": "●  rage bait", "f": "Sean Carroll is a podcaster who used to do physics."}]}]}, {"n": "chair", "i": "@1chair", "u": [{"n": "AI as autocomplete", "t": [0, 1, 2, 3]}, {"n": "Hand-built websites", "t": [4, 5, 6]}, {"n": "Solar, Elon & space", "t": [7, 8, 9, 10]}], "t": [{"t": "“AI is fancy autocomplete”", "p": "AI is fancy autocomplete and task automation. The conceptual work is yours.", "k": [{"q": "○  serious", "f": "The line between conceptual work and automation has moved every year, and always in the same direction."}, {"q": "◐  bait", "f": "If it's autocomplete, it can't do anything new. It writes code that's never been written. So it isn't autocomplete, or autocomplete is smarter than people thought."}, {"q": "●  rage bait", "f": "Claude is mid."}]}, {"t": "“AI can't be compared to us”", "p": "AI is limited by what it is and what it was trained on. It can't be compared to how humans experience the world.", "k": [{"q": "○  serious", "f": "Humans are limited by what they are and what they've been exposed to as well. The comparison is about what gets done."}, {"q": "◐  bait", "f": "It learned from human writing, and human writing is about human experience. So it has all of human experience, and more of it than any one human."}, {"q": "●  rage bait", "f": "AI is a tool. Tools don't deserve respect. Nobody thanks a hammer."}]}, {"t": "“Have it assemble templates”", "p": "The right way to use it is to give it templates and have it assemble them, not have it write from scratch.", "k": [{"q": "○  serious", "f": "That's safe and it leaves out most of what the models are good at."}, {"q": "◐  bait", "f": "If a model can only be trusted with templates, it can't be trusted. So this is an argument for not using it."}, {"q": "●  rage bait", "f": "SaaS is dead. Every app is a prompt now."}]}, {"t": "“A smaller model is enough”", "p": "A smaller model is enough for most of what people do.", "k": [{"q": "○  serious", "f": "For routine work, yes. The hard cases are where the bigger model earns its cost, and you don't know in advance which case you have."}, {"q": "◐  bait", "f": "The best model is the best. Using a worse one on purpose is choosing to be wrong more often to save a dollar."}, {"q": "●  rage bait", "f": "Opus is just Sonnet with a longer wait."}]}, {"t": "“Plain HTML is underrated”", "p": "Plain HTML and simple tools are underrated.", "k": [{"q": "○  serious", "f": "They're durable and fast. They're also slow to build with and hard to maintain past a few pages."}, {"q": "◐  bait", "f": "Frameworks exist because plain HTML didn't scale. If it had, nobody would have built them."}, {"q": "●  rage bait", "f": "React is the only frontend framework and the rest are hobbies."}]}, {"t": "“PDFs are a mess”", "p": "PDFs are still a mess to work with.", "k": [{"q": "○  serious", "f": "The format does its one job, fixed layout anywhere, extremely well. The mess is people using it for everything else."}, {"q": "◐  bait", "f": "A PDF opens the same on every computer made since 1993. Nothing else in computing can say that. So it's the only thing that isn't a mess."}, {"q": "●  rage bait", "f": "PDFs are a solved problem."}]}, {"t": "“Cloud subscriptions are a racket”", "p": "Paying for cloud versions of creative tools is a racket.", "k": [{"q": "○  serious", "f": "Subscriptions are irritating, and they also pay for updates that one-off licences never did."}, {"q": "◐  bait", "f": "Software costs money to make. If you don't pay for it, someone else does, and then they decide what it does."}, {"q": "●  rage bait", "f": "Websites should be made by hand."}]}, {"t": "“Solar is the path”", "p": "Solar is the real path forward.", "k": [{"q": "○  serious", "f": "Solar is intermittent, and firming it with storage adds costs the headline prices leave out."}, {"q": "◐  bait", "f": "The sun goes down every day. A power source that turns off every day isn't a power source, it's a schedule."}, {"q": "●  rage bait", "f": "Solar doesn't work. Night exists."}]}, {"t": "“Track the carbon”", "p": "Carbon is the thing to track.", "k": [{"q": "○  serious", "f": "It's the main thing. Panels built on coal-heavy supply chains show the accounting has to cover manufacturing too."}, {"q": "◐  bait", "f": "Carbon is what plants eat. More carbon, more plants. So the tracking is measuring plant food."}, {"q": "●  rage bait", "f": "Chinese solar panels aren't the green transition. They're coal with a boat."}]}, {"t": "“Starlink matters more than you think”", "p": "Starlink and the satellite build-out matter more than people realise.", "k": [{"q": "○  serious", "f": "It's a real network, and it also puts critical infrastructure under one company's control."}, {"q": "◐  bait", "f": "Space is empty. Putting things in empty space can't matter to anyone on the ground."}, {"q": "●  rage bait", "f": "Space is a waste of money. Fix here first."}]}, {"t": "“The rockets are real”", "p": "Elon's engineering record is mixed, but the rockets are real.", "k": [{"q": "○  serious", "f": "The rockets are thousands of engineers and a lot of public contracts. One name on it hides both."}, {"q": "◐  bait", "f": "He owns the company that built the rocket. Owning is not building. Nobody says the landlord built the house."}, {"q": "●  rage bait", "f": "Elon is a great engineer the way a landlord is a great builder."}]}]}, {"n": "Charlie", "i": "@seinzumtode", "u": [{"n": "Training & agent workflows", "t": [0, 1, 2, 3, 4]}, {"n": "Spinoza & Deleuze", "t": [5, 6, 7, 8, 9]}, {"n": "Kant", "t": [10, 11, 12, 13]}, {"n": "The red & blue button", "t": [14, 15, 16, 17]}], "t": [{"t": "“Stack your agents”", "p": "You need layers of agents: reviewers, judges, verifiers, implementers. One orchestrator is too narrow.", "k": [{"q": "○  serious", "f": "Each layer adds cost and a new place to fail, and reviewers built on the same model share the implementer's blind spots."}, {"q": "◐  bait", "f": "One model is as smart as it is. Asking it twice doesn't make it smarter, any more than asking the same guy twice does. So ten agents know exactly what one agent knows."}, {"q": "●  rage bait", "f": "Agent orchestration is middle management for robots."}]}, {"t": "“More agents, more output”", "p": "The payoff of workflows is the sheer number of agents you can deploy at once.", "k": [{"q": "○  serious", "f": "Parallelism helps on work that splits cleanly. Most real tasks have dependencies that make more agents step on each other."}, {"q": "◐  bait", "f": "More workers means more work done. That's true of ditches, so it's true of thinking. Whoever runs the most agents is right the most."}, {"q": "●  rage bait", "f": "An agent swarm is a for-loop with a pitch deck."}]}, {"t": "“Local minima are fine”", "p": "You don't need the global minimum. Some local minimum is nearly always as good, and the global one is often just memorization.", "k": [{"q": "○  serious", "f": "That's the usual finding for large overparameterized models. It's less clear that it holds for small models trained locally on little data."}, {"q": "◐  bait", "f": "Minimum means lowest, and global means the lowest of all. The lowest loss is the best model. So anything else is settling, and settling is how you get a worse model."}, {"q": "●  rage bait", "f": "Training is just pressing run and waiting."}]}, {"t": "“Train locally”", "p": "Training locally on your own hardware is the way to do it.", "k": [{"q": "○  serious", "f": "For most tasks the hosted frontier models are well ahead, and the gap is large enough to matter in practice."}, {"q": "◐  bait", "f": "The big labs have a million times the compute. A million times the compute gives a million times the model. So whatever runs under a desk is a rounding error."}, {"q": "●  rage bait", "f": "Local models are for people who want to say they run local models."}]}, {"t": "“Intelligence doesn't need a host”", "p": "It's a virtual intelligence. Intelligence doesn't belong to whatever hosts it.", "k": [{"q": "○  serious", "f": "Detaching intelligence from any mind makes it hard to say what would count as its presence or absence."}, {"q": "◐  bait", "f": "Intelligence is something a person has, like height. No person, no intelligence. So \"virtual intelligence\" means no intelligence, said nicely."}, {"q": "●  rage bait", "f": "Fancy autocomplete can't \"know\" anything. Next."}]}, {"t": "“Substance is necessary, not caused”", "p": "For substance, \"necessity\" is the better word than \"cause.\" It always was, is and will be.", "k": [{"q": "○  serious", "f": "If causa sui just means necessary existence, that's the ontological argument's move, and it has the same weakness."}, {"q": "◐  bait", "f": "You can't define something into existing. If you could, I'd define myself a necessary yacht. So substance is a definition and nothing more."}, {"q": "●  rage bait", "f": "Spinoza is just atheism with extra steps."}]}, {"t": "“Each attribute is the whole essence”", "p": "Each attribute expresses the whole essence of substance, fully and adequately.", "k": [{"q": "○  serious", "f": "If thought and extension each express the whole essence and share nothing, it's hard to see how they're attributes of one thing."}, {"q": "◐  bait", "f": "If mind and body are the same thing, then thinking about lunch should feed you. It doesn't. So they're two things and the Ethics is wrong on page one."}, {"q": "●  rage bait", "f": "The Ethics is laid out like geometry because he couldn't write."}]}, {"t": "“Parallel accounts, none reducible”", "p": "Any given thing can be fully accounted for in several parallel ways that never reduce to each other.", "k": [{"q": "○  serious", "f": "Parallelism names the correlation between the orders without explaining why it's perfect."}, {"q": "◐  bait", "f": "If two explanations of one thing never touch, one of them is extra. Science picks the physical one, so the other is decoration."}, {"q": "●  rage bait", "f": "Parallelism is \"it's a coincidence, necessarily.\""}]}, {"t": "“Difference in itself, not white wholeness”", "p": "The stake in Deleuze is difference in itself against an undifferentiated white whole. Philosophy keeps collapsing into the second.", "k": [{"q": "○  serious", "f": "Critics like Badiou argue Deleuze ends up there himself. Univocal being is a One, whatever it's called."}, {"q": "◐  bait", "f": "To be different, things have to be different from each other. That needs things first. So identity comes first, and the whole project starts from the wrong end."}, {"q": "●  rage bait", "f": "Deleuze is retarded."}]}, {"t": "“Deleuze beat Hegel”", "p": "Deleuze's critique of Hegel stands, even if he owed Hegel more credit in places.", "k": [{"q": "○  serious", "f": "Deleuze's Hegel is a caricature of mediation, and Hegel's account of difference is richer than the polemic allows."}, {"q": "◐  bait", "f": "Hegel already said everything turns into its opposite. That includes Hegel's critics. So Deleuze is a moment in Hegel, and Hegel wins without getting up."}, {"q": "●  rage bait", "f": "Hegel was right about everything."}]}, {"t": "“Kant couldn't bridge the gap”", "p": "Kant couldn't bridge the gap between saying what's behind the given is unknowable and saying it gives us the given.", "k": [{"q": "○  serious", "f": "The two-aspect reading eases this. On that reading the thing in itself isn't a second object causing appearances."}, {"q": "◐  bait", "f": "Kant says we can't know things in themselves. Then he tells us they exist and cause our experience. That's knowing two things about them. So he refutes himself in the preface."}, {"q": "●  rage bait", "f": "Kant is overrated."}]}, {"t": "“Maimon caught Kant backwards”", "p": "Kant got it backwards by putting logical possibility at the base of real possibility. Maimon showed that.", "k": [{"q": "○  serious", "f": "Kant distinguishes logical from real possibility for exactly that reason. The Postulates don't derive one from the other."}, {"q": "◐  bait", "f": "If Maimon had refuted Kant, we'd all be reading Maimon. Nobody reads Maimon. History did the peer review."}, {"q": "●  rage bait", "f": "Maimon is a footnote for a reason."}]}, {"t": "“Kant on space is great”", "p": "Kant's argument against relational theories of space is a really good one.", "k": [{"q": "○  serious", "f": "The argument from incongruent counterparts has relationalist replies, and modern physics doesn't treat space the way Kant needs."}, {"q": "◐  bait", "f": "Einstein showed space is curved. Kant said it's flat and in your head. One of them built GPS."}, {"q": "●  rage bait", "f": "Kant never left town and it shows."}]}, {"t": "“Separate words from senses”", "p": "We should separate words from senses carefully, where Kant left things ignorant.", "k": [{"q": "○  serious", "f": "Kant's account of concepts and schemata is an attempt at just that. Whether it works is another matter."}, {"q": "◐  bait", "f": "A word means what it means. If you need to separate the word from its sense, you've picked the wrong word. That's a vocabulary problem."}, {"q": "●  rage bait", "f": "The Critique is long because he didn't know what he meant."}]}, {"t": "“Red is rational”", "p": "Red is the rational press: you live whatever anyone else does.", "k": [{"q": "○  serious", "f": "Red guarantees your survival by leaving everyone who pressed blue to carry the risk."}, {"q": "◐  bait", "f": "A choice is right if it would be fine for everyone to make it. If everyone picks blue, nobody dies. So blue is right, and red is what you pick when you've stopped thinking about anyone."}, {"q": "●  rage bait", "f": "Blue button is the only moral choice."}]}, {"t": "“Blue pressers are virtue signalling with their lives”", "p": "Blue pressers are betting their lives to feel like good people.", "k": [{"q": "○  serious", "f": "Polls of the dilemma keep returning a blue majority, so the bet has good odds."}, {"q": "◐  bait", "f": "Most people are good, and good people press blue. So blue always wins, so pressing blue is the safe one. Red pressers have the risk backwards."}, {"q": "●  rage bait", "f": "Red is the coward's button."}]}, {"t": "“If blue dies, that's on them”", "p": "Nobody is owed your risk. If blue pressers die, they chose that.", "k": [{"q": "○  serious", "f": "Some will press blue by mistake or from trust. A red vote helps decide what happens to them."}, {"q": "◐  bait", "f": "Someone's kid is going to press blue because it's a nice color. Red pressers have decided that's the kid's problem."}, {"q": "●  rage bait", "f": "Imagine letting a toddler die to win a logic puzzle."}]}, {"t": "“Blue's moralizing is the tell”", "p": "The moralizing from the blue side is the tell.", "k": [{"q": "○  serious", "f": "Being annoying doesn't make an argument wrong. The coordination case for blue stands by itself."}, {"q": "◐  bait", "f": "People only moralize when they're right. If they were wrong they'd have to argue. So the lecturing is evidence for blue."}, {"q": "●  rage bait", "f": "The button debate is the best philosophy this chat has done, and blue won it."}]}]}, {"n": "dot", "i": "@terrapin.station.", "u": [{"n": "Literature", "t": [0, 1, 2, 3, 4]}, {"n": "Deleuze", "t": [5, 6, 7, 8]}, {"n": "Ethics", "t": [9, 10, 11, 12, 13]}, {"n": "Capitalism, UBI & left-accelerationism", "t": [14, 15, 16, 17]}, {"n": "Guitar & music", "t": [18, 19, 20, 21]}], "t": [{"t": "“If Lot 49 bored you, you didn't get it”", "p": "If The Crying of Lot 49 bored you, you didn't get it.", "k": [{"q": "○  serious", "f": "A book can be understood and still judged thin. The withheld-plot device carries a lot of what gets called depth."}, {"q": "◐  bait", "f": "A good book is one people enjoy reading. People don't enjoy this one. They enjoy having read it, and that's a different product."}, {"q": "●  rage bait", "f": "Pynchon is unreadable."}]}, {"t": "“Pynchon has the best sentences”", "p": "Some passages in Pynchon are among the best writing there is.", "k": [{"q": "○  serious", "f": "The sentences are extraordinary. The characters they're attached to are thin by design, and that limits what the prose can carry."}, {"q": "◐  bait", "f": "Writing is for telling a s
