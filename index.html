 for maths unless you want to do research.", "b": "AI only matters for maths research", "l": ["If research is the part it changes, then the reason for the degree changes too, since the degree was preparation for research.", "It only affects the thing the training is for.", "Fine for everyone who wasn't going to use the maths.", "A degree is doing exercises. AI does the exercises. So AI can do the degree, and the only thing left is the bit you said it affects.", "AI can't do real math. It can do homework."]}]}, {"t": "University", "n": 106, "k": [{"p": "Most university coursework is slop. The real learning is what you teach yourself.", "b": "Uni is slop, teach yourself", "l": ["Self-teaching follows interest. Coursework is the part that makes you learn what you wouldn't have picked.", "The slop is the stuff you didn't want to know and needed.", "Self-taught people have deep knowledge with holes exactly where the boring courses were.", "If the courses were useless, employers wouldn't ask for the degree. They ask for the degree. So the courses are the part that counts and the self-teaching is a hobby.", "College should be job training. Nobody needs a poem to get hired."]}, {"p": "Doing nothing all term and studying for a month before exams works fine.", "b": "Cram the last month, it works", "l": ["It works for passing. What's kept six months later is much lower with cramming.", "Works on the exam, gone by summer.", "The grade stays and the knowledge doesn't.", "If you can learn it in a month, it's a month of material. So the other three months of the semester are padding, and the fees are for the padding.", "Oral exams are vibes with a grade."]}, {"p": "Knowing the material from your own reading beats how the course presents it.", "b": "My own reading beats the course", "l": ["Self-study rarely includes being tested by someone who knows where you're fooling yourself.", "Nobody marks your reading.", "\"I already know this\" is the most common last thought before a bad exam.", "A professor has studied it for thirty years and you've read a book. Thirty years is more than a book. So the course version is the better one.", "College is a scam. Everything's on YouTube."]}, {"p": "A physics degree is a serious thing to be doing.", "b": "A physics degree is serious", "l": ["It's serious, and most graduates end up in software or finance using little of it.", "Four years of physics to write Python at a bank.", "A serious degree, mostly used as proof you could do one.", "The point of a degree is a job. Most physics graduates don't get physics jobs. So it's a degree in something else with harder homework.", "Physics majors are philosophy majors with job prospects."]}]}, {"t": "Quantum interpretations", "n": 63, "k": [{"p": "Many-worlds owes an account of how the classical-looking state you observe comes out of the universal wavefunction.", "b": "Many-worlds can't get you the classical state", "l": ["Decoherence supplies much of that. Branches become effectively independent very fast, even though the split is never exact.", "Decoherence is the answer, and it's been in the literature for forty years.", "Everettians do have a story. It's just an approximate one.", "The equation gives you everything happening at once. We see one thing. So either the equation's wrong or there's a lot of things we don't see, and the equation's never been wrong.", "Many worlds is correct."]}, {"p": "When does a superposition count as different worlds, and what is it before that? Many-worlds doesn't say cleanly.", "b": "When is it a world?", "l": ["\"World\" is an emergent, approximate notion, like \"storm.\" Vague boundaries don't make it unreal.", "Nobody can say exactly when weather becomes a hurricane.", "Worlds are fuzzy the way everything above the particle level is fuzzy.", "If you can't say how many worlds there are, there aren't any. Things that exist come in a number.", "Many worlds is nonsense. One world. Look around."]}, {"p": "The way working physicists and professors actually make sense of experiments is the standard picture.", "b": "Physicists know what they're doing", "l": ["The standard picture puts off the question of what a measurement is, and that's the question interpretations are for.", "\"It works in the lab\" is common ground. The dispute starts after that.", "Shut up and calculate is a policy.", "Physicists use it and it works. If it works, it's right. Asking what it means is for people who can't do the calculation.", "The measurement problem isn't a problem. You measure, you get a number."]}, {"p": "Bohmian mechanics deserves more respect than it gets.", "b": "Bohm deserves respect", "l": ["It reproduces the predictions and needs a preferred frame, which fits badly with relativity.", "You get particles back and pay for them in relativity.", "Empirically equivalent, with an extra field nobody can detect.", "If it makes the same predictions as the normal theory, it's the normal theory with more parts. More parts for the same result is called worse.", "Bohmian mechanics is classical physics that won't take the hint."]}]}, {"t": "Spacetime", "n": 63, "k": [{"p": "Spacetime exists. Our best theories quantify over it as a mathematical object, and that's reason to be a substantivalist.", "b": "Spacetime is real", "l": ["The hole argument suggests that taking the points as real brings differences no observation could ever reveal.", "Substantivalism buys you differences that make no difference.", "The theory mentions points. It also mentions coordinates, and nobody thinks those are real.", "Everything we measure is a thing at a distance from another thing. Nobody has measured the space by itself. So space is the gaps, and gaps aren't objects.", "Spacetime is just a coordinate system. It's bookkeeping."]}, {"p": "Spacetime is neither matter nor energy, and it's still real.", "b": "Spacetime isn't matter or energy, still real", "l": ["In general relativity the metric carries energy and has its own dynamics, which makes it look like one more field.", "The metric gravitates. That's behaving a lot like stuff.", "Neither matter nor energy, and it can ripple.", "If it isn't matter and it isn't energy, it isn't anything. Those are the two things there are.", "Space is fake and time is on its way out."]}, {"p": "Some of the geometric concepts in our best theories are hard to make sense of without a background spacetime.", "b": "You need a background spacetime", "l": ["Quantum gravity programmes mostly expect spacetime to be emergent, so being hard to picture without it may be a limit of ours.", "Hard to imagine otherwise isn't an argument about what's fundamental.", "It was hard to do without absolute simultaneity too.", "Physicists say spacetime is doomed and they're the ones who'd know. So building a philosophy on it is building on something with a closing date.", "Physics is stuck."]}, {"p": "Spacetime points are the real elements. Coordinates are only labels for them.", "b": "Points are real, coordinates are labels", "l": ["Diffeomorphism invariance suggests point identity does no physical work. The content is in the relations.", "Coordinates are labels, and so is which point is which.", "Points are gauge.", "If you can relabel every point and the physics doesn't change, the points weren't doing anything. So they're labels too, and it's labels all the way down.", "Laws of nature are just summaries. The universe doesn't obey anything."]}]}]}, {"n": "Zone", "u": "zone8383", "m": 4496, "t": [{"t": "Existence & mind-independence", "n": 460, "k": [{"p": "\"Exists\" can't mean \"mind-independent.\" The mind exists, and it isn't independent of itself.", "b": "'Exists' can't mean mind-independent", "l": ["Realists usually mean independent of anyone's beliefs about it. On that reading the mind qualifies fine.", "\"Mind-independent\" means it doesn't depend on what you think of it. Your mind passes.", "That's a problem for a definition nobody uses.", "The mind is in the brain, and the brain is there whether you think about it or not. So the mind is mind-independent, and the puzzle was a pun.", "Consciousness creates reality. Physics says so now."]}, {"p": "Definitions aren't existence. Failing to define a thing precisely doesn't show the thing isn't there.", "b": "No definition doesn't mean it isn't there", "l": ["If nothing can be said about what marks the thing off, the claim that it exists has very little content.", "You don't need a definition, but you need something.", "\"It exists, I just can't say what it is.\"", "If you can't say what a thing is, you don't know what you're claiming exists. So you're claiming nothing, confidently.", "Definitions are arbitrary. A word means whatever people decide."]}, {"p": "A view's logical consequences are part of what you've committed to, whether you noticed or not.", "b": "You're committed to the consequences", "l": ["People hold inconsistent beliefs all the time. Commitment by entailment describes an ideal reasoner.", "On that standard everyone is committed to everything, since everyone's beliefs contain a contradiction somewhere.", "Nobody believes all the consequences of what they believe.", "I can believe one thing and not the next thing. I do it daily. So beliefs don't come with their consequences attached, whatever logic says.", "Consistency is easy. Believe one thing. Being right is the hard part."]}, {"p": "There's a reality our claims answer to, and that's the starting point.", "b": "Reality is the starting point", "l": ["We never compare a belief with unconceptualized reality. We compare it with other beliefs and observations.", "You can't step outside your concepts to check them against the world.", "Nobody has seen reality. They've seen their seeing of it.", "Everyone sees the world through their own eyes. Eyes are different. So there are as many realities as people, and no starting point.", "Objectivity is impossible because everyone has a perspective."]}]}, {"t": "Concepts & meaning", "n": 263, "k": [{"p": "A concept has to have meaning before any epistemic evaluation of it can happen. Meaning comes first.", "b": "Meaning comes first", "l": ["Meaning and evaluation may arrive together. On use theories, grasping a concept is knowing how its application gets assessed.", "You learn what \"red\" means by being corrected about it.", "Meaning first, and where did the meaning come from?", "Babies learn words by pointing at things and being told yes or no. That's evaluation, from day one. So evaluation comes first and meaning is what's left.", "Meanings are in the head. Where else would they be."]}, {"p": "The idea of an assumption depends on a contrast with how the world is. Believing something doesn't make it so.", "b": "Believing doesn't make it so", "l": ["That contrast is what's in dispute. It can't also be the premise.", "\"There's belief and there's the world\" is the conclusion.", "Assuming the contrast between assumptions and the world.", "You only ever have beliefs. You never get the world without one. So the contrast is between a belief and another belief.", "Truth is whatever works. Correspondence is a picture people like."]}, {"p": "Hume's doubts about causation come from his theory of meaning. Reject that theory and the doubts go with it.", "b": "Fix Hume's meaning, fix causation", "l": ["The problem of induction can be stated without the copy principle. The gap between past and future cases is still there.", "Drop the theory of ideas and the argument comes back in a new coat.", "Hume without the theory of meaning is Goodman.", "Hume proved that one thing following another is all we ever see. He didn't need a theory for that. You can check by looking.", "Hume proved cause and effect isn't real. One thing after another."]}, {"p": "Something is credible if it's reliable. Experience is, so it doesn't need a further argument.", "b": "Experience is reliable enough", "l": ["Reliability can only be checked using experience, which is the circle the skeptic points at.", "Experience vouches for experience.", "We know it's reliable because it told us.", "Experience is all anyone has. If it needed backing up there'd be nothing to back it up with. So nothing's justified and everyone carries on anyway.", "Knowledge needs certainty, nothing's certain, so nobody knows anything."]}]}, {"t": "Identity & logic", "n": 247, "k": [{"p": "How a thing acts expresses what it is. Acting against its own identity would be a contradiction.", "b": "Acting against your identity is a contradiction", "l": ["That makes the principle true by definition. Whatever a thing does gets counted as its nature.", "If everything a thing does counts as its nature, the principle forbids nothing.", "A thing acts according to its nature, where its nature is how it acts.", "A is A. Fine. That's true of unicorns as well. So it tells you nothing about anything that exists.", "A is A tells you nothing. Unicorns are unicorns."]}, {"p": "That there will always be problems doesn't tell you how many to put up with. Aim for as few as possible.", "b": "Aim for the fewest problems", "l": ["\"As few as possible\" needs a way of counting and weighing problems, and that's where the disagreement is.", "Fewest problems, by whose count?", "Minimise problems. Now define problem.", "You can't count problems. They aren't objects. So \"fewest\" doesn't mean anything, and it's a sentence that sounds like a plan.", "\"Existence exists\" isn't an axiom, it's a stutter."]}, {"p": "You need axioms, fundamental truths. Not everything can be derived.", "b": "You need axioms", "l": ["Needing starting points doesn't show which ones. Calling them self-evident has gone wrong before.", "The same confidence that gave us the syllogism gave us natural places.", "Every system has axioms. The quarrel is over yours.", "An axiom is something you can't prove. Something you can't prove is something you just believe. So every system rests on faith, and that includes this one.", "Atheism is a faith position."]}, {"p": "Rand's critics rarely give concrete examples of what's wrong.", "b": "Rand's critics never give examples", "l": ["There are book-length critiques with page references, on her reading of Kant and on the move from life to egoism.", "The examples exist. They're in the books about it.", "\"Nobody's given examples\" is a reading problem.", "She said Kant was the most evil man in history. That's the example. Anyone who's read one page of Kant can take it from there.", "Rand never refuted Kant. She refuted the back cover."]}]}, {"t": "Truth as correspondence", "n": 166, "k": [{"p": "Correspondence separates what makes a claim true, which is reality, from why it's believed. Pragmatism collapses the two.", "b": "Correspondence separates truth from belief", "l": ["The distinction is clean. The trouble is saying what \"matching\" is without circularity.", "\"Matches reality\" is a metaphor until someone says what matching is.", "Correspondence explains truth by a relation it can't describe.", "A sentence is made of words and the world is made of stuff. Words don't look like stuff. So nothing matches, and the theory's been comparing apples to the word \"apples.\"", "Truth is cope."]}, {"p": "You can't run epistemic evaluation on every concept all the way down. Truth is one of the ones it stops at.", "b": "Truth is where evaluation stops", "l": ["Declaring a concept exempt from evaluation is what you'd expect from a view that couldn't pass it.", "\"This one's basic\" is available to every theory.", "Everything gets examined, apart from the foundation.", "If truth can't be examined, then nobody knows what it is. If nobody knows what it is, there's no theory of it. So correspondence isn't a theory, it's a refusal.", "An axiom is a claim with a bodyguard."]}, {"p": "You have to answer what truth is before committing to a theory. Otherwise you're reasoning with a bias.", "b": "Define truth first", "l": ["Any answer to \"what is truth\" is a theory of truth. There's no neutral place to answer from first.", "Answering the question is committing to a theory.", "The view from nowhere, as step one.", "You can't say what truth is without saying something true. So you need truth before you start. So the question can't be answered, and everyone should stop.", "Epistemology is easy. Believe true things."]}, {"p": "\"The earth is round\" is true because the statement matches how reality is.", "b": "The earth is round because it matches reality", "l": ["Negative and general truths are harder. It's unclear what \"there are no unicorns\" matches.", "What does \"the spoon isn't there\" correspond to? An absence?", "Works for round planets. Now do \"nothing is in the box.\"", "The earth isn't perfectly round. It's lumpy. So the sentence doesn't match, so it's false, and the theory's favourite example is a counterexample.", "The nonexistent spoon refutes correspondence and it isn't even there."]}]}]}, {"n": "Rudi", "u": "verclide", "m": 4715, "t": [{"t": "Moral rules & values", "n": 269, "k": [{"p": "Moral rules are more basic than moral beliefs. A rule classifies acts whether or not anyone believes it.", "b": "Rules come before beliefs", "l": ["A rule nobody accepts or enforces isn't operating in any sense. Rules live in practices, and practices need believers.", "A rule with no followers is a sentence.", "More basic than beliefs, and stored where?", "Rules are written by people. People write down what they believe. So the belief comes first and the rule is the minutes of the meeting.", "Deontology doesn't explain wrongness, it lists it."]}, {"p": "The evolutionary story explains why we have moral rules. You can't derive what's valuable from it.", "b": "Evolution can't tell you what's valuable", "l": ["If evolution explains why we hold our values, confidence that they track anything further needs separate support.", "The debunking argument starts exactly there.", "Explains the belief, leaves the truth to luck.", "If evolution explains why we think it, that's the whole explanation. Adding \"and it's also true\" is adding nothing.", "Moral values are tastes with a philosophy degree."]}, {"p": "You can't make sense of deviant moral cases without the normal ones.", "b": "You need the normal cases", "l": ["What counts as normal has moved a great deal. Yesterday's deviant case is today's standard one.", "The normal case is whichever won.", "\"Normal\" is doing the work \"correct\" used to do.", "Normal means what most people do. Most people used to own slaves. So normal can't be the guide, and the deviants were right.", "Morality is whatever the law says. Different country, different morality."]}, {"p": "People fight over values because they think they're right. It isn't that they've decided the values are irreconcilable.", "b": "People fight because they think they're right", "l": ["Both can hold. Each side thinks it's right and also knows no argument will move the other.", "They think they're right, and they've noticed that arguing doesn't work.", "Rorty's point survives that.", "Everyone thinks they're right. If everyone thinks so, it tells you nothing about who is. So it comes down to who wins.", "Rorty wasn't wrong, he was rude, and people can't tell the difference."]}]}, {"t": "Perception & representation", "n": 238, "k": [{"p": "Representations explain activities that track an objective, which can succeed or fail. Anti-realism about them isn't tenable.", "b": "Representations aren't optional", "l": ["Success and failure can be described in terms of the system's stimulation and feedback, with no appeal to objective content.", "A thermostat succeeds and fails too.", "Tracking doesn't need representation. A heat-seeking missile tracks.", "Everything an animal ever gets is a signal on a nerve. It never gets the object. So all it can represent is the signal.", "Perception is just reacting to sensory stimuli."]}, {"p": "The physical world causes perception. It doesn't give perception its content.", "b": "The world causes perception, not its content", "l": ["If the world only causes and never supplies content, something has to link content to what's out there, or you get a coherent story about nothing.", "The Given is a myth, and the alternative needs a tether.", "Caused by the world, and about it by courtesy.", "If the world doesn't give experience its content, the content comes from us. So we make up what we see, and Sellars was an idealist who didn't notice.", "Sellars is a behaviorist who learned to say \"inner episodes.\""]}, {"p": "Reducing coping to regulating sensory stimuli for the sake of desire is as reductive as the positivists.", "b": "'Coping' is positivism again", "l": ["Rorty's \"coping\" is wider than stimulus control. It covers redescription and social practice.", "That's a hostile summary of coping.", "Rorty isn't Skinner. That reading is someone in a hurry.", "All anyone ever does is react to what hits their senses. That's what a nervous system is. Calling it reductive doesn't make it false.", "Burge proved perception is objective by describing frogs."]}, {"p": "Worrying about your family can't just mean worrying about your own future sensory states.", "b": "Worrying about family isn't about my senses", "l": ["The stimulus-regulation account is a caricature, though the question of what the concern is about stays hard for everyone.", "Nobody holds the view being refuted there.", "A strong reply to a theory with no defenders.", "You only know your family through your senses. So worrying about them is worrying about what your senses will tell you. It sounds bad and it's still true.", "Life insurance is a bet you win by losing."]}]}, {"t": "Science & the observable", "n": 225, "k": [{"p": "There's no theory-neutral way to say what's observable in practice. That already depends on your theory.", "b": "Observability depends on theory", "l": ["Theory-ladenness is real, but there's wide agreement across rival theories about pointer readings and marks on plates.", "Rival theories agree on what the detector said.", "Theory-laden, and the needle still moved.", "If what counts as observable depends on the theory, then every theory gets to pick its own evidence. So no theory can ever lose.", "Kuhn showed science is just fashion."]}, {"p": "Philosophical debates share something with science: the theories change what counts as the data.", "b": "Theories change the data in philosophy too", "l": ["In science the instruments push back. In philosophy the \"data\" are intuitions, and those bend to the theory.", "Science has a lab. Philosophy has a seminar.", "The parallel holds apart from the experiments.", "Science changes its mind when the experiment fails. Philosophy has no experiments. So one of them is like science and the other is like talking.", "Science and metaphysics are the same thing at different confidence levels."]}, {"p": "Some effects aren't observable at all, being too distant or too energetic, and they still matter for a theory.", "b": "Unobservable effects still matter", "l": ["Claims no observation could bear on don't constrain theory choice. Their role is mainly keeping the mathematics consistent.", "If nothing could ever detect it, it's doing accounting.", "A posit that can't be tested is a parameter.", "If you can't observe it, you can't know it's there. If you can't know it's there, saying it's there is guessing.", "Metaphysics is what people do when they don't want to run the experiment."]}, {"p": "If no science could answer the question, it isn't a question about a brain process.", "b": "If science can't answer it, it isn't the brain", "l": ["What science can't answer today has a poor record as a guide to what it can't answer in principle.", "\"Science can't answer it\" has been said of life and of heat.", "Vitalism made the same argument.", "Everything in the head is a brain process. There's nothing else in there. So if it's about the mind, it's about the brain, and science will get to it.", "Philosophy of mind is finished because of neuroscience."]}]}, {"t": "Rorty, Putnam & Dewey", "n": 146, "k": [{"p": "Putnam's criticism of Rorty lands.", "b": "Putnam's critique lands", "l": ["Putnam moved through several positions himself, so the criticism comes from a moving target.", "Putnam refuted more Putnams than anyone else did.", "It lands, and then Putnam moved.", "Putnam spent thirty years almost agreeing with Rorty and backing out. If you nearly agree for thirty years, you agree.", "Rorty was right. Putnam spent thirty years almost agreeing and backing out."]}, {"p": "Rorty's engagement with Dewey is thin: a name and some footnotes.", "b": "Rorty's Dewey is footnotes", "l": ["Rorty said he was using Dewey for his own ends. Thin as scholarship isn't thin as philosophy.", "He never claimed to be a Dewey scholar.", "Dewey scholars are cross that Rorty made Dewey interesting.", "Nobody was reading Dewey in 1975. Rorty mentioned him and now there are conferences. So Rorty did more for Dewey than the experts.", "Nobody would read Dewey if Rorty hadn't lied about him."]}, {"p": "It's unclear what the Pragmatic Maxim actually rules out in metaphysics.", "b": "The Pragmatic Maxim rules out nothing", "l": ["Peirce used it to dismiss transubstantiation and keep realism about laws, so it does some work.", "It rules out differences that make no difference. That's a fair amount.", "It rules out whatever the pragmatist doesn't like that day.", "If a rule doesn't rule anything out, it isn't a rule. So pragmatism has no method, and the maxim is a motto.", "Pragmatism is retarded."]}, {"p": "Hume could be a skeptic in the study and not outside it. Pragmatism ignores that split.", "b": "Hume was a skeptic only at his desk", "l": ["Pragmatists deny the split on purpose. A doubt that can't affect conduct isn't a real doubt.", "Peirce's reply is that study-only doubt is pretend doubt.", "Skeptical until the door, then normal.", "If you only doubt it at your desk, you don't doubt it. So Hume wasn't a skeptic, he was a man with a hobby.", "Skepticism has never been answered, only outlived."]}]}]}, {"n": "chair", "u": "1chair", "m": 4389, "t": [{"t": "AI as autocomplete", "n": 133, "k": [{"p": "AI is fancy autocomplete and task automation. The conceptual work is yours.", "b": "AI is fancy autocomplete", "l": ["The line between conceptual work and automation has moved every year, and always in the same direction.", "\"It can't do the real thinking\" has had the same shelf life each time.", "The conceptual work, as defined by what it couldn't do last year.", "If it's autocomplete, it can't do anything new. It writes code that's never been written. So it isn't autocomplete, or autocomplete is smarter than people thought.", "Claude is mid."]}, {"p": "AI is limited by what it is and what it was trained on. It can't be compared to how humans experience the world.", "b": "AI can't be compared to us", "l": ["Humans are limited by what they are and what they've been exposed to as well. The comparison is about what gets done.", "Everyone's limited by their training data.", "Different from us doesn't mean worse at the task.", "It learned from human writing, and human writing is about human experience. So it has all of human experience, and more of it than any one human.", "AI is a tool. Tools don't deserve respect. Nobody thanks a hammer."]}, {"p": "The right way to use it is to give it templates and have it assemble them, not have it write from scratch.", "b": "Have it assemble templates", "l": ["That's safe and it leaves out most of what the models are good at.", "Using a model to fill in forms.", "A very expensive mail merge.", "If a model can only be trusted with templates, it can't be trusted. So this is an argument for not using it.", "SaaS is dead. Every app is a prompt now."]}, {"p": "A smaller model is enough for most of what people do.", "b": "A smaller model is enough", "l": ["For routine work, yes. The hard cases are where the bigger model earns its cost, and you don't know in advance which case you have.", "Enough, until it isn't, and you find out afterwards.", "The small model is fine for the tasks you already know are easy.", "The best model is the best. Using a worse one on purpose is choosing to be wrong more often to save a dollar.", "Opus is just Sonnet with a longer wait."]}]}, {"t": "Hand-built websites", "n": 55, "k": [{"p": "Plain HTML and simple tools are underrated.", "b": "Plain HTML is underrated", "l": ["They're durable and fast. They're also slow to build with and hard to maintain past a few pages.", "Great for five pages. Painful for fifty.", "Underrated by people who've never had to update the footer on two hundred files.", "Frameworks exist because plain HTML didn't scale. If it had, nobody would have built them.", "React is the only frontend framework and the rest are hobbies."]}, {"p": "PDFs are still a mess to work with.", "b": "PDFs are a mess", "l": ["The format does its one job, fixed layout anywhere, extremely well. The mess is people using it for everything else.", "PDF is fine. Using it as a database isn't.", "It's paper. It behaves like paper.", "A PDF opens the same on every computer made since 1993. Nothing else in computing can say that. So it's the only thing that isn't a mess.", "PDFs are a solved problem."]}, {"p": "Paying for cloud versions of creative tools is a racket.", "b": "Cloud subscriptions are a racket", "l": ["Subscriptions are irritating, and they also pay for updates that one-off licences never did.", "A racket, with a changelog.", "You used to pay once and keep the bugs.", "Software costs money to make. If you don't pay for it, someone else does, and then they decide what it does.", "Websites should be made by hand."]}]}, {"t": "Solar, Elon & space", "n": 48, "k": [{"p": "Solar is the real path forward.", "b": "Solar is the path", "l": ["Solar is intermittent, and firming it with storage adds costs the headline prices leave out.", "The panel is cheap. The night is expensive.", "Levelized cost stops counting at sunset.", "The sun goes down every day. A power source that turns off every day isn't a power source, it's a schedule.", "Solar doesn't work. Night exists."]}, {"p": "Carbon is the thing to track.", "b": "Track the carbon", "l": ["It's the main thing. Panels built on coal-heavy supply chains show the accounting has to cover manufacturing too.", "Clean to use, dirty to make.", "Counting carbon at the plug and not at the factory.", "Carbon is what plants eat. More carbon, more plants. So the tracking is measuring plant food.", "Chinese solar panels aren't the green transition. They're coal with a boat."]}, {"p": "Starlink and the satellite build-out matter more than people realise.", "b": "Starlink matters more than you think", "l": ["It's a real network, and it also puts critical infrastructure under one company's control.", "A global utility with one owner.", "The world's internet, subject to one man's mood.", "Space is empty. Putting things in empty space can't matter to anyone on the ground.", "Space is a waste of money. Fix here first."]}, {"p": "Elon's engineering record is mixed, but the rockets are real.", "b": "The rockets are real", "l": ["The rockets are thousands of engineers and a lot of public contracts. One name on it hides both.", "SpaceX is a great team with a famous owner.", "The rockets land because of people you've never heard of.", "He owns the company that built the rocket. Owning is not building. Nobody says the landlord built the house.", "Elon is a great engineer the way a landlord is a great builder."]}]}]}, {"n": "Puckspartan", "u": "puckspartan", "m": 3454, "t": [{"t": "ML & alignment", "n": 89, "k": [{"p": "Training doesn't involve metadata like a text's source unless that's set up as supervision.", "b": "No metadata without supervision", "l": ["Source cues are often in the text itself, as headers, URLs and style, so models can pick them up without labels.", "The source is usually written on the document.", "No labels needed when the page says where it's from.", "All training data was chosen by someone. Choosing is supervising. So everything is supervised, and the unsupervised part is marketing.", "All learning is supervised. Somebody picked the data."]}, {"p": "The real question isn't \"AI alignment.\" Development has always been manual work by people, and that's where the control is.", "b": "Alignment is just manual work", "l": ["The process is manual and the result isn't. Nobody hand-writes the weights or knows what most of them do.", "People run the training. Nobody writes the model.", "Manual, apart from the billions of parameters nobody chose.", "Code does what the code says. A model is code. So it does what it was built to do, and \"alignment\" is a word for bugs.", "AI alignment is fake. It does what the code says. Code doesn't have goals."]}, {"p": "AI could be better than a human at something like keeping trade secrets.", "b": "AI could keep secrets better", "l": ["A model can be prompted, probed and exfiltrated in ways an employee can't.", "You can't prompt-inject an accountant.", "The employee who can be copied to a USB stick.", "A person can be bribed and a machine can't. So the machine's better. Unless someone asks it nicely.", "Jailbreaking is a party trick. The model was never hiding anything good."]}, {"p": "Not every drop in learning outcomes is down to one cause.", "b": "Learning loss has more than one cause", "l": ["True, and \"it's multifactorial\" can also be a way of never naming the largest factor.", "Many causes, and one of them is usually bigger.", "\"It's complicated\" has never fixed a school.", "Scores went down when phones came in. That's when it happened. That's the cause.", "Public school is fine. Everyone who says otherwise learned to say it there."]}]}, {"t": "Utilitarianism, Rawls & Kant", "n": 62, "k": [{"p": "One act, like buying a single steak, changes nothing. You have to universalise to see why it matters.", "b": "One steak changes nothing, so universalize", "l": ["Once you universalise you've left act utilitarianism, and the rule has to be justified in some other way.", "That's Kant's move in a utilitarian's coat.", "Universalising is the bit utilitarians borrow.", "One steak changes nothing. A million people each buying one steak is a million things that change nothing. Zero times a million is zero.", "Rule utilitarianism isn't utilitarianism."]}, {"p": "Rawls is the better option because he's realistic. People are dummies, but systems don't have to be.", "b": "Rawls is realistic", "l": ["The parties behind the veil are highly idealised reasoners. It's realistic about institutions and far less so about people.", "Realistic about people, modelled by perfect reasoners.", "The veil of ignorance assumes everyone is clever and nervous.", "A system is made of people. If the people are dummies, the system is a lot of dummies with a flowchart.", "Rawls assumes everyone behind the veil is a coward."]}, {"p": "Kant's been dead two centuries and people are still doing bad metaphysics.", "b": "Kant's dead and metaphysics is still bad", "l": ["Kant's own project was limiting metaphysics. If it's still going, that's partly because his limits didn't hold.", "Kant tried to end it and started three new kinds.", "Two hundred years of metaphysics about how to stop doing metaphysics.", "Science replaced metaphysics in about 1700. Anyone still doing it is a historian who hasn't been told.", "Kant never met anyone, and it shows."]}, {"p": "Definitions and standards aren't separate. Defining \"moral\" as what passes the categorical imperative sets the standard.", "b": "Definitions set the standard", "l": ["A stipulated definition can't settle which standard is correct. It moves the dispute to which definition to adopt.", "You can define your way to any ethics you like.", "Winning by dictionary.", "If I define moral as \"what I like,\" then I'm always moral. Definitions are free. That's why they don't prove anything.", "Utilitarianism is correct."]}]}, {"t": "Rocket League & League", "n": 55, "k": [{"p": "Rocket League deserves the same respect as the big competitive games.", "b": "Rocket League deserves respect", "l": ["It has a high skill ceiling and a small strategic layer next to team games with drafts and economies.", "Mechanically deep, tactically a kickabout.", "Hard to play, simple to explain. That's a compliment and a limit.", "It's football, but you're a car. If you wanted football there's football. If you wanted cars there's racing.", "Rocket League is soccer for people who find both soccer and cars too hard."]}, {"p": "League is worth the time people put into it.", "b": "League is worth the hours", "l": ["Players describe it as something they can't stop doing more often than something they enjoy.", "The most played game people say they hate.", "Worth it, according to people asking to be banned from it.", "A game is meant to be fun. Ask anyone who plays it if they're having fun.", "League isn't a game, it's a punishment with a queue."]}, {"p": "Critiques of engagement-driven design apply to games as much as to social media.", "b": "Engagement design applies to games", "l": ["They do, and that undercuts the idea that time spent in them is freely chosen.", "If the design is the problem, the hours aren't a recommendation.", "A fair point against your own playtime.", "If games are built to be addictive, then playing them a lot is evidence of the design. So the more you play, the less it says about the game being good.", "Esports aren't sports."]}]}]}, {"n": "Sisyphos", "u": ".sisyphos", "m": 4330, "t": [{"t": "Germany & the German language", "n": 100, "k": [{"p": "Some things only work in German. In dub or sub they come across as stiff theatre.", "b": "Some things only work in German", "l": ["Something is lost in any translation. Whether it's the essential thing is the question.", "Everything loses something in translation, including the things that travel fine.", "\"It's better in the original\" is true of every film ever made.", "If it only works in one language, it's about the language. A good story works in any of them. That's how you know it was a story.", "\"Read it in the original\" is cope."]}, {"p": "A word like \"reason\" in German reaches further than the English one.", "b": "'Vernunft' means more than 'reason'", "l": ["Vernunft carries its history from Kant and Hegel. The English word has its own, and neither is the bigger concept.", "Every language's key words feel deeper to the people who grew up in it.", "Vernunft is \"reason\" with a longer reading list.", "A word means what the dictionary says. The dictionary says Vernunft means reason. So they mean the same and the extra feeling is homesickness.", "German is the only language philosophy works in."]}, {"p": "Berlin is very mixed. It isn't typical Germany.", "b": "Berlin isn't typical Germany", "l": ["Capital cities are never typical. Berlin's economy has also trailed the rest of the country's for decades.", "Not typical Germany, and Germany pays for it.", "Berlin is the only capital in Europe that's poorer than its country.", "A capital is where the country puts its best. If that's Germany's best, the rest must be worse. So Berlin tells you everything.", "Berlin is poor, grey, and proud of both."]}, {"p": "Germany's rules can be oddly specific, like what you may grow at home, but the system works.", "b": "German rules are weird but work", "l": ["Specificity is the system. The same instinct produced the paperwork that slows down everything else.", "It works, after the form is stamped.", "Three plants, measured, in triplicate.", "A country with a rule for everything has no room left to do anything. That's why the trains are late.", "Germans aren't efficient. Look at the trains."]}]}, {"t": "Free will & philosophy", "n": 71, "k": [{"p": "There's no free will or agency at any biological level. Sapolsky has that right.", "b": "No free will, Sapolsky's right", "l": ["Sapolsky shows behavior has causes. Compatibilists agree, and deny that this settles whether we act freely.", "\"Everything has causes\" is where the debate starts.", "He proves determinism and thinks that's the end of it.", "He decided to write a book saying nobody decides anything. Then he asks you to change your mind. Both of those need free will.", "Free will skeptics still say \"sorry,\" which is all you need to know."]}, {"p": "Philosophy turns out to be a serious subject. It isn't the poetry-cringe people take it for.", "b": "Philosophy is serious", "l": ["A fair amount of it is closer to the cringe than its defenders admit.", "Serious, with some poetry and some cringe.", "It's not what people think. Sometimes it's worse.", "A serious subject makes progress. Philosophy has the same questions it had in Athens. So it's a hobby that got offices.", "Philosophy servers are where reading goes to die."]}, {"p": "Reading some history of philosophy gives you the broad picture first.", "b": "Start with a history of philosophy", "l": ["Surveys give you labels and one-line positions, and you end up arguing with summaries.", "The broad picture is where every misreading comes from.", "History of philosophy is knowing what everyone said and why nobody was right.", "If the old ones were right there'd be no new ones. There are new ones. So the history is a list of mistakes, and you can skip to the end.", "The history of philosophy is pointless. Physics students don't read Newton."]}, {"p": "Ideas about authenticity and Being shape culture, though slowly.", "b": "Authenticity shapes culture slowly", "l": ["The causal story is hard to show. Culture usually shifts for economic reasons and picks up a philosophy afterwards.", "The philosophy tends to arrive after the change, to explain it.", "Heidegger shaped culture the way the weather report shapes the weather.", "Nobody at a supermarket has read Heidegger. Culture is the people at the supermarket. So he shaped nothing.", "Heidegger is asking what \"is\" means. It means is. Next."]}]}, {"t": "DnB & music", "n": 60, "k": [{"p": "Finding drum and bass put me on the right path, musically.", "b": "DnB saved me", "l": ["It's a great genre with a formula that's been stable for thirty years.", "The right path, at 174 beats a minute, since 1995.", "Saved by a breakbeat.", "It's one drum pattern played fast. Every track has it. If every song has the same drums, it's one song.", "Drum and bass is a drum solo that won't let anyone else talk."]}, {"p": "Mainstream pop isn't worth the time.", "b": "Pop isn't worth it", "l": ["Pop is where most of the craft in songwriting and production goes, whatever anyone thinks of the result.", "The best engineers in the world work on the songs you're skipping.", "\"I don't listen to pop\" is the most popular opinion in music.", "Pop is called pop because it's popular. Popular means most people like it. Most people can't all be wrong about what they like.", "Pop music now is better than the 90s. The production alone."]}, {"p": "In the scene, everybody knows how things really work.", "b": "Everybody in the scene knows", "l": ["Scenes think of themselves as in on something. Mostly it's a small world with its own gossip.", "Everyone in every scene thinks they know how it really works.", "It's a few hundred people and they all have a podcast.", "If everybody in the scene knows, it isn't a secret. If it isn't a secret, it's just a job.", "Berghain is a queue with a sound system."]}, {"p": "You can build a good life around working a little and travelling a lot.", "b": "Work less, travel more", "l": ["You can, usually for a while, and usually with a safety net that isn't mentioned.", "A great plan in your twenties.", "Works until something needs paying for.", "Money comes from working. Less working is less money. Travel costs money. So the plan is spending more of what you have less of.", "Europe is a retirement home with good trains."]}]}]}, {"n": "Mars", "u": "marsaries", "m": 1669, "t": [{"t": "Nietzsche & the philosophers", "n": 85, "k": [{"p": "A plain reading of Greek tragedy cuts against Nietzsche. It isn't just that his history is off.", "b": "Greek tragedy is anti-Nietzsche", "l": ["Nietzsche's claim is about what tragedy does to an audience. A plain reading of the plots doesn't obviously touch that.", "He's talking about the chorus and the music. The plots aren't his evidence.", "The plays say one thing. Nietzsche was listening to the flute.", "The classicists took the book apart the year it came out. If the experts say he's wrong about the Greeks, he's wrong about the Greeks.", "Nietzsche made up the Greeks he needed."]}, {"p": "Derrida, Rorty and Wittgenstein may be the worst philosophers of the twentieth century.", "b": "Derrida, Rorty and Wittgenstein are the worst", "l": ["All three changed what their successors could take for granted, and that's the usual measure of importance.", "The worst three, cited by everyone who came after.", "For the worst, they've got a lot of people still arguing with them.", "The best philosopher is the one who solved the most problems. Wittgenstein solved all of them twice.", "Wittgenstein solved philosophy. Twice."]}, {"p": "Philosophy is the ultimate way of putting off living a good life.", "b": "Philosophy is procrastinating life", "l": ["For a lot of its history, philosophy was the practice of working out how to live.", "The Stoics would be surprised.", "Says the tradition that invented \"the good life.\"", "You can't live a good life without knowing what one is. Finding out is philosophy. So it's the only thing that isn't procrastinating.", "The unexamined life is fine. Most people are busy."]}, {"p": "Kant's grammar of duty runs under everything, whatever people say they've replaced it with.", "b": "Kant's grammar is under everything", "l": ["Consequentialists and virtue theorists would deny that. \"Ought\" was in use long before Kant.", "People said \"should\" before 1785.", "Kant didn't invent obligation. He formatted it.", "Kant lived in one town his whole life and never met anyone unlike himself. An ethics from that is an ethics for that town.", "Kantian ethics is what a guy who never left town comes up with."]}]}, {"t": "Honesty & lying", "n": 31, "k": [{"p": "If you only ever tell the truth, it becomes much harder for people to lie to you.", "b": "Only tell the truth and nobody can lie to you", "l": ["Honest people get lied to regularly. Being truthful doesn't give you a detector.", "Con artists love an honest man.", "The truthful are the easiest marks. They assume everyone else is at it too.", "Liars know all the tricks because they use them. So the best lie detector is a liar, and honest people are the last to find out.", "Marketing is lying with a budget."]}, {"p": "What sets things off is how someone reacts to being called a liar, more than the lie.", "b": "It's the reaction, not the lie", "l": ["Reacting badly to an accusation is what both the guilty and the innocent do.", "Innocent people get angry too.", "\"You're upset, so it's true\" convicts everyone.", "If you call anyone a liar they get upset. So getting upset tells you nothing, and the test is useless.", "Language was invented by whoever needed to lie first."]}, {"p": "Trolling and lying aren't the same thing.", "b": "Trolling isn't lying", "l": ["The difference is intent to be found out later, and to the person on the receiving end it often feels the same.", "A lie with a reveal is still a lie until the reveal.", "\"I was trolling\" is what a lie says when it's caught.", "Saying something false on purpose is lying. Trolling is saying something false on purpose. The rest is branding.", "Irony is just meaning it with an exit."]}]}, {"t": "Poker", "n": 22, "k": [{"p": "Poker is a game of skill.", "b": "Poker is skill", "l": ["Over a long run, yes. In the short run it's mostly variance, and most players never reach the long run.", "Skill, visible after about fifty thousand hands.", "A game of skill where a beginner can win the tournament.", "You can't choose your cards. The cards decide who wins. So it's the cards.", "Poker is pure luck. The cards decide."]}, {"p": "Reading people is a real edge at the table.", "b": "Reads are a real edge", "l": ["Betting patterns carry most of the information. Physical tells matter much less than the films suggest.", "The read is in the bet sizing.", "Nobody can read faces. They remember the times they guessed right.", "Everyone thinks they can tell when someone's lying. Tests say they're at fifty percent. So the edge is a coin.", "A \"read\" is a guess you got away with."]}, {"p": "You can make an honest living at it.", "b": "You can make an honest living at poker", "l": ["A few do. Most who say so make their money from staking, coaching or content.", "The money in poker is in the course.", "An honest living, selling the ebook.", "For one person to win, another has to lose. So the living comes out of someone's rent. That's the business.", "Poker is the only honest job."]}]}]}]</script>

<script>
const P = JSON.parse(document.getElementById('data').textContent), PFP = JSON.parse(document.getElementById('pfps').textContent);
/* three levels: the honest reply, the confident wrong argument, the one-liner (columns 1, 4 and 5 of the written text) */
const LEVELS = ['serious','bait','rage bait'], COL = [0,3,4];
const $ = id => document.getElementById(id), tree = $('tree'), svg = $('wires'), cols = [$('c1'),$('c2'),$('c3'),$('c4')];
const slug = s => s.toLowerCase().replace(/&/g,'and').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
const order = P.map((p,i)=>i).sort((a,b)=>(P[a].s||P[a].n).toLowerCase().localeCompare((P[b].s||P[b].n).toLowerCase()));
const byU = Object.fromEntries(P.map((p,i)=>[p.u,i]));
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const S = {pi:null, ti:null, lv:null}; let drawn = '';

let zackT; const btns0 = () => [...cols[0].children];
function btn(text, n, on){ const b = document.createElement('button'); b.style.setProperty('--n', n); b.append(text); b.onclick = on; return b; }
function fill(col, items, sel, fresh){ col.innerHTML = ''; col.classList.toggle('has', sel != null); col.classList.toggle('in', fresh);
  items.forEach((b,i) => { b.setAttribute('aria-current', String(i === sel)); col.appendChild(b); }); }

function render(){
  const key = [S.pi,S.ti,S.lv].join('/'), was = drawn.split('/'), now = key.split('/'); drawn = key;
  const fresh = i => was[i] !== now[i];           // which column is newly grown this time
  const title = S.pi == null ? "So you’re arguing with…" : "So you’re arguing with " + (P[S.pi].s||P[S.pi].n) + (S.ti == null ? '…' : ' about ' + P[S.pi].t[S.ti].t.toLowerCase());
  document.title = title;
  if(!cols[0].children.length) fill(cols[0], order.map((pi,n) => { const a = document.createElement('span'); a.className = 'av'; a.textContent = (P[pi].n.replace(/[^A-Za-z]/g,'')[0]||'?').toUpperCase();
      if(PFP[P[pi].u]){ const im = new Image(); im.src = PFP[P[pi].u]; im.alt = ''; a.appendChild(im); }
      let label = P[pi].s || P[pi].n;
      if(P[pi].z){ label = document.createElement('span'); label.className = 'dn'; const x = document.createElement('span'); x.className = 'dn-a'; x.textContent = P[pi].s || P[pi].n;
        const y = document.createElement('span'); y.className = 'dn-b'; y.textContent = P[pi].zn; y.setAttribute('aria-hidden','true'); label.append(x, y);
        if(PFP[P[pi].z]){ const im = new Image(); im.src = PFP[P[pi].z]; im.alt = ''; im.className = 'alt'; a.appendChild(im); } }
      const b = btn(label, n, () => {
        if(S.pi === pi){ go({pi:null,ti:null,lv:null}); return; }
        /* Jack: light him up first, let Zack fade through once, then open the branch */
        if(P[pi].z && !reduced){ clearTimeout(zackT); cols[0].classList.add('has'); btns0().forEach(x => x.setAttribute('aria-current', String(x === b)));
