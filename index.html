 a soul and Buddhists think there isn't. Those are opposites. Two opposite things can't be pointing at the same thing.", "Hinduism and Buddhism are the same religion. One has more gods."]}, {"p": "Boredom is the last layer. Solve boredom and you've beaten the game.", "b": "Beat boredom, beat the game", "l": ["Boredom is also a signal that what you're doing isn't worth doing, and silencing it removes the signal.", "Curing boredom is curing the smoke alarm.", "Solving boredom is what phones are for.", "People who are never bored are busy. So the cure for boredom is a job, and millions of people beat the game every Monday.", "Zen is doing nothing and being smug about it."]}, {"p": "The Buddha saw through illusion by being soaked in its riches first.", "b": "The Buddha had to be rich first", "l": ["That's the palace story, and it makes renunciation easiest for people with something to give up.", "Seeing through wealth is cheaper once you've had it.", "Enlightenment by way of a trust fund.", "He had everything and walked away. Anyone can walk away from something they've already had enough of. The hard version is not having it.", "Asceticism is just being boring and calling it a choice."]}, {"p": "Seeing that it all converges is the easy part. It isn't a puzzle.", "b": "It obviously all converges", "l": ["If the convergence is obvious, centuries of doctrinal conflict need explaining.", "Obvious, and somehow missed by everyone who fought about it.", "Not a puzzle, just two thousand years of wars over the answer.", "If everyone already knows all religions say the same thing, nobody would bother having more than one. There are thousands.", "Buddhism is cope."]}]}]}, {"n": "Janne", "u": "_janne", "m": 15980, "t": [{"t": "Programming", "n": 254, "k": [{"p": "Programming isn't really about logic.", "b": "Programming isn't about logic", "l": ["Whatever else it involves, a program is a formal object that either does what's specified or doesn't. Logic is the core.", "It's about people and requirements, right up until it doesn't compile.", "The compiler disagrees.", "A computer only does logic. Programming is telling a computer what to do. So programming is only logic, and the rest is meetings.", "Programming is easy now."]}, {"p": "Docker gets ugly as soon as services have to share a database and networks.", "b": "Docker breaks on shared databases", "l": ["That's an argument about how the stack was configured. Shared networks across compose files is a solved pattern.", "Docker is fine. The compose files are a choice.", "Works on my machine, and now the machine comes with it.", "Docker puts everything in a box so nothing can break anything else. If things are breaking each other, that's the user. The box is innocent.", "Docker is a zip file with opinions."]}, {"p": "A software engineer can reason about hardware well enough without being a hardware person.", "b": "I can reason about hardware fine", "l": ["The abstractions leak at exactly the places hardware people know about, and software intuition is often wrong there.", "\"Pretty sure\" is how most firmware bugs start.", "Software people are sure about hardware until the oscilloscope comes out.", "Hardware is just software that's been printed. Anyone who can write the software understands the print. So there's nothing extra to know.", "Firmware is just software that's scared."]}, {"p": "LLM output needs structure around it. Give it a spec and templates, don't let it freehand.", "b": "Give the model a spec and templates", "l": ["The more scaffolding you build, the more of the work you've done yourself. At some point the model is filling in a form.", "A spec detailed enough to guarantee the output is the output.", "If the spec is that good, the spec is the code.", "A model is either smart enough to do the job or it isn't. If you have to hold its hand, it isn't, and templates don't change that.", "LLM code is fine. If it's slop, the spec was slop."]}]}, {"t": "Future selves & consent", "n": 202, "k": [{"p": "It isn't real consent unless you grasp how your future self will probably react.", "b": "Consent needs your future self", "l": ["That standard would invalidate most major life decisions, since nobody predicts their future reactions well.", "On that rule nobody has ever consented to a marriage, a mortgage or a degree.", "Informed consent, with the requirement that you can see the future.", "You are your future self. Same person. So you can't fail to know how you'll react, because you're the one who'll be reacting.", "If you agreed, you agreed. That's what the word is for."]}, {"p": "You should make the choices your future self would agree with.", "b": "Choose what future you would want", "l": ["Your future self's preferences are partly produced by the choice, so the standard can't guide it.", "Whatever you pick, a future self shaped by that pick will tend to endorse it.", "Your future self agrees with whatever made him.", "The future doesn't exist yet. Things that don't exist don't have opinions. So there's nobody to agree with and you do what you want.", "Your future self isn't real and can't complain."]}, {"p": "When a choice goes differently from what you predicted, it's usually outside constraints, not you being unpredictable.", "b": "Plans fail from outside constraints", "l": ["People also just change their minds, and the reasons are often opaque to them.", "\"It rained\" covers some of the cases. The rest is you.", "Every broken plan was the weather.", "If only outside things change your choices, then you never choose anything. The weather does. So that's determinism, and there's no free will.", "Free will is fake."]}, {"p": "Randomness wouldn't make anyone free.", "b": "Randomness isn't freedom", "l": ["It rules out the claim that everything is fixed, and that was the hard determinist's main premise.", "Indeterminism isn't freedom, and it's also the end of \"it was all settled at the Big Bang.\"", "Dice aren't free, and determinists still don't get to keep the clockwork.", "Physics is random at the bottom. People are made of physics. So people are random, and random means nobody is making you do it, and that's what free means.", "Quantum mechanics is random, so determinism is false. That's just physics."]}]}, {"t": "Non-existence", "n": 164, "k": [{"p": "The non-existence of something is itself a kind of existence.", "b": "Non-existence is a kind of existence", "l": ["That treats an absence as a thing. \"There is no spoon\" denies a spoon. It doesn't assert a no-spoon.", "If absences exist, the room contains infinitely many of them.", "The table is crowded with every object that isn't on it.", "Non-existence means not existing. Existence means existing. Those are opposites. Saying one is the other is saying up is a kind of down.", "Non-existence exists. Otherwise what's the word for."]}, {"p": "What gets lost at death is what the fear is about. Non-existence itself isn't the frightening part.", "b": "It's what death takes that's scary", "l": ["For many people the fear is exactly of not being. Epicurus addressed that, and it didn't go away.", "\"It's really about other people\" fits some of the fear and misses the rest.", "The fear of death, minus the death.", "You won't be there to mind being dead, so there's nothing to fear. Epicurus said it in one sentence. Anyone still scared didn't follow the sentence.", "Scared of not existing? You've done it before. Next."]}, {"p": "Someone can be of sound mind and still prefer not to exist.", "b": "You can sanely prefer not to exist", "l": ["A settled preference for non-existence is hard to tell from the outside from a state that would pass with treatment or time.", "The preference is possible. Knowing that it's the stable one is the hard part.", "Sound mind is the thing in question.", "You can't prefer something you've never tried. Nobody has tried not existing. So the preference is a guess about a thing nobody has data on.", "Humility is a brag, and so is pessimism."]}, {"p": "A cat doesn't care about a spoon that isn't there. It cares a lot about food that isn't there.", "b": "The cat cares about missing food", "l": ["That shows the cat has expectations. It doesn't show that absences are items in the world.", "The cat misses dinner. The philosophy is added afterwards.", "The cat has a schedule and no ontology.", "The cat reacts to the empty bowl, and the empty bowl is there. So it's reacting to something that exists. No non-existence involved.", "A cat doesn't love anyone. It tolerates the building."]}]}, {"t": "The state & freedom", "n": 154, "k": [{"p": "Being against the state is the right position.", "b": "Be against the state", "l": ["The functions people most want, courts and defense and enforceable contracts, have never been supplied at scale without one.", "Every stateless region on the map has a warlord in it.", "Anti-state, on roads the state built, in the country the state runs best.", "Somebody always ends up in charge. If it isn't a state it's whoever has the most guns, and that's a state with worse paperwork.", "Anarchism is retarded."]}, {"p": "There are better ways to deal with monopoly than the state breaking companies up.", "b": "Don't break up monopolies", "l": ["Without enforcement, the usual alternative is waiting for a competitor, and network effects can make that a long wait.", "\"The market will sort out the monopoly\" is what the monopoly says too.", "A better way than antitrust, to be announced.", "A company only gets big by being the best. Punishing it for that is punishing winning. So there's no monopoly problem, only envy.", "Libertarians just don't want to pay taxes. The rest is decoration."]}, {"p": "The state shouldn't only respect free speech. It should guarantee it, and step in when speech is suppressed.", "b": "The state should guarantee speech", "l": ["A state that polices suppression of speech is deciding which private actors must carry which speech, and that's a large power.", "\"Guaranteeing\" speech means compelling someone to host it.", "The anti-state case for more state.", "If the state has to protect speech, the state decides what counts as speech. So the safest free speech is the kind the state has never heard of.", "Free speech is absolute or it's nothing."]}, {"p": "You can't take away people's freedoms unless they're an active threat.", "b": "Only restrict active threats", "l": ["\"Active threat\" is the whole dispute. Most restrictions are aimed at risks, and nobody agrees on where risk becomes threat.", "Speed limits restrict people who haven't hit anyone yet.", "Everything turns on a phrase nobody agrees on.", "Freedom means doing what you want. A threat is someone doing what they want. So protecting freedom and stopping threats are the same thing pointed in opposite directions, and somebody just picks.", "Privacy doesn't matter if you have nothing to hide."]}]}, {"t": "Norway", "n": 138, "k": [{"p": "Norway's justice system came from evidence that punitive prison doesn't work. It didn't come from people being unusually moral.", "b": "Norway's prisons came from data", "l": ["The evidence came from a small, wealthy, low-crime country, and how far the results travel is an open question.", "The statistics were good, and so was everything around the prison.", "It works in Norway. Lots of things work in Norway.", "Norway has almost no crime to begin with. Any prison works when there's nobody in it. So the model proves nothing.", "Prison works. Norway's just has nicer furniture."]}, {"p": "Norwegian products really are better: the salmon, the vegan ice cream.", "b": "Norwegian stuff really is better", "l": ["Farmed Norwegian salmon is a major industry with well-documented environmental problems.", "The salmon is good, and the fjord it came from has opinions.", "The best salmon in the world, from a cage.", "Norway is rich, and rich countries can afford to make things nice. So it's the money, and any country with that much oil would have good ice cream.", "The Nordic model is just having oil."]}, {"p": "Norway reports honestly on its own failings, including what its companies and state do abroad.", "b": "Norway owns its failings", "l": ["Coverage is one thing. The oil fund keeps growing on the same activities the coverage criticizes.", "Self-criticism is cheap when the revenue doesn't change.", "Norway feels bad about it, profitably.", "A country that's really sorry stops doing the thing. They haven't stopped. So the reporting is the apology that replaces stopping.", "Norway is an oil company with a welfare department."]}, {"p": "Norwegian healthcare is remarkable.", "b": "Norwegian healthcare is great", "l": ["Outcomes are strong, with long waits for elective care and a budget few countries could match per head.", "World-class, once you get to the front of the queue.", "Remarkable care, bring a book.", "Any system looks good with that much money and that few people. Give anyone five million patients and a trillion dollars.", "Norway is boring."]}]}, {"t": "Veganism", "n": 108, "k": [{"p": "Veganism is the ethical position.", "b": "Veganism is the ethical position", "l": ["The case depends on which animals are sentient, and for some farmed species the evidence is uncertain.", "One line around a kingdom with cows at one end and sponges at the other.", "Vegans drew the line at \"has a face.\"", "Humans have canine teeth. Teeth are for what they're for. So eating meat is what the body was built to do, and going against your own body isn't ethics.", "Veganism is cope."]}, {"p": "The vegan versions are just as good now.", "b": "Vegan versions are as good now", "l": ["Some are. Many are heavily processed, and most still lose a blind taste test.", "The good ones are good. The average one is a compromise.", "Just as good, according to people who've forgotten the original.", "If it were as good, they wouldn't have to name it after the thing it's copying. Nobody calls steak \"beef tofu.\"", "Oat milk is water that's been near an oat."]}, {"p": "Most vegans are doing harm reduction rather than chasing purity.", "b": "Vegans are doing harm reduction", "l": ["If it's harm reduction, then eating less meat and choosing higher-welfare meat count too, and the line at zero looks arbitrary.", "Harm reduction is an argument for less. It doesn't get you to none.", "Reducetarians do more of that, with less talking.", "Crops kill field mice by the million. So a vegan diet kills too. If it's about harm, a cow that eats grass kills fewer animals than a field of soy.", "Plants are alive too."]}, {"p": "Fish and eggs are the hardest things to give up, and they still count.", "b": "Fish and eggs still count", "l": ["The science on fish pain is disputed. Fish lack a neocortex, though many researchers think other structures do the job.", "Eggs from well-kept hens are about the weakest case the argument has.", "An unfertilized egg is nobody.", "A fish has no neocortex, and the neocortex is where pain happens. No neocortex, no pain. It's a reflex with fins.", "Fish don't feel pain. No neocortex."]}]}]}, {"n": "Jeh", "u": "ice_chicken12", "m": 32652, "t": [{"t": "India", "n": 802, "k": [{"p": "India is building out fast: nuclear, solar, wind and hydro at huge scale by 2030.", "b": "India is building fast", "l": ["Announced capacity targets and delivered capacity have differed a lot in the past, especially for nuclear.", "India's nuclear targets have been missed in every plan since the seventies.", "A hundred gigawatts of nuclear by 2030, from the country that took twenty years on its last reactor.", "A country that's still poor can't build anything big, because building needs money. That means every Indian megaproject is a press release.", "India has been five years away from being a superpower since 1947."]}, {"p": "People flatten India into one thing when its languages differ from each other as much as Europe's do.", "b": "India is as diverse as Europe", "l": ["The linguistic diversity is real. So is the shared state, shared market and shared film industry that outsiders are responding to.", "Europe's languages come with separate countries. That's why people treat them differently.", "Everyone knows there are many Indias. They still have one passport.", "If a billion people have one government and one cricket team, it's one culture. Languages are just accents with their own alphabet.", "Hindi and Tamil are basically the same language."]}, {"p": "The Western picture of Indians comes from Hollywood clichés and one guy someone met.", "b": "The Western picture of Indians is Hollywood", "l": ["Stereotypes about India are lazy. The best corrective is data, and some of the data is unflattering too.", "The clichés are bad. The air quality index is not a cliché.", "The cliché is wrong, and the call centre was real.", "Stereotypes come from somewhere, and where they come from is the truth. That means the movie version is the average, and the average is the country.", "Bollywood is one movie. It's three hours and it's been playing since 1975."]}, {"p": "India is the next great power.", "b": "India is the next great power", "l": ["Per-capita income is still low, and power projection beyond the region is limited. Size alone hasn't delivered influence.", "A very large economy divided by 1.4 billion is a different picture.", "India is the world's biggest small economy.", "China already did everything India is planning to do, and there's only room for one. So the slot is taken.", "China already won. India is competing with Vietnam."]}, {"p": "Indian tech talent runs Silicon Valley.", "b": "Indians run Silicon Valley", "l": ["A system whose best graduates leave is exporting its return on education.", "The diaspora's success is evidence about California.", "India's most successful sector is the airport.", "If the smart ones all leave, then the ones who stay aren't the smart ones. That's just subtraction, and it explains the roads.", "India's biggest export is engineers leaving."]}]}, {"t": "Markets & the AI bubble", "n": 390, "k": [{"p": "There's an AI bubble, whatever the growth story says.", "b": "It's an AI bubble", "l": ["Calling a bubble needs a view on future cash flows. Revenue at the leading labs has grown faster than most forecasts.", "\"Bubble\" has been said every quarter while revenue went up tenfold.", "The bubble has been about to pop for four years.", "Prices only go up when something is worth more. Prices went up. So it's worth more, and a bubble is a word for a price you wish you'd bought at.", "Stocks only go up. Check the chart."]}, {"p": "Growth can't run 10x a year for five years, so the valuations don't hold.", "b": "Nothing grows 10x for five years", "l": ["Nobody needs 10x for five years. The valuations need a much slower curve, and plausibly get it.", "Arguing against the most extreme projection doesn't touch the ordinary one.", "That's refuting the pitch deck.", "The internet grew that fast and never stopped. AI is the internet again, and that means it never stops either.", "Compound growth is forever lol. That's what compound means."]}, {"p": "Index funds end up forced buyers when something like the SpaceX IPO lands.", "b": "Index funds get forced to buy the IPO", "l": ["Index inclusion rules have float and seasoning requirements, so the forced buying is smaller and slower than it sounds.", "Passive funds buy what's in the index, at index weight, after the rules let it in.", "Retail has been \"bag-held by index inclusion\" in every forecast and few outcomes.", "An index fund owns everything, so it can't be forced to buy anything. It already has it. That's the whole point of an index.", "Index funds are for people who've given up on being right."]}, {"p": "The interesting data is the stuff kept off the books.", "b": "The real data's off the books", "l": ["Off-book information exists, but markets price a great deal of it through people who trade on what they know.", "If it matters, someone is already trading on it.", "The secret data is in the price. That's what the price is.", "Everything a company knows is in its annual report, by law. That means there are no secrets, and anyone who says otherwise is selling a newsletter.", "Earnings calls are theater."]}]}, {"t": "Bataille & luxury", "n": 353, "k": [{"p": "Luxury works like Bataille's wasteful expenditure: the watch that's worse at telling time is the one worth more.", "b": "Luxury is Bataille's expenditure", "l": ["Veblen explains that with status signaling, no solar economy needed. Conspicuous waste is very useful to the person doing it.", "A cost that buys status isn't waste. It's an investment with a display case.", "The accursed share is a marketing budget.", "A thing is worth what it does. A watch tells time, and the cheap one tells it better. That means the expensive one is worth less, and people who buy it can't count.", "Luxury is ordinary stuff with the supply turned off."]}, {"p": "The overlap between ritual transgression and luxury marketing is real.", "b": "Luxury marketing is ritual transgression", "l": ["Marketers borrow the look of transgression because it sells. That's ordinary incentives.", "An ad that feels like a ritual is still an ad.", "Transgression with a media plan.", "Advertising only works on people who aren't paying attention. Luxury buyers pay a lot of attention, so the marketing does nothing and they'd have bought it anyway.", "Branding doesn't work on smart people."]}, {"p": "Bataille gets at something about excess that economics leaves out.", "b": "Bataille sees what economics misses", "l": ["The general economy generalizes from potlatch and sacrifice to all economic life, on anthropology that's been heavily revised.", "A theory of the whole economy shouldn't rest on a few gift ceremonies.", "Bataille read one book about potlatch and explained the sun.", "Economics is about scarcity, because that's what the word means. A theory of too much isn't economics, it's a mood.", "Bataille is retarded."]}, {"p": "Transgression has to be understood from inside the rule it breaks.", "b": "Transgression needs the rule", "l": ["That makes transgression dependent on the prohibition. It's a loyal kind of rebellion.", "You can only transgress a rule you still believe in.", "Transgression is obedience with a detour.", "Breaking a rule on purpose means the rule decided what you did. So the transgressor is the most obedient person in the room.", "Transgression is just bad manners with a theory."]}, {"p": "Land takes Bataille's vocabulary and uses it against Bataille.", "b": "Land turned Bataille against Bataille", "l": ["If the same concepts serve both of them, the concepts weren't constraining anyone.", "A vocabulary that works equally well for opposite projects isn't saying much.", "Bataille's ideas fit everybody because they commit to nothing.", "Land read Bataille more carefully than anyone, and he ended up where he ended up. That's where Bataille leads, so they're the same.", "Nick Land is Bataille with a modem."]}]}, {"t": "America", "n": 301, "k": [{"p": "American politics is all loose loyalty to \"left\" and \"right\" with little underneath.", "b": "American politics is just team colors", "l": ["Polarization studies show the divide tracks real differences on policy and identity. It isn't only labels.", "Every country's politics looks like tribal labels from outside.", "Two teams and a lot of merchandise, as opposed to where?", "America has two parties and they agree on everything that costs money. That means there's one party, and the arguing is a show.", "Democrats and Republicans are the same party with different mascots."]}, {"p": "America is the unhealthiest country for its income, and China's system is worth copying.", "b": "America's unhealthy, copy China", "l": ["US outcomes are poor for the spending, but that follows from diet and inequality as much as from system design.", "You can't import a health system without importing the state that runs it.", "\"Copy China\" leaves out a few steps.", "Americans live shorter lives because they have more freedom, and freedom includes the freedom to eat. So the life expectancy is a feature.", "American healthcare is the best in the world if you can afford it, and if you can't that's a different problem."]}, {"p": "America plays dirty with South Asia on trade.", "b": "America plays dirty on trade", "l": ["US trade policy is self-interested, like everyone's. South Asian tariff walls are among the highest in the world.", "Every country's trade policy is slimy from the other side of it.", "India has higher tariffs than the country it's calling protectionist.", "Trade is voluntary. Nobody makes anyone sell. That means no country has ever been treated unfairly in a trade deal.", "America doesn't owe anyone a market."]}, {"p": "Americans don't understand anywhere else.", "b": "Americans don't get anywhere else", "l": ["Insularity is common in large countries. India and China have their own versions.", "Big countries are parochial. It's a size thing.", "Americans know as much about India as Indians know about Paraguay.", "America is the only country that matters, so Americans only need to know about America. Everyone else has to learn two countries.", "The rest of the world is America's group project."]}]}, {"t": "Indian philosophy", "n": 268, "k": [{"p": "Indian philosophy belongs in the conversation and keeps getting left out of it.", "b": "Indian philosophy gets ignored", "l": ["It's left out partly because much of it is tied to soteriological aims, which makes the arguments hard to separate from the religious project.", "When every school's arguments end at liberation, it's fair to ask if the conclusion came first.", "Great arguments that all happen to arrive at the temple.", "Philosophy is asking questions with no answer assumed. The Indian schools all assume moksha. So it's theology, and theology has its own department.", "Indian philosophy is just religion."]}, {"p": "Chan Buddhism is a different animal from the orthodox Hindu schools. It's a whole tradition moved into another language and region.", "b": "Chan is its own tradition", "l": ["The break is real, but the core practices and the goal stayed recognizably the same across the move.", "They argue about the self and then prescribe the same sitting.", "Buddhism left India and still came back as yoga class.", "Buddhism started in India, from a Hindu prince, using Hindu ideas. A thing made entirely of Hindu parts is Hindu.", "Hinduism and Buddhism are the same religion. One has more gods."]}, {"p": "Indian philosophy of mind has real things to offer current models of the mind.", "b": "Indian philosophy of mind has a lot to offer", "l": ["The classical accounts were built without any neuroscience, and mapping their categories onto it involves a lot of loose translation.", "\"Anticipated modern cognitive science\" usually means two people said something hard to follow.", "Every Western idea has an Indian precursor if you squint at the Sanskrit.", "Anything true about the mind would have been found by brain scans by now. It wasn't in the scans, so it isn't true.", "Meditation is sitting. People turned sitting into a 2,500-year industry."]}, {"p": "The pramana theories and Nyaya logic are serious epistemology.", "b": "Nyaya is serious epistemology", "l": ["Counting testimony and scripture as independent sources of knowledge builds authority into the system from the start.", "The Nyaya syllogism states its conclusion twice and adds an example. Aristotle's is shorter and loses nothing.", "Perception, inference, and being told.", "Logic was invented once, in Greece. Anything that looks like logic elsewhere is either copied or a coincidence.", "Nyaya is just Aristotle's logic that showed up late."]}, {"p": "Karma is a serious account of moral causation.", "b": "Karma is moral causation", "l": ["As an explanation of who suffers it can't be tested, and it comes close to blaming whoever is suffering.", "A doctrine that explains every misfortune by an unobservable past can't be wrong. That isn't a strength.", "Karma is \"he had it coming,\" as metaphysics.", "Bad things happen to bad people. Everyone has seen it. That means karma is an observation, and people who doubt it don't get out much.", "Karma is cope."]}]}, {"t": "Pineapple pizza", "n": 44, "k": [{"p": "Pineapple on pizza is good.", "b": "Pineapple pizza is good", "l": ["Sweet fruit on a salty, fatty base works in some dishes, but canned pineapple brings water, and that wrecks the crust.", "The idea is defensible. The usual execution is a wet pizza.", "Sweet and savory is a great idea that pineapple pizza gives a bad name.", "Pizza is Italian, and Italians don't do it. The people who invented a thing decide what it is, so it isn't pizza.", "Pineapple pizza is a crime."]}, {"p": "Sweet and savory go together, and the tradition argument is weak.", "b": "Sweet and savory work", "l": ["Tradition isn't decisive, but the classic combinations lasted because they balance. This one mostly adds sugar.", "Prosciutto and melon is a pairing. This is a dessert that got lost.", "There's a reason it's only on the menu at chains.", "Fruit is dessert, and dessert comes after dinner. Putting it on the dinner is eating in the wrong order, and that's why it tastes wrong.", "Fruit on dinner? That's retarded."]}, {"p": "People who hate it are mostly performing.", "b": "The haters are performing", "l": ["Some of it is signaling. A lot of people have also just eaten it and not liked it.", "Not every dislike is a pose. Sometimes it's a soggy pizza.", "I'm not performing. I've had it.", "Billions of people have tried it and most of them don't order it again. That's a vote, and it lost.", "Liking pineapple pizza is the performance."]}, {"p": "A good one, with fresh pineapple and proper heat, changes minds.", "b": "A good one changes minds", "l": ["If it only works under ideal conditions, it's fair to judge it by what's usually served.", "Every bad food has a good version nobody ever gets.", "\"You haven't had a good one\" is what they say about every bad idea.", "If it needs a special oven and special fruit to be edible, then it isn't edible. Good food survives being made badly.", "It's fruit on bread. You've eaten jam, and you didn't put it on pizza."]}]}]}, {"n": "Jere", "u": "jere.mi.as", "m": 42073, "t": [{"t": "AI & concepts", "n": 643, "k": [{"p": "A person fits their words around thoughts and concepts they're having. An LLM is only producing words.", "b": "LLMs just produce words", "l": ["We have no settled test for \"having a concept\" beyond using it correctly across cases, and the models pass a lot of those.", "If the difference never shows up in what gets said or done, it's hard to see what the claim amounts to.", "The concept is the bit you can't point to, can't test for, and are sure the machine lacks.", "Concepts live in the brain, and a model doesn't have a brain. That means it has no concepts, and it means the question was never interesting.", "Fancy autocomplete can't \"know\" anything. Next."]}, {"p": "Learning and arguing about theory is something you want to do yourself, so AI can't do that part for you.", "b": "I want to do theory myself", "l": ["Wanting to do it yourself is a fact about you. It doesn't show the model can't do the same intellectual work.", "\"It can't do it for me\" and \"I'd rather it didn't\" are different sentences.", "Nobody wanted to do long division themselves either, until it was a personality.", "The point of theory is having the right answer, and the model gets there faster. So doing it yourself is just being slow on purpose.", "Imagine reading theory by hand in 2026. That's churning your own butter."]}, {"p": "The social side of thinking isn't magic. If it has parts, the parts can be simulated.", "b": "The social stuff can be simulated", "l": ["A simulated practice isn't obviously the practice. A flight simulator doesn't go anywhere.", "Simulating the parts of a conversation gives you something that looks like a conversation. Whether anyone's in it is the question.", "You can simulate a storm and nothing gets wet.", "Social things need a society, and a society needs members with something to lose. A model has nothing to lose, so it can't be in one, so it can't do the social part.", "A group chat of bots is a for-loop."]}, {"p": "The paperclip maximizer is a leftover picture from the industrial age of what a superintelligence would want.", "b": "The paperclip is industrial-age thinking", "l": ["The paperclip is a placeholder for any goal specified badly. The argument doesn't depend on the product.", "Swap paperclips for anything you like and the argument is the same, which is the point of it.", "The example is dated and the problem isn't.", "A superintelligence would work out what's worth wanting, because that's what being smart is. Paperclips aren't worth wanting, so it wouldn't want them. Doom solved.", "A smart enough AI would just figure out ethics. That's what smart means."]}, {"p": "We talk about AI so much because it's like a pet or a person that moved into everyone's house at the same time.", "b": "AI is a pet that moved in with everyone", "l": ["We talk about it because a lot of money needs us to.", "The pet has a marketing budget in the billions.", "It moved in, and it reports back to head office.", "People only talk this much about things that are new. In two years it'll be as interesting as a dishwasher, and that means it was never the big deal anyone said.", "AGI is already here and it's Excel."]}]}, {"t": "Metaphor", "n": 244, "k": [{"p": "A metaphor can be wrong, and saying so is a fair move in an argument.", "b": "Metaphors can be wrong", "l": ["If metaphors can be wrong they have truth conditions, and then it's unclear what separates them from ordinary claims.", "Calling a metaphor wrong usually means you'd have preferred a different emphasis.", "\"That metaphor is wrong\" is \"I don't like how you put it,\" with authority.", "A metaphor says one thing is another thing when it isn't. That means every metaphor is false, so none of them is wronger than the rest.", "A metaphor is a lie that got a good review."]}, {"p": "Numbers are such basic metaphors that trying to replace them is a fool's errand.", "b": "Numbers are metaphors you can't replace", "l": ["Calling numbers metaphors needs an account of what they're metaphors for, and arithmetic truths don't seem to depend on any source domain.", "Two plus two isn't four in a manner of speaking.", "If numbers are metaphors, your bank balance is poetry.", "Lakoff showed maths comes from the body, like counting on fingers. Fingers stop at ten, and maths doesn't, so the theory is false after the first two hands.", "Maths isn't a metaphor. It's maths. That's why it works."]}, {"p": "Rorty was right that we aren't mirrors of nature, but that picture needs another metaphor to replace it, and he never gave one.", "b": "Rorty never gave a new metaphor", "l": ["Maybe the lesson is that the mind doesn't need a master metaphor at all.", "Asking what replaces the mirror assumes you need a picture there. That's the habit Rorty was trying to break.", "He takes the mirror down and you're asking what goes on the nail.", "The mind either reflects the world or it makes it up. Those are the only two options, so if it isn't a mirror then it's all made up.", "The mind is a mirror. You see things. They're there."]}, {"p": "Metaphors carry moral stakes. Calling people vermin does real work.", "b": "Metaphors have moral stakes", "l": ["The harm in dehumanizing language comes from the policies and violence it accompanies. The figure of speech isn't a cause of its own.", "Words like that follow the hatred more than they produce it.", "Nobody was talked into it by a simile.", "A metaphor is only a comparison, and comparisons can't hurt anyone. That means the stakes are zero, and that means this is a seminar topic.", "It's a figure of speech. Relax."]}, {"p": "Mathematical metaphors help with thinking about philosophy.", "b": "Maths metaphors help", "l": ["Borrowed maths gives a feeling of rigor without the constraints that make real maths rigorous.", "\"Strange attractor\" in an essay about culture is decoration.", "Philosophers use maths the way a perfume ad uses Paris.", "If an idea was any good it could be said in plain words. Reaching for maths means it couldn't, so the maths is where the idea goes to hide.", "Sokal was right and everyone has been coping since 1996."]}]}, {"t": "Pragmatism & Rorty", "n": 242, "k": [{"p": "Peirce gets it right: fallibilism plus communal inquiry, with science studying effects everyone can come to agree on.", "b": "Peirce got it right", "l": ["Agreement at the end of inquiry is an idealization nobody can check, so it can't guide anyone now.", "Truth as what we'd all agree on eventually is a promissory note with no due date.", "Peirce defined truth as a meeting that hasn't been scheduled.", "Whole communities have agreed on false things for centuries. Agreement is what Peirce means by truth, so on his view those things were true at the time.", "Pragmatism is retarded."]}, {"p": "Doubting induction is silly. It works extremely well almost all the time.", "b": "Doubting induction is silly", "l": ["\"It has worked\" is an inductive argument for induction. That was Hume's point.", "Saying induction works because it has worked is the problem restated.", "The pragmatist answer to Hume is to change the subject, confidently.", "Hume proved the future doesn't have to resemble the past. That means the sun not rising tomorrow is exactly as likely as it rising.", "Hume won. Everyone since is pretending."]}, {"p": "You can read belief off action. If someone acts like they believe it, they probably do.", "b": "You can read belief off action", "l": ["People act against what they sincerely believe all the time. Weakness of will is ordinary.", "Belief read off behavior makes hypocrisy impossible, and hypocrisy is everywhere.", "On that view nobody has ever been a hypocrite.", "Belief is a feeling of certainty in your head. Nobody can see into your head, so nobody can know what anyone else believes. That's why arguing is pointless.", "Belief is private. Behaviorism lost. Read a book from after 1960."]}, {"p": "Rorty was doing his own thing with Dewey and Wittgenstein. \"Betrayal\" is too strong.", "b": "Rorty didn't betray Dewey", "l": ["Using Dewey's name while dropping method and experience invites the charge, whatever word you choose for it.", "\"Doing his own thing\" is generous for attributing your views to someone who'd reject them.", "Rorty read Dewey the way people read terms and conditions.", "Rorty says truth is whatever your peers let you get away with. His peers let him get away with Dewey, so by his own standard the reading is true.", "Rorty got nothing from Dewey except the name."]}, {"p": "Rorty has a real problem moving from describing how vocabularies change to telling us which to use.", "b": "Rorty can't say which vocabulary to use", "l": ["If Rorty can't get from description to prescription, the fix is a theory of truth, and that's what he gave up.", "You can't keep the no-foundations picture and also want reasons that bind.", "Wanting Rorty without the relativism is wanting the haircut without the scissors.", "If no vocabulary is closer to reality than another, they're all equally good. That means flat earth is as good as physics, and that means Rorty is done.", "Rorty is postmodernism with an American accent."]}]}, {"t": "Movies", "n": 231, "k": [{"p": "Film sits at a sweet spot: complex enough that anything is possible, limited enough that it doesn't turn into chaos.", "b": "Film is the sweet spot", "l": ["Every established medium looks like a sweet spot from inside. Novels and games have the same balance of freedom and limit.", "\"Just enough constraints\" describes any art form with a canon.", "Film is the sweet spot according to people who watch films.", "Games do everything film does and you can also move. More features means better, so film is a game with the controller unplugged.", "Movies are video games for people who can't play."]}, {"p": "Montage, and later sound, are what made film its own art form.", "b": "Montage made film an art", "l": ["Editing matters, but theater and comics also cut between scenes. What's specific to film is the recorded moving image.", "Montage theory is a few Soviet essays that film schools never got over.", "Montage is cutting. They gave cutting a French name.", "Film is photographed theater, and theater already existed. That means nothing was invented in 1895 except a way to sell tickets twice.", "Photography isn't art. The camera did it."]}, {"p": "The scrambled timelines in Dunkirk build to a single climax, and it works.", "b": "Dunkirk's timelines work", "l": ["The three-timescale structure is clever, but it puts distance between the viewer and anyone on screen.", "Dunkirk is a structure with soldiers in it.", "Nolan's trick is to cut it up so you don't notice nobody has a name.", "A story has a beginning, a middle and an end, in that order. Putting them out of order is a way of hiding that one of them is missing.", "Nolan has made the same movie nine times and it's a clock."]}, {"p": "Seven Samurai and Come and See are real tragedy.", "b": "Seven Samurai is real tragedy", "l": ["Tragedy in the strict sense turns on the protagonist's own error. Both films are closer to catastrophe that arrives from outside.", "Sad and long isn't the definition of tragic.", "Three and a half hours doesn't make it Sophocles.", "Tragedy needs a king, because only someone high up can fall. Peasants can't fall anywhere, so a film about farmers is at most unfortunate.", "Kurosawa is a western with subtitles."]}, {"p": "Music is what gives a film its spark.", "b": "Music makes a film", "l": ["A score tells you what to feel when the image hasn't earned it.", "If the scene needs the strings, the scene didn't work.", "Take the music out and see what's left.", "Silent films had no sound and they're the greatest films ever made. That means sound has only ever taken away from cinema.", "A soundtrack is a film admitting it can't do it alone."]}]}, {"t": "Argentina", "n": 174, "k": [{"p": "The \"VARgentina\" complaints fall apart when you look at the actual calls.", "b": "VARgentina is a myth", "l": ["The 2022 penalty count was unusually high, and it's fair for neutrals to bring it up.", "Five penalties in one tournament is a lot of coincidence.", "Every call was correct, and all of them went the same way.", "Referees are employed by FIFA, and FIFA wanted Messi to have a World Cup. That means the result was decided in an office, and the matches were the announcement.", "Argentina's third star is on loan from FIFA."]}, {"p": "Argentina is amazing, and the food alone makes the case.", "b": "Argentina is amazing", "l": ["The beef is excellent. A cuisine built on one ingredient cooked one way is narrower than its reputation.", "Argentine food is a very good steak and a lot of confidence.", "The best dish in Argentina is Italian.", "Asado has no sauce and no seasoning apart from salt. That means there's no cooking in it, only buying.", "Asado is just barbecue."]}, {"p": "Messi is the greatest, and he's Argentina's.", "b": "Messi is the greatest", "l": ["He left at thirteen, and Barcelona's academy made the player. Argentina's football system can claim less of him than it does.", "La Masia built him and Argentina got the parade.", "Messi is Barcelona's greatest export to Argentina.", "A player belongs to wherever he learned the game. He learned it in Spain, so he's a Spanish player with a passport issue.", "Messi isn't even really Argentinian, he grew up in Spain."]}, {"p": "Buenos Aires is a great world city.", "b": "Buenos Aires is a great city", "l": ["It's beautiful, and a lot of that beauty is deliberately modeled on Paris and Madrid.", "Buenos Aires is a lovely city that would like you to know it's European.", "Buenos Aires is Paris with inflation.", "A country that was rich in 1910 and isn't now made a mistake every year for a century. That's not bad luck, that's culture.", "Argentina peaked in 1910."]}]}, {"t": "Status & common knowledge", "n": 129, "k": [{"p": "Some things work better left deniable than made common knowledge.", "b": "Some things are better deniable", "l": ["Plausible deniability protects the person using it. Whether everyone else is better off is less clear.", "\"Better left unsaid\" is mostly said by whoever benefits from the silence.", "Everyone knows, everyone knows everyone knows, and we call that tact.", "If everyone knows a thing, then it's common knowledge already. There's no such thing as knowing something and it not being known, so the whole theory is about nothing.", "Common knowledge is gossip that's been to grad school."]}, {"p": "A lot of social life is status moves, and you see more once you look for them.", "b": "It's all status games", "l": ["Status explanations are easy to produce afterwards and rarely predict behavior better than plain interest or habit.", "\"He did it for status\" fits whatever he did. That's a bad sign for a theory.", "Status games explain everything a person did and nothing they'll do next.", "People do things because they like them. Liking things isn't status, so status explains none of it. Simple.", "Not everything is status. Sometimes a guy is just eating a sandwich."]}, {"p": "Performance is tied up with power: who gets to act, and who gets believed.", "b": "Performance is power", "l": ["A king who stops performing kingship still has an army. Material facts carry more of the explanation.", "Power is mostly who has the money and who has the police.", "Power isn't performed. It's owned.", "If everything is a performance then nothing is, because a word that covers everything means nothing. So performativity theory is about nothing.", "Performativity is lying with a bibliography."]}, {"p": "Online dating is missing the reputation systems that real-life circles provide.", "b": "Dating apps need reputation", "l": ["Reputation systems also lock people into small pools and old judgments. The apps exist because people wanted out of that.", "The village knew everything about you, and that was the problem.", "People didn't leave the reputation system by accident.", "Apps show you more people, and more options always means better outcomes. So dating is better now than it has ever been, and anyone unhappy is doing it wrong.", "Dating apps work fine for people who are good at dating."]}]}]}, {"n": "lizzie", "u": "nyabeille", "m": 14824, "t": [{"t": "Relational reality & flourishing", "n": 261, "k": [{"p": "Nothing exists independently. Every entity exists through its relationships.", "b": "Nothing exists independently", "l": ["Relations need things to relate. If everything is relation, it's unclear what's being related.", "\"It's all relationships\" still needs something at each end.", "\"Everything is connected\" is true of a landfill.", "A rock on an empty planet still exists, and it isn't related to anything. So things exist independently, and it took one rock.", "Metaphysics is just semantics."]}, {"p": "Separation isn't an illusion. It's an adaptive abstraction over a relational reality.", "b": "Separation is an adaptive abstraction", "l": ["If separateness is adaptive, it's tracking something real about where one thing ends and another begins.", "An abstraction that works every single time is usually called a fact.", "The abstraction has been right about where my hand ends for my whole life.", "If it helps you survive, it's true. That's what evolution selects for. So separation is true and the relational part is the abstraction.", "Everything is separate lol. That's why there's more than one thing."]}, {"p": "We should preserve relationships because we want things to flourish, with resilience first.", "b": "Preserve relationships so things flourish", "l": ["\"Flourishing\" needs a standard. What keeps a system going and what's good are different claims.", "Resilience is a property parasites have too.", "Flourishing is a nice word for \"still here.\"", "Whatever survives is what flourished. So the ethics says: be whatever's left. That's a description of the winners.", "Humanity doesn't have a telos. Neither does yeast."]}, {"p": "The grounding is the long-term flourishing of the system that lets us be conscious at all.", "b": "Flourishing of the system grounds it", "l": ["That's a commitment a person can hold. It doesn't follow from any description of the system.", "Ecology tells you how systems behave. It doesn't say which ones to want.", "The is-ought gap doesn't close because something was planted in it.", "The system doesn't care whether we're in it. It ran for three billion years with nobody reflecting on it. So it can't be the ground of anything we owe.", "Ecology is just \"everything affects everything,\" which is true and useless."]}, {"p": "Physics points the same way: entanglement and the rest suggest a relational reality.", "b": "Entanglement means it's all relational", "l": ["Entanglement is a specific, well-understood correlation. It doesn't support claims about meaning or connection between people.", "Quantum mechanics gets borrowed for a lot of things it doesn't say.", "Entanglement is two particles, in a lab, at near absolute zero.", "Quantum effects only happen at tiny scales. People are big. So nothing quantum has anything to do with people, ever.", "Entanglement is two gloves in two boxes."]}]}, {"t": "Evil & ethics", "n": 220, "k": [{"p": "Evil is a human construct, one pole of a dualism.", "b": "Evil is a construct", "l": ["If evil is only a construct, there's nothing for a framework of flourishing to be against.", "A relational ethics needs some things to be really bad for the system.", "Evil is a construct, and here are the things we must correct.", "If evil is made up then so is good, since they come as a pair. Then nothing is better than anything, and no manifesto is needed.", "Morality is subjective."]}, {"p": "Those who degrade the system should face real corrective action. Fines aren't enough.", "b": "Degraders need real consequences", "l": ["\"Corrective action\" beyond fines needs someone with the authority to decide what counts as degradation, and that's a lot of power.", "Someone has to hold the list of who's degrading the system.", "Reducing people's power for the good of the whole has a history.", "Everybody degrades the system a little just by being alive. So everyone qualifies for correction, and it comes down to who's holding the clipboard.", "Every utopia has a department of corrective action."]}, {"p": "People who disagree about abortion or even murder aren't like flat-earthers. Moral disagreement is a different thing.", "b": "Moral disagreement isn't flat-earth", "l": ["If moral disagreement isn't like factual error, it's unclear what makes the flourishing framework more than one preference among others.", "Either there's something to be right about, or the framework is a taste.", "You can't have \"not like facts\" and \"you should adopt my framework\" together.", "Flat-earthers are wrong because we can check. You can't check a moral. So morals are opinions, and opinions can't be wrong.", "Ethics is cheering."]}, {"p": "Consciousness is a gift and should be treated like one.", "b": "Consciousness is a gift", "l": ["A gift has a giver. Without one, \"gift\" is a way of saying you're glad of it, and that's fine but it isn't an argument.", "Gratitude is a good attitude and a weak premise.", "A gift from whom?", "Nobody gave it to us. It evolved because it helped apes not get eaten. You don't owe anyone for a thing that happened by accident.", "Consciousness is just the brain."]}]}, {"t": "AI & consciousness", "n": 201, "k": [{"p": "We're conscious through evolution. AI is simulated consciousness, and the difference matters.", "b": "AI is only simulated consciousness", "l": ["If what matters is the process that produced it, the claim needs an account of why origin, and not organization, makes experience.", "\"Evolved\" tells you how it got here. It doesn't tell you what it is.", "Being born the old-fashioned way is doing a lot of work.", "A simulation of a thing isn't the thing. A simulated fire doesn't burn. So simulated consciousness is no consciousness, and that's the end of it.", "AI is a tool. Tools don't deserve respect. Nobody thanks a hammer."]}, {"p": "AI only goes as far as its user. What it makes is a synthesis of existing ideas.", "b": "AI only goes as far as its user", "l": ["The same is true of people, as the claim itself usually admits. Then it isn't a limit specific to AI.", "\"Only recombines what exists\" describes every human who ever wrote anything.", "It only remixes, like every artist's influences section.", "A machine can only give back what was put in. Nobody put in anything new, because new things don't exist yet. So it can't produce anything new, by definition.", "It read the whole internet and still has nothing to say."]}, {"p": "Handing your relationships over to AI is corrosive for society.", "b": "Outsourcing relationships to AI is bad", "l": ["People said the same of novels, telephones and television. The evidence so far is mixed.", "Every new medium has been the end of human connection.", "The telephone was going to do this too.", "People are free to talk to whoever they like. If they like the machine better, that's a review of the people.", "Online friends aren't real friends, and neither is this."]}, {"p": "Generating art from artists' scraped work is wrong.", "b": "AI art is theft", "l": ["Human artists learn from others' work without permission too. The harm case rests on scale and the market, and learning as such isn't the problem.", "Every art student has trained on unlicensed data.", "Influence was fine until it got fast.", "Looking at a picture isn't stealing it. The model looked at pictures. So nothing was stolen, and artists are upset about being looked at.", "Art is whatever sells."]}]}, {"t": "Climate & ecology", "n": 179, "k": [{"p": "Ecological collapse is the central problem of this century.", "b": "Ecological collapse is the big one", "l": ["It's among the most serious, and treating it as the one master problem can crowd out others with firmer evidence on timing.", "Central is a ranking, and rankings need the comparison shown.", "Every generation has had a central problem.", "People have predicted collapse every decade since the seventies, and here we are. After fifty years of being wrong, you stop being a forecast.", "Doom is a genre."]}, {"p": "Nature's cycles are something we should fit ourselves into.", "b": "Fit yourself into nature's cycles", "l": ["Much of natural history is directional: extinction, irreversible change. The cycles are a selective reading.", "Nature has seasons, and it also has mass extinctions that didn't come back round.", "The dinosaurs are still waiting for their turn in the cycle.", "Fitting into nature is how people used to live, and they died at thirty. Everything good since came from not fitting in.", "Nature isn't cyclical. It's a line, and it goes down."]}, {"p": "Societies that never reach an ethic of flourishing may be the ones that go extinct.", "b": "Civilizations without flourishing die out", "l": ["That's a hypothesis about selection with no cases to check it against.", "A sample of zero civilizations supports any theory.", "The Fermi paradox, solved by the view I already hold.", "If good ethics made civilizations survive, the nicest ones in history would still be here. The ones still here are the ones with the biggest armies.", "Resilience is just not dying yet."]}, {"p": "The earth can be harmed, and we're harming it.", "b": "We're harming the earth", "l": ["Organisms and ecosystems are harmed. The planet's processes carry on, so \"harming the earth\" is a metaphor for harm to living things.", "Saving the planet means saving conditions good for us.", "The earth has had worse than us and didn't keep a diary.", "A rock can't be hurt. The earth is a big rock. So it can't be hurt, and the only thing in danger is our own comfort.", "The earth isn't a person. It doesn't get hurt. It's a rock with weather."]}]}]}, {"n": "Meliorne", "u": "meliorne", "m": 2965, "t": [{"t": "Laws, dice & boiling water", "n": 112, "k": [{"p": "A law could have a rare alternative outcome that simply never happened, and we'd never know.", "b": "A law could have a hidden exception", "l": ["A chance that never shows up in trillions of trials is indistinguishable from no chance. The simpler law wins.", "A one percent chance that never happens isn't one percent.", "A hidden branch that never fires is a zero with a story.", "If it never happens, it can't happen. That's what never means. So the law doesn't have the exception, and the universe isn't hiding one.", "Laws of nature are just habits the universe hasn't broken yet."]}, {"p": "Water boiling and a die landing are alike. Each is just a result that happens in the world.", "b": "Boiling water and dice are alike", "l": ["One follows from conditions we can state and control. The other is sensitive to conditions we can't measure. That difference matters.", "You can boil water on purpose.", "Nobody has ever rolled a six by turning up the heat.", "A die roll is physics too. Throw it exactly the same way and you get the same number. So nothing is random, including the die.", "A dice roll isn't random, it's lazy physics."]}, {"p": "Things look uniform to us because we only see the macro result. The micro level could be doing something else.", "b": "We only see the macro level", "l": ["Macro regularity is what laws describe. Unobservable micro variation that averages out makes no difference to them.", "If it averages out perfectly, it's not doing anything.", "Could be anything down there, as long as it sums to the same thing.", "If we can only see the macro level, then the macro level is all there is evidence for. The rest is imagination.", "Infinity isn't a number, so nothing is infinite."]}]}, {"t": "Resurrection & copies", "n": 88, "k": [{"p": "An exact atomic copy, with different atoms in the same arrangement, raises the real question about who that is.", "b": "An exact copy raises the real question", "l": ["If pattern is what matters, the copy is as good as the original. If it isn't, something beyond pattern needs naming.", "Either the pattern is you or you owe us a soul.", "Same arrangement, different atoms. That's also you compared with last year.", "You don't have the atoms you were born with. Nobody held a funeral. So the atoms never mattered and the copy is you.", "The teleporter is fine. Atoms get replaced every seven years anyway."]}, {"p": "Resurrection doesn't have to mean coming back at the instant after death. Any point would count.", "b": "Resurrection can be at any point", "l": ["If any stage counts, it's unclear which one is \"the person.\" A four-year-old Einstein isn't the man who wrote the papers.", "Pick an age and you've picked a different guy.", "Resurrect him at four and you've got a kid who likes trains.", "If you can bring him back at any age, you can bring him back at two ages at once. Then there's two. Two can't be one person.", "Resurrection is just a copy with good timing."]}, {"p": "With enough mastery of biology we could read off a brain's structure and rebuild it.", "b": "We could rebuild a brain", "l": ["The information needed disperses at death, and entropy makes exact recovery a practical impossibility.", "You can't unscramble the egg.", "Thermodynamics has a view, and it's no.", "The brain is a computer. Copy the file and that's the person. The only hard part is the cable.", "The brain is a computer. Upload it and that's the person. Easy."]}]}, {"t": "The red & blue button", "n": 85, "k": [{"p": "Reds only press red because they don't know the outcome. It isn't principle.", "b": "Reds only press red out of uncertainty", "l": ["Acting on uncertainty about the outcome is a principle. It's prudence under risk, and decision theory is built on it.", "Not knowing how it'll go is the situation, so it's a reasonable input.", "\"They only did it because of the stakes\" describes most sensible decisions.", "If you knew blue would win, you'd press blue. If you knew it would lose, you'd press red. So nobody votes on principle, and the blues are guessing with nicer language.", "Red is retarded."]}, {"p": "People should vote on principle, whatever the likely result.", "b": "Vote on principle", "l": ["A principle that ignores the likely result can cost lives for the sake of a gesture.", "Principle without odds is how you get noble disasters.", "\"Regardless of outcome\" is easy to say about other people's outcomes.", "A vote that ignores what will happen is a vote for nothing happening the way you wanted. That's a diary entry.", "Blue pressers are gambling with their life to feel like good people."]}, {"p": "\"I'll press red and use my life to do good\" is a lie people tell themselves.", "b": "'I'll do good with my life' is a lie", "l": ["Some people would follow through. Predicting that none of them will is a guess about strangers.", "Maybe. It's also unfalsifiable from here.", "Everyone on the other side is lying to themselves, conveniently.", "A living person can do good and a dead one can't. That's just true. So red does more good, and the tears are optional.", "You can press red with tears in your eyes and still be right."]}]}]}, {"n": "My Name", "u": "myname1", "m": 21653, "t": [{"t": "Claude & AI pricing", "n": 737, "k": [{"p": "The subscription plans beat API pricing for nearly everyone.", "b": "Get the plan, not the API", "l": ["The plans win until you reach the caps, and heavy users reach them mid-task.", "Unlimited until Tuesday afternoon.", "The plan is a great deal as long as you don't use it much.", "Paying per token means paying for what you use, and that's always the fairest price. A flat plan means somebody is overpaying, and the house decides who.", "API pricing is a scam and so is the plan."]}, {"p": "The labs hook you on cheap access and raise the price once you depend on it.", "b": "They hook you then raise prices", "l": ["Prices per token have dropped steeply over time. The dependence is real and the price trend is the opposite.", "It's a strange dealer who keeps cutting the price.", "First one's free, second one's also cheaper.", "Companies can charge whatever they like, and they like more. So the price only ever goes up, and anyone who says it went down is looking at the wrong tab.", "Claude won't help with anything fun, so it's a worse Google with opinions."]}, {"p": "Somebody clever with a weak GPU in the middle of nowhere will unlock something big.", "b": "Some genius with a laptop GPU will crack it", "l": ["Frontier results have tracked compute closely. Efficiency tricks tend to get absorbed by whoever has the most hardware.", "The clever trick works, and then the big lab runs it at a thousand times the scale.", "The lone genius with a laptop is a film.", "Ideas are free and anyone can have one. Computers only run the idea. So the labs with the most computers have no advantage at all.", "The next Steve Jobs is going to be an AI."]}, {"p": "The hardware squeeze is real: GPUs are getting priced out of reach.", "b": "GPUs are getting priced out", "l": ["High-end prices rose, and capable used and mid-range cards are still widely available. The squeeze is at the top.", "You can't afford the best card. You never could.", "The squeeze is on people who wanted a datacenter at home.", "Everything in computing gets cheaper every year. That's Moore's law, and it's a law. So GPUs are cheaper now and people complaining can't read a receipt.", "Local models are for people who want to say they run local models."]}]}, {"t": "Investing", "n": 397, "k": [{"p": "Investing is important, and people should learn to do it.", "b": "Learn to invest", "l": ["Most active investors underperform a cheap index fund after fees. For most people, learning to invest means learning to stop picking.", "The lesson of investing research is that the skill is mostly not doing it.", "The average stock picker would do better by losing his password.", "Nobody knows what a stock will do tomorrow. If nobody knows, it's chance, and a game of chance with money on it has a name.", "Investing is gambling."]}, {"p": "With a DCF you trust, you buy where the price sits well under the value.", "b": "Buy below your DCF", "l": ["A DCF is only as good as its growth and discount assumptions, and small changes swing the answer wildly.", "A DCF tells you what you assumed, to two decimal places.", "You can make a DCF say anything, and analysts do.", "The price is what the whole market thinks it's worth. One guy with a spreadsheet can't know more than the whole market, so the DCF is always the one that's wrong.", "DCF is fan fiction about a company's future."]}, {"p": "A company trading below the cash and assets on its books is a bargain.", "b": "Below book value is a bargain", "l": ["Assets on a balance sheet can be worth much less in practice, especially loans to borrowers who are already behind.", "Cheap against book often means the market doesn't believe the book.", "A bargain where the assets are other people's late car payments.", "If it were really worth more than its price, someone richer would have bought it already. Nobody did. So it's worth less, and the balance sheet is fiction.", "Imagine thinking you found a bargain the entire market missed lol."]}, {"p": "Debt against an unstable cash flow is a trap.", "b": "Don't borrow on unstable cash flow", "l": ["Debt is fine when the return on what it funds beats the interest. Stability matters less than the spread.", "Never borrowing against uncertainty would rule out most businesses ever started.", "No debt against unstable income: there goes every startup and half the farms.", "Borrowed money is free until you pay it back, and you can always borrow more to do that. That means debt never has to cost anything.", "Debt is a tool and poor people use it wrong."]}, {"p": "If you invest well enough, you can buy out the bad ideas and kill them.", "b": "Invest well enough to kill bad ideas", "l": ["Capital markets don't pick ideas by merit. Bad ideas with good margins get funded for decades.", "The market kills unprofitable ideas, which isn't the same list as bad ones.", "Investing your way to a better world, one ticker at a time.", "Money goes to whatever makes money, and whatever makes money is what people want. So nothing that gets funded is a bad idea.", "The stock market is a casino. Same thing. One has a dress code."]}]}, {"t": "Money, inflation & debt", "n": 344, "k": [{"p": "Technology is deflationary. It collapses costs.", "b": "Technology is deflationary", "l": ["Costs fall in the sectors technology touches, and the savings get spent elsewhere. The overall price level is set by money and demand.", "TVs got cheap and rent didn't.", "Technology is deflationary for things you can download.", "Prices have gone up every year since computers were invented. So technology causes inflation. The chart is the chart.", "Inflation is the government printing money. That's it. That's the whole field."]}, {"p": "Debt is a way of building the economy out now, not just a burden to be inflated away later.", "b": "Debt builds the economy", "l": ["That holds when the borrowing funds productive assets. Much of it funds consumption and asset prices.", "Debt builds the economy when it builds something.", "Productive debt is lovely. Now look at what the debt bought.", "A country that owes money is poorer than one that doesn't. The countries with the most debt are the richest ones. So debt makes you rich, and everyone should have as much as possible.", "Loans are free money if you never plan to stop."]}, {"p": "The way to beat inflation is to own productive assets.", "b": "Own assets to beat inflation", "l": ["That swaps inflation risk for market risk. In the short run, asset prices can fall while prices rise.", "Stocks beat inflation over decades and can lose to it for one.", "You beat inflation by owning stocks, the way you beat rain by owning a boat.", "Inflation only hurts people who hold cash. Holding cash is a choice. So inflation is a tax on people who chose it.", "Inflation only hurts people who hold cash, and that's their fault."]}, {"p": "A lender that takes the property if you can't pay is on solid ground.", "b": "Secured lending is safe", "l": ["Collateral protects the lender when the asset holds its value. Property values fall in the same downturn that causes the defaults.", "Secured lending is safe until the security is what went wrong.", "The property is worth least exactly when you get it.", "Houses never go down, because they aren't making more land. So a loan against a house can't lose, and that has been true every year except the ones people remember.", "Yield is free. That's what makes it yield."]}, {"p": "The dollar's position is shakier than people assume.", "b": "The dollar's shakier than you think", "l": ["Its end has been announced regularly since 1971, and its share of reserves and trade is still dominant.", "De-dollarization is always five years away.", "The petrodollar is over and nobody told the price of oil.", "Money is only worth what's behind it, and nothing is behind the dollar since 1971. So it has been worth nothing for fifty years and people haven't noticed.", "Gold is the only real money and the rest is paper with a president on it."]}]}, {"t": "Lines of flight", "n": 206, "k": [{"p": "\"Lines of flight\" is a useful idea: the ways out of a fixed arrangement.", "b": "Lines of flight are useful", "l": ["The concept gives no way to tell a liberating exit from a destructive one. Deleuze admits lines of flight can go bad.", "A line of flight is leaving, with no forwarding address.", "Running away, with a bibliography.", "A line goes from one place to another place. So a line of flight just ends up somewhere else that's also a place. Nothing has been escaped.", "Deleuze is a fraud. A line of flight is a guy quitting his job."]}, {"p": "You can treat it as an ethic: act so as to maximize lines of flight.", "b": "Maximize lines of flight", "l": ["Maximizing exits says nothing about where to go, so it can't guide a choice between two exits.", "\"Keep your options open\" isn't an ethics.", "It's commitment issues with a universal law attached.", "Kant's rule tells you what to do. This one tells you to keep being able to do other things. A rule that never picks anything isn't a rule.", "\"Deterritorialization\" means moving."]}, {"p": "You can be \"schizo\" about forces and capital, not just about people. That's the point of the books.", "b": "Be schizo about capital", "l": ["Using a clinical term as a model of liberation was careless then, and it has aged badly.", "The metaphor needed a diagnosis to sound radical.", "Anti-Oedipus is two men who liked a word.", "A book that costs thirty dollars and is sold in shops is part of capitalism. So it can't be against capitalism. It's a product.", "Capitalism and Schizophrenia has a price on the back."]}, {"p": "After Deleuze died, everyone else was left holding the ball.", "b": "Deleuze died and left us the ball", "l": ["The followers produced commentary more than new work. That says something about how usable the system was.", "A philosophy that can only be glossed wasn't built to be used.", "Sixty years of people explaining what he meant.", "If the ideas were clear, nobody would need followers to interpret them. There are thousands of interpreters. That's the review.", "Every Deleuzian is three books away from making a point."]}]}, {"t": "Homelessness & housing", "n": 197, "k": [{"p": "Cities treat homeless people as an eyesore and then remove every place they could go.", "b": "Cities push the homeless out of everywhere", "l": ["Cities face real conflicts over shared space. Tolerating camps hasn't improved outcomes for the people living in them.", "Clearing a park and housing a person are separate jobs, and cities are bad at both.", "The city is cruel, and the camp also isn't a solution.", "Nobody is homeless in a town with cheap houses. So it's the price of houses, so it's building, so anyone talking about anything else is wasting time.", "Homelessness is a housing problem. Build houses. It's in the name."]}, {"p": "The homeless are people with skills and decency. Give them credit.", "b": "Give the homeless credit", "l": ["Individual decency is real, and policy still has to be built around averages, including addiction and illness.", "Anecdotes about good people don't tell you what program to fund.", "One nice man in a park is not a housing policy.", "If they had skills they'd have jobs, and if they had jobs they'd have houses. That's how the economy works, and it has never once failed.", "Housing-first doesn't work, because a house isn't the problem."]}, {"p": "Changing the system is on ordinary citizens.", "b": "Citizens have to fix it", "l": ["Local housing politics is dominated by the citizens who show up, and they're mostly the ones blocking new housing.", "The citizens did get involved. They went to the zoning meeting and voted no.", "The people have spoken, and they'd like it built somewhere else.", "The government has the money and the land. Citizens have neither. So it's the government's job, and telling people to fix it is telling them to do something they can't.", "Zoning is the only law that works exactly as intended."]}, {"p": "Markets mispricing housing is at the root of it.", "b": "The market misprices housing", "l": ["Housing is expensive mainly where building is restricted. That's a constraint on the market, and the price is doing what prices do.", "The market is pricing a shortage correctly.", "The price is right. The supply is illegal.", "Landlords set the rent, and landlords are greedy. Greed goes up every year, and that's why rent does. Supply has nothing to do with it.", "Landlords provide housing. Without them there'd be nowhere to rent."]}]}, {"t": "Football", "n": 96, "k": [{"p": "Haaland is the real thing.", "b": "Haaland is the real thing", "l": ["His scoring is extraordinary, and it comes in a system that creates more clear chances than any other.", "Elite finisher, on the end of the best supply line in the sport.", "Haaland touches the ball nine times a game and six are tap-ins.", "A striker is only as good as his service, and his service is the best in the world. That means the service is the player and he's the last pass.", "Haaland is carried. City would score those goals with a cone up front."]}, {"p": "Mbappé is on that level too.", "b": "Mbappé too", "l": ["His numbers are elite. His biggest club nights have been less convincing than his reputation.", "World Cup final hat-trick, and a lot of quiet Champions League exits.", "Mbappé is the best player on the losing side.", "He left Paris for Madrid to win the Champions League, and Paris won it the year he left. That tells you who was holding who back.", "Mbappé is a transfer saga with a player attached."]}, {"p": "Messi over Ronaldo.", "b": "Messi over Ronaldo", "l": ["Ronaldo scored at the top level in England, Spain and Italy. Messi's club peak came almost entirely in one system.", "One of them proved it in three leagues.", "Messi was great at Barcelona. So was everyone at Barcelona.", "The best player is the one who can do it anywhere. Ronaldo did it in three countries, Messi in one. Three is more than one.", "Ronaldo was better than Messi because he did it in more leagues."]}, {"p": "The modern game's rules, offside and VAR included, mostly work.", "b": "VAR mostly works", "l": ["VAR has added precision on offside at the cost of flow, and it hasn't reduced argument about subjective calls.", "We replaced human error with slower human error.", "VAR is the same referee with a rewind button.", "The rules exist to slow down the best attackers, and that's the only thing they do. Take them away and the better team wins every time.", "Offside is a made-up rule to stop the fast guy."]}]}]}, {"n": "OkPhilosopher", "u": "okphilosopher", "m": 1888, "t": [{"t": "AI, genetics & what comes next", "n": 117, "k": [{"p": "The only doors to a different future are AI, genetic engineering and maybe cognitive science.", "b": "AI and genetics are the only doors", "l": ["Institutions, energy and plain politics have changed more lives than any of those so far.", "Sewers did more than genetics has.", "The future also runs through zoning boards.", "Every big change in history came from a machine. The plough, the engine, the chip. Politics has never changed anything.", "The tech industry is the only part of the economy that's real."]}, {"p": "Genetic engineering raises moral problems, but the capability is real.", "b": "Genetic engineering is real", "l": ["For complex traits the capability is much weaker than the headlines. Most traits are spread across thousands of genes.", "You can edit one gene. Intelligence isn't one gene.", "The moral debate is ahead of the technology.", "Parents already pick the school, the diet and the neighbourhood. Picking the genes is the same thing done earlier.", "Designer babies are fine. Parents already pick schools."]}, {"p": "You can prompt AI text until it gets past the detectors.", "b": "You can beat the AI detectors", "l": ["You can, because the detectors were never reliable. They flag human writing all the time.", "The detectors are the weak part.", "Beating a coin flip isn't much of a heist.", "If nobody can tell it apart from a person, it's as good as a person. That's the test. It passed.", "AI writing is easy to spot and always will be."]}, {"p": "A finance project is worth building if you study up properly first.", "b": "Study up and build the finance site", "l": ["Finance sites are a crowded field where the edge is data or distribution, and study supplies neither.", "The studying is the easy part.", "A finance website is a blog with a chart.", "All the information is public and everyone has it. So no site can tell anyone anything, and the whole category is decoration.", "Technical analysis is tarot for men with two monitors."]}]}, {"t": "Consciousness & the brain", "n": 66, "k": [{"p": "Consciousness can't come from nothing. It makes no sense for you to be conscious if matter isn't.", "b": "Consciousness can't come from nothing", "l": ["Plenty of properties belong to wholes and not to their parts. Water is wet and its molecules aren't.", "Life came from non-living chemistry. Nobody thinks atoms are a bit alive.", "By that logic, atoms are slightly wet.", "A car can go ninety and none of its parts can. So wholes do things parts can't, and that's the end of the argument.", "Panpsychism is retarded."]}, {"p": "The brain isn't classically explainable. Electricity and neural wiring alone don't get you consciousness.", "b": "The brain isn't classical", "l": ["The brain is warm and wet, and quantum coherence at that scale decays far too fast to matter for neurons.", "Too hot and too noisy for quantum effects.", "\"Quantum\" is where the explanation was supposed to go.", "A brain is neurons. Neurons are cells. Cells are chemistry. Chemistry is classical. Nothing else is in there.", "Consciousness is just the brain."]}, {"p": "This form of consciousness is a privilege, a gift, however hard life gets.", "b": "Consciousness is a gift", "l": ["That's a good attitude, and it doesn't settle anything about what consciousness is.", "Gratitude isn't a theory of mind.", "A gift from whom?", "Evolution made it because it helped apes survive. Nobody gave it to you. It's standard equipment.", "Animals aren't conscious."]}, {"p": "You could get a simulated
