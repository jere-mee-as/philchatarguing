fly brain to learn things, given enough compute.", "b": "A simulated fly brain could learn", "l": ["The fly connectome has been mapped. Getting a simulation to behave like a fly is still a long way off.", "We have the wiring diagram and not the fly.", "A map of a brain is a map.", "If you simulate every neuron, you've got the fly. A fly is its neurons. So it's a fly, and you owe it sugar.", "Neurons aren't special. A brain is slow, wet, and wrong most of the time."]}]}]}, {"n": "monkey", "u": "papagaio", "m": 40832, "t": [{"t": "Brazil", "n": 357, "k": [{"p": "You can't judge Brazil without knowing the context: development, rural migration, how the politics got this way.", "b": "You need the context to judge Brazil", "l": ["Every country has context. At some point outcomes are fair to judge alongside the history that explains them.", "\"It's complicated\" is true of everywhere, and other places still get results.", "Brazil has had context for five hundred years.", "A country is its results. Brazil's results are in, and they've been the same since before anyone alive was born, so there's nothing left to explain.", "Brazil is not a serious country."]}, {"p": "São Paulo and Rio are different worlds. One faction runs things in São Paulo. Rio is a turf war.", "b": "São Paulo and Rio are different worlds", "l": ["From outside, the difference between one crime monopoly and four competing ones is a detail.", "Both cities are run in part by organizations that aren't the government. The org chart varies.", "São Paulo has better-organized crime, which is a strange thing to be proud of.", "A city is either safe or it isn't. Neither is, so they're the same city with different beaches, and one of them doesn't have a beach.", "Rio is São Paulo for tourists and São Paulo is Rio for people with jobs."]}, {"p": "Brazilians aren't \"Latino\" in the sense Americans mean.", "b": "Brazilians aren't Latino", "l": ["Whatever the census says, Brazil shares the colonial history, the religion and most of the politics of its neighbors.", "The language is different. Nearly everything else is familiar.", "Brazil is Latin America's biggest country, insisting it's just visiting.", "Latin America means the part of America that speaks a Latin language. Portuguese is one. That means Brazilians are the most Latino of all, since there are more of them.", "Portuguese is just bad Spanish."]}, {"p": "Lula and Bolsonaro are not the same thing.", "b": "Lula and Bolsonaro aren't the same", "l": ["Both governed through the same congressional bloc and the same pork. The rhetoric differs more than the method.", "Whoever wins in Brazil ends up paying the same centrists.", "Different speeches, same Congress.", "In Brazil the Congress decides everything and the president signs. So it doesn't matter who the president is, and it never has.", "Lula and Bolsonaro are the same guy with different hats."]}, {"p": "South American agriculture is more efficient than Europe's or America's.", "b": "South American farming is the most efficient", "l": ["Yields are high, partly on cleared land and loose enforcement. Efficiency figures look different when that's priced in.", "It's easy to be efficient when the forest isn't on the invoice.", "The world's most efficient farms, on what used to be the world's largest rainforest.", "Farming is putting seeds in the ground, and Brazil has the most ground. So it's size. A country can't take credit for being big.", "Farming is easy. Plants want to grow."]}]}, {"t": "Europe & gringos", "n": 217, "k": [{"p": "European climate rules are partly a pretext for hobbling South American farming.", "b": "EU climate rules target South American farms", "l": ["The deforestation rules apply to European producers too, and the science behind them isn't a trade invention.", "A rule can protect domestic farmers and be right about the forest. Both are possible.", "It's protectionism, and the trees are also real.", "Europe has no forests left, so it has nothing to lose from forest rules. That means the rules are free for them and only cost Brazil, which proves the motive.", "Europe peaked and it's a museum now. Brazil never peaked, which is worse."]}, {"p": "Gringos don't get Brazil.", "b": "Gringos don't get Brazil", "l": ["Outsiders miss a lot. Insiders miss things too, and in more flattering directions.", "Every country thinks foreigners don't get it. Sometimes the foreigners see it fine.", "You don't need to be from somewhere to read its statistics.", "If only Brazilians can understand Brazil, then nobody can check what they say about it. That's convenient, and it's why the country never has to explain itself.", "The best thing about Brazil is leaving it and missing it."]}, {"p": "Portugal and Brazil are their own things now. The colonial link doesn't define either.", "b": "Portugal and Brazil are separate now", "l": ["Language, law, religion and a lot of the class structure came over on the boats and stayed.", "The link doesn't define Brazil, and Brazil still speaks it every day.", "Brazil is Portugal's most successful export and its biggest critic.", "A colony is a copy of the country that founded it. Copies are always worse than the original, so Brazil is a worse Portugal, and Portugal isn't great.", "Brazilian Portuguese is Portuguese with the consonants removed."]}, {"p": "Europe isn't the model it thinks it is.", "b": "Europe isn't the model", "l": ["On health, safety and inequality, most of Europe still outperforms most of the Americas by a wide margin.", "You can find Europe smug and still notice the trains run.", "The museum has working hospitals.", "Small countries are easy to run, and Europe is all small countries. So Europe's success is a matter of size, and it proves nothing about anything.", "Denmark only works because it's small and everyone's cousins."]}]}, {"t": "Football", "n": 147, "k": [{"p": "Brazil's decline tracks the decline of the national team.", "b": "Brazil fell with the national team", "l": ["The team's slump is better explained by European clubs taking players at sixteen than by anything national.", "The national team stopped winning when the domestic league became a showroom.", "The country is fine. The export model for teenagers is the problem.", "Brazil stopped winning in 2002 and stopped mattering in 2002. The same year can't be a coincidence, so the whole country was the squad.", "Brazil is the most overrated football country. Five cups, none since 2002."]}, {"p": "Football is boring, but you watch the national team because you have to.", "b": "Football's boring but you have to watch", "l": ["If the national side is an obligation, that says something about what the sport is doing for people.", "A sport you watch out of duty is a civic ritual.", "Watching out of patriotism is the saddest reason to watch anything.", "If Brazilians find football boring then nobody likes it, since they're the ones who are supposed to. That means the sport is one long misunderstanding.", "Football is ninety minutes of nothing happening and then someone falls over."]}, {"p": "There's more to the game than putting the ball in the goal.", "b": "There's more to football than goals", "l": ["The scoreboard only counts goals, so everything else is in service of that or decoration.", "The other stuff is lovely and doesn't appear in the result.", "Jogo bonito is what you call it when you didn't score.", "The rules say the team with more goals wins. Nothing else is in the rules, so nothing else is in the game.", "Step-overs are for people who can't shoot."]}, {"p": "Pelé still counts as the greatest.", "b": "Pelé is the greatest", "l": ["His totals include friendlies and exhibitions, and the level of his opposition is hard to compare with today's.", "Half the thousand goals were in matches nobody would count now.", "Pelé's record is a number he was counting himself.", "Pelé never played in Europe, and Europe is where the good players are. That means he was never tested, and an untested player can't be the best at anything.", "Messi is better than Pelé and it's not close. Pelé scored against plumbers."]}, {"p": "The current generation, Vini and Endrick and the rest, is good enough.", "b": "This generation is good enough", "l": ["Vinícius has been a different player for Brazil than for Madrid, and the hype around Brazilian teenagers has a poor record.", "For every Endrick who makes it there are ten wonderkids nobody remembers.", "Every Brazilian teenager is the new Pelé until he's 21.", "Ancelotti won everything with Madrid by standing still. Brazil hired him to stand still, and the players aren't Madrid's. So that's that.", "Argentina has better football."]}]}, {"t": "Jiu-jitsu", "n": 141, "k": [{"p": "Rolling with technical people is the point. Strength and size are the lesser game.", "b": "Technique beats size", "l": ["Weight classes exist because size matters a great deal, and technique closes less of the gap than the mats suggest.", "\"Technique beats strength\" is true up to about twenty kilos.", "Technique beats strength until strength shows up.", "If technique beat size there'd be no weight classes. There are weight classes, so size wins, so the art is lifting.", "Jiu-jitsu is hugging with a ranking system."]}, {"p": "New white belts who think they're tough need their egos crushed.", "b": "White belts need humbling", "l": ["Hazing beginners selects for people who put up with it, and that isn't the same as people who'd be good.", "Half the people who'd have been good quit in the first month.", "A gym that's proud of breaking beginners is proud of its dropout rate.", "Somebody who's been training for years beats somebody who started on Monday. That proves nothing about anyone, and they've made a ritual out of it.", "Belts are for holding up pants."]}, {"p": "You can't just shoot for takedowns in BJJ. You'll end up somewhere bad.", "b": "Don't shoot in BJJ", "l": ["That's a fact about the ruleset. With strikes allowed, the wrestler's takedown is the safer bet.", "The risk of shooting is a risk the sport's own rules created.", "\"Don't shoot\" is advice for a game where nobody hits you.", "A takedown puts you on top, and on top is winning. So a sport that's scared of takedowns is scared of winning.", "Wrestlers beat BJJ guys, and they learned it for free in high school."]}, {"p": "Matches are boring for ordinary viewers, and that's fine.", "b": "Boring matches are fine", "l": ["A sport that can't hold a casual viewer has a scoring system rewarding the wrong things.", "Advantages for almost doing something is a design problem.", "Two people protecting a lead of zero.", "A sport is something people watch. Nobody watches this, so it's exercise with a bracket.", "Watching BJJ is watching a hug get reviewed."]}, {"p": "English names every tiny variation of a position. Portuguese gets by with far fewer.", "b": "English names every position", "l": ["More names usually means more analysis. The catalogue is how the technique got refined.", "The naming is how people can teach it online to someone who's never been to Brazil.", "Brazil invented it and America wrote the manual.", "If a position doesn't have a name, nobody can teach it. English has the names, so the Americans are the ones who understand it now.", "BJJ is judo that hired a publicist."]}]}, {"t": "VFX & film work", "n": 135, "k": [{"p": "Post-production is real craft. The audience just doesn't see it.", "b": "Post is real craft", "l": ["A lot of it is cleanup and integration of decisions made by other people, which is skilled, and also secondary.", "The compositor's job is making someone else's shot look planned.", "Fixing it in post, professionally.", "If nobody can see the work, then the work made no difference. That's what \"can't see it\" means. So the craft is invisible because it isn't there.", "Compositing is tracing with more monitors."]}, {"p": "Advertising work is still filmmaking.", "b": "Ads are filmmaking", "l": ["Thirty seconds of a product is a different craft with a different goal. It shares the equipment.", "A commercial is a film the way a jingle is a song.", "Filmmaking for an audience of one client.", "A film is made because someone had something to say. An ad is made because someone had something to sell. Those are opposites, so one of them isn't filmmaking.", "Ads aren't filmmaking."]}, {"p": "A generated clip isn't production-ready. You need proper timecode, clean cuts, the boring correct stuff.", "b": "AI clips aren't production-ready", "l": ["The boring correct stuff is exactly what software is good at. That gap closes first.", "Timecode is not the last line of defense for an industry.", "\"It can't do the tedious part\" is a brave place to make a stand.", "Every objection to AI video is about version one. Version two fixed it, so every objection is already out of date by the time it's said.", "VFX is over. The button exists now."]}, {"p": "Knowing where a take really starts and ends is its own skill.", "b": "Finding the take is a skill", "l": ["It's a skill, and it's also pattern recognition over footage. That's a short list of things machines do well.", "Finding the dead five seconds is not a moat.", "The editor's ear for a cut, soon available as a checkbox.", "A take starts when they say action and ends when they say cut. They say it out loud. It's the one job on set with the answer read to you.", "Editing is deleting the bad parts lmao. Anyone can find the bad parts."]}, {"p": "Tools and pipeline matter. Node graphs, proper color, the right setup.", "b": "Pipeline matters", "l": ["Most shots come out the same in a layer stack. The node graph is for the artist's comfort.", "The audience has never noticed a pipeline.", "A node graph is a layer stack that wants to be looked at.", "Color grading is picking a look, and the looks are orange or grey. That's two options, so it's a switch.", "Color grading is a filter. Instagram has had it since 2011."]}]}]}, {"n": "Pearl", "u": "pearlian.", "m": 11497, "t": [{"t": "Relationships & communication", "n": 368, "k": [{"p": "Women leave more often because they're more willing to walk away from relationships that don't meet basic needs.", "b": "Women leave when needs aren't met", "l": ["The filing statistics are clear. The reading of them isn't, since who files and who caused the breakdown are separate questions.", "Who files is a fact. Why is an interpretation.", "The paperwork doesn't say whose needs weren't met.", "Whoever leaves is the one who ended it. That's what leaving is. So the statistics say who ends marriages, and the rest is PR.", "Divorce is always somebody's fault. People just don't like saying whose."]}, {"p": "Walking away to cool down is communicating, as long as you say that's what you're doing.", "b": "Walking away to cool down is communicating", "l": ["It works when both people trust that the conversation will resume. Used often, it becomes a way to end every hard one.", "\"Let's talk later\" is great if later comes.", "A cooling-off period, renewed indefinitely.", "Communicating means talking. Leaving the room is the opposite of talking. So walking away is not communicating, however nicely it's announced.", "Boundaries are just rules for other people."]}, {"p": "A lot of men's talk about dating is a way of avoiding change.", "b": "Men's dating talk is avoiding change", "l": ["Some of it is. Some of it describes real shifts in education, wages and how people meet.", "Not every complaint is an excuse. Some are data.", "\"They just don't want to change\" is also a way of not looking at the numbers.", "People don't choose to be unhappy. If millions of them are unhappy the same way, something outside them changed. So it's the world, and telling them to improve is telling them nothing.", "Dating was better before apps and everyone who met on an app knows it."]}, {"p": "People should be direct about what they want. Mind-reading isn't a fair thing to expect.", "b": "Say what you want", "l": ["Total explicitness is a standard few people meet. A lot of ordinary closeness runs on inference.", "If everything has to be stated, nothing is ever just understood.", "Radical directness is lovely on paper.", "If you have to be told, it doesn't count. The whole point of knowing someone is not needing the instructions.", "Relationships are simple. Communicate."]}]}, {"t": "Moderation", "n": 272, "k": [{"p": "If someone bothers you, block them. That's the first tool, and it's enough most of the time.", "b": "Just block them", "l": ["Blocking protects the blocker and leaves the behavior in place for everyone else in the room.", "Block solves it for one person at a time.", "\"Just block them\" is moderation by asking everyone to moderate.", "If everyone blocked everyone who annoyed them there'd be no chat, just forty people talking to nobody. So blocking doesn't scale and bans are the only real tool.", "Bans don't work, and blocking works even less."]}, {"p": "When a mod gets tagged in, they review the whole conversation, and whatever stands out is fair game.", "b": "Tag a mod, the whole convo is fair game", "l": ["Reviewing everything means the person who reported can end up the one being examined, and that discourages reporting.", "Report a problem, receive an audit.", "Call the referee and get a card.", "A mod's job is the thing that was reported. Anything else they find is them going through people's messages, and nobody appointed them for that.", "Moderation is having opinions with a button."]}, {"p": "A timeout the chat voted for isn't the mod's doing. That's the community deciding.", "b": "A vote ban is the community, not the mod", "l": ["A vote ban is still a power the mods set up and can override, so responsibility doesn't fully move to the voters.", "The community decided, using the button the mods installed.", "\"I didn't ban him, I just run the place where he got banned.\"", "A vote is the majority deciding. The majority is always right, because that's what majority means. So every vote ban has been correct and nobody can complain.", "A voteban is democracy and people only like democracy as a poll."]}, {"p": "Slurs and insults in chat don't hurt anyone here. The word alone isn't the problem.", "b": "Slurs don't hurt anyone here", "l": ["If words don't matter, tone rules have nothing to rest on, and most moderation is about tone.", "Words don't matter, and here's a warning for your wording.", "The word is fine. The way you said the word is a timeout.", "If the word doesn't hurt anyone, then no word does, and then there's nothing to moderate. A chat where words don't matter doesn't need a mod.", "Rules make chats boring. The best servers have none."]}]}, {"t": "Housing programs", "n": 102, "k": [{"p": "A housing program is there to get people to sustainable housing. If you're able and won't work toward that, there are consequences.", "b": "Able and won't work, there are consequences", "l": ["Conditions screen out the people with the most problems, and that's the group the programs exist for.", "The conditions work well on people who needed the least help.", "Sustainability requirements: a great filter for the easy cases.", "A house is a house. If someone has one, they're housed. Adding conditions means the program isn't about housing, it's about behavior.", "Housing-first doesn't work, because a house isn't the problem."]}, {"p": "Unemployment insurance and local rental assistance are what you reach for first when you lose a job. That's what they're for.", "b": "Use unemployment and rental help first", "l": ["Those systems are slow and patchy, and many people who qualify never get paid in time to matter.", "The safety net pays out some time after you've landed.", "File the form and wait six weeks for a decision on last month's rent.", "If the system worked, nobody would end up on the street. People end up on the street. So the system doesn't work, and telling someone to apply is sending them to a queue.", "Welfare programs exist to employ the people who run them."]}, {"p": "The people these programs serve often can't be handed a tool and a manual. The system has to be built around that.", "b": "Design for people who can't use the manual", "l": ["Designing for the least capable user can end up underestimating most of them.", "Build for people who can't use it, and nobody gets to use it properly.", "The low expectations are part of the program.", "Adults can read a form. If the program assumes they can't, the program is the one with the problem. Treat people as capable and they are.", "Coddling isn't kindness."]}, {"p": "War doesn't make an economy better off. It makes it busier for a while.", "b": "War just makes an economy busy", "l": ["War spending has pulled economies out of slumps and paid for technology that outlasted the war.", "The broken window fallacy is right, and the US still came out of 1945 with half the world's output.", "Busy for a while, and then the interstate, the jet and the internet.", "The US was in a depression, then there was a war, then it was the richest country in history. That's the experiment, and it ran once and worked.", "War is the only stimulus that's ever passed Congress."]}]}]}, {"n": "Simon", "u": "simon_432", "m": 11520, "t": [{"t": "Marx", "n": 294, "k": [{"p": "Marx's analysis doesn't depend on his values. \"Exploitation\" is a technical term.", "b": "Exploitation is a technical term", "l": ["The language of exploitation and alienation is hard to read as neutral, and Marx knew what it would do to a reader.", "He says he's only describing, in the voice of a prosecutor.", "A technical term that happens to make you angry.", "If it's only a description then it doesn't say anything should change. Then there's no reason for a revolution. So either it's moral or it's a textbook.", "Marx isn't normative? He calls capital a vampire."]}, {"p": "The wage is an equal exchange, not an unfair one. Marx's objection was never that workers are cheated.", "b": "The wage is an equal exchange", "l": ["If the exchange is equal and nobody is cheated, the case against the system has to come from somewhere else, and it's unclear where.", "Nobody's cheated and everybody should revolt.", "An equal exchange you're meant to be furious about.", "An equal exchange is a fair one. That's what equal means. So Marx agrees capitalism is fair, and the three volumes are a compliment.", "Surplus value is just profit with a guilt trip."]}, {"p": "The falling rate of profit is a tendency. Countervailing factors are part of the theory.", "b": "The falling rate of profit is a tendency", "l": ["A tendency that can be offset indefinitely predicts every outcome, and that's a weakness.", "A law that holds except when it doesn't.", "The rate of profit has been about to fall for a hundred and fifty years.", "Profits are at record highs. A theory that says they fall, in a world where they rise, is false. It isn't more subtle than that.", "The rate of profit isn't falling."]}, {"p": "A more democratic USSR that had really invested in computer planning would have done better.", "b": "A democratic USSR with computers would've worked", "l": ["More computation doesn't solve the Hayekian problem that the relevant knowledge is dispersed, tacit and never stated.", "A faster spreadsheet still needs someone to tell it what people want for dinner.", "Cockshott solved the calculation problem and left the knowledge problem where it was.", "The Soviets had the best mathematicians in the world and they couldn't do it. If they couldn't, a bigger computer can't, because computers are just fast mathematicians.", "Cockshott thinks a big enough computer fixes communism. So did the Soviets."]}, {"p": "History moves objectively toward an end, and human action is still needed to get there.", "b": "History has a direction, but you still have to act", "l": ["If the end is objective, action is redundant. If action is needed, the end isn't guaranteed.", "Inevitable, and please attend the meeting.", "It's going to happen whatever you do, so here's what you must do.", "If history has a direction it would have arrived by now. It's had long enough. So it doesn't, and things just happen.", "Material conditions explain everything after it happens and nothing before."]}]}, {"t": "Science, consensus & Trump", "n": 273, "k": [{"p": "Among experts it's argument and evidence that make something accepted. Consensus matters for the rest of us deciding what to believe.", "b": "Experts go by evidence, the rest of us by consensus", "l": ["For non-experts, deferring to consensus was wrong about continental drift and ulcers for decades.", "Consensus is the best bet and has a known failure rate.", "Trust the consensus, apart from the times it reversed.", "The consensus used to be that the sun went round the earth. Consensus was wrong then, so it can be wrong now, so it tells you nothing.", "Scientific consensus is the only kind of truth there is."]}, {"p": "A scientific fact just is what the scientific community has reached consensus on.", "b": "Scientific fact is consensus", "l": ["Then facts change when opinions do, and the earth stopped being the centre of things on the day people changed their minds.", "On that definition the planets moved when the vote did.", "Truth by show of hands, with lab coats.", "A fact is how things are. A consensus is what people think. Those are different words because they're different things, and no survey ever moved a planet.", "Science proves things. Consensus is just scientists agreeing about it afterwards."]}, {"p": "Trump isn't a fascist. The nearest he gets is illiberal democracy on the Orbán model.", "b": "Trump isn't a fascist", "l": ["The distinction is fair, and it can also comfort. Illiberal democracies hollow out the same institutions more slowly.", "\"Only Orbán\" is not the reassurance it sounds like.", "Not fascism, just the thing that's working in Hungary.", "He does rallies, he has a movement, he hates the press. If it has every feature of the thing, it's the thing. The uniform is optional.", "Trump is a fascist and people are scared of the word."]}, {"p": "MAGA doesn't reach the level of fascism yet.", "b": "MAGA isn't fascism yet", "l": ["\"Yet\" grants the direction. Arguing over the label can stand in for deciding what to do about it.", "A debate about what to call it, held on the way there.", "Checking the definition while the building's on fire.", "Fascism was a thing in Italy in the 1920s. This is America in the 2020s. Different place, different time, so it can't be the same thing, and that's just geography.", "Populism is just democracy that the wrong people won."]}]}, {"t": "Mereological nihilism", "n": 202, "k": [{"p": "Every answer to the special composition question is arbitrary or counterintuitive, so the answer is that composition never happens.", "b": "Composition never happens", "l": ["Nihilism has to paraphrase ordinary talk as \"simples arranged chair-wise,\" and that leans on the concept of a chair.", "You can't say \"arranged chair-wise\" without knowing what a chair is.", "\"Simples arranged chair-wise\" is a chair with a longer name.", "I'm sitting on something. It's holding me up. Things that hold you up exist. So there's at least one chair, and the theory is short by one chair.", "Chairs exist."]}, {"p": "Arguing from intuition isn't a good basis, least of all against someone who thinks the intuitions are wrong.", "b": "Intuitions aren't evidence", "l": ["I'm more certain I have hands than of any premise in the argument for nihilism. That's a comparison of credences.", "Any argument that ends with no tables has a premise less certain than the tables.", "Moore held up his hands and that was sufficient.", "If intuitions don't count, then the intuition that arguments should be valid doesn't count either. So nothing counts, and I'm keeping the table.", "Here is one hand. Sorry about your theory."]}, {"p": "Where you draw the line for a composite object is arbitrary. Someone else would draw it elsewhere.", "b": "Where a thing ends is arbitrary", "l": ["A vague boundary doesn't show there's nothing on either side. Baldness is vague, and there are bald men.", "Vagueness is a problem about our words. The mountain isn't worried.", "Nobody can say exactly where the hill starts, and you can still fall off it.", "If nobody can say where the line is, then there's a line and we don't know where. That's different from no line. Not knowing where your keys are doesn't mean you have no keys.", "Mereology is arguing about whether a pile is a pile."]}, {"p": "At bottom you need at least matter simples and space simples, maybe more depending on the physics.", "b": "You need matter simples and space simples", "l": ["Physics doesn't guarantee a bottom level. If matter is gunky, nihilism leaves an empty universe.", "Nihilism bets everything on physics hitting a floor.", "Nobody has seen a simple. I've seen several chairs.", "If things are made of simples, the simples compose the things. That's composition. So the nihilist has just described the thing he says never happens.", "Imagine sitting in a chair to type that chairs don't exist."]}, {"p": "It's a recent view with papers and no famous defenders, and that isn't a mark against it.", "b": "No famous defenders isn't a problem", "l": ["A view that's been available since the atomists and attracted almost nobody may be telling you something.", "Two and a half thousand years on the shelf.", "A philosophy with no books is a blog.", "If it were true, someone famous would believe it. Famous philosophers believe all sorts of things. None of them picked this one.", "Mereological nihilism is cope."]}]}, {"t": "Qualia", "n": 139, "k": [{"p": "Once you separate out what's being claimed, qualia aren't real.", "b": "Qualia aren't real", "l": ["Any seeming is already an experience. To be under the illusion of pain is to be feeling something.", "An illusion of consciousness is a conscious illusion.", "It only seems like there's seeming.", "I can doubt everything a neuroscientist tells me. I can't doubt that this hurts. So the hurting is more certain than the theory that says it isn't there.", "Illusionism is retarded. An illusion of pain that hurts is pain."]}, {"p": "A great deal about first-person experience can be explained from the third person.", "b": "Experience can be explained from outside", "l": ["The explained parts are the functional ones, like causes and reports. The question was about what's left when those are done.", "Neuroscience explains the flinch.", "Everything about seeing red, except the red.", "You can describe a headache to a brain scanner all day and it won't get one. So something's missing from the third person, and the something is the headache.", "Nobody ever took an aspirin for a functional state."]}, {"p": "The hard problem is hard because we can't even imagine what a scientific answer would look like.", "b": "The hard problem is unimaginable", "l": ["If no answer is imaginable, that's as much a reason to suspect the experience is real and unexplained as to deny it.", "\"We can't explain it\" is a strange route to \"it isn't there.\"", "Too hard to solve, so it was deleted.", "If science can't even imagine an answer, then it isn't a scientific question. And if it isn't science, physicalism has nothing to say about it.", "Qualia are real."]}, {"p": "Altruism runs on reward and punishment mechanisms, even when nobody is aware of them.", "b": "Altruism is reward-driven", "l": ["An unconscious reward behind every act can't be tested. It fits any behavior you show it.", "A motive nobody can detect, behind everything, is an article of faith.", "You did it for a good feeling you didn't feel.", "People die for strangers. Dead people don't collect rewards. So the mechanism isn't what's doing it, and it took one example.", "Egoism is the only honest ethics, and it's false."]}]}, {"t": "Free will", "n": 95, "k": [{"p": "The compatibilist kind of free will isn't the kind worth caring about.", "b": "Compatibilist free will isn't worth wanting", "l": ["Compatibilists argue their kind is the one that underwrites responsibility, and it's hard to say what more the libertarian kind would add.", "Control by your own deliberation is the thing people want. Nothing better is on offer.", "\"That's not real free will\" needs a description of the real one that isn't magic.", "You decide what to have for lunch and then you have it. That's free will. There isn't a second, better kind hiding behind it.", "Free will is real."]}, {"p": "What ordinary people mean by free will is the libertarian kind.", "b": "People mean libertarian free will", "l": ["Experimental surveys find folk intuitions are mixed, and often compatibilist when cases are concrete.", "The folk have been asked, and they didn't all say what Sam Harris says they say.", "\"What people really mean\" is usually what the speaker means.", "Ordinary people mean they weren't forced. Nobody at a bus stop has ever meant \"uncaused by prior states of the universe.\"", "Compatibilism is the folk view. Hard determinism is a podcast."]}, {"p": "Determinism doesn't make human action pointless. Marx wasn't a fatalist either.", "b": "Determinism doesn't make action pointless", "l": ["If the outcome is fixed, effort is one more fixed thing, and urging it changes nothing that wasn't already going to change.", "It's all determined, including the part where you're told to try.", "Fatalism with extra steps.", "If everything is determined then so is whether I agree. So there's no point arguing with me. And you're still arguing, so you don't believe it.", "If free will is fake, stop trying to convince me."]}, {"p": "Einstein had good reason to resist indeterminism in quantum mechanics.", "b": "Einstein was right to resist", "l": ["Bell tests rule out the local hidden variables Einstein hoped for. The determinism that's left has to be nonlocal or conspiratorial.", "Einstein's hunch was tested, and it lost.", "Superdeterminism saves the idea by making experiments meaningless.", "The experiments were done and the dice won. A theory that says the universe faked the results on purpose is a conspiracy theory with a doctorate.", "Quantum mechanics is random, so determinism is false. That's just physics."]}]}]}, {"n": "Stackhouse", "u": "stack.house", "m": 181, "t": [{"t": "Love, detachment & the One", "n": 7, "k": [{"p": "The mystics' ideal is someone perfect in love, who sees no difference between their own and another's.", "b": "Perfect love sees no distinction", "l": ["An ideal of perfect detachment has trouble making room for the particular loves that make up a life.", "Loving everyone equally is close to loving no one in particular.", "Detachment is easier to admire than to live with.", "If you make no distinction between your own family and a stranger, your family has a complaint.", "The One is just God."]}, {"p": "Goodness, wisdom and the eternal are worth taking seriously.", "b": "Take goodness and the eternal seriously", "l": ["They are, and the tradition tends to give them capital letters where it should give arguments.", "Capitalising a word isn't an argument for it.", "The Good, the True, and the footnotes.", "Nobody has ever seen the eternal. Everything anyone has seen ended. So it's a word for what we'd like.", "Neoplatonism is retarded."]}, {"p": "Attitudes toward women and status are more tangled up than the stereotypes say.", "b": "Women and status are complicated", "l": ["The correlations are real and small, and they get reported as if they were laws.", "An r of 0.2 and a headline.", "Every study about this is a forum post with a sample size.", "People are complicated, so no generalisation about them is true. That includes this one.", "Incels are just lonely. That's the whole phenomenon. People write books."]}]}, {"t": "The old web & AI art", "n": 6, "k": [{"p": "Early-2000s websites had something worth bringing back.", "b": "Bring back early-2000s websites", "l": ["They had personality because every one was hand-made and half-broken. Nostalgia edits out the half-broken part.", "Charming, and unusable.", "You miss the look. You don't miss the load times.", "Old sites were bad and people remember being young. That's all nostalgia has ever been.", "Early 2000s websites were better."]}, {"p": "Mixing that old look with modern animation would be a good project.", "b": "Old web plus new animation", "l": ["Pastiche tends to get the surface and miss why the originals looked that way. They were limited.", "The old web looked like that because it had to.", "Fake constraints are a filter.", "If you add modern animation, it isn't the old web. If you don't, it's just an old website. So the project is neither.", "Vibe-coded websites all look the same."]}, {"p": "AI image generators have gutted commission work for artists.", "b": "AI killed commission work", "l": ["They've hit the low end hardest. Clients paying for a specific artist's hand are a different market.", "The work that left was the work anyone could do.", "Commissions that could be replaced by a prompt were already cheap.", "If a machine can do your job for free, the job was worth nothing. The market just found out.", "Art is whatever sells."]}]}]}, {"n": "SuperVillainy", "u": "dionysus_dude", "m": 1410, "t": [{"t": "Education", "n": 63, "k": [{"p": "High school should move away from college prep. That model is outdated.", "b": "Ditch college prep", "l": ["College completion still tracks earnings strongly. Schools that drop the prep risk closing that door for the students with the fewest alternatives.", "\"Not everyone needs college\" tends to get applied to other people's kids.", "The outdated model still pays a lot better.", "Every good job asks for a degree. So preparing for college is preparing for a job, and anything else is preparing for less.", "College should be job training. Nobody needs a poem to get hired."]}, {"p": "AI belongs in school in a supervised, computer-lab way. Teach it properly. Don't ban it or leave it loose.", "b": "Teach AI in a lab", "l": ["Lab-style teaching assumes the tool sits still. By the time there's a curriculum, the tool has changed.", "A syllabus for something that changes every six weeks.", "The computer lab, the solution to the internet in 1998.", "The students already use it better than the teacher does. So the lesson is the teacher learning it from the students.", "Teachers will be replaced by AI because teaching is information transfer."]}, {"p": "Logical consequences beat punishment. If you wrecked the room, you clean it and catch up on the work.", "b": "Logical consequences beat punishment", "l": ["The research on that is thin, and to the student it often feels the same as punishment.", "A logical consequence is a punishment that's been explained.", "\"It's not a punishment, you just can't go outside.\"", "A consequence you make happen is a punishment. That's the definition. Calling it logical is for the adult.", "Homework is the only part of school that works."]}, {"p": "You can judge a child's behaviour as bad without thinking the child is bad.", "b": "Bad behavior, not a bad kid", "l": ["The distinction is sound and hard to keep up in practice. Children mostly hear the judgment as being about them.", "The child doesn't hear the difference.", "\"I'm not saying you're bad\" is always followed by a description of someone bad.", "A person is what they do. If what they do is bad, that's what they are for now. Pretending otherwise is why nothing changes.", "Teachers are babysitters with a pension."]}]}, {"t": "Truth & justification", "n": 59, "k": [{"p": "What makes \"it's raining\" true is whether it's raining. But all justification happens inside the discursive process.", "b": "Truth's out there, justification's in here", "l": ["If justification never leaves the discursive process, the rain's role in making the claim true does no work for us.", "The rain makes it true and we never get to consult the rain.", "A truth-maker we can't reach from inside.", "If it's raining, you get wet. Getting wet isn't discursive. So justification happens outdoors, and the theory needs a coat.", "Truth is correspondence."]}, {"p": "Empirical data alone isn't enough to talk about truth. You need epistemic standards and values to interpret it.", "b": "Data needs values to mean anything", "l": ["The standards also get chosen for how well they predict, so the data still disciplines them.", "The values that survive are the ones the data rewarded.", "Standards matter, and reality marks them.", "If you need values to read the data, then different values read it differently. So there's no fact, just readings.", "Empirical data never settled a single question about values."]}, {"p": "Metaphysical content is extra baggage. It's an interpretive scheme that doesn't add to understanding.", "b": "Metaphysics is baggage", "l": ["Deciding what counts as understanding is itself a metaphysical commitment.", "\"Only what helps us cope counts\" is a metaphysics.", "The no-baggage view, with one carry-on.", "You can't get rid of metaphysics by saying it's useless. Saying what's real and what's baggage is metaphysics. So the view refutes itself.", "Metaphysics is what people do when they don't want to run the experiment."]}, {"p": "How we sort the incoming data into what's relevant is the real question.", "b": "Sorting the data is the real question", "l": ["That's a question for psychology and for statistics. It's less clear what's left for philosophy.", "The interesting part has a department already.", "A good question for cognitive science.", "The eyes sort it. That's what eyes do. The philosophy starts after the sorting is already done.", "Epistemology is just having good sources."]}]}, {"t": "Democracy & liberal norms", "n": 52, "k": [{"p": "Democratic ideals aren't lofty abstractions. They're the tested ways we've found of getting the best societies.", "b": "Democracy is tested", "l": ["\"Tested\" covers about two centuries in a minority of countries, and some well-run places didn't follow the template.", "A good track record, from a short sample.", "Singapore has entered the chat.", "The richest, safest place on earth doesn't do it this way. One counterexample is enough.", "Singapore."]}, {"p": "Being democratically elected doesn't mean someone is following democratic principles.", "b": "Elected isn't democratic", "l": ["If \"democratic principles\" can overrule election results, someone unelected is deciding what they are.", "Democracy, apart from the outcome.", "The voters got it wrong, democratically.", "Democracy is the people choosing. The people chose. So whatever he does is democratic, and anyone who disagrees is against the people.", "Unconstitutional acts are democratic when the voters wanted them."]}, {"p": "Liberal norms are distinctive because they recognise the pull of cultural habit and correct for it.", "b": "Liberalism corrects for culture", "l": ["Liberalism has its own cultural momentum and tends to read it as neutrality.", "Liberalism corrects every bias apart from the belief that it's the unbiased one.", "The culture with no culture.", "Liberalism says all cultures are equal and also that liberalism should be in charge. Those can't both be true.", "Liberalism isn't sophisticated. It's \"leave me alone,\" with footnotes."]}, {"p": "One party has made itself impossible to vote for in this era.", "b": "One party's off the table", "l": ["That may be so. It also means the other party doesn't have to earn the vote.", "A safe vote is one nobody works for.", "One option isn't much of a ballot.", "If you'd vote for one party whatever happens, you aren't voting, you're registering. A vote that can't change isn't one.", "Democrats and Republicans are the same party with different mascots."]}]}, {"t": "Speech laws", "n": 23, "k": [{"p": "Hate speech laws can be defended, and plenty of functioning democracies have them.", "b": "Hate speech laws are defensible", "l": ["The definitions are vague, and vague speech laws get enforced unevenly.", "\"Hate\" is a category the prosecutor fills in.", "Functioning democracies also have blasphemy laws.", "The countries with the strictest laws have the fastest-growing far right. So the laws either don't work or they're helping.", "Hate speech laws work the way umbrellas stop rain."]}, {"p": "You should check what someone was actually convicted of before saying they were jailed for \"speech.\"", "b": "Check the conviction first", "l": ["Fair, and the chilling effect comes from what people think the law covers, whatever the charge sheet says.", "The charge sheet matters. So does everyone who stayed quiet.", "Accurate about the conviction, silent on the people who never posted.", "If he was arrested after saying something, he was arrested for saying it. The rest is how they wrote it up.", "Free speech is absolute or it's nothing."]}, {"p": "The US protects speech very strongly. Courts keep blocking attempts to shut out the press.", "b": "The US protects speech hard", "l": ["The strong protection is why the American experience gives no evidence about what speech laws do.", "The US is the control group.", "Strong protection, and a lot of people still careful about what they say.", "America has no speech laws and the most arguments. So speech laws would mean fewer arguments, and that's the case for them.", "Hate speech laws work. Europe has them and Europe is fine."]}, {"p": "A hate crime and hate speech are different things, and people run them together.", "b": "Hate crimes aren't hate speech", "l": ["The line blurs where speech is the evidence of motive. Then the speech is what raises the sentence.", "Different in statute, close in court.", "The speech is how they prove the hate.", "A hate crime is a crime plus an opinion. So the extra sentence is for the opinion. That's a speech law with a crime attached.", "Punishing the motive is punishing the thought."]}]}]}, {"n": "thewillowofdarkness", "u": "thewillowofdarkness", "m": 5120, "t": [{"t": "Identity & distinction", "n": 609, "k": [{"p": "Two individuals could share every feature and still be distinct. Which one each is isn't given by any property.", "b": "Identical twins are still two", "l": ["A difference no property grounds is hard to tell from no difference.", "Distinctness that nothing accounts for is a brute fact with a Latin name.", "Haecceity is \"it's this one because it's this one.\"", "If two things are the same in every way, they're the same thing. That's what \"same in every way\" means. So there's one.", "Identity is a filing convention."]}, {"p": "The one who came to exist is never the others who might have. There are no rewinds or alternate versions.", "b": "No alternate versions", "l": ["Talk of what might have been seems to need the alternatives to be something, if only abstractly.", "\"You could have been otherwise\" has to be about you to mean anything.", "No alternate versions, and yet we plan around them daily.", "Physics says every outcome happens somewhere. So there are other versions, and they're doing fine.", "Many worlds is correct."]}, {"p": "A necessary being is necessary because it takes no part in determinate action. It's never becoming one thing or another.", "b": "The necessary being doesn't act", "l": ["A being that does nothing and determines nothing can't be told apart from an abstraction.", "Necessary, unchanging, inactive. That's a number.", "It exists necessarily and that's all it does.", "If it doesn't do anything, it makes no difference. If it makes no difference, there's no reason to say it's there.", "Truthmakers are facts with a job title."]}, {"p": "The fact has to be present for a claim to be true. Someone's testimony doesn't make it so.", "b": "Testimony doesn't make it true", "l": ["Since we only ever reach the fact through evidence and testimony, \"the presence of the fact\" doesn't help us sort the true claims.", "True because of the fact, known because someone said so.", "\"It's true if it's the case\" doesn't help anyone find out.", "If only the fact matters and nobody can get at the fact except through what people say, then what people say is all there is.", "Something can be true for one person and not for another."]}]}, {"t": "Causality & bodies", "n": 376, "k": [{"p": "The usual way of talking about causation gets the phenomenon wrong. There's a correct usage, and only one.", "b": "There's one right way to talk about causation", "l": ["Causal talk is used differently in physics, law and medicine, and each use works. That counts against a single correct one.", "Physicists, lawyers and doctors all mean something different and all get by.", "There's one right way to say it, and it happens to be this one.", "Words mean what people use them to mean. People use \"cause\" lots of ways. So there are lots of correct usages and \"only one\" is a mistake about dictionaries.", "Causation is just one thing after another."]}, {"p": "A reliable prediction is an abstraction that holds across many different causal paths. It isn't one of the causes.", "b": "Predictions aren't causes", "l": ["If the prediction holds across all the paths, it carries the information a decision needs, whichever path is actual.", "You don't need to know which road you're on to read a sign that's on all of them.", "True of every causal path is quite a useful thing to be.", "If it's accurate, it's tracking the cause. If it's tracking the cause, it's about the cause. So the abstraction is the causal fact, written down.", "Laws of nature are just summaries. The universe doesn't obey anything."]}, {"p": "A state of someone's body never amounts to an identity. No state of the body is the fact of who they are.", "b": "Your body isn't your identity", "l": ["If no bodily state bears on identity, it's unclear what evidence ever could, or how anyone learns it.", "An identity that no observation touches is safe, and also out of reach.", "Not the body, not the behaviour, not the brain. So where?", "You are your body. Change the body enough and it's a different person. That's what happens in every hospital.", "Thoughts are in the head. That's why hitting it changes them."]}, {"p": "A hallucinated oasis exists as an experience. That doesn't make it an existing oasis.", "b": "A hallucinated oasis isn't an oasis", "l": ["Agreed, and that distinction is the one the empiricist uses when asking for the evidence behind a claim.", "Exists as an appearance, doesn't exist as a thing. That's what the other side said.", "Everyone agrees. That's why they ask for evidence.", "If it exists in the experience then it exists. There's no second kind of existing. So there's an oasis, a small one, in his head.", "Everything is contingent. Even the oasis."]}]}, {"t": "Experience & awareness", "n": 306, "k": [{"p": "There can be experiences that never enter awareness. Someone can have an experience of red and never be aware of it.", "b": "You can experience red without knowing it", "l": ["An experience nobody is aware of loses the feature that made it an experience and not just processing.", "Unexperienced experience needs a different name.", "A pain nobody feels.", "Experience means being aware of something. An experience you're not aware of is a square with no sides.", "Consciousness is on or off. Nothing is 3% conscious."]}, {"p": "Substance isn't a \"mind at large.\" It isn't any of the minds that share in it.", "b": "Substance isn't a mind at large", "l": ["If substance is none of the minds and none of the bodies, it's hard to say what the positive claim is.", "Not this, not that, and shared by all.", "Substance is whatever's left after every description is refused.", "Spinoza says there's one substance and it's God or Nature. So it's nature. So it's physics. So Spinoza was a materialist and this is a long way round.", "Spinoza was a determinist."]}, {"p": "Motivation has nothing to do with what's obligatory.", "b": "Motivation isn't obligation", "l": ["An obligation that gives no one any reason to act is a strange thing to call binding.", "Binding on everyone, moving no one.", "A duty that doesn't care if anyone's listening.", "If something doesn't motivate anyone, nobody does it. If nobody does it, it's not an obligation, it's a suggestion.", "Deontology is consequentialism for people who don't want to look."]}, {"p": "The colour red is a fact about what's present. It isn't a report about a mind.", "b": "Red is a fact, not a report", "l": ["Colour experience varies with lighting, surroundings and the viewer. That makes \"what's present\" depend on who's looking.", "The dress was blue and black, and also white and gold.", "Present to whom?", "Dogs don't see red. If red were in the thing, the dog would get it too. So it's in the looker.", "Color isn't in the world. Physics found wavelengths and stopped."]}]}, {"t": "Oughts & moral truth", "n": 278, "k": [{"p": "A moral truth is objectively true in the instance. In a given case, it's the case that some act ought to happen.", "b": "Moral truths are objective", "l": ["If oughts are facts that aren't states of existence, we need an account of how anyone detects them.", "An objective fact with no location and no detector.", "Where are the oughts? Point at one.", "A fact is something that exists. If oughts aren't states of existence, they don't exist. So they aren't facts, and \"objective ought\" means nothing.", "Morality is subjective."]}, {"p": "Oughts aren't generated by bodies. Believing in one is a separate matter from its being so.", "b": "Oughts don't come from bodies", "l": ["An ought that exists whether or not any mind grasps it leaves moral knowledge looking like luck.", "If the ought doesn't come from us, getting it right is a coincidence.", "Unproduced, unobserved, and binding.", "Nobody had heard of morality before there were people. So people made it. Things people made aren't out there waiting.", "Deontology doesn't explain wrongness, it lists it."]}, {"p": "What people desire is just their desire. It isn't a duty, and it doesn't make one.", "b": "Desire isn't duty", "l": ["A morality with no tie to what anyone wants has trouble explaining why it should move anyone.", "A duty that connects to nobody's concerns is hard to tell from a rule in a game nobody's playing.", "Duties for no one's sake.", "If nobody wanted anything, nothing would matter. So wanting is where mattering comes from, and duty is what you call the wants you approve of.", "Emotivism is correct."]}, {"p": "That power exists doesn't make it right. If a power is immoral, it's immoral whatever it can enforce.", "b": "Power doesn't make it right", "l": ["Moral change has tracked shifts in power closely enough that \"discovery\" needs defending.", "Norms shift when power shifts, and the arguments arrive afterwards.", "Right and might are different, and they do keep the same calendar.", "Whoever wins decides what gets called immoral. That's been true every time. So immoral means \"lost.\"", "Might makes right. Everything else is a press release."]}]}, {"t": "Empiricism", "n": 163, "k": [{"p": "Citing empiricism is a doxa of reduction. Empirical results can't touch all the claims that aren't empirical.", "b": "Empiricism is a doxa", "l": ["A claim nothing empirical bears on needs some other way of being checked, and it's fair to ask what that is.", "\"You can't test it\" is a description. It isn't a defence.", "Immune to evidence, and proud of it.", "If nothing you could ever observe would change your mind, that's not knowledge. Everybody has a name for that and it isn't philosophy.", "Empiricism is the only philosophy that's ever admitted it could be wrong."]}, {"p": "It's the populist-empiricist error to think objective truth needs a spatial or empirical event.", "b": "Truth doesn't need an event", "l": ["Mathematical truth is the best case for that, and it comes with proof. Other non-empirical claims don't have an equivalent.", "Maths gets to be non-empirical because it has proofs. What do the rest have?", "Objective truth without events, checkable by nobody.", "Everything that's turned out true was found by looking. Germs, atoms, planets. Nothing true was ever found by not looking.", "Metaphysics is what's left after science takes everything useful."]}, {"p": "Some things affect what we observe and still can't be studied by the scientific method, because they offer no evidence to test a hypothesis against.", "b": "Some causes leave no evidence", "l": ["If something affects what we observe, those effects are evidence, and that's all the method needs.", "An effect on observation is a data point.", "Affects everything, leaves no trace.", "If it makes a difference, you can measure the difference. If you can't measure a difference, it doesn't make one. So there's nothing left over.", "The noumenon is just the stuff we don't know yet. Science will get there."]}, {"p": "You can stipulate any definition you like. The issue is whether it matches the world.", "b": "Definitions have to match the world", "l": ["Checking whether a definition matches the world is an empirical procedure, and that's the one being criticised.", "\"Does it match the world\" is the empiricist's question.", "That's the scientific method with the name filed off.", "A definition can't be wrong. It's a decision about a word. So no definition has ever failed to match the world, because that's not what they do.", "Definitions are arbitrary. A word means whatever people decide."]}]}], "s": "Willow"}, {"n": "thunderstud", "u": "thunderstud", "m": 4360, "t": [{"t": "Claude & the models", "n": 265, "k": [{"p": "If the model can't do it, it's a skill issue: wrong model, wrong prompt or wrong setup.", "b": "Skill issue", "l": ["\"Skill issue\" can't lose. Any failure gets put down to the user, so the claim is never tested.", "A tool that only works for experts is telling you something about the tool.", "It can do anything, if you already know how to make it.", "A hammer doesn't need a skilled user to be a hammer. If the model only works when you hold it right, the model has the issue.", "Agents don't work. It's a demo that works once on stage."]}, {"p": "The models are still improving. Writing them off for what they can't do today is thick.", "b": "They're still improving", "l": ["Improvement so far doesn't guarantee the specific gap closes. Some weaknesses have survived several generations.", "\"It'll get better\" has been the answer to the same complaint for three versions.", "Progress is real. So is the list of things that haven't moved.", "Every technology levels off. Planes aren't faster than in 1970. So the models will stop too, and probably already have.", "Every model is \"the best model\" for six weeks."]}, {"p": "OpenAI and Anthropic keep a real edge, mostly through their harnesses and built-in tooling.", "b": "OpenAI and Anthropic win on harnesses", "l": ["Harness advantages are the easiest to copy. Open tooling has caught up within months each time.", "A moat made of UI.", "The edge is a wrapper, and wrappers are what everyone else ships next quarter.", "If the edge is the wrapper, then the model isn't the edge. So the models are all the same, and people are paying for a nicer window.", "Claude Code is a for-loop with a logo."]}, {"p": "Give each session a clear role and scope and it behaves. No alignment trouble.", "b": "Scope the session and it behaves", "l": ["That works at small scale under supervision. The worry is about less supervised, longer-running use.", "It behaves in the cases where someone's watching.", "\"If it works, it works\" is fine until it's unattended.", "It's a computer. It does what it's told. If it did something else that would be a bug, and bugs get fixed. So there's no such thing as an alignment problem.", "Alignment is easy. You tell it what to do. It's a computer."]}]}, {"t": "Dev tools & setup", "n": 164, "k": [{"p": "Telling a beginner to use VS Code is like teaching them to drive in an F1 car.", "b": "VS Code is an F1 car for beginners", "l": ["An editor with a file tree is about the simplest environment going. The harder thing is learning with a tool that hides the files.", "VS Code is the hatchback.", "The F1 car is the one that drives itself and won't say where it's going.", "Every working developer uses an editor. If beginners don't learn one, they aren't learning to develop. They're learning to ask.", "Vibe coding isn't programming, it's ordering."]}, {"p": "The desktop app has everything someone starting out needs. An IDE adds complexity they'll never use.", "b": "The desktop app is enough", "l": ["The complexity they'll never use includes the debugger, and that's how you find out why it broke.", "Everything you need, apart from a way to see what went wrong.", "It has all the features until something doesn't work.", "If the app does everything, there's nothing for the user to do. If there's nothing for the user to do, they aren't a developer. So the app is for people who aren't.", "Vibe coding is fine until prod, and everything is prod."]}, {"p": "A top-spec MacBook is the machine to want.", "b": "Get the top-spec MacBook", "l": ["Per dollar, a desktop with a real GPU does much more for local model work.", "Twenty grand for a laptop is a workstation with a hinge.", "The best machine for running models, apart from the ones built for it.", "It can't be upgraded, can't be repaired and costs double. Those are the three things a computer shouldn't be.", "A Mac isn't a dev machine. It's a fashion choice with a terminal."]}, {"p": "Getting programmatic control of your own UI is liberating.", "b": "Controlling your own UI is liberating", "l": ["It is, and the hours spent customising rarely come back as output.", "There are people with a perfect setup and no project.", "Liberating, the way reorganising your desk is productive.", "Time spent on the tool is time not spent on the work. The more you customise, the less you ship. That's arithmetic.", "Imagine having the perfect setup and nothing to build with it."]}]}, {"t": "AI & jobs", "n": 72, "k": [{"p": "Computer jobs are nearly every job now, so that's who's exposed.", "b": "Every job is a computer job now", "l": ["Exposure isn't replacement. Most jobs are bundles of tasks, and automating some of them has usually changed the job without ending it.", "Spreadsheets were going to end accountants.", "Exposed, like bank tellers were to ATMs. There are more tellers now.", "If AI could do computer jobs, the companies selling it wouldn't be hiring. They're hiring. So it can't.", "AI taking jobs is bad. No jobs, no money, no customers."]}, {"p": "Some jobs only exist as status display. A doorman's value is someone's ego, and a robot could take it.", "b": "Doormen are ego", "l": ["If the value is having a person do it, a robot can't supply that by definition.", "The point of a doorman is that he's a man.", "You can't automate being waited on by a human.", "People pay for a doorman because they want a person there. A robot isn't a person. So the one job AI can never take is the one in the example.", "Humanoid robots are shaped like people for the investors."]}, {"p": "For day-to-day business admin, these tools are already excellent once you know how to use them.", "b": "The tools are great for admin", "l": ["Admin gains are real. They also show how much admin was created by earlier software.", "The AI is excellent at the paperwork the last tool invented.", "It automates the forms that automation made.", "If a machine can do the admin, the admin never needed doing. Nobody ever automated anything important.", "Office work was always fake and AI just said so."]}, {"p": "Driving will be automated away eventually, just probably not in our lifetimes.", "b": "Driving goes, eventually", "l": ["It's been five years off since 2015, which says something about forecasts for the other jobs.", "Self-driving is the best evidence for how long \"almost there\" lasts.", "The first job AI was going to take is still hiring.", "Cars already drive themselves in some cities. So it's done, and everyone else is waiting for the paperwork.", "Self-driving cars have been two years away since 2012."]}]}]}, {"n": "vannak", "u": "vannak", "m": 7814, "t": [{"t": "Formal systems & truth", "n": 442, "k": [{"p": "Formal systems have premises. The world doesn't. Truth in the provable sense is a feature of the system.", "b": "Formal systems have premises, the world doesn't", "l": ["If truth only lives inside formal systems, \"the world has no premises\" needs some standing of its own to be worth asserting.", "That's a claim about the world, said with a lot of confidence for something with no premises.", "Nothing is true of the world, and that's true of the world.", "It's raining or it isn't. Nobody needs premises for that. You look out the window, and the window isn't a formal system.", "Logic is made up."]}, {"p": "\"Probably true\" isn't workable as mathematics. There's no proof process for it.", "b": "'Probably true' isn't maths", "l": ["Probability theory is a rigorous way of handling \"probably,\" with axioms and proofs of its own.", "Kolmogorov would like a word.", "There's a whole branch of maths for \"probably.\"", "Everything outside pure maths is \"probably.\" If probably doesn't count, then physics, medicine and breakfast don't count either.", "\"Approximately true\" is just false. A miss is a miss."]}, {"p": "If logical entailment not matching reality bothers you, go anti-realist. Attacking the true/false binary is pointless, because deduction plainly works.", "b": "Go anti-realist if entailment bugs you", "l": ["\"It obviously works\" is a claim about the system's success in the world, and that's a realist thing to say.", "Deduction works. Explaining why is where realism comes back.", "Anti-realism, justified by how well it works in reality.", "If deduction works on the world, then the world has the structure deduction needs. That's realism. You can't use it and deny it.", "Formalism is how people hide that they have nothing to say."]}, {"p": "Laying out a \"map\" and a \"territory\" already sets up a target that tilts the whole analysis.", "b": "Map and territory rig the analysis", "l": ["Dropping the distinction doesn't remove the problem. Models still differ in how well they predict, and that needs explaining.", "You can refuse the metaphor and still be wrong about where the bridge is.", "The territory doesn't care whether you believe in the metaphor.", "There's the thing and there's the description of the thing. Those are two. Anyone who says otherwise is describing something.", "The map isn't the territory. That's the whole insight and it took four words."]}, {"p": "Riding a bike is knowledge. It isn't propositional truth, and running the two together is bad vocabulary.", "b": "Riding a bike isn't propositional", "l": ["Know-how can often be restated as knowing that this is a way to do it. The split is less clean than it looks.", "Someone who knows how to ride can usually tell you a few true things about riding.", "Know-how is know-that with the sentences left out.", "Knowledge is knowing facts. Riding a bike isn't a fact. So it isn't knowledge, it's a habit, and dogs have habits.", "A formal argument in a Discord is an informal argument with letters in it."]}]}, {"t": "Symbol machines", "n": 240, "k": [{"p": "The right way to understand minds and models is as symbol machines.", "b": "Minds are symbol machines", "l": ["Neural networks compute with continuous values. The symbols may be something we read into the output.", "The symbols show up when a person looks.", "Faces in clouds, with weights.", "A neural net is multiplication. Multiplication isn't symbols. So there are no symbols in there, and the theory is about the wrong machine.", "LLMs are just autocomplete."]}, {"p": "A symbol comes from filtering information. That isn't a separate process from whatever makes consciousness.", "b": "Symbols come from filtering", "l": ["Filtering is cheap. A sieve does it. The account needs to say what makes some filtering into symbols and other filtering into gravel.", "Thermostats filter information.", "By that definition a coffee filter has symbols.", "A symbol stands for something to someone. No someone, no symbol. So you need the mind first, and it can't be built out of symbols.", "Symbols were a wrong turn and the GPUs proved it."]}, {"p": "Whether to read a system's symbolic content is a choice. Ignore it and your physics comes out the same.", "b": "Reading symbols is optional", "l": ["If the physics comes out right without it, the symbolic content isn't doing any explaining.", "Optional content is commentary.", "If you can skip it and lose nothing, it's a caption.", "If something makes no difference to anything, it doesn't exist. That's the test for existing. So symbolic content doesn't exist, on the theory's own description.", "Symbolic content is a caption someone added."]}, {"p": "Reality doesn't have \"parts\" in the strict, provable sense. Find that kind of truth and you were analysing something synthetic.", "b": "Reality doesn't have provable parts", "l": ["Chemistry gets on fine treating molecules as having parts, and its predictions hold.", "The parts of a water molecule didn't wait for a proof.", "No parts, apart from the ones in every textbook.", "A car has four wheels. You can count them. Counting is as strict as it gets. So reality has parts, starting with the wheels.", "Things are made of their parts. That's what \"made of\" means."]}, {"p": "\"What it's like to be\" something is a cliché, a hallucination. The question doesn't make sense.", "b": "'What it's like' is a cliché", "l": ["The question makes enough sense that everyone understands the difference between being awake and under anaesthetic.", "Nobody is confused about what the anaesthetist takes away.", "A hallucination is something it's like something to have.", "It's like something to stub your toe. Everyone who has stubbed a toe knows what the question means. So it makes sense, and the theory hasn't stubbed a toe.", "Qualia are obviously real. Red looks like something."]}]}, {"t": "Null hypotheses & mech interp", "n": 239, "k": [{"p": "Mechanistic interpretability only ever makes the positive case. The null is never addressed.", "b": "Mechinterp never tests the null", "l": ["Causal interventions like ablation and activation patching are tests against alternatives, and features that fail them get dropped.", "Patching experiments are the null.", "They do run controls. The papers have a section for it.", "You can't prove a negative. So no field can address the null, and holding interp to it is holding it to something impossible.", "Null hypothesis testing is a ritual and everyone doing it knows."]}, {"p": "Under universal function approximation, competing and even contradictory causal stories all fit, so finding a feature rules nothing out.", "b": "UFA fits contradictory stories", "l": ["UFA is about what a network could represent. Which circuit this network uses is an empirical matter that interventions can test.", "\"Anything could be in there\" doesn't mean nothing in particular is.", "Could represent anything, did represent something.", "If a network can approximate any function then it can approximate one with clean features. So the features people find are the real ones. That's what the theorem says.", "Universal approximation means it's all the same machine."]}, {"p": "Yes, training a probe that finds a feature is evidence the feature is there. The trouble is everything it can't exclude.", "b": "Probes can't exclude enough", "l": ["All evidence leaves alternatives open. The live question is whether the alternatives predict anything different.", "That's true of every finding in every science.", "Evidence that doesn't rule out everything else. Also known as evidence.", "Evidence for a thing is evidence for the thing. If there's evidence, it's there. Wanting more than evidence is wanting something science doesn't have.", "Mechanistic interpretability is phrenology for matrices."]}, {"p": "Without a library of null tests, \"the predictions got better\" is suspect.", "b": "No null tests, no trust", "l": ["Better held-out prediction is a test against the null of no improvement. It doesn't need a library.", "Out-of-sample accuracy is the test.", "The prediction either came true or it didn't.", "A prediction that comes true is right. That's all a prediction is. Adding a null hypothesis to something that already happened is paperwork.", "Baselines are for people who are scared of results."]}, {"p": "Treating a model's outputs as draws from a random variable is a framing. The model is a functional manifold.", "b": "It's a functional manifold", "l": ["Every useful description is a framing. The statistical one has earned its place by predicting how models behave.", "\"That's just a framing\" applies to \"functional manifold\" too.", "A framing that works is called a theory.", "A model gives different answers each time you ask. Different answers each time is random. So it's a random variable, and the manifold is the framing.", "A thing that gives a different answer every time isn't random? That's retarded."]}]}, {"t": "Physics & measurement", "n": 217, "k": [{"p": "If you say \"it's raining\" is true of reality, and particle physics has no such notion, you're saying the physics is wrong.", "b": "Rain isn't in particle physics", "l": ["Higher-level truths can be consistent with a physics that doesn't mention them. Absence from the vocabulary isn't contradiction.", "Particle physics doesn't mention Tuesdays either.", "The Standard Model has no term for \"wet,\" and you'll still need a coat.", "Physics is the complete description. If rain isn't in it, rain isn't real, and what's falling on you is an informal description.", "Physics is just math."]}, {"p": "A good match between simulation and outcome is impressive, and it doesn't license claims about what reality \"is.\"", "b": "Simulations don't tell you what reality is", "l": ["If the match isn't evidence about reality, its reliability is unexplained.", "The simulation keeps being right for no reason, then.", "It predicts everything, and we're asked not to draw conclusions.", "If the simulation gets the same answer as the world, the world is doing what the simulation does. That's what \"same answer\" means. So that's what reality is.", "The wavefunction is just math. It's not a thing. Nobody's seen one."]}, {"p": "You can't measure an indefinitely complex state. That limit is part of physics, and more than a practical nuisance.", "b": "You can't measure an indefinitely complex state", "l": ["A limit on what we can measure is a fact about instruments. It takes more argument to make it a fact about what's there.", "The particles have positions whether or not there's a budget for the detector.", "The universe isn't waiting on the equipment.", "If it can't be measured, it isn't physics. If it isn't physics, it isn't real. So the unmeasured state doesn't exist until someone pays for the instrument.", "If you can't measure it, it's a mood."]}, {"p": "A Fourier transform is just a mathematical change of representation. No mystery in it.", "b": "A Fourier transform is just a change of outfit", "l": ["The fact that the change of representation corresponds to physical operations, like what a lens does, is itself interesting.", "\"Just a transform\" that light happens to compute.", "It's only maths, and so is everything else that turned out to matter.", "It's the same information before and after. If nothing changes, nothing happened. So a Fourier transform does nothing, and people got Nobel prizes for it.", "A Fourier transform isn't deep. It's a change of outfit."]}]}, {"t": "Scalars", "n": 105, "k": [{"p": "Treat a preference as a scalar and you'll get scalar-like results, even when the preference isn't shaped that way.", "b": "Preferences aren't scalars", "l": ["Representation theorems show any consistent set of preferences can be put on a single scale. The scalar comes from consistency.", "If the choices are transitive, the number exists whether you like it or not.", "Von Neumann put your whole value system on a number line in 1944.", "If you chose one thing over another, you ranked them. A ranking is a number line. So every preference is a scalar the moment you act on it.", "Everything can be ranked. You just have to be brave."]}, {"p": "Money and scalar value flatten things that don't sit on one axis.", "b": "Money flattens everything", "l": ["We trade unlike goods against each other in every budget. Refusing the common scale hides the exchange rate.", "\"Incommensurable\" means you made the comparison and didn't write it down.", "You rank incomparable things every time you order lunch.", "Everything has a price, and a price is one number. If it didn't have a price nobody could buy it. So everything fits on one axis, and the axis is dollars.", "One number is always enough if it's the right number."]}, {"p": "Rock-paper-scissors shows it: there's no scalar you can assign to each that reproduces who beats who.", "b": "Rock-paper-scissors has no scalar", "l": ["The cycle is about pairwise matchups. Each strategy still has a scalar win rate, and it's a third.", "Rock, paper and scissors each win a third of the time. There's your number.", "Three equal scalars.", "Rock breaks scissors and rock is a rock. Paper covering it does nothing to a rock. So rock is first, and the cycle is a rule somebody added.", "Rock is the best one and everyone knows it."]}, {"p": "Colours aren't scalar. Hex codes don't order them in any way that means something.", "b": "Colours aren't scalar", "l": ["Colours order along several axes, like luminance, hue and wavelength, and each of those is a scalar.", "Not one ordering, but several. That's still ordering.", "Colours come in order. It's called a rainbow.", "A hex code is a number. Numbers have an order. So blue is bigger than red, and it's right there in the code.", "Hex codes are numbers and numbers have an order."]}]}]}, {"n": "Youvious", "u": "youv.philip", "m": 5602, "t": [{"t": "Maths", "n": 237, "k": [{"p": "Mathematics is the one place we have completely clear, unambiguous definitions.", "b": "Maths has perfectly clear definitions", "l": ["Foundational disputes over choice, constructivism and what \"exists\" means show the clarity gives out at the base.", "Clear definitions, resting on axioms people still argue about.", "Unambiguous, apart from the foundations.", "If the definitions were clear, nobody would fail maths. Most people fail maths. So they're not clear.", "Axioms are just the stuff you refuse to argue about."]}, {"p": "You build a spacetime starting from a topological space: the set of points comes first, then the structure.", "b": "Points first, then structure", "l": ["That's the order of the textbook construction. Whether nature is built in that order is a further claim.", "The textbook starts with points. That's pedagogy.", "The points come first on the page.", "You can't have a point without somewhere for it to be. Somewhere is space. So space comes first and the points go in it. The textbook has it backwards.", "Topology is geometry for people who can't measure."]}, {"p": "A lot of this is easy once you write down the Euler-Lagrange equations and solve.", "b": "Just write the Euler-Lagrange equations", "l": ["Setting up the Lagrangian is the modelling step. That's where the physical insight goes, and nobody tells you which one to write.", "Easy once someone hands you the Lagrangian.", "\"Just solve it\" is the whole difficulty.", "If it were easy, there wouldn't be a degree in it. There's a degree, a master's and a doctorate. That's eight years of \"fairly easy.\"", "The Lagrangian is a trick. Nobody knows why it works."]}, {"p": "AI won't matter much
