<script id="data" type="application/json">[{"n": "Sizzurp", "u": "sizzurp1", "m": 20573, "t": [{"t": "Religion & theism", "n": 533, "k": [{"p": "Even the robust defenses of theism lose to naturalism once you get into the details.", "b": "Naturalism beats theism", "l": ["Fine-tuning is taken seriously by plenty of non-theist philosophers, and naturalism's main replies are an unobservable multiverse or brute fact.", "Naturalism wins on points, and its answer to fine-tuning is still \"a lot of universes.\"", "The naturalist's reply to fine-tuning is infinite universes, which is plenty of faith.", "Something can't come from nothing. There's something. So someone made it. That's the whole debate, and it was over before philosophy departments existed.", "Atheism is cope."]}, {"p": "Giving up a core commitment of classical theism to escape an objection means the objection worked.", "b": "Dropping a doctrine means you lost", "l": ["Traditions revise under pressure without that counting as defeat. Science does it routinely.", "Revising a doctrine in response to an argument is what you'd want from anyone.", "By that standard, physics has been refuted about forty times.", "Theology has changed its answers for two thousand years and it's still here. Things that are false don't last two thousand years. So changing the answers is how you can tell it's true.", "Aquinas already answered that. He numbered it."]}, {"p": "A sane believer resists the question \"if God commanded something monstrous, would you do it?\" Only a pathological one just says yes.", "b": "Sane believers resist 'what if God commanded it'", "l": ["Resisting the question is a way of rejecting divine command theory while keeping the vocabulary.", "If the believer checks the command against a prior sense of good, that sense is doing the work.", "The sane believer has a morality and a God, in that order.", "God is good by definition. So He couldn't command anything bad. So the question is like asking what if a triangle had four sides, and only atheists think it's clever.", "Without God, \"wrong\" means \"I don't like it.\""]}, {"p": "The Catholic God, of all gods, being the real one would be a nightmare.", "b": "The Catholic God would be a nightmare", "l": ["The doctrine of hell is hard, and Catholic theology has centuries of work on reconciling it with mercy and freedom.", "Finding it frightening isn't an argument that it's false.", "\"I'd hate it if it were true\" is a review.", "A true thing doesn't care whether you'd enjoy it. People only say a view would be a nightmare when they suspect it's right.", "Thomism is the most consistent system ever built."]}, {"p": "Call-in show atheism is garbage. The serious debate is with theistic philosophers of religion.", "b": "Call-in atheism is garbage", "l": ["The philosophers of religion are mostly believers defending what they already held, which is a selection effect worth weighing.", "A field where nearly everyone started out agreeing with the conclusion.", "Philosophy of religion is the home game.", "The apologists have read more than the atheists and win every debate. Winning debates is how you find out who's right. So that's that.", "Analytic philosophy of religion is Christians with logic notation."]}]}, {"t": "Lenin, Trotsky & Stalinism", "n": 237, "k": [{"p": "Stalinism was a vulgar corruption of the doctrine. It doesn't follow from Lenin.", "b": "Stalinism betrayed Lenin", "l": ["The one-party state, the Cheka and the ban on factions all came before Stalin. The tools were built under Lenin.", "Stalin inherited the equipment. He didn't invent it.", "The corruption used the original machinery without modification.", "Stalin was Lenin's general secretary, in Lenin's party, under Lenin's rules. If a student does exactly what the teacher set up, that's the teacher.", "Lenin and Stalin are the same. One died sooner."]}, {"p": "The Bolsheviks never promised to abide by bourgeois elections, so dissolving the Constituent Assembly was no betrayal.", "b": "Dissolving the Assembly wasn't a betrayal", "l": ["They campaigned for the Assembly and closed it after losing. \"We never promised\" is a narrow defense.", "They ran in the election. That's usually taken as agreeing to it.", "It wasn't a betrayal, they just lost and shut it.", "An election is whoever gets the most votes. They got fewer. In every other context that's called losing, and here it's called a higher form of democracy.", "Democratic centralism is \"we vote and then I decide.\""]}, {"p": "A party with a fixed ratio of intellectuals to workers was a principled design.", "b": "The vanguard ratio was principled", "l": ["A party that sets its own ratio of thinkers to workers has decided in advance who does the thinking.", "Workers in the majority, and the minority writes the program.", "One intellectual per ten workers, and guess who talks.", "If the workers could lead themselves there'd be no need for a party. There's a party. So the theory already assumes they can't, and everything after follows from that.", "The vanguard party is \"trust me bro\" with a reading list."]}, {"p": "You have to read Mandel, Kliman and the rest before you get an opinion on this.", "b": "Read Mandel and Kliman first", "l": ["A position that can only be assessed after thousands of pages of in-house literature is hard to tell apart from one that can't be assessed.", "The reading list grows every time the argument goes badly.", "\"You haven't read enough\" has never lost a debate.", "If it were true, it could be explained in a paragraph. Physics can do it. This needs forty books, and that means even the authors weren't sure.", "Forty books to explain why the revolution didn't happen? That's retarded."]}, {"p": "Marx expected the workers' state to be short and healthy, with revolution in the advanced countries first. What happened isn't on him.", "b": "What happened isn't on Marx", "l": ["The predictions failing is evidence about the theory. A theory isn't cleared by having expected something else.", "\"He didn't know what would happen\" is the criticism.", "The theory was fine. Events did it wrong.", "Marx predicted the revolution in England. England got fish and chips. A scientist whose experiment fails every time isn't unlucky.", "Marx was wrong, and Lenin proved it by trying."]}]}, {"t": "Wokeness & the working class", "n": 207, "k": [{"p": "Middle-class radicalism corrodes working-class cohesion.", "b": "Middle-class radicals hurt workers", "l": ["Class politics and identity politics have often reinforced each other. The union movement's best decades included civil rights.", "The working class has identities too. Treating them as a distraction has lost elections.", "The workers were meant to be united, apart from the things they care about.", "The working class is whoever works. Most people work. So everyone's working class, and the term picks out nobody.", "Woke is just Marxism with race swapped in for class. Everyone knows this."]}, {"p": "The working class is still the agent that matters.", "b": "The working class still matters", "l": ["Organized industrial labor is a shrinking share of the workforce in rich countries. The agent the theory needs is hard to find.", "The proletariat was meant to have nothing to lose. It got a mortgage.", "The revolutionary subject has a pension and a pickup.", "Workers vote for whoever they like, and lately it isn't the left. If the workers are always right, they're right about that too.", "Workers don't want the means of production, they want Fridays off."]}, {"p": "Even the less unhinged right-wingers are peddling the same ruling-class idealism.", "b": "Even the sane right is ruling-class ideology", "l": ["Calling every opposing view ruling-class ideology means no argument from that side ever has to be answered.", "\"That's ideology\" is a reply that works on everything, including itself.", "Everyone who disagrees is a dupe of the ruling class, which is handy.", "If every idea comes from a class, so does Marxism. Marx was middle class and lived off a factory owner. So Marxism is bourgeois ideology by its own test.", "Marx was a capitalist. He lived off Engels' factory."]}, {"p": "Fascistic currents in the ruling class are the more dangerous ones right now.", "b": "The fascist wing is the danger", "l": ["\"Fascist\" has been applied so widely that it's lost much of its power to pick out what's new.", "Every right-wing government since 1945 has been called fascist by somebody.", "The boy who cried Mussolini.", "Fascists wore uniforms and marched. Nobody's marching. If it doesn't have the uniform, it's something else, and something else isn't as scary.", "Communists and fascists are the same people at different ages."]}]}, {"t": "Marxist economics", "n": 177, "k": [{"p": "The labor theory of value holds up when you read it properly.", "b": "The LTV holds up", "l": ["The transformation problem is a real difficulty, and a century of rival solutions suggests the trouble is in the theory.", "It needs a new interpretation every decade to stay alive.", "\"Read properly\" has meant something different in each generation.", "Value is whatever someone will pay. People pay more for water in a desert, and no extra labor went into it. That's the whole theory gone, in one example.", "A mud pie takes labor and it's worth nothing. That's the whole LTV, gone."]}, {"p": "Marxist theory already makes room for interest, macro and the rest. It isn't at odds with those categories.", "b": "Marxism handles interest and macro", "l": ["If it absorbs the mainstream categories, it's fair to ask what the value theory adds to them.", "Sraffa gets the distribution results with no labor values at all.", "Marxism accepts everything mainstream economics says and adds a moral.", "If two theories say the same thing and one has predictions, you keep that one. Economists did. That's why there are no Marxists at the central bank.", "Neoclassical economics is a science and Marxian economics is a book club."]}, {"p": "Capitalist social relations are the root cause. A politician who doesn't see that will just reproduce them.", "b": "Capitalism is the root cause", "l": ["Root-cause claims this broad explain every outcome, which makes them hard to test against any.", "Everything bad is capitalism and everything good happened despite it.", "One cause, for all effects, forever.", "There was poverty before capitalism, and a lot more of it. So capitalism can't be the cause. It's the only thing that ever reduced it.", "Capitalism won."]}, {"p": "Mainstream economists dodge exploitation.", "b": "Economists dodge exploitation", "l": ["They have a different account. If pay tracks marginal product, the concept needs another basis than surplus value.", "They don't dodge it. They think it's a category error.", "Surplus value is profit described by someone angry about it.", "Nobody is forced to take a job. A deal both sides agree to can't be exploitation, because that's what agreeing means.", "Exploitation is voluntary. Nobody makes you take the job."]}, {"p": "Capitalism is in permanent crisis: cyclical slumps, unemployment, far-right surges.", "b": "Capitalism is in permanent crisis", "l": ["The same system has delivered the largest sustained rise in living standards on record. \"Permanent crisis\" has to account for that.", "In crisis since 1848, and somehow richer every decade.", "The final crisis has had a lot of encores.", "A system that's been collapsing for a hundred and seventy years isn't collapsing. That's just what it looks like when it works.", "Late capitalism has been late for seventy years."]}]}]}, {"n": "Anonymous Johnson", "u": "anonymousjohnson", "m": 3658, "t": [{"t": "Shakespeare & literature", "n": 157, "k": [{"p": "Famous Shakespeare lines often come from comic characters riffing on stock ideas. They weren't meant as grand insight.", "b": "The famous lines are jokes", "l": ["Context matters, and lines also outgrow their speakers. Plenty of what a fool says in Shakespeare is the play's best thinking.", "The fools get the good lines on purpose.", "\"A comic character said it\" is how Shakespeare says most of the true things.", "If it's in the play, he wrote it. If he wrote it, he meant something by it. So every line is his opinion, and who says it is staging.", "Shakespeare is a plot thief with a thesaurus."]}, {"p": "You have to know the conventions of the period to read him properly.", "b": "Know the period conventions", "l": ["A work that needs a period glossary to land has lost part of what made it work.", "If the joke needs a footnote, it's a historical document.", "Reading properly, with one finger in the notes.", "A great writer is one you can read without help. He needs a page of notes per page of text. So that's half a writer.", "The comedies aren't funny and haven't been since 1610."]}, {"p": "The older books, the Hebrew Bible and the classics, repay real reading.", "b": "The old books repay reading", "l": ["They do, and a lot of their standing comes from having been required for centuries.", "Great, and also assigned.", "Canon is what survived the syllabus.", "A book is good if people choose to read it. Nobody chooses these. They get them at school. So their readership is a captive audience.", "The Old Testament is the better half. The sequel ruined the pacing."]}, {"p": "Changing how a word is used doesn't change what a thing is.", "b": "Changing a word doesn't change the thing", "l": ["Usage is how words get their meanings. If enough people use a word differently, that is what it means now.", "Dictionaries follow the speakers.", "A word means what people mean by it, annoyingly.", "Words are sounds. A sound means whatever people agree it means. If they agree on something new, that's the meaning, and the old one is a hobby.", "Definitions are arbitrary. A word means whatever people decide."]}]}, {"t": "Plato", "n": 44, "k": [{"p": "Plato wants number as a transcendent cause and also has numbers at work inside the physical world. He tries to have both.", "b": "Plato wants numbers both ways", "l": ["Participation is meant to bridge that, and Plato himself raises the objection that it doesn't.", "He wants the Forms apart from things and in them, and the Parmenides notices.", "Both ways, and he wrote the dialogue that says you can't.", "A cause has to touch what it causes. Forms don't touch anything. So they cause nothing, and the theory is decoration.", "The Parmenides is Plato admitting the Forms don't work."]}, {"p": "The cave still works as an image. Whoever brings the truth blinds people at first.", "b": "The cave still works", "l": ["It also flatters whoever is telling it. Everyone who uses the cave puts themselves outside.", "Nobody has ever told the cave story from inside the cave.", "The cave is a story about how right the storyteller is.", "If everyone else is in the cave and you aren't, either you're a philosopher or you're the one who's confused. The odds aren't close.", "Plato was a fascist."]}, {"p": "A popular podcast is a perfectly good way into philosophy.", "b": "Podcasts are a fine way in", "l": ["It's a way into summaries of philosophy. The arguments are in the texts, and summaries lose them.", "You learn what Kant concluded and none of why.", "An intro to the names.", "If a podcast can do it, a degree is a very expensive podcast. Either the podcast is missing something or the universities are a scam.", "Arguing online is the only philosophy anyone actually does."]}]}], "s": "AJ"}, {"n": "Ape", "u": "ape1284", "m": 12495, "t": [{"t": "Epistemology", "n": 264, "k": [{"p": "JTB is dead. The Gettier side wins that argument.", "b": "JTB is dead, Gettier won", "l": ["Gettier cases rest on intuitions about odd scenarios, and experimental work suggests those intuitions aren't shared as widely as assumed.", "The whole literature depends on \"surely he doesn't know,\" and not everyone has the surely.", "Three pages in 1963 and a discipline has been busy ever since.", "Knowledge is believing something true for a good reason. In Gettier cases the guy believes something true for a good reason. So he knows, and the puzzle is people refusing the answer.", "Knowledge is justified true belief. Gettier cases are riddles."]}, {"p": "If you really are someone's epistemic peer, you should hold on to your confidence when they disagree.", "b": "Peers should stay confident", "l": ["If you're peers, their dissent is as much evidence as your own judgment, and holding firm treats yours as special.", "Steadfastness is a polite name for counting your own vote twice.", "\"We're equals, and I'm right\" needs a second premise.", "If two equally smart people disagree, each has a fifty percent chance of being right. So both should be at fifty percent, and anyone above that is bad at maths.", "Confidence is 90% of being right."]}, {"p": "The usual probability puzzles come down to setting up the sample space correctly.", "b": "It's all about the sample space", "l": ["Picking the sample space is where the modelling judgment goes, and the maths can't make that choice for you.", "Every probability paradox is two people with different sample spaces, both certain.", "The answer is easy once you've assumed the answer's setup.", "There are two outcomes: it happens or it doesn't. That's fifty-fifty. Every more complicated answer is someone showing off.", "Bayesianism is being wrong with decimals."]}, {"p": "Rejecting a correspondence theory of truth isn't like being a flat-earther. It's closer to rejecting the axiom of choice.", "b": "Rejecting correspondence isn't flat-earth stuff", "l": ["The axiom of choice is independent of the other axioms. Whether sentences answer to the world isn't obviously optional in that way.", "Truth isn't an optional extra you can decline and keep the rest.", "Choosing your theory of truth like an axiom is a view about truth, and an odd one.", "A statement is true if it says how things are. Anyone who denies that is saying something they think is how things are. So they've agreed already.", "Truth is correspondence. Everything else is cope."]}, {"p": "Philosophical views mostly come from intuitions, so expecting someone to flip their position is unrealistic.", "b": "Nobody flips on intuitions", "l": ["If views rest on intuitions \"from God knows where,\" that's a reason to hold them loosely.", "If nobody can be argued out of anything, it's unclear what the arguing is for.", "The method is consulting what seems true to the person writing the paper.", "An intuition is a feeling. Feelings aren't evidence in any other subject. So philosophy runs on nothing, and that's why it never finishes.", "Intuitions aren't evidence. They're what you believed before you checked."]}]}, {"t": "Maths & statistics", "n": 157, "k": [{"p": "Mathematics being a kind of language game doesn't stop it having real consequences.", "b": "Maths matters even as a language game", "l": ["If it's a game with rules we chose, its fit with physics needs explaining, and \"impact\" just renames the puzzle.", "A game we invented that happens to predict eclipses.", "It's only a language game, and the bridge stays up by coincidence.", "Games are made up. If maths is a game, maths is made up. Made-up things can't be true, so there are no mathematical truths, only moves.", "Maths is made up."]}, {"p": "Statistics and stochastic processes are the better place to be than pure theory.", "b": "Stats beats pure theory", "l": ["Applied work is useful, and it borrows its guarantees from the theory it's contrasted with.", "The applied people are spending what the pure people proved.", "Statistics is maths that has to be right about the world, and mostly isn't.", "Statistics is counting things and dividing. That's primary school. The symbols are there so it looks like a degree.", "Statisticians are mathematicians who gave up on proof."]}, {"p": "A proper mathematical physics course should cover manifolds and the real machinery.", "b": "Do the manifolds properly", "l": ["Physicists get results with far less rigor than mathematicians think is needed, and the results hold.", "Physics has never waited for the maths to be done properly.", "The bridges are fine.", "If physicists needed that maths, the physics would be wrong without it. It isn't. So they don't need it.", "Physics students don't learn the maths properly and the bridges are fine."]}, {"p": "Maths doesn't collapse into verbal disputes the way philosophy can.", "b": "Maths doesn't do verbal disputes", "l": ["Foundations has its own standoffs, between constructivists and classical mathematicians and over which axioms to accept.", "Mathematicians have verbal disputes. They call them foundations.", "No verbal disputes, apart from what \"exists\" means.", "In maths you prove it and it's over. Nothing in maths has ever been disputed for longer than a proof takes to read.", "Axioms are just the stuff you refuse to argue about."]}]}, {"t": "Realism: colour, taste & morals", "n": 114, "k": [{"p": "\"This thing is red\" reports a property of the thing. People who say red is only in the mind are wrong.", "b": "Red is in the thing", "l": ["Physically identical colour experiences come from very different reflectance profiles, so \"red\" doesn't map onto a single property of surfaces.", "Metamers are a problem for putting red on the object.", "The physics has reflectances. The red is our contribution.", "Red is a wavelength. Wavelengths aren't red, they're long. So the red has to be somewhere else, and the only other place is your head.", "Color isn't in the world. Physics found wavelengths and stopped."]}, {"p": "Gastronomic realism: some food really is better, and preferences play a smaller part than people think.", "b": "Some food is just better", "l": ["Taste varies with genetics and upbringing in ways that make a single standard of \"better\" hard to defend.", "Coriander tastes like soap to a fixed fraction of people. Which of them is wrong?", "Realism about dinner is a brave hill.", "Taste is in the tongue, and tongues are different. So good food is whatever your tongue says, and no restaurant critic has ever been right.", "Well-done steak is better and that's an objective fact about food."]}, {"p": "Moral realism deserves to be taken seriously. Huemer's case in particular isn't lazy.", "b": "Take Huemer seriously", "l": ["Intuitionism makes moral knowledge depend on seemings, and seemings are what evolutionary debunking targets.", "\"It seems true, so believe it until shown otherwise\" is a comfortable epistemology.", "Phenomenal conservatism is \"I'm right until further notice.\"", "If there were moral facts, people would have agreed on them by now like they did on the boiling point of water. They haven't. So there aren't any.", "Moral realism is cope."]}, {"p": "Even in a realist account, preferences keep some role. They just retreat into the background.", "b": "Preferences retreat, they don't vanish", "l": ["If preferences can't be eliminated, the \"realism\" may be a sophisticated subjectivism with better manners.", "Realism where preferences retreat but never leave is what an anti-realist would predict.", "The preferences retreated to the foundations.", "Either it depends on what people like or it doesn't. If it depends a little, it depends. So it's subjectivism and the rest is vocabulary.", "Quasi-realism is realism for people who don't want to pay for it."]}]}, {"t": "Analytic philosophy", "n": 58, "k": [{"p": "Standard analytic philosophy is substantive and useful, and worth defending.", "b": "Analytic philosophy is worth defending", "l": ["Its clarity is real, and it tends to select questions for being tractable more than for mattering.", "A method built for precision picks problems that reward precision.", "Analytic philosophy answers small questions very well.", "A subject that's useful produces things. Engineering makes bridges. Analytic philosophy makes replies to replies. So it isn't useful, by the ordinary meaning of the word.", "Analytic philosophy is arguing about definitions. Look it up and move on."]}, {"p": "Continental philosophy gets misread so much because it's written loosely.", "b": "Conties write loosely", "l": ["Much of the misreading comes from applying a premise-by-premise method to texts that argue historically and by reconstruction.", "\"Unclear\" sometimes means \"I wasn't taught to read this.\"", "If you can't find the argument in five minutes, the argument must be missing.", "Hegel is hard and Russell is easy. The hard one must be saying more, because nobody would make it that hard for no reason.", "The analytic/continental split is simple. One side has ideas."]}, {"p": "Rigor is what separates the analytic side.", "b": "Rigor is the difference", "l": ["Symbolizing a weak argument doesn't strengthen it. Close reading and historical work are rigorous in a different way.", "Rigor isn't notation.", "A weak premise in a nice font.", "Putting a box in front of a sentence doesn't make it necessary. It makes it look like it went to university.", "Logic notation is a lab coat."]}, {"p": "Conties don't engage with the actual arguments.", "b": "Conties dodge the arguments", "l": ["They'd say the same in reverse: that analytic work ignores history, politics and the conditions under which the argument was made.", "Each side thinks the other is avoiding the real questions.", "Two departments not going to each other's talks.", "The analytics have had a hundred years on metaethics and the options are the same three. Whatever engaging with the arguments does, it doesn't finish anything.", "Metaethics is what people do instead of having ethics."]}]}]}, {"n": "aura", "u": "aurasurfer", "m": 970, "t": [{"t": "AI: help or replace", "n": 30, "k": [{"p": "It's fair not to bother with the big AI claims until the experts show more evidence.", "b": "Wait for the evidence on AI", "l": ["Waiting for proof is reasonable for curiosity. It's less reasonable if being late has a cost.", "Sensible, unless the evidence arrives as the event.", "\"Wake me when it's proven\" works for most things.", "The experts have been wrong about AI every year for seventy years. So waiting for them is waiting for people who don't know either.", "AI safety is a grift."]}, {"p": "There's a real question about when a bot is helping with work and when it's replacing it.", "b": "Help or replace is a real question", "l": ["The line moves. Most \"helping\" is replacing one task at a time.", "Help is replacement at a slower speed.", "It's helping, the way the first tractor was helping.", "A tool does the work or it doesn't. If it does the work, the person who used to isn't needed. That's replacing. There isn't a second kind.", "AI taking jobs is bad. No jobs, no money, no customers."]}, {"p": "A deterministic bot isn't really doing anything. Same input, same output.", "b": "Deterministic bots aren't doing anything", "l": ["Being deterministic doesn't make a system trivial. A chess engine can be deterministic and still beat everyone.", "Stockfish is deterministic and you'd lose.", "Deterministic and better than you is still better than you.", "People are deterministic too. Same brain, same situation, same answer. So if that means the bot isn't doing anything, neither is anyone.", "A priest could be replaced by a recording. That's what liturgy is."]}]}, {"t": "Business & LLCs", "n": 24, "k": [{"p": "You can have a working business with clients first and form the LLC later.", "b": "Get clients first, LLC later", "l": ["You can. Operating without one leaves personal assets exposed, and that's the thing the LLC is for.", "Fine until the first client sues.", "The LLC is the boring step that matters on the bad day.", "A business is something registered. If it isn't registered, it's a guy doing favours for money. That's a different thing with a different tax form.", "An LLC doesn't make a business. It makes a hobby with a registered agent."]}, {"p": "If you're trying lots of ventures, run them under one LLC and split one off only when it starts earning.", "b": "One LLC for everything", "l": ["One LLC for everything means one lawsuit reaches everything.", "One entity, one bucket, one creditor to empty it.", "Cheap until the bad project takes the good one down.", "If one LLC is enough for five businesses, then the LLC isn't doing anything for any of them. It's a folder.", "Most businesses shouldn't exist and the owners know by month four."]}, {"p": "Scaling food production up into big controlled indoor facilities is a real path.", "b": "Indoor farming is the path", "l": ["Indoor farming works for leafy greens and has struggled on energy costs for anything with calories.", "Vertical farms keep going bankrupt growing lettuce.", "A real path for salad.", "Plants need light. The sun is free. Indoors you pay for the light. So it costs more to grow the same plant, forever.", "Farming is easy. Plants want to grow."]}, {"p": "Being pro sex work is about the workers getting paid. It isn't a claim that the industry is great.", "b": "Pro sex work means pro workers", "l": ["That's a coherent position. It also leaves open whether more of the industry is a good thing.", "You can back the workers and still wonder about the business.", "Supporting the people in it and the thing itself are two questions.", "If the industry isn't great, supporting it isn't great. You can't be for the workers and against the work. The work is what pays them.", "Sex work is work the same way gambling is work."]}]}, {"t": "Astrology", "n": 16, "k": [{"p": "Astrology is worth having as a set of fun heuristics.", "b": "Astrology is fun heuristics", "l": ["A heuristic has to beat chance to be one, and matching tests put astrology at chance.", "A rule of thumb that doesn't work is a thumb.", "Fun, yes. Heuristic is the part that needs evidence.", "If it's only for fun, it doesn't tell you anything. If it tells you something, it isn't only for fun. So it has to pick one.", "Astrology has no mechanism, which is the only thing a theory needs."]}, {"p": "The types capture something real about people.", "b": "The types capture something", "l": ["Sun-sign descriptions are general enough to fit anyone, and people rate random ones as accurate.", "Every sign is \"passionate but sometimes guarded.\"", "Twelve ways of saying \"you're a person.\"", "Personality doesn't change by birth month in any dataset anyone's collected. Millions of people, no signal.", "Astrology is cope."]}, {"p": "Seasons and cycles do shape people, and astrology is a way of talking about that.", "b": "Seasons shape people", "l": ["Season-of-birth effects exist and are small, and they come down to things like school year. Planets don't come into it.", "The only birth-month effect is who was oldest in the class.", "Seasons do things to people. Saturn doesn't.", "Everyone has central heating now. The seasons haven't affected anyone since about 1950.", "Seasons don't matter to anyone with central heating."]}]}]}, {"n": "Bedbug", "u": "bedbug0450", "m": 6227, "t": [{"t": "Food & cooking", "n": 128, "k": [{"p": "Eat ingredients one at a time and your brain builds a map of what each food gives you.", "b": "Eat ingredients one at a time", "l": ["There's little evidence for that. Dishes exist because combinations taste better and absorb better.", "Cuisine is ten thousand years of people finding that mixing things works.", "A nutritional map, drawn by eating a plain boiled egg.", "Your stomach mixes it all together thirty seconds later. So eating it separately does nothing, and you've just had a worse dinner.", "Mixing ingredients is called food."]}, {"p": "Cravings track what your body needs.", "b": "Cravings know what you need", "l": ["Cravings track sugar, salt and fat, and habit. The link to specific nutrient needs is weak in the research.", "If cravings tracked needs, nobody would crave a second doughnut.", "My body knows what it needs, and it needs crisps.", "People crave cigarettes. Nobody's body needs a cigarette. So cravings are just wanting, and wanting isn't nutrition.", "Disgust is always right about food and always wrong about people."]}, {"p": "Cooking is simple. Find good recipes, follow the steps, learn the basics like balancing flavour and getting the fond up.", "b": "Cooking is simple", "l": ["\"Balance the flavour\" is the hard part. It's the judgment recipes can't give you.", "Simple, apart from the bit where you need to know what you're doing.", "Follow the steps, and also have taste.", "If it were simple, restaurants wouldn't exist. Nobody pays forty dollars for something that's following steps.", "Fond is burnt. French cooking is scraping burnt off a pan with wine."]}, {"p": "Sour and fermented stuff is an acquired taste worth acquiring.", "b": "Sour is worth acquiring", "l": ["Acquired tastes are partly a matter of signalling. The acquiring is the point for a lot of people.", "\"Worth acquiring\" usually means \"I acquired it.\"", "You can train yourself to like anything. That's an argument for nothing.", "Sour means it's gone off. That's what the tongue is for. Learning to like it is teaching yourself to ignore the warning.", "Sour beer is beer that went wrong and got a label."]}]}, {"t": "Pseudointellectuals", "n": 100, "k": [{"p": "Being convinced you know more than you do isn't enough to make someone a pseudointellectual.", "b": "Overconfidence doesn't make a pseudointellectual", "l": ["If overestimating your own knowledge isn't the mark, it's hard to say what is beyond \"people I find annoying.\"", "Then the word means \"wrong, and I don't like the tone.\"", "A pseudointellectual is whoever's being pretentious about a different book from mine.", "An intellectual is someone who knows things. A pseudointellectual is someone who thinks they do. That's the definition, and it's everyone in a philosophy chat.", "Everyone on a philosophy server is a pseudointellectual. That's the genre."]}, {"p": "Doing something pseudointellectual doesn't make you a pseudointellectual. One act doesn't define a person.", "b": "One act doesn't define you", "l": ["People are what they repeatedly do. Enough of the activity and the label is earned.", "One act, every evening, for two years.", "\"I'm not a smoker, I just smoke.\"", "You are what you do. If you do the activity, you're the thing. Nobody says \"I only murdered once.\"", "Humility is a brag."]}, {"p": "Normies have a more accurate picture of plenty of things than very online people do.", "b": "Normies are often right", "l": ["Offline people miss things as well. They're just wrong about different stuff, with more confidence.", "Normies are right about the internet and wrong about nearly everything else.", "The normie's advantage is not knowing what he's missing.", "Most people are average, and average people believe average things. Average things are half wrong. So normies are wrong half the time, the same as a coin.", "Normies are right about everything and that's what makes them normies."]}, {"p": "Good ragebait works on people who think they're too smart for it.", "b": "Ragebait gets the smart ones", "l": ["That makes it unfalsifiable. Whoever objects proves the point, and whoever doesn't wasn't the target.", "Any reaction counts as a hit. That's a generous scoring system.", "\"If you're mad, it worked\" is how every bad joke defends itself.", "If it only works on smart people, then getting annoyed proves you're smart. So the more it works on you, the better you're doing.", "Ragebait only works on people who think they're too smart for it."]}]}, {"t": "The red & blue button", "n": 44, "k": [{"p": "Pressing blue is the immoral one. Blue pressers either can't think it through or don't mind dying, and you don't owe either your life.", "b": "Blue is the immoral button", "l": ["Some blue pressers reason that enough others will press blue. Polls of the dilemma bear them out.", "There's a third kind of blue presser: one who expects blue to win. So far that one's been right.", "\"Stupid or suicidal\" leaves out \"correct about the vote.\"", "Polls say blue wins. If blue wins, nobody dies. So the blue pressers did the maths and the red ones were scared of a poll.", "Red is the coward's button. It only works if other people are braver."]}, {"p": "\"Everyone should press blue to save me\" is the whole blue argument, and it's a hostage note.", "b": "Blue is a hostage note", "l": ["The blue case is about coordination. If a majority is reachable, the only outcome with no deaths runs through it.", "It isn't \"save me.\" It's \"this is the only version where nobody dies.\"", "The hostage note is addressed to people who were going to shoot the hostage.", "Red only works because someone else gets shot. Calling the people who'd save everyone hostage-takers is a brave way to describe hiding.", "Red is a free ride on other people's decency."]}, {"p": "Add a private payoff to the choice and you see what people are really made of.", "b": "Add a payoff, see who people are", "l": ["Changing the payoffs changes the problem. What people do for a million dollars says little about the original.", "A different game gives a different answer.", "Paying people to press red and then noting that they press red.", "If you have to pay people to press red, then red isn't the natural choice. You don't have to bribe people to do the right thing.", "Blue is the only moral button."]}, {"p": "The whole thing is a meme. Nobody should care this much.", "b": "It's just a meme", "l": ["It's a meme that reliably sorts people by how they treat risk to others, which is why it won't die.", "For a meme, it's had a long run of people getting upset about it.", "Nobody cares, at length.", "People only say \"it's just a meme\" about arguments they lost. Nobody has ever won one and then said it didn't matter.", "The button meme is the best philosophy this chat has done."]}]}]}, {"n": "bossOnothin", "u": "bossonothin", "m": 5745, "t": [{"t": "Islam & Islamic philosophy", "n": 145, "k": [{"p": "Any claim that Islam is \"inherently\" this or that is stupid.", "b": "Nothing about Islam is 'inherent'", "l": ["Traditions have texts and core doctrines. Saying nothing is characteristic of a religion makes the word empty.", "If nothing is inherent to it, it's unclear what the name picks out.", "Anti-essentialism is correct, until you need to say what the thing is.", "A religion is its book, and the book doesn't change. So whatever's in the book is what it inherently is. Christianity too. That's what a religion of the book means.", "Religion is just crowd control with songs."]}, {"p": "The medieval Islamic philosophers are serious metaphysicians, not commentators.", "b": "The Islamic philosophers were real metaphysicians", "l": ["Much of the work is commentary in form, and the original moves, like essence and existence, are fewer than the bulk suggests.", "Serious, and a great deal of it is glosses on Aristotle.", "A golden age of footnotes.", "If they were original, they'd be taught in the first year like Descartes. They aren't. The syllabus is the ranking.", "Avicenna just translated Aristotle and added medicine."]}, {"p": "The classical idea that those trained in philosophy should rule so everyone else can live virtuously deserves a hearing.", "b": "Let the philosophers rule", "l": ["That's Plato's guardians, and it has Plato's problem. Nobody checks the philosophers.", "Rule by the educated has been tried. They educated themselves into privileges.", "The philosopher-king always turns out to be a king.", "Smart people make better decisions. That's what smart means. So the smartest should decide everything and elections are a way of choosing worse.", "The best government is a smart guy with no elections to worry about."]}, {"p": "On contested history, no source is neutral, so read with the author's side in mind.", "b": "No source is neutral", "l": ["If no source is neutral, weighing them still needs some standard that isn't just another side.", "\"Everyone's biased\" is where source criticism starts.", "No neutral sources, says the one neutral observation.", "If every historian is biased then nobody knows what happened. So history is opinions, and yours is as good as a professor's.", "A steelman is a strawman somebody would like to be friends with."]}]}, {"t": "Aristotle & Plato", "n": 99, "k": [{"p": "Aristotle can't have misunderstood Plato. He studied with him for twenty years.", "b": "Twenty years with Plato, he got him", "l": ["Long study doesn't prevent polemical readings. Aristotle had reasons to present Plato in the form that suited his own alternative.", "Twenty years is also long enough to get tired of someone.", "Students who stay twenty years have the most reasons to misrepresent the teacher.", "If he'd understood Plato he'd have agreed with him, because Plato was right. He didn't agree. So he didn't understand.", "Aristotle is Plato with the good parts taken out and a filing system added."]}, {"p": "There'd be no Metaphysics without the Timaeus.", "b": "No Timaeus, no Metaphysics", "l": ["The Metaphysics answers the Presocratics and the Academy broadly. Making the Timaeus its source narrows it a lot.", "Aristotle is replying to two centuries of people. Plato is one of them.", "Everything is a footnote to Plato if you squint hard enough.", "The Timaeus says the world was built by a craftsman out of triangles. If Aristotle's whole system is a reply to that, the whole system is a reply to a bedtime story.", "Plato's cosmology is a creation myth with triangles."]}, {"p": "If you want to learn ethics as such, read a modern textbook. Aristotle, Kant and Mill deepen things, but they're not where you start.", "b": "Learn ethics from a textbook first", "l": ["The textbook's categories come from those three. Starting with the summary gives you the labels and leaves out the reasons.", "A textbook is Aristotle, Kant and Mill with the arguments shortened.", "Learn ethics from the people who learned it from the people you're skipping.", "If a textbook can say it better, then the originals are obsolete. Obsolete books are history. So the whole canon is a history course.", "The history of philosophy is pointless. Physics students don't read Newton."]}, {"p": "Maimonides read Aristotle through the Muslim metaphysicians, and you have to read him knowing that.", "b": "Read Maimonides through the Muslim philosophers", "l": ["True, and it's also true that his main arguments can be assessed directly, whatever their route.", "Where it came from isn't whether it's right.", "Everyone read Aristotle through someone.", "If you need to know three other philosophers to understand one, that one didn't have anything of his own. That's what \"influenced by\" means when it goes that deep.", "Maimonides is Aristotle with a commentary track."]}]}, {"t": "Newcomb's problem", "n": 78, "k": [{"p": "Two-boxing is only picking up the thousand dollars that's also sitting there.", "b": "Two-boxing is just grabbing the free thousand", "l": ["It is, and the people who reliably do that walk out with a thousand, while the ones who don't walk out with a million.", "The thousand is right there, and so is the track record.", "Picking up the extra thousand is how you end up with only the thousand.", "The point of a decision is to end up with the most money. One-boxers end up with the most money. So their decision is the better one, because that's what better means.", "Two-boxing is cope."]}, {"p": "Why would anyone turn themselves into a one-boxer, the lower-EV disposition, for one hypothetical that might never come up?", "b": "Why become a one-boxer for one hypothetical?", "l": ["Being predictably one-boxing pays in ordinary life too, anywhere others act on what they expect you to do.", "Anyone who keeps a promise when breaking it would pay is one-boxing.", "It comes up every time someone decides whether to trust you.", "The disposition that gets a million has a higher EV than the one that gets a thousand. A million is higher than a thousand. So one-boxing is the higher-EV disposition, and the arithmetic has four steps.", "If you're so rational, why aren't you rich?"]}, {"p": "Two-boxers get accused of rejecting the predictor. It's one-boxers who reject the premise that there's a choice.", "b": "One-boxers deny there's a choice", "l": ["The one-boxer accepts both. The choice is real, and it's the same thing the predictor tracked.", "One-boxers think you choose, and that your choosing was foreseeable. Those fit together.", "Predictable isn't unfree. Your friends predict you constantly.", "If you really have a choice, the predictor can be wrong. The problem says it isn't wrong. So there isn't a choice, and one-boxing is just reading the instructions.", "The predictor knew you'd say that."]}, {"p": "If everything outside the room vanished, one-boxers would still be too scared to pick up the thousand.", "b": "One-boxers are too scared to grab the thousand", "l": ["In that case nothing depends on the prediction any more, and the one-boxer takes both. The reasoning is conditional on the setup.", "Remove the predictor and you've removed the problem.", "Every two-boxer thought experiment starts by deleting the predictor.", "Change the problem and you get a different answer. That's true of every problem. It's why exam questions don't let you edit them.", "Explain it with one more analogy. That'll fill the box."]}]}, {"t": "The principle of sufficient reason", "n": 53, "k": [{"p": "The PSR is a serious principle. Things have sufficient reasons.", "b": "Things have sufficient reasons", "l": ["An unrestricted PSR seems to entail that nothing could have been otherwise, since a sufficient reason leaves no slack.", "The PSR explains everything and leaves nothing optional.", "If everything has a sufficient reason, so does what you had for breakfast, from the Big Bang.", "An atom decays at one moment and not another, and physics says there's no reason for which. Physics works. So some things have no reason, and the principle is false.", "The PSR is retarded. Some stuff just happens."]}, {"p": "The identity of indiscernibles holds.", "b": "Indiscernibles are identical", "l": ["Max Black's two identical spheres alone in a universe share every property, and there are still two.", "Two things can differ only in being two.", "Leibniz's law has a counterexample you can draw.", "Two new coins from the same mint are identical in every way and there are two of them. Anyone with a pocket can check.", "Leibniz was a courtier with a calculator."]}, {"p": "The chain of explanation has to end in something necessary.", "b": "Explanation ends in something necessary", "l": ["A necessary being is one stopping point. \"It just is\" is another, and it's unclear the first explains more.", "A self-explaining being is a brute fact with a title.", "\"Necessary\" is \"because,\" capitalised.", "Everything needs a reason, except the first thing, which doesn't. So the principle has an exception on line one, and a principle with an exception isn't one.", "The universe doesn't owe anyone an explanation."]}, {"p": "Hume didn't refute it.", "b": "Hume didn't refute it", "l": ["Hume showed that an uncaused beginning is conceivable without contradiction, which means the PSR isn't a truth of logic.", "He didn't refute it. He showed nobody had proved it.", "Hume asked for the proof and got a feeling.", "Hume said you can imagine something popping up with no cause. You can. So it's possible, so the PSR is false, and that's the refutation.", "Hume ended metaphysics and Kant spent 800 pages pretending he didn't."]}]}]}, {"n": "Brutus", "u": "exso_lam", "m": 29893, "t": [{"t": "Cooking", "n": 643, "k": [{"p": "Cooking stays interesting forever, because there's always another technique or ingredient.", "b": "Cooking never gets old", "l": ["Most home cooking is a small rotation of dishes. The endless-novelty part is a hobby on top of the feeding.", "There's always a new technique, and dinner is still the same six things.", "Endless depth, mostly spent on beans.", "Food is fuel, and fuel doesn't need technique. Anything past making it hot is entertainment.", "Cooking is following instructions. If you can read, you can cook."]}, {"p": "Chicken thighs are the best part of the bird.", "b": "Thighs are the best part", "l": ["Thighs are forgiving, and that's a different thing from better. A well-cooked breast is a harder target.", "Thighs taste good because they're hard to ruin.", "Preferring thighs is preferring the easy mode.", "Breast is the most expensive cut, and price tracks quality. That means breast is the best cut and thigh people are saving money.", "Chicken thighs are for people who can't cook breast properly."]}, {"p": "Cast iron earns its place in the kitchen.", "b": "Cast iron earns its place", "l": ["It holds heat well and conducts it poorly, so on most home burners it has hot spots that clad pans don't.", "Famous heat retention, less famous uneven heating.", "A heavy way to cook unevenly.", "Restaurants cook better than anyone, and restaurants use stainless and aluminum. That means cast iron is what people use when they don't know.", "Cast iron is overrated."]}, {"p": "Dried beans, cooked properly, are worth the effort over canned.", "b": "Dried beans are worth it", "l": ["In blind tastings for soups and chili, most people can't tell canned from dried.", "The overnight soak is mostly for the cook's sense of occasion.", "Dried beans are canned beans with a delay.", "A bean is a bean. The can is just where it waits. So there's no difference, and the people who say there is are tasting the effort.", "Canned beans are the same as dried. A bean doesn't know how long it soaked."]}, {"p": "Seasoning should be precise: the right paprika, the right mustard, no sugar where it doesn't belong.", "b": "Season precisely", "l": ["A little sugar in an acidic sauce is ordinary balancing, and most ground spices in home kitchens are too old to be precise about.", "Three-year-old smoked paprika is contributing color and memories.", "Arguing about which paprika, with a jar from 2022.", "Sugar makes things taste better. That's why it's in everything people like. So a sauce without it is a sauce that's been made worse on principle.", "Sugar goes in tomato sauce. Italians do it and don't tell Americans."]}]}, {"t": "Tokens & models", "n": 363, "k": [{"p": "If the smarter model is much smarter, saving tokens on a worse one is a false economy.", "b": "Use the smarter model", "l": ["For bulk, checkable work like OCR passes, a cheap model with verification often gets the same result for far less.", "\"Always use the best model\" is right for hard steps and wasteful for the other ninety percent.", "The expensive model, for reading scanned pages.", "The cheap model gets 90% right. 90% is an A. So paying more is paying for a grade you already have.", "DeepSeek does 90% of it for 5% of the price."]}, {"p": "If tokens produce net value, burning through them faster just gets you the return sooner.", "b": "Burn tokens faster, profit sooner", "l": ["That holds only if value per token is constant. In practice returns fall as you throw more tokens at a task.", "\"Spend faster to earn faster\" assumes every token is as useful as the first.", "That's also the pitch for every bar tab.", "Spending is the opposite of saving, and saving is how people get rich. So the more tokens you burn, the poorer you are. It isn't complicated.", "Vibe coding is paying per word to be confused."]}, {"p": "Running several passes, with models checking each other's errors, gets the job done.", "b": "Have models check each other", "l": ["Models tend to share failure modes, so cross-checking catches fewer errors than independent review would.", "One model marking another's homework, both trained on the same internet.", "Three models agreeing is one opinion, three times.", "If a model could find the errors, it wouldn't have made them. So a checking pass can't find anything, and it bills you to say so.", "Subagents are one model in different hats."]}, {"p": "Different models get different things wrong, so it's worth knowing which to use where.", "b": "Know which model to use where", "l": ["The differences move with every release, so that knowledge has a short shelf life.", "By the time you've learned a model's quirks, it's been replaced.", "Model expertise expires faster than milk.", "They're all trained on the same data with the same method. Same in, same out. So they get the same things wrong and the differences are in your head.", "Nobody can tell the models apart blind."]}]}, {"t": "Newcomb's problem", "n": 315, "k": [{"p": "Once you're in the room the boxes are set, so if you can choose at all you should take both.", "b": "The boxes are set, take both", "l": ["The setup says the contents were fixed by a prediction of this very choice. Treating them as independent drops the one fact that defines the problem.", "\"The boxes are set\" is true, and they were set by someone who knew what you'd say next.", "The money's already there, because of what you're like.", "If you're so rational, why aren't you rich? One-boxers walk out with a million every time, and that means their reasoning is correct, because being correct is what getting the money is.", "Two-boxing is cope."]}, {"p": "Thinking that leaving a box can get you more money means believing in something physically impossible.", "b": "One-boxing needs magic", "l": ["No backward causation is needed. Your disposition caused both the prediction and the choice. That's a common cause.", "One-boxers don't think the choice reaches back. They think the choice and the prediction share a source.", "It's correlation with a known reason, which is the respectable kind.", "The predictor is never wrong. So whatever you pick, it picked first. That means your choice does set the contents, and physics will have to deal with it.", "The predictor knew you'd say \"but physics\" and left the box empty."]}, {"p": "\"It's better to be a one-boxer\" only means it's better to end up with more money.", "b": "'Better to be a one-boxer' just means richer", "l": ["If one policy reliably ends with more money, that's close to what \"better choice\" means in a decision problem.", "A decision theory that concedes the other side gets richer has conceded most of it.", "\"It only gets you more money\" is a strange objection in a game about money.", "Rational means doing what gets the most. One-boxers get the most. So two-boxing is irrational by definition, and the definition isn't up for debate.", "Two-boxers get a thousand dollars and a proof lmao."]}, {"p": "A one-boxer in the room with a full box couldn't take both anyway. What you'd do is already settled.", "b": "You couldn't take both anyway", "l": ["If what you'll do is settled by what you're like, then being a one-boxer is the thing to be. That's the one-boxer's point.", "\"I couldn't have done otherwise\" doesn't tell you which kind of agent to have been.", "You can't choose both, so you'll be glad you weren't the type who would.", "If it's all determined then nobody chooses anything, and the problem is fake. And if the problem is fake you may as well have the million.", "You are not the one guy who beats the predictor."]}, {"p": "Maybe it isn't a real decision problem at all. Some decision theorists gave up on it.", "b": "Newcomb isn't a real decision problem", "l": ["Calling it ill-formed is an option, but real cases with good predictors of behavior exist and still need an answer.", "\"It's not a real problem\" tends to get said by the side that's losing it.", "The no-boxer position: neither, and I'd like to go home.", "A problem you can't answer isn't a problem, it's a trick. Tricks don't have right answers, so everyone's answer is as good as anyone's, including one-boxing.", "Imagine leaving a million dollars in a box to win an argument."]}]}, {"t": "Microscopy & optics", "n": 294, "k": [{"p": "Diffraction sets real limits, and techniques like Fourier ptychography are clever ways around what a lens alone can do.", "b": "Ptychography beats the diffraction limit", "l": ["Computational methods recover resolution by adding assumptions about the sample, and the result is only as good as those assumptions.", "The extra resolution comes from the algorithm's guess about what's there.", "Past the diffraction limit, you're looking at a reconstruction.", "A picture the computer worked out isn't a picture, it's a drawing. So super-resolution is the microscope making things up, and the limit is still the limit.", "Diffraction limits are a suggestion. Software fixes that now."]}, {"p": "Oblique illumination and the old optics papers still have things to teach.", "b": "Read the old optics papers", "l": ["Most of what's in the classic papers is built into modern instruments, so reading them is closer to history than technique.", "Köhler already won. It's in the box when you buy one.", "Rediscovering 1890s microscopy by hand is a lovely hobby.", "Science moves forward, so the newest paper contains all the old ones. That means anything from before 2010 is already inside something better.", "Reading old optics papers is churning your own butter."]}, {"p": "Microscopy and astronomy are the same problem at different scales.", "b": "Microscopes and telescopes, same problem", "l": ["The maths overlaps. The practical problems, like sample preparation against atmosphere, are very different.", "Same Fourier transform, completely different Tuesday.", "Everything is the same problem if you only look at the equations.", "One is looking at big things far away and the other at small things up close. Those are opposites. So nothing about one applies to the other.", "A microscope is just a small telescope pointed down."]}, {"p": "Mineral optics is worth caring about: pleochroism and the rest.", "b": "Mineral optics matter", "l": ["It's real physics, and for most collectors the interest is closer to connoisseurship than to science.", "It changes color when you turn it. So does a CD.", "Green, and then dark green.", "A mineral is valuable if it's rare and pretty. What it does to polarized light isn't on the price tag, so it doesn't matter.", "Minerals are rocks with a price tag."]}, {"p": "Good glass and real aperture matter more than specs on a box.", "b": "Glass over specs", "l": ["For most images at viewing size, sensor and processing differences swamp the lens differences people pay for.", "The lens matters most to the person who paid for it.", "Nobody has looked at a photo and praised the effective aperture.", "A photo is made of pixels, and more pixels is more photo. Lenses don't have pixels. So the lens isn't the part that counts.", "Megapixels are all that matter."]}]}, {"t": "Voting", "n": 169, "k": [{"p": "No single vote decides an election, and that isn't the right way to think about what voting is.", "b": "No single vote decides it", "l": ["If your vote has no causal effect on the result, the instrumental case for casting it is gone, and something else has to carry it.", "\"It doesn't cause the outcome, and you should do it anyway\" needs a second sentence.", "Voting matters, in a sense that's carefully kept away from the result.", "The winner is whoever gets the most votes. Votes are made of single votes. So every single vote decides the election, and yours did last time.", "Imagine thinking your vote doesn't count. Every election comes down to one vote."]}, {"p": "Casting and counting is just how a collective decision gets made concrete. Asking what your one vote \"contributes\" misses that.", "b": "Voting is just counting", "l": ["Describing the mechanism doesn't answer the individual's question of why to take part.", "\"It's an operationalization\" is true, and it isn't a reason to stand in the queue.", "A very precise way of not answering the question.", "A collective is just a lot of individuals. If no individual matters, the collective doesn't either, because zero times a million is zero.", "Voting is a survey with stickers."]}, {"p": "The outcome is a threshold state. It isn't a sum of contributions.", "b": "It's a threshold, not a sum", "l": ["Thresholds get crossed by increments. Somebody's vote is the marginal one, even if nobody knows whose.", "There's a last vote in every count. Someone cast it.", "A threshold is a sum that stops at one number.", "If it's a threshold then nothing counts until the last vote. That means everyone who voted before the last guy wasted their time, which is everyone.", "The only vote that counts is the last one, so vote late."]}, {"p": "People get hung up on the causation and miss the point of taking part.", "b": "Stop obsessing over causation", "l": ["The point of taking part is usually stated as expression or duty, and both are open to the question of why this form.", "If it's about expression, a sign in the yard does more.", "\"The point of participating is participating.\"", "Doing something that changes nothing is a ritual. Rituals are religion. So voting is church for people who say they don't go.", "Democracy is two wolves and a sheep voting on dinner."]}]}, {"t": "Coarse-graining & entropy", "n": 136, "k": [{"p": "Coarse-graining is physically principled. The macrostates aren't arbitrary.", "b": "Coarse-graining is principled", "l": ["Entropy depends on the choice of macrostates. If a different carving gives a different entropy, something in the quantity belongs to the describer.", "\"The natural macrostates\" tend to be the ones our instruments happen to measure.", "The macrostates are natural the way a map's colors are natural.", "You choose the macrostates, so you choose the entropy. A number you choose isn't a fact about the world. It's a setting.", "Coarse-graining is rounding. They gave rounding a name."]}, {"p": "Entropy is more subtle than \"disorder.\"", "b": "Entropy isn't just disorder", "l": ["The subtle version still depends on a low-entropy start that's put in by hand to get an arrow of time.", "The careful definition explains the second law by assuming a very special beginning.", "It's subtle, and then page one says \"it started tidy.\"", "My room gets messier over time and never cleaner. That's entropy. That's all of it. The rest is physicists protecting their jobs.", "Entropy is just disorder. Messy room. That's the whole concept."]}, {"p": "A model has to be physically realistic to count. Arbitrarily small or idealized cases don't settle anything.", "b": "Only realistic models count", "l": ["Statistical mechanics is built on idealizations. Phase transitions strictly exist only at infinite size.", "\"Physically realistic\" rules out most of the textbook.", "Thermodynamics is exact for a system that doesn't exist.", "Physics is equations, and equations are exact. Real systems aren't exact. So the equations are right and reality is the approximation.", "\"In the thermodynamic limit\" means \"not here.\""]}, {"p": "Sean Carroll is worth listening to on this.", "b": "Listen to Sean Carroll", "l": ["His presentations of entropy and the arrow of time state a contested Past Hypothesis picture with more confidence than the field has.", "A popularizer's settled view is usually the field's open question.", "Every physicist with a podcast has solved time.", "Real physicists publish papers and don't talk to the public. He talks to the public. Draw the conclusion.", "Sean Carroll is a podcaster who used to do physics."]}]}]}, {"n": "Charlie", "u": "seinzumtode", "m": 20578, "t": [{"t": "Training & agent workflows", "n": 444, "k": [{"p": "You need layers of agents: reviewers, judges, verifiers, implementers. One orchestrator is too narrow.", "b": "Stack your agents", "l": ["Each layer adds cost and a new place to fail, and reviewers built on the same model share the implementer's blind spots.", "A judge that shares the defendant's training data is not much of a judge.", "Reviewers, judges and verifiers, all the same model in different hats.", "One model is as smart as it is. Asking it twice doesn't make it smarter, any more than asking the same guy twice does. So ten agents know exactly what one agent knows.", "Agent orchestration is middle management for robots."]}, {"p": "The payoff of workflows is the sheer number of agents you can deploy at once.", "b": "More agents, more output", "l": ["Parallelism helps on work that splits cleanly. Most real tasks have dependencies that make more agents step on each other.", "Nine agents can't deliver one baby in a month.", "A swarm is a way to be confused in parallel.", "More workers means more work done. That's true of ditches, so it's true of thinking. Whoever runs the most agents is right the most.", "An agent swarm is a for-loop with a pitch deck."]}, {"p": "You don't need the global minimum. Some local minimum is nearly always as good, and the global one is often just memorization.", "b": "Local minima are fine", "l": ["That's the usual finding for large overparameterized models. It's less clear that it holds for small models trained locally on little data.", "\"Any minimum will do\" is a result about giant networks. A laptop model isn't one.", "Good enough is good enough, says everyone who stopped early.", "Minimum means lowest, and global means the lowest of all. The lowest loss is the best model. So anything else is settling, and settling is how you get a worse model.", "Training is just pressing run and waiting."]}, {"p": "Training locally on your own hardware is the way to do it.", "b": "Train locally", "l": ["For most tasks the hosted frontier models are well ahead, and the gap is large enough to matter in practice.", "Running it at home trades a lot of quality for control most people never use.", "A worse answer, slower, on your own electricity.", "The big labs have a million times the compute. A million times the compute gives a million times the model. So whatever runs under a desk is a rounding error.", "Local models are for people who want to say they run local models."]}, {"p": "It's a virtual intelligence. Intelligence doesn't belong to whatever hosts it.", "b": "Intelligence doesn't need a host", "l": ["Detaching intelligence from any mind makes it hard to say what would count as its presence or absence.", "If intelligence doesn't need a host, it's unclear what the word is tracking.", "Intelligence that belongs to nobody is a nice way to describe a spreadsheet.", "Intelligence is something a person has, like height. No person, no intelligence. So \"virtual intelligence\" means no intelligence, said nicely.", "Fancy autocomplete can't \"know\" anything. Next."]}]}, {"t": "Spinoza & Deleuze", "n": 148, "k": [{"p": "For substance, \"necessity\" is the better word than \"cause.\" It always was, is and will be.", "b": "Substance is necessary, not caused", "l": ["If causa sui just means necessary existence, that's the ontological argument's move, and it has the same weakness.", "Renaming self-causation \"necessity\" doesn't explain why there's a necessary thing.", "It exists because it has to, and it has to because of the definition.", "You can't define something into existing. If you could, I'd define myself a necessary yacht. So substance is a definition and nothing more.", "Spinoza is just atheism with extra steps."]}, {"p": "Each attribute expresses the whole essence of substance, fully and adequately.", "b": "Each attribute is the whole essence", "l": ["If thought and extension each express the whole essence and share nothing, it's hard to see how they're attributes of one thing.", "Two complete accounts with no overlap sounds like two things.", "One substance, described twice, with no translation between the versions.", "If mind and body are the same thing, then thinking about lunch should feed you. It doesn't. So they're two things and the Ethics is wrong on page one.", "The Ethics is laid out like geometry because he couldn't write."]}, {"p": "Any given thing can be fully accounted for in several parallel ways that never reduce to each other.", "b": "Parallel accounts, none reducible", "l": ["Parallelism names the correlation between the orders without explaining why it's perfect.", "\"They're the same thing under two attributes\" is the puzzle restated as the answer.", "Two clocks and a promise.", "If two explanations of one thing never touch, one of them is extra. Science picks the physical one, so the other is decoration.", "Parallelism is \"it's a coincidence, necessarily.\""]}, {"p": "The stake in Deleuze is difference in itself against an undifferentiated white whole. Philosophy keeps collapsing into the second.", "b": "Difference in itself, not white wholeness", "l": ["Critics like Badiou argue Deleuze ends up there himself. Univocal being is a One, whatever it's called.", "For a philosopher of difference, everything he writes says one thing about being.", "He warns against the undifferentiated whole and then says being is said in one sense.", "To be different, things have to be different from each other. That needs things first. So identity comes first, and the whole project starts from the wrong end.", "Deleuze is retarded."]}, {"p": "Deleuze's critique of Hegel stands, even if he owed Hegel more credit in places.", "b": "Deleuze beat Hegel", "l": ["Deleuze's Hegel is a caricature of mediation, and Hegel's account of difference is richer than the polemic allows.", "Deleuze needs Hegel to be simpler than he is.", "He beats a Hegel who was put together for the purpose.", "Hegel already said everything turns into its opposite. That includes Hegel's critics. So Deleuze is a moment in Hegel, and Hegel wins without getting up.", "Hegel was right about everything."]}]}, {"t": "Kant", "n": 85, "k": [{"p": "Kant couldn't bridge the gap between saying what's behind the given is unknowable and saying it gives us the given.", "b": "Kant couldn't bridge the gap", "l": ["The two-aspect reading eases this. On that reading the thing in itself isn't a second object causing appearances.", "That's a problem for one reading of Kant, and there are others.", "Two hundred years of Kantians have noticed. They have replies.", "Kant says we can't know things in themselves. Then he tells us they exist and cause our experience. That's knowing two things about them. So he refutes himself in the preface.", "Kant is overrated."]}, {"p": "Kant got it backwards by putting logical possibility at the base of real possibility. Maimon showed that.", "b": "Maimon caught Kant backwards", "l": ["Kant distinguishes logical from real possibility for exactly that reason. The Postulates don't derive one from the other.", "Maimon is a sharp critic, and Kant's own text separates the two more carefully than the objection allows.", "\"Kant got it backwards\" is a big claim to rest on Maimon.", "If Maimon had refuted Kant, we'd all be reading Maimon. Nobody reads Maimon. History did the peer review.", "Maimon is a footnote for a reason."]}, {"p": "Kant's argument against relational theories of space is a really good one.", "b": "Kant on space is great", "l": ["The argument from incongruent counterparts has relationalist replies, and modern physics doesn't treat space the way Kant needs.", "A good argument for 1781. Then geometry changed.", "Kant proved space had to be Euclidean, and then it wasn't.", "Einstein showed space is curved. Kant said it's flat and in your head. One of them built GPS.", "Kant never left town and it shows."]}, {"p": "We should separate words from senses carefully, where Kant left things ignorant.", "b": "Separate words from senses", "l": ["Kant's account of concepts and schemata is an attempt at just that. Whether it works is another matter.", "He wrote eight hundred pages on how concepts apply. \"Ignorant\" is harsh.", "You can say Kant failed. Careless he wasn't.", "A word means what it means. If you need to separate the word from its sense, you've picked the wrong word. That's a vocabulary problem.", "The Critique is long because he didn't know what he meant."]}]}, {"t": "The red & blue button", "n": 42, "k": [{"p": "Red is the rational press: you live whatever anyone else does.", "b": "Red is rational", "l": ["Red guarantees your survival by leaving everyone who pressed blue to carry the risk.", "Red is safe for you. That's a statement about you.", "Red is a free ride on other people's decency.", "A choice is right if it would be fine for everyone to make it. If everyone picks blue, nobody dies. So blue is right, and red is what you pick when you've stopped thinking about anyone.", "Blue button is the only moral choice."]}, {"p": "Blue pressers are betting their lives to feel like good people.", "b": "Blue pressers are virtue signalling with their lives", "l": ["Polls of the dilemma keep returning a blue majority, so the bet has good odds.", "It's a bet that mostly wins, according to every poll run on it.", "Risking your life to feel good is still a better reason than the one red has.", "Most people are good, and good people press blue. So blue always wins, so pressing blue is the safe one. Red pressers have the risk backwards.", "Red is the coward's button."]}, {"p": "Nobody is owed your risk. If blue pressers die, they chose that.", "b": "If blue dies, that's on them", "l": ["Some will press blue by mistake or from trust. A red vote helps decide what happens to them.", "\"They chose it\" covers the confused and the kids too.", "\"Their choice\" is what you say about a cost you helped set.", "Someone's kid is going to press blue because it's a nice color. Red pressers have decided that's the kid's problem.", "Imagine letting a toddler die to win a logic puzzle."]}, {"p": "The moralizing from the blue side is the tell.", "b": "Blue's moralizing is the tell", "l": ["Being annoying doesn't make an argument wrong. The coordination case for blue stands by itself.", "Insufferable and correct happens a lot.", "You can dislike the sermon and still check the maths.", "People only moralize when they're right. If they were wrong they'd have to argue. So the lecturing is evidence for blue.", "The button debate is the best philosophy this chat has done, and blue won it."]}]}]}, {"n": "dot", "u": "terrapin.station.", "m": 17737, "t": [{"t": "Literature", "n": 453, "k": [{"p": "If The Crying of Lot 49 bored you, you didn't get it.", "b": "If Lot 49 bored you, you didn't get it", "l": ["A book can be understood and still judged thin. The withheld-plot device carries a lot of what gets called depth.", "\"You didn't get it\" is the defense for every book that withholds on purpose.", "There's a lot to get, and most of it is that there's nothing to get.", "A good book is one people enjoy reading. People don't enjoy this one. They enjoy having read it, and that's a different product.", "Pynchon is unreadable."]}, {"p": "Some passages in Pynchon are among the best writing there is.", "b": "Pynchon has the best sentences", "l": ["The sentences are extraordinary. The characters they're attached to are thin by design, and that limits what the prose can carry.", "Great paragraphs about people named after puns.", "The best writing of all time, about a character called Oedipa Maas.", "Writing is for telling a story. If the best part is one paragraph in a hotel room, the story didn't need the other hundred and fifty pages.", "Gravity's Rainbow is about a guy and a rocket. It didn't need 760 pages."]}, {"p": "Nabokov knew morality is built into art and used that deliberately.", "b": "Nabokov used morality on purpose", "l": ["Nabokov denied any moral purpose loudly and often. Reading one in is a choice the reader makes.", "He said he had no social purpose and no moral message. He was fairly clear.", "The moral reading of Lolita is a rescue mission.", "A book with a moral is a fable, and fables are for children. Nabokov wrote for adults. So there's no moral in it and looking for one is a category error.", "Lolita is just a well-written bad book."]}, {"p": "Deleuze uses Kafka as a vehicle for his own system, and that's fine. It's how he reads everyone.", "b": "Deleuze using Kafka is fine", "l": ["If he reads every author into his own system, the readings tell you about Deleuze. Calling them readings is generous.", "A method that finds the same thing in every book isn't finding it in the books.", "Deleuze on Kafka is Kafka being told what he meant.", "Kafka wrote diaries saying what he meant. A reading that ignores them is wrong in the plain sense of the word.", "Kafka is depressing and that's the whole reputation."]}, {"p": "Dostoevsky and DFW both start from meaninglessness and come back to something moral.", "b": "Dostoevsky and DFW find their way back to morals", "l": ["\"Life is meaningless, therefore be kind\" is a non sequitur both of them leave as one.", "Both of them announce the void and then act as if it weren't there.", "Nihilism for four hundred pages and then a sermon.", "If life is meaningless then so is the book that says so. That means there's nothing to take from either of them, and they both knew it.", "Nobody finished Infinite Jest. They finished telling people they were reading it."]}]}, {"t": "Deleuze", "n": 237, "k": [{"p": "Deleuze is the one French post-structuralist who isn't stuck to some earlier system.", "b": "Deleuze is the original one", "l": ["His debts to Bergson, Spinoza and Nietzsche are as heavy as anyone's to Hegel or Freud.", "He left the tracks, carrying three other philosophers with him.", "Deleuze is original the way a mixtape is original.", "Every philosopher builds on earlier ones. That's how the subject works. So saying one of them didn't just means you missed where he got it.", "Deleuze is Bergson for people who can't sit through Bergson."]}, {"p": "Deleuze liked Nietzsche because Nietzsche was easy to turn into an example of his own system.", "b": "Deleuze picked Nietzsche because he was easy", "l": ["That's a criticism of the method. A reading chosen for convenience is a ventriloquism.", "Picking philosophers because they're easy to bend is an odd thing to praise.", "Deleuze's Nietzsche says a lot of things Deleuze would say.", "If he only used Nietzsche as a prop, then the book on Nietzsche isn't about Nietzsche. That's a whole book with the wrong title.", "Deleuze never met a writer he couldn't turn into himself."]}, {"p": "Difference comes first. The map is only the map because it isn't the painting or the lamp.", "b": "Difference comes first", "l": ["That's Saussure's point about signs and Hegel's about determination. Putting it as \"difference first\" is the contested part.", "\"A thing is what it is by not being other things\" is in Hegel, the one he's supposed to be escaping.", "That's dialectics. He'd hate that it's dialectics.", "The map is the map because someone drew a map. It would still be a map if the lamp had never existed. So difference isn't first, drawing is.", "The assemblage is \"stuff, together.\" That's the concept."]}, {"p": "Between Hegel on sensuous experience and Deleuze on machinic desire, we already have a good account of what valuable experience is.", "b": "Hegel plus Deleuze covers valuable experience", "l": ["Those two accounts are incompatible in their foundations, so combining them needs an argument.", "You can't staple Hegel to Deleuze and call it settled.", "A good account, made of two philosophers who refute each other.", "If philosophers had worked out what makes experience valuable, people would be happier than they were in 1800. They aren't, so the account doesn't work.", "Deleuze was a Hegelian who was embarrassed about it."]}]}, {"t": "Ethics", "n": 236, "k": [{"p": "Moral truth doesn't exist in any objective sense. Morality isn't something you can be true about.", "b": "There's no objective morality", "l": ["If no moral claim is true, \"you shouldn't believe in moral truths\" needs some other kind of authority.", "Anti-realists still argue as if their op
