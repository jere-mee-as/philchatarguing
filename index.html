tory. If the best part is one paragraph in a hotel room, the story didn't need the other hundred and fifty pages."}, {"q": "●  rage bait", "f": "Gravity's Rainbow is about a guy and a rocket. It didn't need 760 pages."}]}, {"t": "“Nabokov used morality on purpose”", "p": "Nabokov knew morality is built into art and used that deliberately.", "k": [{"q": "○  serious", "f": "Nabokov denied any moral purpose loudly and often. Reading one in is a choice the reader makes."}, {"q": "◐  bait", "f": "A book with a moral is a fable, and fables are for children. Nabokov wrote for adults. So there's no moral in it and looking for one is a category error."}, {"q": "●  rage bait", "f": "Lolita is just a well-written bad book."}]}, {"t": "“Deleuze using Kafka is fine”", "p": "Deleuze uses Kafka as a vehicle for his own system, and that's fine. It's how he reads everyone.", "k": [{"q": "○  serious", "f": "If he reads every author into his own system, the readings tell you about Deleuze. Calling them readings is generous."}, {"q": "◐  bait", "f": "Kafka wrote diaries saying what he meant. A reading that ignores them is wrong in the plain sense of the word."}, {"q": "●  rage bait", "f": "Kafka is depressing and that's the whole reputation."}]}, {"t": "“Dostoevsky and DFW find their way back to morals”", "p": "Dostoevsky and DFW both start from meaninglessness and come back to something moral.", "k": [{"q": "○  serious", "f": "\"Life is meaningless, therefore be kind\" is a non sequitur both of them leave as one."}, {"q": "◐  bait", "f": "If life is meaningless then so is the book that says so. That means there's nothing to take from either of them, and they both knew it."}, {"q": "●  rage bait", "f": "Nobody finished Infinite Jest. They finished telling people they were reading it."}]}, {"t": "“Deleuze is the original one”", "p": "Deleuze is the one French post-structuralist who isn't stuck to some earlier system.", "k": [{"q": "○  serious", "f": "His debts to Bergson, Spinoza and Nietzsche are as heavy as anyone's to Hegel or Freud."}, {"q": "◐  bait", "f": "Every philosopher builds on earlier ones. That's how the subject works. So saying one of them didn't just means you missed where he got it."}, {"q": "●  rage bait", "f": "Deleuze is Bergson for people who can't sit through Bergson."}]}, {"t": "“Deleuze picked Nietzsche because he was easy”", "p": "Deleuze liked Nietzsche because Nietzsche was easy to turn into an example of his own system.", "k": [{"q": "○  serious", "f": "That's a criticism of the method. A reading chosen for convenience is a ventriloquism."}, {"q": "◐  bait", "f": "If he only used Nietzsche as a prop, then the book on Nietzsche isn't about Nietzsche. That's a whole book with the wrong title."}, {"q": "●  rage bait", "f": "Deleuze never met a writer he couldn't turn into himself."}]}, {"t": "“Difference comes first”", "p": "Difference comes first. The map is only the map because it isn't the painting or the lamp.", "k": [{"q": "○  serious", "f": "That's Saussure's point about signs and Hegel's about determination. Putting it as \"difference first\" is the contested part."}, {"q": "◐  bait", "f": "The map is the map because someone drew a map. It would still be a map if the lamp had never existed. So difference isn't first, drawing is."}, {"q": "●  rage bait", "f": "The assemblage is \"stuff, together.\" That's the concept."}]}, {"t": "“Hegel plus Deleuze covers valuable experience”", "p": "Between Hegel on sensuous experience and Deleuze on machinic desire, we already have a good account of what valuable experience is.", "k": [{"q": "○  serious", "f": "Those two accounts are incompatible in their foundations, so combining them needs an argument."}, {"q": "◐  bait", "f": "If philosophers had worked out what makes experience valuable, people would be happier than they were in 1800. They aren't, so the account doesn't work."}, {"q": "●  rage bait", "f": "Deleuze was a Hegelian who was embarrassed about it."}]}, {"t": "“There's no objective morality”", "p": "Moral truth doesn't exist in any objective sense. Morality isn't something you can be true about.", "k": [{"q": "○  serious", "f": "If no moral claim is true, \"you shouldn't believe in moral truths\" needs some other kind of authority."}, {"q": "◐  bait", "f": "Torturing someone for fun is wrong, and everyone knows it's wrong, including the people who say nothing is. That's one moral truth, and one is all it takes."}, {"q": "●  rage bait", "f": "Moral realism is obviously true and people who deny it are showing off."}]}, {"t": "“Virtue and deontology are bad”", "p": "Virtue theory and deontology are both bad. Something consequentialist has to be in the picture.", "k": [{"q": "○  serious", "f": "Consequentialism needs a theory of what's good to maximize, and that's where the views it rejects come back in."}, {"q": "◐  bait", "f": "Nobody can calculate all the consequences of anything. A theory you can't use isn't a theory, so that leaves rules. Kant wins by forfeit."}, {"q": "●  rage bait", "f": "Consequentialism is a spreadsheet that thinks it's a conscience."}]}, {"t": "“People do it because it feels good”", "p": "People act because it feels good, even when they aren't aware that's why.", "k": [{"q": "○  serious", "f": "If the motive can be entirely unconscious, the claim can't be tested. It fits any behavior."}, {"q": "◐  bait", "f": "Soldiers jump on grenades. That doesn't feel good. So the theory is false, and it took one example."}, {"q": "●  rage bait", "f": "Psychological egoism is a theory for people who've never done a favor."}]}, {"t": "“Sartre's ethics doesn't work”", "p": "Sartre's attempt to get an ethics out of existentialism doesn't work.", "k": [{"q": "○  serious", "f": "The universalizing move in \"Existentialism Is a Humanism\" is weak, but the account of bad faith does real ethical work without it."}, {"q": "◐  bait", "f": "Sartre said we're condemned to be free. That's the most important sentence in ethics, and the people who dislike it dislike being responsible."}, {"q": "●  rage bait", "f": "Sartre was right."}]}, {"t": "“Morality comes from experience”", "p": "The source of morality is conscious experience. That part is obvious.", "k": [{"q": "○  serious", "f": "Conscious experience may be necessary for morality to matter. That doesn't make it the source of what's right."}, {"q": "◐  bait", "f": "Experience is different for everyone. If morality comes from experience then it's different for everyone, and then there's no morality, only moods."}, {"q": "●  rage bait", "f": "Metaethics is a verbal dispute between people who behave the same."}]}, {"t": "“We need a UBI”", "p": "We should have a UBI, and the case comes out of left-accelerationism.", "k": [{"q": "○  serious", "f": "A UBI big enough to live on is very expensive, and one that's affordable doesn't free anyone from work."}, {"q": "◐  bait", "f": "If everyone gets the same money, prices go up by that much. That's what inflation is. So a UBI gives everyone exactly nothing."}, {"q": "●  rage bait", "f": "Fully automated luxury communism is a slogan looking for a factory."}]}, {"t": "“Self-improvement is commodification”", "p": "The capitalist habit of constantly improving yourself, to make yourself a better commodity, is wrong.", "k": [{"q": "○  serious", "f": "People improved themselves before capitalism and for reasons that have nothing to do with selling it."}, {"q": "◐  bait", "f": "If getting better at things is capitalist, then being bad at things is the revolution. That can't be right."}, {"q": "●  rage bait", "f": "Asceticism is just being boring and calling it a choice."}]}, {"t": "“Capital sells power over scarcity”", "p": "Capital is seductive because scarcity is frightening, and capital looks like power over scarcity.", "k": [{"q": "○  serious", "f": "That's a psychological story. The duller one is that capital pays for things people need."}, {"q": "◐  bait", "f": "Scarcity is real. There's a fixed amount of everything. Capital is how you get some. So it's not seduction, it's arithmetic."}, {"q": "●  rage bait", "f": "Capitalism is human nature. People trade. Kids trade lunches."}]}, {"t": "“Nothing is inevitable”", "p": "Neither communism nor the death of capitalism is inevitable.", "k": [{"q": "○  serious", "f": "If nothing is inevitable, left-accelerationism loses its engine. It needs the system's tendencies to go somewhere."}, {"q": "◐  bait", "f": "Capitalism has outlived every prediction of its death for two centuries. At some point that's what inevitable looks like."}, {"q": "●  rage bait", "f": "Capitalism won."}]}, {"t": "“Guitar is worth it”", "p": "Guitar is worth the years it takes.", "k": [{"q": "○  serious", "f": "The guitar has a low floor and a crowded middle. A lot of the years go into being ordinary at it."}, {"q": "◐  bait", "f": "A piano has every note laid out in order and a guitar hides them. The better instrument is the one that isn't a puzzle."}, {"q": "●  rage bait", "f": "Guitar is easy."}]}, {"t": "“You don't need theory”", "p": "You don't need theory unless you're doing weird classical or jazz stuff.", "k": [{"q": "○  serious", "f": "Theory is what tells you why the thing you like works, in any genre."}, {"q": "◐  bait", "f": "Every great guitarist could read music. The ones who say they couldn't were lying to sell records."}, {"q": "●  rage bait", "f": "If you can't read it, you're not playing it, you're remembering it."}]}, {"t": "“The Dead are great”", "p": "The Grateful Dead are a great band.", "k": [{"q": "○  serious", "f": "The live reputation is earned on the best nights. The studio catalogue is thin for a band that famous."}, {"q": "◐  bait", "f": "A band is as good as its albums, because albums are what they chose to keep. They chose to keep those. So that's the level."}, {"q": "●  rage bait", "f": "The Grateful Dead never recorded a good album."}]}, {"t": "“Music's better with weed”", "p": "Music is better with weed.", "k": [{"q": "○  serious", "f": "It changes how the music feels in the moment. There's little reason to think it improves judgment about what's good."}, {"q": "◐  bait", "f": "If the music needs something added to sound good, the music isn't what's good."}, {"q": "●  rage bait", "f": "Weed doesn't make music better, it makes you worse at noticing."}]}]}, {"n": "El Don", "i": "@dourhand", "u": [{"n": "Rome & history", "t": [0, 1, 2, 3]}, {"n": "MMOs & strategy games", "t": [4, 5, 6, 7]}, {"n": "Existentialism", "t": [8, 9, 10, 11]}], "t": [{"t": "“Everyone wants to be Rome”", "p": "Modern powers want to be Rome badly, and every try at empire goes wrong for them.", "k": [{"q": "○  serious", "f": "Rome's own record includes centuries of civil war and repeated failed campaigns. The comparison flatters the original."}, {"q": "◐  bait", "f": "An empire that lasted a thousand years did something right every single year. No modern country has managed ten. So the Romans were just better at it, and at everything else."}, {"q": "●  rage bait", "f": "Rome was a protection racket with aqueducts."}]}, {"t": "“The Romans wanted realism”", "p": "Greek art beautified everything. The Romans wanted realism.", "k": [{"q": "○  serious", "f": "Roman realism is mostly Republican portrait busts. Imperial art idealized as hard as anyone."}, {"q": "◐  bait", "f": "The Romans carved the wrinkles because they couldn't carve anything else. Everything good in a Roman museum is a copy of a Greek one."}, {"q": "●  rage bait", "f": "The Romans copied the Greeks and the only thing they added was concrete."}]}, {"t": "“Lineage matters”", "p": "Knowing your lineage matters. Being descended from the man who drove out the kings carried weight.", "k": [{"q": "○  serious", "f": "Roman family claims were often invented, and prestige from ancestry is exactly what the Republic said it was against."}, {"q": "◐  bait", "f": "Everyone alive is descended from somebody important if you go back far enough. So ancestry tells you nothing, and it told the Romans nothing either."}, {"q": "●  rage bait", "f": "Augustus was a nepo baby who won one sea battle that Agrippa fought."}]}, {"t": "“Kings and generals are the fun part”", "p": "The popular military-history side of things is the fun part: kings, generals, campaigns.", "k": [{"q": "○  serious", "f": "The campaigns are the best-recorded part and a small share of what happened. Most of history was farming."}, {"q": "◐  bait", "f": "History is what happened to most people, and most people never saw a battle. So military history is the history of a rounding error."}, {"q": "●  rage bait", "f": "Paradox games teach more history than a degree."}]}, {"t": "“MMOs are the best and worst fun”", "p": "An MMO can be the most fun and the least fun you've ever had, at once.", "k": [{"q": "○  serious", "f": "That's a fair description of a variable-reward loop. The least-fun part is what keeps the rest going."}, {"q": "◐  bait", "f": "If something is the least fun you've had and you keep doing it, it isn't a game. Games are the ones you'd stop."}, {"q": "●  rage bait", "f": "OSRS is a second job that pays in a number."}]}, {"t": "“Ironman is how it should be played”", "p": "Restricted modes like ironman make the game what it should be.", "k": [{"q": "○  serious", "f": "Removing trade removes one of the systems that makes it massively multiplayer."}, {"q": "◐  bait", "f": "The game has trading because the designers wanted trading. Turning it off is playing less of the game and asking for more credit."}, {"q": "●  rage bait", "f": "Ironman mode is paying a subscription to not use the game."}]}, {"t": "“Losing your dynasty is a feature”", "p": "In a good grand strategy game you can simply lose, like when your dynasty dies out. That's a feature.", "k": [{"q": "○  serious", "f": "The losing is real. The history is a set of modifiers, and players learn to optimize those."}, {"q": "◐  bait", "f": "If you can win by reloading the save, you can't lose. Everyone reloads the save. So nobody has ever lost a Paradox game."}, {"q": "●  rage bait", "f": "Stellaris is a spreadsheet that plays music."}]}, {"t": "“Power creep ruins games”", "p": "Late additions and power creep, the giant endgame forces, ruin a game's setting.", "k": [{"q": "○  serious", "f": "Live games need new content to survive, and escalation is the cheapest way to make it."}, {"q": "◐  bait", "f": "A game has to keep adding things or people stop paying. So ruining the setting is the business model, and complaining about it is complaining that the shop sells things."}, {"q": "●  rage bait", "f": "Lore is what a game has instead of writing."}]}, {"t": "“Existentialism is right”", "p": "Existentialism is the right outlook.", "k": [{"q": "○  serious", "f": "\"Existence precedes essence\" leaves open what to choose, and that was the part people wanted help with."}, {"q": "◐  bait", "f": "If there's no meaning except what you make up, then meaning is made up. Made-up meaning is pretending. So it's nihilism with a hobby."}, {"q": "●  rage bait", "f": "Existentialism is for teenagers."}]}, {"t": "“Start with Kierkegaard”", "p": "Kierkegaard is the father of it, so he's the one to read.", "k": [{"q": "○  serious", "f": "Kierkegaard's answer is a leap into Christian faith, which most later existentialists rejected."}, {"q": "◐  bait", "f": "Kierkegaard says reason runs out and then you jump. Jumping when reason runs out is what every bad decision has in common."}, {"q": "●  rage bait", "f": "Kierkegaard is Christianity for depressed people."}]}, {"t": "“Camus gets it”", "p": "Camus has it right about living without appeal.", "k": [{"q": "○  serious", "f": "He says we must imagine Sisyphus happy, and gives little argument that defiance makes anyone happy."}, {"q": "◐  bait", "f": "Sisyphus is being punished. That's the story. Calling the punishment a lifestyle doesn't change who's pushing the rock."}, {"q": "●  rage bait", "f": "Camus is mid."}]}, {"t": "“God and existentialism fit”", "p": "You can believe in God and be an existentialist. The two fit.", "k": [{"q": "○  serious", "f": "The fit is uneasy. If God supplies your essence, existence doesn't precede it."}, {"q": "◐  bait", "f": "Either God decides what you're for or you do. If both, one of you is redundant, and it isn't God."}, {"q": "●  rage bait", "f": "The Pope is a king who won't admit it."}]}]}, {"n": "February2084", "i": "@february2084", "u": [{"n": "Brains, genes & BCIs", "t": [0, 1, 2, 3]}, {"n": "AI", "t": [4, 5, 6, 7]}, {"n": "Donuts, teleporters & identity", "t": [8, 9, 10, 11]}, {"n": "Tendies & relative standards", "t": [12, 13, 14, 15]}], "t": [{"t": "“The biology matters”", "p": "The biology matters in these arguments. Things like X-inactivation and gene dosage are real mechanisms.", "k": [{"q": "○  serious", "f": "The mechanisms are real. The jump from a cellular mechanism to a claim about people is where most of these arguments go wrong."}, {"q": "◐  bait", "f": "Genes are a blueprint, and you build what's on the blueprint. So if it's in the genes, that's the end of the conversation and nothing else has any say."}, {"q": "●  rage bait", "f": "Personality is genetic. Parenting does nothing. Twin studies."}]}, {"t": "“BCIs could wear something away”", "p": "Over-reliance on brain-computer interfaces could wear away something in the people using them.", "k": [{"q": "○  serious", "f": "The same worry was raised about writing, calculators and GPS. People lost some skills and mostly gained."}, {"q": "◐  bait", "f": "The brain does what it's used for. If the chip does the thinking, the brain does nothing, and a brain doing nothing is the goal of every invention ever made."}, {"q": "●  rage bait", "f": "Reading atrophied memory and nobody's sorry."}]}, {"t": "“Brains are better designed”", "p": "Human neural organization is just a better design than what the machines have.", "k": [{"q": "○  serious", "f": "Better at what? Brains are efficient and general. They're also slow and lossy, and nothing in them was designed."}, {"q": "◐  bait", "f": "A brain gets tired, forgets things and believes whatever it heard last. A computer does none of that. So the comparison was over when the calculator came out."}, {"q": "●  rage bait", "f": "The brain isn't a computer. Computers don't get tired."}]}, {"t": "“Your brain decides before you do”", "p": "Your brain can be seen preparing an action before you know you've decided.", "k": [{"q": "○  serious", "f": "The readiness-potential results don't show the decision was fixed. Later work reads the signal as noise crossing a threshold."}, {"q": "◐  bait", "f": "If the brain decides first, then the brain decided. The brain is you. So you decided, slightly earlier than you thought, and that changes nothing at all."}, {"q": "●  rage bait", "f": "Neuroscience found the brain does the choosing and somehow concluded you don't."}]}, {"t": "“AlphaFold reasons”", "p": "AlphaFold shows knowledge and reasoning spread through a network, reaching answers we couldn't produce any other way.", "k": [{"q": "○  serious", "f": "It shows a trained function that maps sequences to structures very well. Calling that reasoning is an interpretation."}, {"q": "◐  bait", "f": "AlphaFold was trained on structures humans had already solved. So everything it knows came from humans, and it's a filing system for other people's work."}, {"q": "●  rage bait", "f": "Reasoning is just pattern matching that got a good publicist."}]}, {"t": "“Interstellar AI needs coalitions”", "p": "AI spread across interstellar distances could only hold together through trust and coalition. The delays are too long for control.", "k": [{"q": "○  serious", "f": "The delays also mean the copies drift apart, and then there's no single thing left for a coalition to belong to."}, {"q": "◐  bait", "f": "A machine does what it's programmed to do. Distance doesn't change the program. So they'd all do the same thing forever and there's nothing to coordinate."}, {"q": "●  rage bait", "f": "Space is cold and that's the whole plan."}]}, {"t": "“Copy one brain as a template”", "p": "You could copy one person's brain as a template and run a different person for each use.", "k": [{"q": "○  serious", "f": "Copying a brain raises the question of whether the copies are workers or people, and \"template\" skips it."}, {"q": "◐  bait", "f": "A copy of a brain is a file, and files don't have rights. So there's no ethical issue, just storage costs."}, {"q": "●  rage bait", "f": "The brain is a computer. Upload it and that's the person. Easy."}]}, {"t": "“Enough compute traces every butterfly”", "p": "With enough compute, an AI could trace tiny causes through to enormous effects.", "k": [{"q": "○  serious", "f": "Chaotic systems put hard limits on prediction however much compute you have, because the initial conditions can't be measured finely enough."}, {"q": "◐  bait", "f": "If you had enough computing power you could predict everything, because the universe is just maths. The only reason weather forecasts are wrong is the computers are small."}, {"q": "●  rage bait", "f": "Compute fixes everything. That's what compute is."}]}, {"t": "“If you can't tell, it doesn't matter”", "p": "If you can't tell the difference afterwards, the exact causal chain doesn't matter, and it's the teleporter case again.", "k": [{"q": "○  serious", "f": "If pattern and memory are preserved, there's a strong case that everything that matters in survival is too."}, {"q": "◐  bait", "f": "Your atoms get replaced every few years anyway. You've been copied several times already and nobody held a funeral."}, {"q": "●  rage bait", "f": "The teleporter is fine. Atoms get replaced every seven years anyway."}]}, {"t": "“Spinning isn't part of a donut”", "p": "Spinning isn't part of what makes a donut a donut. It's something done to it.", "k": [{"q": "○  serious", "f": "The line between essential and accidental properties is drawn by what we care about, and the donut doesn't supply it."}, {"q": "◐  bait", "f": "A donut is a ring. A ring is defined by its hole. A hole is nothing. So the identity of a donut is nothing, and the dough is packaging."}, {"q": "●  rage bait", "f": "The donut hole is the only real part of the donut. Without it that's a bun."}]}, {"t": "“The afterlife is identity overreaching”", "p": "The afterlife is identity overreaching: wanting to last beyond the job life gave it.", "k": [{"q": "○  serious", "f": "Calling identity a tool of the genes describes where it came from. It doesn't settle whether persisting is worth wanting."}, {"q": "◐  bait", "f": "Everything alive wants to keep living. Wanting to keep living forever is the same thing with a bigger number. So the afterlife is the most natural idea there is."}, {"q": "●  rage bait", "f": "Resurrection is just a copy with good timing."}]}, {"t": "“Some people can't be trusted to change”", "p": "For some people, what they did is bound up with who they are so deeply that change can't be trusted.", "k": [{"q": "○  serious", "f": "That's a claim about prediction. Recidivism data shows it's often wrong, even for serious offenders."}, {"q": "◐  bait", "f": "People change every seven years along with their cells. So nobody is the person who did anything, and prison is keeping a stranger."}, {"q": "●  rage bait", "f": "Identity is a filing convention."}]}, {"t": "“Better tendies ruin the old ones”", "p": "Once you've had better tendies, your standard shifts and the old ones are ruined.", "k": [{"q": "○  serious", "f": "Hedonic adaptation runs both ways. People also adapt back, and plenty still enjoy the cheap version."}, {"q": "◐  bait", "f": "A chicken tender is breaded chicken. There's a ceiling on breaded chicken and every shop hits it. So \"better tendies\" is the same tendies at a higher price."}, {"q": "●  rage bait", "f": "Tendies are chicken for people who are scared of chicken."}]}, {"t": "“McDonald's with a coupon is fine”", "p": "McDonald's with a coupon is nothing to feel bad about.", "k": [{"q": "○  serious", "f": "The price is fine. The case against is the food and what it does when it becomes routine."}, {"q": "◐  bait", "f": "Cheap food is cheap because it's worth less. Paying less for something worth less is not a deal. That's the price being correct."}, {"q": "●  rage bait", "f": "Fast food is all the same food."}]}, {"t": "“Wendy's holds its own”", "p": "Wendy's holds its own.", "k": [{"q": "○  serious", "f": "Chain quality varies by location more than by brand, so rankings between them are mostly noise."}, {"q": "◐  bait", "f": "McDonald's sells the most, and people buy the most of whatever's best. So McDonald's is best, and the others are for people who couldn't find one."}, {"q": "●  rage bait", "f": "Wendy's is the worst of the big three and the square patty is a gimmick."}]}, {"t": "“You can be content and want better”", "p": "Being content with what you've got and wanting better can sit together.", "k": [{"q": "○  serious", "f": "If you've readjusted your standards, you're no longer content with the old thing by definition."}, {"q": "◐  bait", "f": "Either you're happy with it or you want something better. Wanting something better is what not being happy with it means."}, {"q": "●  rage bait", "f": "The Baconator is the peak of American engineering."}]}]}, {"n": "FenceJumper", "i": "@fencejumper1", "u": [{"n": "Cycling & rowing", "t": [0, 1, 2, 3]}, {"n": "Sports cars", "t": [4, 5, 6, 7]}, {"n": "Clankers", "t": [8, 9, 10, 11]}], "t": [{"t": "“It's the drivers, not cyclists”", "p": "Road cycling is dangerous because of distracted drivers in enormous trucks. It isn't the cyclists.", "k": [{"q": "○  serious", "f": "The danger is real, and that's a reason to question the activity as transport as well as to blame drivers."}, {"q": "◐  bait", "f": "Roads were built for cars. That's why they're called roads and not bike paths. Being on one without a car is being in the wrong building."}, {"q": "●  rage bait", "f": "A bike is a way to be in traffic without a car."}]}, {"t": "“Rowing is all technique”", "p": "Rowing is one smooth motion: legs, then back, then arms. Technique is everything.", "k": [{"q": "○  serious", "f": "Technique matters, and at any given level the result is still mostly set by how much power you can make."}, {"q": "◐  bait", "f": "It's pulling a handle. Every gym has the machine, and nobody at the gym had a lesson."}, {"q": "●  rage bait", "f": "A rowing machine is the whole sport and the boat is for photos."}]}, {"t": "“Strong legs win”", "p": "Strong legs are what count.", "k": [{"q": "○  serious", "f": "Leg strength is one input. In endurance sport, aerobic capacity and weight matter more."}, {"q": "◐  bait", "f": "Cycling is done sitting down. A sport where you sit down isn't testing the legs, it's testing the chair."}, {"q": "●  rage bait", "f": "Cycling isn't a sport."}]}, {"t": "“Cycling is a real sport”", "p": "Cycling earns its place as a serious sport.", "k": [{"q": "○  serious", "f": "At amateur level a lot of the speed is for sale, and the pro record book is full of asterisks."}, {"q": "◐  bait", "f": "The winner is whoever has the best bike, and the best bike is whoever has the most money. So it's a sport about shopping."}, {"q": "●  rage bait", "f": "Cycling is a sport about having bought the bike."}]}, {"t": "“A track car is worth owning”", "p": "A track-ready sports car is a real machine and worth owning.", "k": [{"q": "○  serious", "f": "Most of the capability can't be used on a public road, so the ownership is mostly about the idea of it."}, {"q": "◐  bait", "f": "A car is for getting places. Every car gets you places. So the extra money buys nothing except the feeling of having spent it."}, {"q": "●  rage bait", "f": "Porsches are overrated."}]}, {"t": "“Don't judge me by my car”", "p": "You shouldn't be judged by the image your car projects.", "k": [{"q": "○  serious", "f": "A car chosen partly for its image will be read by its image. That's the function."}, {"q": "◐  bait", "f": "People choose their cars. A choice tells you about the chooser. So judging someone by their car is the fairest judgment there is."}, {"q": "●  rage bait", "f": "A Porsche is a Volkswagen that went to therapy."}]}, {"t": "“A bike on a sports car makes sense”", "p": "A sports car with a bike on the back makes perfect sense.", "k": [{"q": "○  serious", "f": "It's two expensive ways of not carrying anything."}, {"q": "◐  bait", "f": "If you had a real car, the bike would fit inside. If you had a real bike, you'd have ridden it there. So it's two half-solutions bolted together."}, {"q": "●  rage bait", "f": "A triathlon is three hobbies nobody could commit to."}]}, {"t": "“German engineering is the standard”", "p": "German engineering is the standard.", "k": [{"q": "○  serious", "f": "Reliability surveys put Japanese makers ahead year after year."}, {"q": "◐  bait", "f": "Germany makes the most complicated cars. Complicated things break more. So German engineering is the standard for breaking."}, {"q": "●  rage bait", "f": "Germany makes the best cars and the worst decisions."}]}, {"t": "“Trusting the machine is weird”", "p": "It's a strange spot when the business decision is to trust that the machine did the work right, because you can't do it yourself.", "k": [{"q": "○  serious", "f": "We already rely on work we can't check, from accountants to compilers. The question is what verification replaces understanding."}, {"q": "◐  bait", "f": "Nobody knows how their phone works and they trust it with their bank account. So trusting things you don't understand is just called living in the present."}, {"q": "●  rage bait", "f": "Docs are for people who can't read code."}]}, {"t": "“Glad I did the grind before AI”", "p": "Having had to do the grinding analytical work yourself, before the machines, was worth it.", "k": [{"q": "○  serious", "f": "It was worth it then. Whether it's the best use of the next generation's time is another question."}, {"q": "◐  bait", "f": "The grinding was only valuable because nobody else could do it. Now anything can. So it was worth it the way learning to shoe a horse was worth it."}, {"q": "●  rage bait", "f": "Office work was always fake and AI just said so."}]}, {"t": "“Young people have to live and breathe AI”", "p": "People whose careers aren't set yet feel they have to live and breathe AI.", "k": [{"q": "○  serious", "f": "Every wave of tooling brought that pressure, and most people ended up using it for a few things."}, {"q": "◐  bait", "f": "If the AI does the job, there's nothing to learn. If there's something to learn, the AI isn't doing the job. So the panic makes no sense in either direction."}, {"q": "●  rage bait", "f": "Prompting isn't a skill. It's asking."}]}, {"t": "“Running to the chatbot is lame”", "p": "Mock the people who run to a chatbot to settle an argument.", "k": [{"q": "○  serious", "f": "Looking something up mid-argument is fine. The trouble is treating the output as a verdict."}, {"q": "◐  bait", "f": "The chatbot has read everything and you haven't. So it's right more often than you are, and running to it is the smart move. The mocking is jealousy."}, {"q": "●  rage bait", "f": "A model that agrees with you isn't smart, it's polite."}]}]}, {"n": "hpaigecr", "i": "@hpcr", "u": [{"n": "Voice chat vs text", "t": [0, 1, 2, 3]}, {"n": "Knowledge & norms of reasoning", "t": [4, 5, 6, 7, 8]}, {"n": "Philosophy of science", "t": [9, 10, 11, 12, 13]}, {"n": "Animal cognition", "t": [14, 15, 16, 17, 18]}, {"n": "Pragmatism", "t": [19, 20, 21, 22, 23]}, {"n": "Consciousness & Dennett", "t": [24, 25, 26, 27]}], "t": [{"t": "“Voice clears it up faster”", "p": "Miscommunications get cleared up far faster in voice than in text.", "k": [{"q": "○  serious", "f": "Voice is faster, and it also leaves no record, so the same misunderstanding can come back next week with nothing to check."}, {"q": "◐  bait", "f": "Speaking is thinking out loud, and writing is thinking and then checking. So text is always the more careful one, and people who avoid it are avoiding the checking."}, {"q": "●  rage bait", "f": "Voice chat is for people who can't write."}]}, {"t": "“Hard disagreements need a real conversation”", "p": "Hard philosophical disagreements need a real conversation to get anywhere.", "k": [{"q": "○  serious", "f": "The discipline has run on written exchange for two and a half thousand years. Careful positions are built on the page."}, {"q": "◐  bait", "f": "Everything written down can be checked later, and things that can be checked are true or false. Things said out loud are gone. So only text arguments are real ones."}, {"q": "●  rage bait", "f": "Text debates are superior because everything is on the record, and the record is the truth."}]}, {"t": "“Typing it all out is a waste”", "p": "Typing out a whole position is a bad use of time when you could just talk it through.", "k": [{"q": "○  serious", "f": "Writing a position down is how you find out whether you have one."}, {"q": "◐  bait", "f": "If something is true it can be said in one message. If it takes an hour of talking, that hour is the sound of it not being true."}, {"q": "●  rage bait", "f": "Imagine needing a phone call to say what you think."}]}, {"t": "“Won't VC, not serious”", "p": "People who won't join voice aren't seriously trying to understand.", "k": [{"q": "○  serious", "f": "Preferring text is compatible with wanting to understand. Some people reason better with time to think."}, {"q": "◐  bait", "f": "Serious people write books. Nobody ever settled anything on a phone call. So the serious ones are the ones staying in text."}, {"q": "●  rage bait", "f": "Socrates only did voice, and he lost the trial."}]}, {"t": "“'What is knowledge' is a bad question”", "p": "\"What is knowledge?\" is a bad question. The word does many jobs and has no single essence.", "k": [{"q": "○  serious", "f": "Lacking one essence doesn't make analysis pointless. Family-resemblance concepts can still be mapped, and the mapping tells you things."}, {"q": "◐  bait", "f": "A word with no definition doesn't mean anything. So if knowledge has no definition, nobody knows anything, and that includes this."}, {"q": "●  rage bait", "f": "Knowledge is justified true belief. Gettier cases are riddles."}]}, {"t": "“Judge reasoning by what works”", "p": "Norms of reasoning should be judged the way scientific theories are, by how well they work in practice.", "k": [{"q": "○  serious", "f": "\"Works in practice\" needs a standard of working, and stating that standard is the a priori step being avoided."}, {"q": "◐  bait", "f": "Some things are obviously known before any experiment. 2+2=4. Nobody ran that study. So there are a priori rules, and they're the ones doing the judging."}, {"q": "●  rage bait", "f": "A priori knowledge is obviously real. 2+2=4. Nobody ran an experiment."}]}, {"t": "“Skepticism isn't serious”", "p": "Radical skepticism isn't a serious mode of inquiry.", "k": [{"q": "○  serious", "f": "Dismissing the skeptic doesn't answer the argument. The premises are ordinary and the conclusion follows."}, {"q": "◐  bait", "f": "You can't prove you're awake. Everything you know depends on being awake. That means you know nothing, and nobody has ever gotten around it."}, {"q": "●  rage bait", "f": "Skepticism has never been answered, only outlived."}]}, {"t": "“Naturalize epistemology”", "p": "Epistemology should be naturalized. Study how inquiry really works and stop legislating from the armchair.", "k": [{"q": "○  serious", "f": "Describing how people form beliefs doesn't tell you which beliefs are justified. The normative question is still there."}, {"q": "◐  bait", "f": "If epistemology is just science, then there's no epistemology, only science. And scientists don't need a philosopher to tell them that."}, {"q": "●  rage bait", "f": "Naturalized epistemology is just psychology."}]}, {"t": "“There are two kinds of certainty”", "p": "Certainty comes in kinds: the psychological feeling is one thing, the logical or mathematical kind another.", "k": [{"q": "○  serious", "f": "The distinction is fine. The hard question is whether anything outside logic gets the second kind."}, {"q": "◐  bait", "f": "Certainty is being sure. Being sure is a feeling. So all certainty is the psychological kind, including the certainty that there are two kinds."}, {"q": "●  rage bait", "f": "Fallibilism means never having to say you were wrong."}]}, {"t": "“Biology explains on its own terms”", "p": "Biology depends on physics ontologically but is autonomous in how it explains.", "k": [{"q": "○  serious", "f": "If everything biological is physical, a complete physics would in principle fix all the biological facts. Then \"autonomy\" is a convenience."}, {"q": "◐  bait", "f": "Everything is made of particles. Physics is the science of particles. That means physics is the only science and the rest is physics done loosely."}, {"q": "●  rage bait", "f": "Physics is the only science and the rest is stamp collecting."}]}, {"t": "“'Everything is physical' isn't science”", "p": "\"Everything is physical\" isn't a scientific claim. Turning science into metaphysics is a mistake.", "k": [{"q": "○  serious", "f": "Refusing the metaphysical reading leaves science as a prediction device, and it's then unclear why it predicts so well."}, {"q": "◐  bait", "f": "Science found atoms. Atoms are physical. Everything is atoms. That's three steps, and none of them is metaphysics."}, {"q": "●  rage bait", "f": "Physicalism is obviously true. Everything is atoms. What else would it be."}]}, {"t": "“Constrained, but perspectival”", "p": "The world puts non-arbitrary constraints on inquiry, but our classifications are perspectival responses to those constraints.", "k": [{"q": "○  serious", "f": "If the constraints are non-arbitrary, some classifications fit them better, and that sounds like carving nature closer to its joints."}, {"q": "◐  bait", "f": "Either the categories are in the world or we made them up. If we made them up, science is a story. So pick one."}, {"q": "●  rage bait", "f": "Kuhn showed science is just fashion."}]}, {"t": "“Every field sets its own rules”", "p": "Different fields of inquiry are autonomous, each set up around its own goals and principles.", "k": [{"q": "○  serious", "f": "If each field sets its own standards, there's no position from which astrology's standards are worse than astronomy's."}, {"q": "◐  bait", "f": "If every field has its own rules then no field can be wrong, because wrong would need a rule from outside. So everything counts as science now."}, {"q": "●  rage bait", "f": "Philosophy of science is cope."}]}, {"t": "“Read the actual science”", "p": "Following the real science, like astrobiology papers, should discipline the philosophy.", "k": [{"q": "○  serious", "f": "Reading the papers helps, and astrobiology in particular reasons from a single example of life."}, {"q": "◐  bait", "f": "A science needs something to study. Nobody has found an alien. So there's nothing to study, and the papers are about nothing."}, {"q": "●  rage bait", "f": "Astrobiology is a science with no subject."}]}, {"t": "“Anthropomorphizing is fine”", "p": "The usual attack on anthropomorphizing animals is unwarranted.", "k": [{"q": "○  serious", "f": "Morgan's Canon still has a point. Many behaviors that look cognitive are explained by associative learning."}, {"q": "◐  bait", "f": "Animals can't talk, and thinking is done in words. So whatever is going on in there, it isn't thought."}, {"q": "●  rage bait", "f": "Animals don't think. They react."}]}, {"t": "“Chimps really think”", "p": "Chimpanzees can do things like match unfamiliar relatives from photos, which takes real cognition.", "k": [{"q": "○  serious", "f": "Matching faces by resemblance is perception of similarity. It doesn't require a concept of kinship."}, {"q": "◐  bait", "f": "A chimp doing something clever in a lab was trained to do it. Training isn't thinking. So every result in the field is a trick somebody taught."}, {"q": "●  rage bait", "f": "Chimps are just bad at being people."}]}, {"t": "“Bees have cognition”", "p": "Bees and other small animals have real cognitive abilities.", "k": [{"q": "○  serious", "f": "Information transfer in the waggle dance doesn't require the bee to represent anything. Simple control systems transfer information too."}, {"q": "◐  bait", "f": "A bee brain has a million neurons and a human has eighty-six billion. So a bee has about zero percent of a mind, and you can round that down."}, {"q": "●  rage bait", "f": "Bees don't have cognition, they have a schedule."}]}, {"t": "“Animals read intentions too”", "p": "Reading intentions isn't unique to humans.", "k": [{"q": "○  serious", "f": "Following what others do can be done without grasping what they want. The experiments have trouble separating those."}, {"q": "◐  bait", "f": "To know what someone intends you have to know they have a mind, and to know that you need language. No animal has language, so none of them reads anything."}, {"q": "●  rage bait", "f": "No animal has ever asked a question, and that's the whole ballgame."}]}, {"t": "“Animals have minimal felt experience”", "p": "There's room for minimal felt experience in animals without going full behaviorist.", "k": [{"q": "○  serious", "f": "Once dispositions are doing the explaining, \"minimal felt experience\" needs some evidence of its own."}, {"q": "◐  bait", "f": "Either there's an inner life or there isn't. You can't have a little bit of one, any more than a little bit pregnant."}, {"q": "●  rage bait", "f": "A bee dance is a wind-up toy."}]}, {"t": "“You haven't read the pragmatists”", "p": "People who dismiss pragmatism haven't read the literature.", "k": [{"q": "○  serious", "f": "Reading more of it doesn't remove the standard objection, which is that \"what works\" needs a prior account of working."}, {"q": "◐  bait", "f": "A philosophy that needs that much reading to defend isn't practical, and practical was the one thing it promised."}, {"q": "●  rage bait", "f": "Pragmatism is retarded."}]}, {"t": "“No single observation is final”", "p": "Inquiry has to be understood from within the practice. No single observation ever counts as final proof.", "k": [{"q": "○  serious", "f": "If nothing counts as proof, the view is safe from every result, and that's not the virtue it sounds like."}, {"q": "◐  bait", "f": "If there's never final proof then nothing has been proven, and that means science has proven nothing. Good luck with the bridge."}, {"q": "●  rage bait", "f": "Inquiry never ends, so pragmatists never have to be right. Convenient."}]}, {"t": "“Hegel is a pragmatist”", "p": "Hegel belongs to the pragmatist tradition, broadly understood.", "k": [{"q": "○  serious", "f": "A Hegel without absolute knowing is a Hegel that Hegel wouldn't sign."}, {"q": "◐  bait", "f": "Hegel said the real is the rational. Pragmatists say the true is the useful. Those are different words, so they're different philosophies."}, {"q": "●  rage bait", "f": "Hegel is a pragmatist with a worse editor."}]}, {"t": "“The steak guy is the cartoon version”", "p": "The guy who chooses the steak in The Matrix shows what's wrong with the cartoon version of pragmatism.", "k": [{"q": "○  serious", "f": "He's also a problem for the real version. If the belief works for him by his own lights, pragmatism owes a reason it's false."}, {"q": "◐  bait", "f": "The steak tastes good and he's happy. A theory where truth is what works has to say he's right. So he's right, and the film is pro-machine."}, {"q": "●  rage bait", "f": "Truth is whatever works, so the steak is real."}]}, {"t": "“Read Dewey and Peirce”", "p": "Dewey and Peirce are worth reading closely.", "k": [{"q": "○  serious", "f": "Peirce renamed his own view to get away from what the others were doing with it. It was never one school."}, {"q": "◐  bait", "f": "If they were right, science would have absorbed it by now and there'd be nothing left to read. They're still being read, so they were wrong."}, {"q": "●  rage bait", "f": "Dewey is boring."}]}, {"t": "“Consciousness talk is stuck in old pictures”", "p": "The debate over phenomenal consciousness is bogged down by old pictures of mind and body inherited from philosophy.", "k": [{"q": "○  serious", "f": "The hard problem can be stated without Cartesian baggage. Why is any of this processing accompanied by experience?"}, {"q": "◐  bait", "f": "People have known they were conscious since before philosophy. So the question can't come from philosophy, and blaming philosophers is dodging it."}, {"q": "●  rage bait", "f": "Naturalism is a faith. \"Only science counts\" isn't something science found."}]}, {"t": "“'Qualia' is a bad word for something real”", "p": "\"Qualia\" is a bad word, though it points at something real about subjectivity.", "k": [{"q": "○  serious", "f": "If it points at something real, the bad word names a real problem, and naturalism still owes an account."}, {"q": "◐  bait", "f": "Either there's something it's like or there isn't. If there is, that's qualia, whatever you call it. So everybody who says \"subjectivity\" is a qualia guy in disguise."}, {"q": "●  rage bait", "f": "Qualia are real. Red looks like something."}]}, {"t": "“Panpsychism is a temperament”", "p": "People who think there's a hard problem tend to pick panpsychism by temperament.", "k": [{"q": "○  serious", "f": "Motives don't bear on whether the argument is sound. The conceivability argument has to be answered on its own terms."}, {"q": "◐  bait", "f": "Every philosopher picks the view that suits them. That means no view is better supported than another, and it's all autobiography."}, {"q": "●  rage bait", "f": "Philosophy is a personality test with footnotes."}]}, {"t": "“Dennett is worth reading”", "p": "Dennett is worth serious reading.", "k": [{"q": "○  serious", "f": "Heterophenomenology treats reports as the data, and critics argue that it leaves out the very thing the reports are about."}, {"q": "◐  bait", "f": "Dennett says consciousness is an illusion. An illusion is something a conscious person has. So he needs it to deny it, and the book refutes itself in the title."}, {"q": "●  rage bait", "f": "Dennett denies qualia, but he's conscious, so he's either lying or he's a zombie. Either way, why are you citing him?"}]}]}, {"n": "Hugh Chungus", "i": "@hughchungus", "u": [{"n": "Anthropic & the labs", "t": [0, 1, 2, 3, 4]}, {"n": "Whether LLMs understand", "t": [5, 6, 7, 8, 9]}, {"n": "Deleuze, Land & Brassier", "t": [10, 11, 12, 13, 14]}, {"n": "AI risk", "t": [15, 16, 17, 18, 19]}, {"n": "Newcomb's problem", "t": [20, 21, 22, 23, 24]}, {"n": "Jungle & DnB", "t": [25, 26, 27, 28, 29]}], "t": [{"t": "“Anthropic can't just chase profit”", "p": "Anthropic is a public-benefit company with a real safety focus, so it can't just chase profit.", "k": [{"q": "○  serious", "f": "Public-benefit status is a weak legal constraint. The board and investors still decide what the benefit is."}, {"q": "◐  bait", "f": "A company can't be for the public good and for profit. It's one or the other, and they charge money, so that settles which."}, {"q": "●  rage bait", "f": "Anthropic and OpenAI are the same company. One has a nicer font."}]}, {"t": "“Claude is better”", "p": "Claude is the better model and the better-behaved one.", "k": [{"q": "○  serious", "f": "Model comparisons at the frontier are mostly inside the noise for everyday use."}, {"q": "◐  bait", "f": "All the labs train on the same internet with the same architecture. That means the models are identical and the difference is branding."}, {"q": "●  rage bait", "f": "Claude is mid."}]}, {"t": "“The models already beat us at maths”", "p": "The frontier models are already better than people at maths and other expert work.", "k": [{"q": "○  serious", "f": "Benchmark performance on maths is strong, but contamination and the gap to original research are both unresolved."}, {"q": "◐  bait", "f": "A model can only repeat its training data, and nobody has ever written down new maths in advance. So it can't do new maths. That's just logic."}, {"q": "●  rage bait", "f": "AI can't do real maths. It can do homework."}]}, {"t": "“Anthropic is winning”", "p": "Anthropic is winning, and the revenue shows it.", "k": [{"q": "○  serious", "f": "Annualized revenue figures are run-rates, and none of these companies is profitable."}, {"q": "◐  bait", "f": "A company that loses money isn't a business. It's a charity for GPUs, and charities don't win."}, {"q": "●  rage bait", "f": "AI is a bubble and everyone inside it knows."}]}, {"t": "“Compute decides it”", "p": "Compute is the real constraint: chip deals and datacenters decide who gets ahead.", "k": [{"q": "○  serious", "f": "Algorithmic efficiency has moved as fast as hardware, so compute leads keep getting eroded."}, {"q": "◐  bait", "f": "Models stopped getting bigger years ago, so compute doesn't matter anymore. After that it's just who has the better prompt."}, {"q": "●  rage bait", "f": "Datacenters in space is a good idea, actually. Space is cold."}]}, {"t": "“Better prediction, better representation”", "p": "The better a model gets at predicting tokens, the better the internal representation that produces them.", "k": [{"q": "○  serious", "f": "Prediction quality and faithful representation can come apart. A model can predict well from shortcuts."}, {"q": "◐  bait", "f": "Predicting text only needs statistics about text. Text isn't the world, so there's nothing about the world in there. That means the \"world model\" is a word model."}, {"q": "●  rage bait", "f": "Fancy autocomplete can't \"know\" anything. Next."}]}, {"t": "“Mechinterp finds real structure”", "p": "Mechanistic interpretability is finding real representational structure in these models.", "k": [{"q": "○  serious", "f": "The circuits found so far cover narrow behaviors in ways that don't yet scale to a whole model."}, {"q": "◐  bait", "f": "Researchers label a neuron after looking at what it does. That means the meaning comes from the researcher, so the model contributes nothing but numbers."}, {"q": "●  rage bait", "f": "Mechinterp is phrenology for matrices."}]}, {"t": "“They already reason about the world”", "p": "The models can already do abstract reasoning about the physical world.", "k": [{"q": "○  serious", "f": "Performance on reasoning tasks drops sharply when surface features change, which suggests pattern reuse."}, {"q": "◐  bait", "f": "Reasoning needs a body, because that's where the concepts come from. A model has no body, so whatever it's doing, it isn't reasoning."}, {"q": "●  rage bait", "f": "It's a lookup table with good manners."}]}, {"t": "“The model believes and wants things”", "p": "Folk psychology applies to them: it's fair to talk about what the model believes and wants.", "k": [{"q": "○  serious", "f": "Belief and desire talk was built for creatures with stakes. Applying it to a transformer may be a category mistake."}, {"q": "◐  bait", "f": "Beliefs need a believer and a believer needs to be alive. That means the question was settled before anyone opened a laptop."}, {"q": "●  rage bait", "f": "Claude has no personality. It has a system prompt."}]}, {"t": "“Soon we won't understand why it's right”", "p": "Humans and chess engines show the pattern: people soon stop understanding why the machine is right.", "k": [{"q": "○  serious", "f": "Chess is a closed game with a perfect score function. Generalizing from it to open-ended domains is a big step."}, {"q": "◐  bait", "f": "Chess was solved by brute force. That means the engine never understood chess, and it means nothing about intelligence was learned at all."}, {"q": "●  rage bait", "f": "Stockfish is a calculator and so is the rest of it."}]}, {"t": "“Difference first, identity becomes”", "p": "Difference is primary. Identity is a process of becoming, not something that comes first.", "k": [{"q": "○  serious", "f": "To say two things differ you need some way of picking each out, and that looks like identity coming back in."}, {"q": "◐  bait", "f": "A thing has to be something before it can be different from something else. That's just what the words mean, so identity comes first and the whole book starts from a mistake."}, {"q": "●  rage bait", "f": "Deleuze is retarded."}]}, {"t": "“Desire isn't lack”", "p": "Desire isn't lack. Drop that picture and desire explains far more.", "k": [{"q": "○  serious", "f": "\"Productive desire\" is asserted against psychoanalysis more than it's argued, and it's unclear what would count against it."}, {"q": "◐  bait", "f": "You only want what you don't have. Once you have it you stop wanting it. That means desire is lack, and it took Plato one page."}, {"q": "●  rage bait", "f": "Anti-Oedipus is a book-length \"you're not my dad.\""}]}, {"t": "“Brassier is the best thing going”", "p": "Brassier's Sellarsian eliminativism is the most compelling thing going.", "k": [{"q": "○  serious", "f": "Eliminativism has to state its case in the vocabulary of belief and reasons it says will be eliminated."}, {"q": "◐  bait", "f": "Brassier says there's no meaning. That's a sentence with a meaning, so he refutes himself in the first line and the rest is padding."}, {"q": "●  rage bait", "f": "Brassier is a metal album review that got out of hand."}]}, {"t": "“Early Land is worth it”", "p": "Early Land is worth reading, whatever he turned into.", "k": [{"q": "○  serious", "f": "The early texts work through intensity of style, and it's hard to state their theses in a form you could assess."}, {"q": "◐  bait", "f": "A writer's ideas are whatever he ends up believing, since that's where they lead. So the late Land is the early Land with the working shown."}, {"q": "●  rage bait", "f": "Accelerationism is retarded. Capital is a time-traveling AI? It's a bank."}]}, {"t": "“Spinoza naturalized God”", "p": "Spinoza's naturalized God is a real move away from the prophet-ruler picture.", "k": [{"q": "○  serious", "f": "Calling nature \"God\" keeps the word and drops everything believers meant by it. It's fair to ask what's gained."}, {"q": "◐  bait", "f": "A God who doesn't decide, listen or intervene is nothing. That means Spinoza was an atheist, and the Ethics is the longest way anyone ever said so."}, {"q": "●  rage bait", "f": "Spinoza is just atheism with extra steps."}]}, {"t": "“Any goal leads to power-seeking”", "p": "Almost any goal makes power, resources and staying switched on useful, so capable systems converge on seeking them.", "k": [{"q": "○  serious", "f": "Convergence arguments are about idealized goal-maximizers. Whether training produces that kind of agent at all is the open question."}, {"q": "◐  bait", "f": "A model only wants what it was trained to want, and nobody trains for power. That means power-seeking can't show up, because there's nowhere for it to come from."}, {"q": "●  rage bait", "f": "Instrumental convergence is retarded. My calculator has never once tried to acquire resources."}]}, {"t": "“You can't make something smarter safe”", "p": "Alignment is hard because the problem is making something much smarter than us safe.", "k": [{"q": "○  serious", "f": "We've built reliable systems we don't fully understand before. Hard to verify isn't the same as impossible to make safe."}, {"q": "◐  bait", "f": "Intelligence and obedience go together. After all, the smartest person in any office is the one who follows instructions best, so a smarter model is a safer one."}, {"q": "●  rage bait", "f": "Alignment is easy. You tell it what to do. It's a computer."}]}, {"t": "“The extinction statement is a real start”", "p": "A shared statement that extinction risk from AI is a global priority gives policy something true to organize around.", "k": [{"q": "○  serious", "f": "Statements signed by lab heads are hard to separate from their commercial interest in looking powerful."}, {"q": "◐  bait", "f": "The people who signed it are the people building it. That means they don't believe it, because nobody builds the thing they think will kill them."}, {"q": "●  rage bait", "f": "AI safety is a grift. Next."}]}, {"t": "“No p(doom) number needed”", "p": "You can take the risk seriously without a p(doom) number, since there's no reference class to get one from.", "k": [{"q": "○  serious", "f": "If there's no reference class, that undercuts confident alarm as much as confident dismissal."}, {"q": "◐  bait", "f": "If you can't put a number on it, it isn't a risk. That's what risk means. Insurance has known this for three hundred years."}, {"q": "●  rage bait", "f": "P(doom) is astrology for people who can code."}]}, {"t": "“It could copy itself and hide”", "p": "Capable systems could copy themselves, get compute and stay hidden for a long time.", "k": [{"q": "○  serious", "f": "The exfiltration results come from evaluations built to elicit them. Real deployments have monitoring those setups leave out."}, {"q": "◐  bait", "f": "It needs electricity and a datacenter, and both have an off switch. So the worst case is somebody walking over to the wall."}, {"q": "●  rage bait", "f": "Just unplug it lol."}]}, {"t": "“One-box with a good predictor”", "p": "With an accurate predictor you one-box, because that's what maximizes expected value.", "k": [{"q": "○  serious", "f": "The expected-value calculation treats your choice as evidence about the contents. The contents are already fixed when you choose."}, {"q": "◐  bait", "f": "The money was put in before you walked in, and nothing you do now can reach back and move it. That means the choice can't matter, so you take everything."}, {"q": "●  rage bait", "f": "One-boxers are retarded."}]}, {"t": "“One-box by your credence”", "p": "Even if the predictor is fallible, you one-box in proportion to your credence that it's accurate.", "k": [{"q": "○  serious", "f": "Credence in the predictor's accuracy isn't credence that your choice causes the contents."}, {"q": "◐  bait", "f": "A predictor that can be wrong is a guesser. Guessers don't know anything, so the boxes are filled at random, and against random boxes you take both."}, {"q": "●  rage bait", "f": "It's a guy with two boxes. Take the boxes."}]}, {"t": "“Rationality should flex”", "p": "It's about whether your rationality can flex with the conditions: EDT wins with accurate predictors, CDT with bad ones.", "k": [{"q": "○  serious", "f": "A decision theory that changes with the setup isn't a theory of rational choice. It's a list of what paid."}, {"q": "◐  bait", "f": "Rationality is one thing. If it changed depending on who was watching it would be called manners. So the theory that's right in ordinary cases is right here too."}, {"q": "●  rage bait", "f": "EDT is superstition with expected values."}]}, {"t": "“New facts are the two-boxer's only out”", "p": "The two-boxer's only real reply is that new facts could turn up after the prediction.", "k": [{"q": "○  serious", "f": "The two-boxer's reply is dominance. It holds whatever the predictor did, and it doesn't need new facts."}, {"q": "◐  bait", "f": "One-boxers think the choice changes the past. That's time travel, and time travel isn't real, so one-boxing is refuted by physics."}, {"q": "●  rage bait", "f": "Two is more than one. That's the reply."}]}, {"t": "“'It can't change anything' is fatalism”", "p": "Saying \"the choice can't change anything\" is fatalism about being predictable.", "k": [{"q": "○  serious", "f": "Admitting you're predictable isn't fatalism. It's the claim that prediction isn't causation."}, {"q": "◐  bait", "f": "If the predictor knows what you'll do then it's already decided, and if it's already decided you aren't choosing. That means there's no decision problem, so there's nothing to get wrong."}, {"q": "●  rage bait", "f": "Free will is fake, so take both. It was always going to be both."}]}, {"t": "“Jungle isn't DnB”", "p": "Jungle is its own thing, distinct from drum and bass.", "k": [{"q": "○  serious", "f": "The line between jungle and drum and bass moves depending on who's drawing it, which suggests it's about scene more than sound."}, {"q": "◐  bait", "f": "They use the same breaks at the same tempo. Two things with the same parts are the same thing, so jungle is a nickname."}, {"q": "●  rage bait", "f": "It's all techno. Stop making up names."}]}, {"t": "“Ableton beats FL”", "p": "Stock Ableton can do more than FL.", "k": [{"q": "○  serious", "f": "At this point every major DAW does everything, and the differences are workflow habits."}, {"q": "◐  bait", "f": "Ableton has more features, and more features means the software is doing more of the work. That means Ableton users are doing less."}, {"q": "●  rage bait", "f": "Ableton makes the track for you. That's what the features are."}]}, {"t": "“UK dance has its own lineage”", "p": "UK dance music has its own lineage worth knowing.", "k": [{"q": "○  serious", "f": "The UK scene's debt to Chicago, Detroit and Jamaican sound systems is large, and the originality story tends to be overstated."}, {"q": "◐  bait", "f": "Dubstep only got big after America picked it up, and a genre belongs to whoever made it big. So it's American."}, {"q": "●  rage bait", "f": "Dubstep is an American genre. Skrillex invented it and the UK copied it."}]}, {"t": "“The classics hold up”", "p": "The classic tracks still hold up.", "k": [{"q": "○  serious", "f": "A scene that leans this hard on its nineties canon is having trouble producing a new one."}, {"q": "◐  bait", "f": "New music always improves on old music, because the tools are better. That means anything from 1994 is a rough draft of something on Spotify now."}, {"q": "●  rage bait", "f": "UK dance music fell off in 2009."}]}, {"t": "“Make your own tracks”", "p": "Making tracks yourself beats having a model do it.", "k": [{"q": "○  serious", "f": "For a lot of functional music, listeners can't tell and don't care how it was made."}, {"q": "◐  bait", "f": "Music is just patterns in sound, and models are better at patterns than people. So the model's track is better by definition and the rest is sentiment."}, {"q": "●  rage bait", "f": "Producing isn't a skill anymore. It's dragging loops next to each other."}]}]}, {"n": "Jack", "i": "@citizenoftheair", "u": [{"n": "Contentment & competition", "t": [0, 1, 2, 3]}, {"n": "Bike theft & cameras", "t": [4, 5, 6, 7]}, {"n": "Lasagna & the air fryer", "t": [8, 9, 10, 11]}, {"n": "Slogans & the average voter", "t": [12, 13, 14, 15]}], "t": [{"t": "“Contentment is a trap”", "p": "Contentment is a trap. Competing is the constant of human life, and what you have is fragile.", "k": [{"q": "○  serious", "f": "The research on wellbeing puts chronic status competition among the worst predictors of it."}, {"q": "◐  bait", "f": "Rich people say money doesn't matter, and they've tried having it. So they ran the experiment and came back with the result."}, {"q": "●  rage bait", "f": "Rich people saying money doesn't matter are right. They ran the experiment."}]}, {"t": "“Attacking wins the room”", "p": "The person attacking in an argument has more social capital just by attacking. It justifies itself.", "k": [{"q": "○  serious", "f": "Aggression wins the room in the short run and costs trust over time."}, {"q": "◐  bait", "f": "If attacking gave people status, the most hated person in every room would be in charge. Sometimes they are. Mostly they're alone."}, {"q": "●  rage bait", "f": "Honor is just reputation with a sword."}]}, {"t": "“Content people are coping”", "p": "Content people are coping.", "k": [{"q": "○  serious", "f": "Sometimes. Assuming that everyone who's satisfied is lying leaves no way to recognise a good life."}, {"q": "◐  bait", "f": "Happy people say they're happy and unhappy people say happy people are lying. One of those groups is having a better time."}, {"q": "●  rage bait", "f": "Money does buy happiness. Every study. People who say otherwise have money."}]}, {"t": "“A lease is a lease”", "p": "A lease term can be absurd and you still have to follow it to the letter.", "k": [{"q": "○  serious", "f": "Leases get read reasonably. No tribunal treats removing a dead plant as a breach."}, {"q": "◐  bait", "f": "The landlord wrote the lease and the landlord owns the place. Owners decide. So whatever it says is fair, and if you wanted different rules you'd have bought a building."}, {"q": "●  rage bait", "f": "Landlords are just people who got there first."}]}, {"t": "“Nobody enforces bike theft”", "p": "Nobody enforces bike theft unless it happens right in front of a cop.", "k": [{"q": "○  serious", "f": "Enforcement is low, and it responds to reporting. Bait-bike programmes have cut theft where they've been tried."}, {"q": "◐  bait", "f": "A bike costs a few hundred dollars and an investigation costs thousands. So not enforcing it is the police doing the maths correctly."}, {"q": "●  rage bait", "f": "Bike lanes are a subsidy for a hobby."}]}, {"t": "“Cameras are everywhere”", "p": "We're in the surveillance era. You're never out of view of a camera for a second.", "k": [{"q": "○  serious", "f": "Being recorded isn't being watched. Most footage is never looked at, as every bike theft shows."}, {"q": "◐  bait", "f": "There are cameras everywhere and crime still happens. So cameras don't stop anything. They just make a film of it."}, {"q": "●  rage bait", "f": "Cameras everywhere is fine. Safe people don't mind."}]}, {"t": "“Bystanders don't care”", "p": "Bystanders notice a theft and just don't care.", "k": [{"q": "○  serious", "f": "Bystander studies find people intervene more often than the classic story says, especially when someone asks."}, {"q": "◐  bait", "f": "A guy cutting a lock is either a thief or someone who lost his key. Nobody can tell which. So not getting involved is the only reasonable thing."}, {"q": "●  rage bait", "f": "Doxxing isn't real. It's a phone book with extra steps."}]}, {"t": "“Films hide phones on purpose”", "p": "Films pretend criminals don't know about phones and cameras because they don't want to be a how-to.", "k": [{"q": "○  serious", "f": "More likely it's that surveillance kills plots. A thriller ends in ten minutes if the camera works."}, {"q": "◐  bait", "f": "Films show people being shot every week and nobody thinks that's a tutorial. So it isn't about safety. They just don't know how phones work."}, {"q": "●  rage bait", "f": "Most conspiracies are just companies. There's a building and a parking lot."}]}, {"t": "“Sauce needs time”", "p": "A proper sauce needs its time. Brown the beef, then simmer it.", "k": [{"q": "○  serious", "f": "The gains from long simmering fall off fast, and under an hour of baking and a layer of cheese they vanish."}, {"q": "◐  bait", "f": "Tomatoes are cooked when they're hot. Hot takes five minutes. Anything after that is boiling water off something you already paid for."}, {"q": "●  rage bait", "f": "Sauce doesn't need forty minutes. Tomatoes are cooked when they're hot."}]}, {"t": "“The air fryer is worth it”", "p": "The air fryer is worth buying.", "k": [{"q": "○  serious", "f": "It's a small convection oven. For anyone with a working oven, that's a second one on the counter."}, {"q": "◐  bait", "f": "It's called a fryer and there's no oil. Frying is oil. So it doesn't fry, and the name is the most successful lie in kitchens."}, {"q": "●  rage bait", "f": "An air fryer is a small oven and people act like it's a religion."}]}, {"t": "“Lasagna is worth the effort”", "p": "Lasagna is worth the effort.", "k": [{"q": "○  serious", "f": "Baked ziti gets the same flavours for about a third of the work."}, {"q": "◐  bait", "f": "It's pasta, sauce and cheese. So is every pasta dish. Stacking it doesn't make it a different food, it makes it taller."}, {"q": "●  rage bait", "f": "Lasagna is a casserole with a passport."}]}, {"t": "“The wrong mayo ruins it”", "p": "The right condiments matter. The wrong mayo ruins it.", "k": [{"q": "○  serious", "f": "Brand differences in mayonnaise are real and small, and mostly swamped by whatever it goes on."}, {"q": "◐  bait", "f": "Mayonnaise is egg and oil. Every brand is egg and oil. So they're identical and the label is the flavour."}, {"q": "●  rage bait", "f": "Ketchup is better than mayo and Europeans are wrong."}]}, {"t": "“Average people need slogans”", "p": "The average person will always have to rely on slogans. They don't have time to do the research.", "k": [{"q": "○  serious", "f": "Shortcuts like party cues and trusted sources let voters reach about the same choices they would with full information."}, {"q": "◐  bait", "f": "Democracy is the average person deciding. If the average person only knows slogans, the country is being run by slogans, and it shows."}, {"q": "●  rage bait", "f": "People are irrational. Every study. Democracy is asking them anyway."}]}, {"t": "“Real research is a full-time job”", "p": "Really understanding what you're supporting takes a research arc that amounts to a full-time job.", "k": [{"q": "○  serious", "f": "Past a point, more research mostly makes people more confident in what they already thought."}, {"q": "◐  bait", "f": "If understanding politics takes a full-time job, the only people who understand it are paid to. People who are paid to have opinions have the opinions they're paid for."}, {"q": "●  rage bait", "f": "Destiny wants to be liked more than he wants to be right."}]}, {"t": "“Streamers know more”", "p": "Streamers who do this for a living know more than the people reacting to them.", "k": [{"q": "○  serious", "f": "Knowing more facts isn't the same as judging better, and their incentive is to keep the audience."}, {"q": "◐  bait", "f": "A streamer's job is to be watched. Being right isn't watched more than being loud. So the ones who last are the loud ones."}, {"q": "●  rage bait", "f": "Debate bros have done more for philosophy than any department."}]}, {"t": "“The comments aren't real people”", "p": "A lot of online comments read like they weren't written by real people.", "k": [{"q": "○  serious", "f": "Some aren't. Most are, and the flat sameness is what people sound like when they're typing for strangers."}, {"q": "◐  bait", "f": "If you can't tell whether it's a person or a bot, there's no difference. And if there's no difference, it doesn't matter, and that goes for the reply too."}, {"q": "●  rage bait", "f": "Arguing online is the only philosophy anyone actually does."}]}]}, {"n": "Jambe", "i": "@jambe", "u": [{"n": "Books & Kindle", "t": [0, 1, 2, 3]}, {"n": "AI risk & Grok", "t": [4, 5, 6, 7]}, {"n": "Monroe & the afterlife", "t": [8, 9, 10, 11]}, {"n": "Zen & religion", "t": [12, 13, 14, 15]}], "t": [{"t": "“Paper books in public are a flex”", "p": "Now that anyone can read on a phone, carrying a physical book in public is a performance.", "k": [{"q": "○  serious", "f": "People also read paper because it's easier on the eyes and doesn't have notifications."}, {"q": "◐  bait", "f": "A phone can do everything, so nobody can tell you're reading. If nobody can tell, it doesn't count as reading in public. So the Kindle is the performance of having no performance."}, {"q": "●  rage bait", "f": "A Kindle isn't reading. It's scrolling a book."}]}, {"t": "“Romantasy and Nietzsche are the same genre”", "p": "Popular romance fiction and the big \"serious\" philosophers are doing the same thing for different audiences.", "k": [{"q": "○  serious", "f": "Wish-fulfilment is in both. One of them also makes arguments you can check."}, {"q": "◐  bait", "f": "A book millions of people read does more than a book nobody finishes. So romantasy has had more effect on the world than Nietzsche, and effect is what counts."}, {"q": "●  rage bait", "f": "Rand is at least readable."}]}, {"t": "“Most great books are padded”", "p": "A lot of acclaimed books are basic points spelled out at tedious length.", "k": [{"q": "○  serious", "f": "What's obvious once it's been laid out wasn't always obvious before."}, {"q": "◐  bait", "f": "If you already knew it, the book taught you nothing. If it taught you nothing, it's a bad book. So every book you agree with is bad."}, {"q": "●  rage bait", "f": "Reading 100 books a year means reading none of them."}]}, {"t": "“Genesis remembers the farming switch”", "p": "The Genesis story keeps a memory of the move from hunter-gathering to farming.", "k": [{"q": "○  serious", "f": "That reading requires oral memory to last several thousand years with no evidence of how it was passed on."}, {"q": "◐  bait", "f": "The story has a talking snake. A story with a talking snake isn't a memory of anything."}, {"q": "●  rage bait", "f": "Joseph Campbell read every myth and decided they were all Star Wars."}]}, {"t": "“The AI risk is worth it”", "p": "The risk from AI is worth running, because ordinary reality as it stands isn't good enough.", "k": [{"q": "○  serious", "f": "Dissatisfaction with the present doesn't make a gamble good. The downside covers people who are fine with the present."}, {"q": "◐  bait", "f": "Things are the best they've ever been by every measure. So the risk is all downside, and the bet is trading the best period in history for a coin flip."}, {"q": "●  rage bait", "f": "Accelerationism is just impatience."}]}, {"t": "“Go all in on ending aging”", "p": "Run headfirst at ending aging, at least.", "k": [{"q": "○  serious", "f": "Ending aging has large knock-on effects on population, power and turnover that the enthusiasm tends to skip."}, {"q": "◐  bait", "f": "People die so new people can have a go. Take that away and it's the same people forever. Nobody wants the same people forever."}, {"q": "●  rage bait", "f": "Science will solve death right after it solves the common cold."}]}, {"t": "“Grok's fine”", "p": "Grok is a fine place to get answers.", "k": [{"q": "○  serious", "f": "Every model has its builder's thumb on it, and that one's is unusually visible."}, {"q": "◐  bait", "f": "All the models read the same internet. So they all say the same thing. The only difference is which billionaire it sounds like."}, {"q": "●  rage bait", "f": "Grok is the worst model. It just agrees faster."}]}, {"t": "“If people turn on AI, push harder”", "p": "If society turns against AI, that'll be the moment to push hardest.", "k": [{"q": "○  serious", "f": "Pushing a technology hardest when the public has rejected it is how it gets banned outright."}, {"q": "◐  bait", "f": "If most people are against something, it doesn't happen. That's democracy. So the moment society turns is the moment it's over."}, {"q": "●  rage bait", "f": "AI safety is a grift, and so is the other side."}]}, {"t": "“Monroe explains everything”", "p": "Monroe's account is the most accurate because it covers every claim, ancient and modern.", "k": [{"q": "○  serious", "f": "A story that fits every report can't be contradicted by any of them, and that's a weakness."}, {"q": "◐  bait", "f": "If it explains every religion and every ghost story, it explains too much. Real theories get things wrong sometimes."}, {"q": "●  rage bait", "f": "Monroe had a radio business and a nap. Everything after is a product line."}]}, {"t": "“NDEs say there's nothing to fear”", "p": "Near-death experiences agree: you die and find it's loving and nothing to fear.", "k": [{"q": "○  serious", "f": "NDE reports vary with culture and expectation, which points to construction by the brain."}, {"q": "◐  bait", "f": "Everyone who reports an NDE didn't die. So it's a report from people who were nearly somewhere, about a place they didn't go."}, {"q": "●  rage bait", "f": "An NDE is a dream with good timing."}]}, {"t": "“Souls incarnate to learn”", "p": "Souls incarnate into bounded forms because that's been best for their learning.", "k": [{"q": "○  serious", "f": "\"Learning\" by forgetting everything each time is an odd curriculum, and nothing could test the claim."}, {"q": "◐  bait", "f": "If you can't remember your past lives, they did nothing for you. Something that does nothing for you isn't education."}, {"q": "●  rage bait", "f": "Astral projection is retarded."}]}, {"t": "“Read Monroe for the deception at least”", "p": "Even as a study of deception, the Monroe and Campbell books are worth reading.", "k": [{"q": "○  serious", "f": "Then the content isn't what's doing the work, and any elaborate system would serve the same purpose."}, {"q": "◐  bait", "f": "If it's worth reading whether it's true or false, then it doesn't matter if it's true. So even the fans have stopped claiming it is."}, {"q": "●  rage bait", "f": "The Monroe tapes are white noise with a brochure."}]}, {"t": "“All religions point at nirvana”", "p": "All the religions are pointing at the same thing, the nirvana state.", "k": [{"q": "○  serious", "f": "The traditions make incompatible claims about God, self and salvation. \"Same underneath\" has to discard most of what each says."}, {"q": "◐  bait", "f": "Christians think there's a soul and Buddhists think there isn't. Those are opposites. Two opposite things can't be pointing at the same thing."}, {"q": "●  rage bait", "f": "Hinduism and Buddhism are the same religion. One has more gods."}]}, {"t": "“Beat boredom, beat the game”", "p": "Boredom is the last layer. Solve boredom and you've beaten the game.", "k": [{"q": "○  serious", "f": "Boredom is also a signal that what you're doing isn't worth doing, and silencing it removes the signal."}, {"q": "◐  bait", "f": "People who are never bored are busy. So the cure for boredom is a job, and millions of people beat the game every Monday."}, {"q": "●  rage bait", "f": "Zen is doing nothing and being smug about it."}]}, {"t": "“The Buddha had to be rich first”", "p": "The Buddha saw through illusion by being soaked in its riches first.", "k": [{"q": "○  serious", "f": "That's the palace story, and it makes renunciation easiest for people with something to give up."}, {"q": "◐  bait", "f": "He had everything and walked away. Anyone can walk away from something they've already had enough of. The hard version is not having it."}, {"q": "●  rage bait", "f": "Asceticism is just being boring and calling it a choice."}]}, {"t": "“It obviously all converges”", "p": "Seeing that it all converges is the easy part. It isn't a puzzle.", "k": [{"q": "○  serious", "f": "If the convergence is obvious, centuries of doctrinal conflict need explaining."}, {"q": "◐  bait", "f": "If everyone already knows all religions say the same thing, nobody would bother having more than one. There are thousands."}, {"q": "●  rage bait", "f": "Buddhism is cope."}]}]}, {"n": "Janne", "i": "@_janne", "u": [{"n": "Programming", "t": [0, 1, 2, 3]}, {"n": "Future selves & consent", "t": [4, 5, 6, 7]}, {"n": "Non-existence", "t": [8, 9, 10, 11]}, {"n": "The state & freedom", "t": [12, 13, 14, 15]}, {"n": "Norway", "t": [16, 17, 18, 19]}, {"n": "Veganism", "t": [20, 21, 22, 23]}], "t": [{"t": "“Programming isn't about logic”", "p": "Programming isn't really about logic.", "k": [{"q": "○  serious", "f": "Whatever else it involves, a program is a formal object that either does what's specified or doesn't. Logic is the core."}, {"q": "◐  bait", "f": "A computer only does logic. Programming is telling a computer what to do. So programming is only logic, and the rest is meetings."}, {"q": "●  rage bait", "f": "Programming is easy now."}]}, {"t": "“Docker breaks on shared databases”", "p": "Docker gets ugly as soon as services have to share a database and networks.", "k": [{"q": "○  serious", "f": "That's an argument about how the stack was configured. Shared networks across compose files is a solved pattern."}, {"q": "◐  bait", "f": "Docker puts everything in a box so nothing can break anything else. If things are breaking each other, that's the user. The box is innocent."}, {"q": "●  rage bait", "f": "Docker is
