 a zip file with opinions."}]}, {"t": "“I can reason about hardware fine”", "p": "A software engineer can reason about hardware well enough without being a hardware person.", "k": [{"q": "○  serious", "f": "The abstractions leak at exactly the places hardware people know about, and software intuition is often wrong there."}, {"q": "◐  bait", "f": "Hardware is just software that's been printed. Anyone who can write the software understands the print. So there's nothing extra to know."}, {"q": "●  rage bait", "f": "Firmware is just software that's scared."}]}, {"t": "“Give the model a spec and templates”", "p": "LLM output needs structure around it. Give it a spec and templates, don't let it freehand.", "k": [{"q": "○  serious", "f": "The more scaffolding you build, the more of the work you've done yourself. At some point the model is filling in a form."}, {"q": "◐  bait", "f": "A model is either smart enough to do the job or it isn't. If you have to hold its hand, it isn't, and templates don't change that."}, {"q": "●  rage bait", "f": "LLM code is fine. If it's slop, the spec was slop."}]}, {"t": "“Consent needs your future self”", "p": "It isn't real consent unless you grasp how your future self will probably react.", "k": [{"q": "○  serious", "f": "That standard would invalidate most major life decisions, since nobody predicts their future reactions well."}, {"q": "◐  bait", "f": "You are your future self. Same person. So you can't fail to know how you'll react, because you're the one who'll be reacting."}, {"q": "●  rage bait", "f": "If you agreed, you agreed. That's what the word is for."}]}, {"t": "“Choose what future you would want”", "p": "You should make the choices your future self would agree with.", "k": [{"q": "○  serious", "f": "Your future self's preferences are partly produced by the choice, so the standard can't guide it."}, {"q": "◐  bait", "f": "The future doesn't exist yet. Things that don't exist don't have opinions. So there's nobody to agree with and you do what you want."}, {"q": "●  rage bait", "f": "Your future self isn't real and can't complain."}]}, {"t": "“Plans fail from outside constraints”", "p": "When a choice goes differently from what you predicted, it's usually outside constraints, not you being unpredictable.", "k": [{"q": "○  serious", "f": "People also just change their minds, and the reasons are often opaque to them."}, {"q": "◐  bait", "f": "If only outside things change your choices, then you never choose anything. The weather does. So that's determinism, and there's no free will."}, {"q": "●  rage bait", "f": "Free will is fake."}]}, {"t": "“Randomness isn't freedom”", "p": "Randomness wouldn't make anyone free.", "k": [{"q": "○  serious", "f": "It rules out the claim that everything is fixed, and that was the hard determinist's main premise."}, {"q": "◐  bait", "f": "Physics is random at the bottom. People are made of physics. So people are random, and random means nobody is making you do it, and that's what free means."}, {"q": "●  rage bait", "f": "Quantum mechanics is random, so determinism is false. That's just physics."}]}, {"t": "“Non-existence is a kind of existence”", "p": "The non-existence of something is itself a kind of existence.", "k": [{"q": "○  serious", "f": "That treats an absence as a thing. \"There is no spoon\" denies a spoon. It doesn't assert a no-spoon."}, {"q": "◐  bait", "f": "Non-existence means not existing. Existence means existing. Those are opposites. Saying one is the other is saying up is a kind of down."}, {"q": "●  rage bait", "f": "Non-existence exists. Otherwise what's the word for."}]}, {"t": "“It's what death takes that's scary”", "p": "What gets lost at death is what the fear is about. Non-existence itself isn't the frightening part.", "k": [{"q": "○  serious", "f": "For many people the fear is exactly of not being. Epicurus addressed that, and it didn't go away."}, {"q": "◐  bait", "f": "You won't be there to mind being dead, so there's nothing to fear. Epicurus said it in one sentence. Anyone still scared didn't follow the sentence."}, {"q": "●  rage bait", "f": "Scared of not existing? You've done it before. Next."}]}, {"t": "“You can sanely prefer not to exist”", "p": "Someone can be of sound mind and still prefer not to exist.", "k": [{"q": "○  serious", "f": "A settled preference for non-existence is hard to tell from the outside from a state that would pass with treatment or time."}, {"q": "◐  bait", "f": "You can't prefer something you've never tried. Nobody has tried not existing. So the preference is a guess about a thing nobody has data on."}, {"q": "●  rage bait", "f": "Humility is a brag, and so is pessimism."}]}, {"t": "“The cat cares about missing food”", "p": "A cat doesn't care about a spoon that isn't there. It cares a lot about food that isn't there.", "k": [{"q": "○  serious", "f": "That shows the cat has expectations. It doesn't show that absences are items in the world."}, {"q": "◐  bait", "f": "The cat reacts to the empty bowl, and the empty bowl is there. So it's reacting to something that exists. No non-existence involved."}, {"q": "●  rage bait", "f": "A cat doesn't love anyone. It tolerates the building."}]}, {"t": "“Be against the state”", "p": "Being against the state is the right position.", "k": [{"q": "○  serious", "f": "The functions people most want, courts and defense and enforceable contracts, have never been supplied at scale without one."}, {"q": "◐  bait", "f": "Somebody always ends up in charge. If it isn't a state it's whoever has the most guns, and that's a state with worse paperwork."}, {"q": "●  rage bait", "f": "Anarchism is retarded."}]}, {"t": "“Don't break up monopolies”", "p": "There are better ways to deal with monopoly than the state breaking companies up.", "k": [{"q": "○  serious", "f": "Without enforcement, the usual alternative is waiting for a competitor, and network effects can make that a long wait."}, {"q": "◐  bait", "f": "A company only gets big by being the best. Punishing it for that is punishing winning. So there's no monopoly problem, only envy."}, {"q": "●  rage bait", "f": "Libertarians just don't want to pay taxes. The rest is decoration."}]}, {"t": "“The state should guarantee speech”", "p": "The state shouldn't only respect free speech. It should guarantee it, and step in when speech is suppressed.", "k": [{"q": "○  serious", "f": "A state that polices suppression of speech is deciding which private actors must carry which speech, and that's a large power."}, {"q": "◐  bait", "f": "If the state has to protect speech, the state decides what counts as speech. So the safest free speech is the kind the state has never heard of."}, {"q": "●  rage bait", "f": "Free speech is absolute or it's nothing."}]}, {"t": "“Only restrict active threats”", "p": "You can't take away people's freedoms unless they're an active threat.", "k": [{"q": "○  serious", "f": "\"Active threat\" is the whole dispute. Most restrictions are aimed at risks, and nobody agrees on where risk becomes threat."}, {"q": "◐  bait", "f": "Freedom means doing what you want. A threat is someone doing what they want. So protecting freedom and stopping threats are the same thing pointed in opposite directions, and somebody just picks."}, {"q": "●  rage bait", "f": "Privacy doesn't matter if you have nothing to hide."}]}, {"t": "“Norway's prisons came from data”", "p": "Norway's justice system came from evidence that punitive prison doesn't work. It didn't come from people being unusually moral.", "k": [{"q": "○  serious", "f": "The evidence came from a small, wealthy, low-crime country, and how far the results travel is an open question."}, {"q": "◐  bait", "f": "Norway has almost no crime to begin with. Any prison works when there's nobody in it. So the model proves nothing."}, {"q": "●  rage bait", "f": "Prison works. Norway's just has nicer furniture."}]}, {"t": "“Norwegian stuff really is better”", "p": "Norwegian products really are better: the salmon, the vegan ice cream.", "k": [{"q": "○  serious", "f": "Farmed Norwegian salmon is a major industry with well-documented environmental problems."}, {"q": "◐  bait", "f": "Norway is rich, and rich countries can afford to make things nice. So it's the money, and any country with that much oil would have good ice cream."}, {"q": "●  rage bait", "f": "The Nordic model is just having oil."}]}, {"t": "“Norway owns its failings”", "p": "Norway reports honestly on its own failings, including what its companies and state do abroad.", "k": [{"q": "○  serious", "f": "Coverage is one thing. The oil fund keeps growing on the same activities the coverage criticizes."}, {"q": "◐  bait", "f": "A country that's really sorry stops doing the thing. They haven't stopped. So the reporting is the apology that replaces stopping."}, {"q": "●  rage bait", "f": "Norway is an oil company with a welfare department."}]}, {"t": "“Norwegian healthcare is great”", "p": "Norwegian healthcare is remarkable.", "k": [{"q": "○  serious", "f": "Outcomes are strong, with long waits for elective care and a budget few countries could match per head."}, {"q": "◐  bait", "f": "Any system looks good with that much money and that few people. Give anyone five million patients and a trillion dollars."}, {"q": "●  rage bait", "f": "Norway is boring."}]}, {"t": "“Veganism is the ethical position”", "p": "Veganism is the ethical position.", "k": [{"q": "○  serious", "f": "The case depends on which animals are sentient, and for some farmed species the evidence is uncertain."}, {"q": "◐  bait", "f": "Humans have canine teeth. Teeth are for what they're for. So eating meat is what the body was built to do, and going against your own body isn't ethics."}, {"q": "●  rage bait", "f": "Veganism is cope."}]}, {"t": "“Vegan versions are as good now”", "p": "The vegan versions are just as good now.", "k": [{"q": "○  serious", "f": "Some are. Many are heavily processed, and most still lose a blind taste test."}, {"q": "◐  bait", "f": "If it were as good, they wouldn't have to name it after the thing it's copying. Nobody calls steak \"beef tofu.\""}, {"q": "●  rage bait", "f": "Oat milk is water that's been near an oat."}]}, {"t": "“Vegans are doing harm reduction”", "p": "Most vegans are doing harm reduction rather than chasing purity.", "k": [{"q": "○  serious", "f": "If it's harm reduction, then eating less meat and choosing higher-welfare meat count too, and the line at zero looks arbitrary."}, {"q": "◐  bait", "f": "Crops kill field mice by the million. So a vegan diet kills too. If it's about harm, a cow that eats grass kills fewer animals than a field of soy."}, {"q": "●  rage bait", "f": "Plants are alive too."}]}, {"t": "“Fish and eggs still count”", "p": "Fish and eggs are the hardest things to give up, and they still count.", "k": [{"q": "○  serious", "f": "The science on fish pain is disputed. Fish lack a neocortex, though many researchers think other structures do the job."}, {"q": "◐  bait", "f": "A fish has no neocortex, and the neocortex is where pain happens. No neocortex, no pain. It's a reflex with fins."}, {"q": "●  rage bait", "f": "Fish don't feel pain. No neocortex."}]}]}, {"n": "Jeh", "i": "@ice_chicken12", "u": [{"n": "India", "t": [0, 1, 2, 3, 4]}, {"n": "Markets & the AI bubble", "t": [5, 6, 7, 8]}, {"n": "Bataille & luxury", "t": [9, 10, 11, 12, 13]}, {"n": "America", "t": [14, 15, 16, 17]}, {"n": "Indian philosophy", "t": [18, 19, 20, 21, 22]}, {"n": "Pineapple pizza", "t": [23, 24, 25, 26]}], "t": [{"t": "“India is building fast”", "p": "India is building out fast: nuclear, solar, wind and hydro at huge scale by 2030.", "k": [{"q": "○  serious", "f": "Announced capacity targets and delivered capacity have differed a lot in the past, especially for nuclear."}, {"q": "◐  bait", "f": "A country that's still poor can't build anything big, because building needs money. That means every Indian megaproject is a press release."}, {"q": "●  rage bait", "f": "India has been five years away from being a superpower since 1947."}]}, {"t": "“India is as diverse as Europe”", "p": "People flatten India into one thing when its languages differ from each other as much as Europe's do.", "k": [{"q": "○  serious", "f": "The linguistic diversity is real. So is the shared state, shared market and shared film industry that outsiders are responding to."}, {"q": "◐  bait", "f": "If a billion people have one government and one cricket team, it's one culture. Languages are just accents with their own alphabet."}, {"q": "●  rage bait", "f": "Hindi and Tamil are basically the same language."}]}, {"t": "“The Western picture of Indians is Hollywood”", "p": "The Western picture of Indians comes from Hollywood clichés and one guy someone met.", "k": [{"q": "○  serious", "f": "Stereotypes about India are lazy. The best corrective is data, and some of the data is unflattering too."}, {"q": "◐  bait", "f": "Stereotypes come from somewhere, and where they come from is the truth. That means the movie version is the average, and the average is the country."}, {"q": "●  rage bait", "f": "Bollywood is one movie. It's three hours and it's been playing since 1975."}]}, {"t": "“India is the next great power”", "p": "India is the next great power.", "k": [{"q": "○  serious", "f": "Per-capita income is still low, and power projection beyond the region is limited. Size alone hasn't delivered influence."}, {"q": "◐  bait", "f": "China already did everything India is planning to do, and there's only room for one. So the slot is taken."}, {"q": "●  rage bait", "f": "China already won. India is competing with Vietnam."}]}, {"t": "“Indians run Silicon Valley”", "p": "Indian tech talent runs Silicon Valley.", "k": [{"q": "○  serious", "f": "A system whose best graduates leave is exporting its return on education."}, {"q": "◐  bait", "f": "If the smart ones all leave, then the ones who stay aren't the smart ones. That's just subtraction, and it explains the roads."}, {"q": "●  rage bait", "f": "India's biggest export is engineers leaving."}]}, {"t": "“It's an AI bubble”", "p": "There's an AI bubble, whatever the growth story says.", "k": [{"q": "○  serious", "f": "Calling a bubble needs a view on future cash flows. Revenue at the leading labs has grown faster than most forecasts."}, {"q": "◐  bait", "f": "Prices only go up when something is worth more. Prices went up. So it's worth more, and a bubble is a word for a price you wish you'd bought at."}, {"q": "●  rage bait", "f": "Stocks only go up. Check the chart."}]}, {"t": "“Nothing grows 10x for five years”", "p": "Growth can't run 10x a year for five years, so the valuations don't hold.", "k": [{"q": "○  serious", "f": "Nobody needs 10x for five years. The valuations need a much slower curve, and plausibly get it."}, {"q": "◐  bait", "f": "The internet grew that fast and never stopped. AI is the internet again, and that means it never stops either."}, {"q": "●  rage bait", "f": "Compound growth is forever lol. That's what compound means."}]}, {"t": "“Index funds get forced to buy the IPO”", "p": "Index funds end up forced buyers when something like the SpaceX IPO lands.", "k": [{"q": "○  serious", "f": "Index inclusion rules have float and seasoning requirements, so the forced buying is smaller and slower than it sounds."}, {"q": "◐  bait", "f": "An index fund owns everything, so it can't be forced to buy anything. It already has it. That's the whole point of an index."}, {"q": "●  rage bait", "f": "Index funds are for people who've given up on being right."}]}, {"t": "“The real data's off the books”", "p": "The interesting data is the stuff kept off the books.", "k": [{"q": "○  serious", "f": "Off-book information exists, but markets price a great deal of it through people who trade on what they know."}, {"q": "◐  bait", "f": "Everything a company knows is in its annual report, by law. That means there are no secrets, and anyone who says otherwise is selling a newsletter."}, {"q": "●  rage bait", "f": "Earnings calls are theater."}]}, {"t": "“Luxury is Bataille's expenditure”", "p": "Luxury works like Bataille's wasteful expenditure: the watch that's worse at telling time is the one worth more.", "k": [{"q": "○  serious", "f": "Veblen explains that with status signaling, no solar economy needed. Conspicuous waste is very useful to the person doing it."}, {"q": "◐  bait", "f": "A thing is worth what it does. A watch tells time, and the cheap one tells it better. That means the expensive one is worth less, and people who buy it can't count."}, {"q": "●  rage bait", "f": "Luxury is ordinary stuff with the supply turned off."}]}, {"t": "“Luxury marketing is ritual transgression”", "p": "The overlap between ritual transgression and luxury marketing is real.", "k": [{"q": "○  serious", "f": "Marketers borrow the look of transgression because it sells. That's ordinary incentives."}, {"q": "◐  bait", "f": "Advertising only works on people who aren't paying attention. Luxury buyers pay a lot of attention, so the marketing does nothing and they'd have bought it anyway."}, {"q": "●  rage bait", "f": "Branding doesn't work on smart people."}]}, {"t": "“Bataille sees what economics misses”", "p": "Bataille gets at something about excess that economics leaves out.", "k": [{"q": "○  serious", "f": "The general economy generalizes from potlatch and sacrifice to all economic life, on anthropology that's been heavily revised."}, {"q": "◐  bait", "f": "Economics is about scarcity, because that's what the word means. A theory of too much isn't economics, it's a mood."}, {"q": "●  rage bait", "f": "Bataille is retarded."}]}, {"t": "“Transgression needs the rule”", "p": "Transgression has to be understood from inside the rule it breaks.", "k": [{"q": "○  serious", "f": "That makes transgression dependent on the prohibition. It's a loyal kind of rebellion."}, {"q": "◐  bait", "f": "Breaking a rule on purpose means the rule decided what you did. So the transgressor is the most obedient person in the room."}, {"q": "●  rage bait", "f": "Transgression is just bad manners with a theory."}]}, {"t": "“Land turned Bataille against Bataille”", "p": "Land takes Bataille's vocabulary and uses it against Bataille.", "k": [{"q": "○  serious", "f": "If the same concepts serve both of them, the concepts weren't constraining anyone."}, {"q": "◐  bait", "f": "Land read Bataille more carefully than anyone, and he ended up where he ended up. That's where Bataille leads, so they're the same."}, {"q": "●  rage bait", "f": "Nick Land is Bataille with a modem."}]}, {"t": "“American politics is just team colors”", "p": "American politics is all loose loyalty to \"left\" and \"right\" with little underneath.", "k": [{"q": "○  serious", "f": "Polarization studies show the divide tracks real differences on policy and identity. It isn't only labels."}, {"q": "◐  bait", "f": "America has two parties and they agree on everything that costs money. That means there's one party, and the arguing is a show."}, {"q": "●  rage bait", "f": "Democrats and Republicans are the same party with different mascots."}]}, {"t": "“America's unhealthy, copy China”", "p": "America is the unhealthiest country for its income, and China's system is worth copying.", "k": [{"q": "○  serious", "f": "US outcomes are poor for the spending, but that follows from diet and inequality as much as from system design."}, {"q": "◐  bait", "f": "Americans live shorter lives because they have more freedom, and freedom includes the freedom to eat. So the life expectancy is a feature."}, {"q": "●  rage bait", "f": "American healthcare is the best in the world if you can afford it, and if you can't that's a different problem."}]}, {"t": "“America plays dirty on trade”", "p": "America plays dirty with South Asia on trade.", "k": [{"q": "○  serious", "f": "US trade policy is self-interested, like everyone's. South Asian tariff walls are among the highest in the world."}, {"q": "◐  bait", "f": "Trade is voluntary. Nobody makes anyone sell. That means no country has ever been treated unfairly in a trade deal."}, {"q": "●  rage bait", "f": "America doesn't owe anyone a market."}]}, {"t": "“Americans don't get anywhere else”", "p": "Americans don't understand anywhere else.", "k": [{"q": "○  serious", "f": "Insularity is common in large countries. India and China have their own versions."}, {"q": "◐  bait", "f": "America is the only country that matters, so Americans only need to know about America. Everyone else has to learn two countries."}, {"q": "●  rage bait", "f": "The rest of the world is America's group project."}]}, {"t": "“Indian philosophy gets ignored”", "p": "Indian philosophy belongs in the conversation and keeps getting left out of it.", "k": [{"q": "○  serious", "f": "It's left out partly because much of it is tied to soteriological aims, which makes the arguments hard to separate from the religious project."}, {"q": "◐  bait", "f": "Philosophy is asking questions with no answer assumed. The Indian schools all assume moksha. So it's theology, and theology has its own department."}, {"q": "●  rage bait", "f": "Indian philosophy is just religion."}]}, {"t": "“Chan is its own tradition”", "p": "Chan Buddhism is a different animal from the orthodox Hindu schools. It's a whole tradition moved into another language and region.", "k": [{"q": "○  serious", "f": "The break is real, but the core practices and the goal stayed recognizably the same across the move."}, {"q": "◐  bait", "f": "Buddhism started in India, from a Hindu prince, using Hindu ideas. A thing made entirely of Hindu parts is Hindu."}, {"q": "●  rage bait", "f": "Hinduism and Buddhism are the same religion. One has more gods."}]}, {"t": "“Indian philosophy of mind has a lot to offer”", "p": "Indian philosophy of mind has real things to offer current models of the mind.", "k": [{"q": "○  serious", "f": "The classical accounts were built without any neuroscience, and mapping their categories onto it involves a lot of loose translation."}, {"q": "◐  bait", "f": "Anything true about the mind would have been found by brain scans by now. It wasn't in the scans, so it isn't true."}, {"q": "●  rage bait", "f": "Meditation is sitting. People turned sitting into a 2,500-year industry."}]}, {"t": "“Nyaya is serious epistemology”", "p": "The pramana theories and Nyaya logic are serious epistemology.", "k": [{"q": "○  serious", "f": "Counting testimony and scripture as independent sources of knowledge builds authority into the system from the start."}, {"q": "◐  bait", "f": "Logic was invented once, in Greece. Anything that looks like logic elsewhere is either copied or a coincidence."}, {"q": "●  rage bait", "f": "Nyaya is just Aristotle's logic that showed up late."}]}, {"t": "“Karma is moral causation”", "p": "Karma is a serious account of moral causation.", "k": [{"q": "○  serious", "f": "As an explanation of who suffers it can't be tested, and it comes close to blaming whoever is suffering."}, {"q": "◐  bait", "f": "Bad things happen to bad people. Everyone has seen it. That means karma is an observation, and people who doubt it don't get out much."}, {"q": "●  rage bait", "f": "Karma is cope."}]}, {"t": "“Pineapple pizza is good”", "p": "Pineapple on pizza is good.", "k": [{"q": "○  serious", "f": "Sweet fruit on a salty, fatty base works in some dishes, but canned pineapple brings water, and that wrecks the crust."}, {"q": "◐  bait", "f": "Pizza is Italian, and Italians don't do it. The people who invented a thing decide what it is, so it isn't pizza."}, {"q": "●  rage bait", "f": "Pineapple pizza is a crime."}]}, {"t": "“Sweet and savory work”", "p": "Sweet and savory go together, and the tradition argument is weak.", "k": [{"q": "○  serious", "f": "Tradition isn't decisive, but the classic combinations lasted because they balance. This one mostly adds sugar."}, {"q": "◐  bait", "f": "Fruit is dessert, and dessert comes after dinner. Putting it on the dinner is eating in the wrong order, and that's why it tastes wrong."}, {"q": "●  rage bait", "f": "Fruit on dinner? That's retarded."}]}, {"t": "“The haters are performing”", "p": "People who hate it are mostly performing.", "k": [{"q": "○  serious", "f": "Some of it is signaling. A lot of people have also just eaten it and not liked it."}, {"q": "◐  bait", "f": "Billions of people have tried it and most of them don't order it again. That's a vote, and it lost."}, {"q": "●  rage bait", "f": "Liking pineapple pizza is the performance."}]}, {"t": "“A good one changes minds”", "p": "A good one, with fresh pineapple and proper heat, changes minds.", "k": [{"q": "○  serious", "f": "If it only works under ideal conditions, it's fair to judge it by what's usually served."}, {"q": "◐  bait", "f": "If it needs a special oven and special fruit to be edible, then it isn't edible. Good food survives being made badly."}, {"q": "●  rage bait", "f": "It's fruit on bread. You've eaten jam, and you didn't put it on pizza."}]}]}, {"n": "Jere", "i": "@jere.mi.as", "u": [{"n": "AI & concepts", "t": [0, 1, 2, 3, 4]}, {"n": "Metaphor", "t": [5, 6, 7, 8, 9]}, {"n": "Pragmatism & Rorty", "t": [10, 11, 12, 13, 14]}, {"n": "Movies", "t": [15, 16, 17, 18, 19]}, {"n": "Argentina", "t": [20, 21, 22, 23]}, {"n": "Status & common knowledge", "t": [24, 25, 26, 27]}], "t": [{"t": "“LLMs just produce words”", "p": "A person fits their words around thoughts and concepts they're having. An LLM is only producing words.", "k": [{"q": "○  serious", "f": "We have no settled test for \"having a concept\" beyond using it correctly across cases, and the models pass a lot of those."}, {"q": "◐  bait", "f": "Concepts live in the brain, and a model doesn't have a brain. That means it has no concepts, and it means the question was never interesting."}, {"q": "●  rage bait", "f": "Fancy autocomplete can't \"know\" anything. Next."}]}, {"t": "“I want to do theory myself”", "p": "Learning and arguing about theory is something you want to do yourself, so AI can't do that part for you.", "k": [{"q": "○  serious", "f": "Wanting to do it yourself is a fact about you. It doesn't show the model can't do the same intellectual work."}, {"q": "◐  bait", "f": "The point of theory is having the right answer, and the model gets there faster. So doing it yourself is just being slow on purpose."}, {"q": "●  rage bait", "f": "Imagine reading theory by hand in 2026. That's churning your own butter."}]}, {"t": "“The social stuff can be simulated”", "p": "The social side of thinking isn't magic. If it has parts, the parts can be simulated.", "k": [{"q": "○  serious", "f": "A simulated practice isn't obviously the practice. A flight simulator doesn't go anywhere."}, {"q": "◐  bait", "f": "Social things need a society, and a society needs members with something to lose. A model has nothing to lose, so it can't be in one, so it can't do the social part."}, {"q": "●  rage bait", "f": "A group chat of bots is a for-loop."}]}, {"t": "“The paperclip is industrial-age thinking”", "p": "The paperclip maximizer is a leftover picture from the industrial age of what a superintelligence would want.", "k": [{"q": "○  serious", "f": "The paperclip is a placeholder for any goal specified badly. The argument doesn't depend on the product."}, {"q": "◐  bait", "f": "A superintelligence would work out what's worth wanting, because that's what being smart is. Paperclips aren't worth wanting, so it wouldn't want them. Doom solved."}, {"q": "●  rage bait", "f": "A smart enough AI would just figure out ethics. That's what smart means."}]}, {"t": "“AI is a pet that moved in with everyone”", "p": "We talk about AI so much because it's like a pet or a person that moved into everyone's house at the same time.", "k": [{"q": "○  serious", "f": "We talk about it because a lot of money needs us to."}, {"q": "◐  bait", "f": "People only talk this much about things that are new. In two years it'll be as interesting as a dishwasher, and that means it was never the big deal anyone said."}, {"q": "●  rage bait", "f": "AGI is already here and it's Excel."}]}, {"t": "“Metaphors can be wrong”", "p": "A metaphor can be wrong, and saying so is a fair move in an argument.", "k": [{"q": "○  serious", "f": "If metaphors can be wrong they have truth conditions, and then it's unclear what separates them from ordinary claims."}, {"q": "◐  bait", "f": "A metaphor says one thing is another thing when it isn't. That means every metaphor is false, so none of them is wronger than the rest."}, {"q": "●  rage bait", "f": "A metaphor is a lie that got a good review."}]}, {"t": "“Numbers are metaphors you can't replace”", "p": "Numbers are such basic metaphors that trying to replace them is a fool's errand.", "k": [{"q": "○  serious", "f": "Calling numbers metaphors needs an account of what they're metaphors for, and arithmetic truths don't seem to depend on any source domain."}, {"q": "◐  bait", "f": "Lakoff showed maths comes from the body, like counting on fingers. Fingers stop at ten, and maths doesn't, so the theory is false after the first two hands."}, {"q": "●  rage bait", "f": "Maths isn't a metaphor. It's maths. That's why it works."}]}, {"t": "“Rorty never gave a new metaphor”", "p": "Rorty was right that we aren't mirrors of nature, but that picture needs another metaphor to replace it, and he never gave one.", "k": [{"q": "○  serious", "f": "Maybe the lesson is that the mind doesn't need a master metaphor at all."}, {"q": "◐  bait", "f": "The mind either reflects the world or it makes it up. Those are the only two options, so if it isn't a mirror then it's all made up."}, {"q": "●  rage bait", "f": "The mind is a mirror. You see things. They're there."}]}, {"t": "“Metaphors have moral stakes”", "p": "Metaphors carry moral stakes. Calling people vermin does real work.", "k": [{"q": "○  serious", "f": "The harm in dehumanizing language comes from the policies and violence it accompanies. The figure of speech isn't a cause of its own."}, {"q": "◐  bait", "f": "A metaphor is only a comparison, and comparisons can't hurt anyone. That means the stakes are zero, and that means this is a seminar topic."}, {"q": "●  rage bait", "f": "It's a figure of speech. Relax."}]}, {"t": "“Maths metaphors help”", "p": "Mathematical metaphors help with thinking about philosophy.", "k": [{"q": "○  serious", "f": "Borrowed maths gives a feeling of rigor without the constraints that make real maths rigorous."}, {"q": "◐  bait", "f": "If an idea was any good it could be said in plain words. Reaching for maths means it couldn't, so the maths is where the idea goes to hide."}, {"q": "●  rage bait", "f": "Sokal was right and everyone has been coping since 1996."}]}, {"t": "“Peirce got it right”", "p": "Peirce gets it right: fallibilism plus communal inquiry, with science studying effects everyone can come to agree on.", "k": [{"q": "○  serious", "f": "Agreement at the end of inquiry is an idealization nobody can check, so it can't guide anyone now."}, {"q": "◐  bait", "f": "Whole communities have agreed on false things for centuries. Agreement is what Peirce means by truth, so on his view those things were true at the time."}, {"q": "●  rage bait", "f": "Pragmatism is retarded."}]}, {"t": "“Doubting induction is silly”", "p": "Doubting induction is silly. It works extremely well almost all the time.", "k": [{"q": "○  serious", "f": "\"It has worked\" is an inductive argument for induction. That was Hume's point."}, {"q": "◐  bait", "f": "Hume proved the future doesn't have to resemble the past. That means the sun not rising tomorrow is exactly as likely as it rising."}, {"q": "●  rage bait", "f": "Hume won. Everyone since is pretending."}]}, {"t": "“You can read belief off action”", "p": "You can read belief off action. If someone acts like they believe it, they probably do.", "k": [{"q": "○  serious", "f": "People act against what they sincerely believe all the time. Weakness of will is ordinary."}, {"q": "◐  bait", "f": "Belief is a feeling of certainty in your head. Nobody can see into your head, so nobody can know what anyone else believes. That's why arguing is pointless."}, {"q": "●  rage bait", "f": "Belief is private. Behaviorism lost. Read a book from after 1960."}]}, {"t": "“Rorty didn't betray Dewey”", "p": "Rorty was doing his own thing with Dewey and Wittgenstein. \"Betrayal\" is too strong.", "k": [{"q": "○  serious", "f": "Using Dewey's name while dropping method and experience invites the charge, whatever word you choose for it."}, {"q": "◐  bait", "f": "Rorty says truth is whatever your peers let you get away with. His peers let him get away with Dewey, so by his own standard the reading is true."}, {"q": "●  rage bait", "f": "Rorty got nothing from Dewey except the name."}]}, {"t": "“Rorty can't say which vocabulary to use”", "p": "Rorty has a real problem moving from describing how vocabularies change to telling us which to use.", "k": [{"q": "○  serious", "f": "If Rorty can't get from description to prescription, the fix is a theory of truth, and that's what he gave up."}, {"q": "◐  bait", "f": "If no vocabulary is closer to reality than another, they're all equally good. That means flat earth is as good as physics, and that means Rorty is done."}, {"q": "●  rage bait", "f": "Rorty is postmodernism with an American accent."}]}, {"t": "“Film is the sweet spot”", "p": "Film sits at a sweet spot: complex enough that anything is possible, limited enough that it doesn't turn into chaos.", "k": [{"q": "○  serious", "f": "Every established medium looks like a sweet spot from inside. Novels and games have the same balance of freedom and limit."}, {"q": "◐  bait", "f": "Games do everything film does and you can also move. More features means better, so film is a game with the controller unplugged."}, {"q": "●  rage bait", "f": "Movies are video games for people who can't play."}]}, {"t": "“Montage made film an art”", "p": "Montage, and later sound, are what made film its own art form.", "k": [{"q": "○  serious", "f": "Editing matters, but theater and comics also cut between scenes. What's specific to film is the recorded moving image."}, {"q": "◐  bait", "f": "Film is photographed theater, and theater already existed. That means nothing was invented in 1895 except a way to sell tickets twice."}, {"q": "●  rage bait", "f": "Photography isn't art. The camera did it."}]}, {"t": "“Dunkirk's timelines work”", "p": "The scrambled timelines in Dunkirk build to a single climax, and it works.", "k": [{"q": "○  serious", "f": "The three-timescale structure is clever, but it puts distance between the viewer and anyone on screen."}, {"q": "◐  bait", "f": "A story has a beginning, a middle and an end, in that order. Putting them out of order is a way of hiding that one of them is missing."}, {"q": "●  rage bait", "f": "Nolan has made the same movie nine times and it's a clock."}]}, {"t": "“Seven Samurai is real tragedy”", "p": "Seven Samurai and Come and See are real tragedy.", "k": [{"q": "○  serious", "f": "Tragedy in the strict sense turns on the protagonist's own error. Both films are closer to catastrophe that arrives from outside."}, {"q": "◐  bait", "f": "Tragedy needs a king, because only someone high up can fall. Peasants can't fall anywhere, so a film about farmers is at most unfortunate."}, {"q": "●  rage bait", "f": "Kurosawa is a western with subtitles."}]}, {"t": "“Music makes a film”", "p": "Music is what gives a film its spark.", "k": [{"q": "○  serious", "f": "A score tells you what to feel when the image hasn't earned it."}, {"q": "◐  bait", "f": "Silent films had no sound and they're the greatest films ever made. That means sound has only ever taken away from cinema."}, {"q": "●  rage bait", "f": "A soundtrack is a film admitting it can't do it alone."}]}, {"t": "“VARgentina is a myth”", "p": "The \"VARgentina\" complaints fall apart when you look at the actual calls.", "k": [{"q": "○  serious", "f": "The 2022 penalty count was unusually high, and it's fair for neutrals to bring it up."}, {"q": "◐  bait", "f": "Referees are employed by FIFA, and FIFA wanted Messi to have a World Cup. That means the result was decided in an office, and the matches were the announcement."}, {"q": "●  rage bait", "f": "Argentina's third star is on loan from FIFA."}]}, {"t": "“Argentina is amazing”", "p": "Argentina is amazing, and the food alone makes the case.", "k": [{"q": "○  serious", "f": "The beef is excellent. A cuisine built on one ingredient cooked one way is narrower than its reputation."}, {"q": "◐  bait", "f": "Asado has no sauce and no seasoning apart from salt. That means there's no cooking in it, only buying."}, {"q": "●  rage bait", "f": "Asado is just barbecue."}]}, {"t": "“Messi is the greatest”", "p": "Messi is the greatest, and he's Argentina's.", "k": [{"q": "○  serious", "f": "He left at thirteen, and Barcelona's academy made the player. Argentina's football system can claim less of him than it does."}, {"q": "◐  bait", "f": "A player belongs to wherever he learned the game. He learned it in Spain, so he's a Spanish player with a passport issue."}, {"q": "●  rage bait", "f": "Messi isn't even really Argentinian, he grew up in Spain."}]}, {"t": "“Buenos Aires is a great city”", "p": "Buenos Aires is a great world city.", "k": [{"q": "○  serious", "f": "It's beautiful, and a lot of that beauty is deliberately modeled on Paris and Madrid."}, {"q": "◐  bait", "f": "A country that was rich in 1910 and isn't now made a mistake every year for a century. That's not bad luck, that's culture."}, {"q": "●  rage bait", "f": "Argentina peaked in 1910."}]}, {"t": "“Some things are better deniable”", "p": "Some things work better left deniable than made common knowledge.", "k": [{"q": "○  serious", "f": "Plausible deniability protects the person using it. Whether everyone else is better off is less clear."}, {"q": "◐  bait", "f": "If everyone knows a thing, then it's common knowledge already. There's no such thing as knowing something and it not being known, so the whole theory is about nothing."}, {"q": "●  rage bait", "f": "Common knowledge is gossip that's been to grad school."}]}, {"t": "“It's all status games”", "p": "A lot of social life is status moves, and you see more once you look for them.", "k": [{"q": "○  serious", "f": "Status explanations are easy to produce afterwards and rarely predict behavior better than plain interest or habit."}, {"q": "◐  bait", "f": "People do things because they like them. Liking things isn't status, so status explains none of it. Simple."}, {"q": "●  rage bait", "f": "Not everything is status. Sometimes a guy is just eating a sandwich."}]}, {"t": "“Performance is power”", "p": "Performance is tied up with power: who gets to act, and who gets believed.", "k": [{"q": "○  serious", "f": "A king who stops performing kingship still has an army. Material facts carry more of the explanation."}, {"q": "◐  bait", "f": "If everything is a performance then nothing is, because a word that covers everything means nothing. So performativity theory is about nothing."}, {"q": "●  rage bait", "f": "Performativity is lying with a bibliography."}]}, {"t": "“Dating apps need reputation”", "p": "Online dating is missing the reputation systems that real-life circles provide.", "k": [{"q": "○  serious", "f": "Reputation systems also lock people into small pools and old judgments. The apps exist because people wanted out of that."}, {"q": "◐  bait", "f": "Apps show you more people, and more options always means better outcomes. So dating is better now than it has ever been, and anyone unhappy is doing it wrong."}, {"q": "●  rage bait", "f": "Dating apps work fine for people who are good at dating."}]}]}, {"n": "lizzie", "i": "@nyabeille", "u": [{"n": "Relational reality & flourishing", "t": [0, 1, 2, 3, 4]}, {"n": "Evil & ethics", "t": [5, 6, 7, 8]}, {"n": "AI & consciousness", "t": [9, 10, 11, 12]}, {"n": "Climate & ecology", "t": [13, 14, 15, 16]}], "t": [{"t": "“Nothing exists independently”", "p": "Nothing exists independently. Every entity exists through its relationships.", "k": [{"q": "○  serious", "f": "Relations need things to relate. If everything is relation, it's unclear what's being related."}, {"q": "◐  bait", "f": "A rock on an empty planet still exists, and it isn't related to anything. So things exist independently, and it took one rock."}, {"q": "●  rage bait", "f": "Metaphysics is just semantics."}]}, {"t": "“Separation is an adaptive abstraction”", "p": "Separation isn't an illusion. It's an adaptive abstraction over a relational reality.", "k": [{"q": "○  serious", "f": "If separateness is adaptive, it's tracking something real about where one thing ends and another begins."}, {"q": "◐  bait", "f": "If it helps you survive, it's true. That's what evolution selects for. So separation is true and the relational part is the abstraction."}, {"q": "●  rage bait", "f": "Everything is separate lol. That's why there's more than one thing."}]}, {"t": "“Preserve relationships so things flourish”", "p": "We should preserve relationships because we want things to flourish, with resilience first.", "k": [{"q": "○  serious", "f": "\"Flourishing\" needs a standard. What keeps a system going and what's good are different claims."}, {"q": "◐  bait", "f": "Whatever survives is what flourished. So the ethics says: be whatever's left. That's a description of the winners."}, {"q": "●  rage bait", "f": "Humanity doesn't have a telos. Neither does yeast."}]}, {"t": "“Flourishing of the system grounds it”", "p": "The grounding is the long-term flourishing of the system that lets us be conscious at all.", "k": [{"q": "○  serious", "f": "That's a commitment a person can hold. It doesn't follow from any description of the system."}, {"q": "◐  bait", "f": "The system doesn't care whether we're in it. It ran for three billion years with nobody reflecting on it. So it can't be the ground of anything we owe."}, {"q": "●  rage bait", "f": "Ecology is just \"everything affects everything,\" which is true and useless."}]}, {"t": "“Entanglement means it's all relational”", "p": "Physics points the same way: entanglement and the rest suggest a relational reality.", "k": [{"q": "○  serious", "f": "Entanglement is a specific, well-understood correlation. It doesn't support claims about meaning or connection between people."}, {"q": "◐  bait", "f": "Quantum effects only happen at tiny scales. People are big. So nothing quantum has anything to do with people, ever."}, {"q": "●  rage bait", "f": "Entanglement is two gloves in two boxes."}]}, {"t": "“Evil is a construct”", "p": "Evil is a human construct, one pole of a dualism.", "k": [{"q": "○  serious", "f": "If evil is only a construct, there's nothing for a framework of flourishing to be against."}, {"q": "◐  bait", "f": "If evil is made up then so is good, since they come as a pair. Then nothing is better than anything, and no manifesto is needed."}, {"q": "●  rage bait", "f": "Morality is subjective."}]}, {"t": "“Degraders need real consequences”", "p": "Those who degrade the system should face real corrective action. Fines aren't enough.", "k": [{"q": "○  serious", "f": "\"Corrective action\" beyond fines needs someone with the authority to decide what counts as degradation, and that's a lot of power."}, {"q": "◐  bait", "f": "Everybody degrades the system a little just by being alive. So everyone qualifies for correction, and it comes down to who's holding the clipboard."}, {"q": "●  rage bait", "f": "Every utopia has a department of corrective action."}]}, {"t": "“Moral disagreement isn't flat-earth”", "p": "People who disagree about abortion or even murder aren't like flat-earthers. Moral disagreement is a different thing.", "k": [{"q": "○  serious", "f": "If moral disagreement isn't like factual error, it's unclear what makes the flourishing framework more than one preference among others."}, {"q": "◐  bait", "f": "Flat-earthers are wrong because we can check. You can't check a moral. So morals are opinions, and opinions can't be wrong."}, {"q": "●  rage bait", "f": "Ethics is cheering."}]}, {"t": "“Consciousness is a gift”", "p": "Consciousness is a gift and should be treated like one.", "k": [{"q": "○  serious", "f": "A gift has a giver. Without one, \"gift\" is a way of saying you're glad of it, and that's fine but it isn't an argument."}, {"q": "◐  bait", "f": "Nobody gave it to us. It evolved because it helped apes not get eaten. You don't owe anyone for a thing that happened by accident."}, {"q": "●  rage bait", "f": "Consciousness is just the brain."}]}, {"t": "“AI is only simulated consciousness”", "p": "We're conscious through evolution. AI is simulated consciousness, and the difference matters.", "k": [{"q": "○  serious", "f": "If what matters is the process that produced it, the claim needs an account of why origin, and not organization, makes experience."}, {"q": "◐  bait", "f": "A simulation of a thing isn't the thing. A simulated fire doesn't burn. So simulated consciousness is no consciousness, and that's the end of it."}, {"q": "●  rage bait", "f": "AI is a tool. Tools don't deserve respect. Nobody thanks a hammer."}]}, {"t": "“AI only goes as far as its user”", "p": "AI only goes as far as its user. What it makes is a synthesis of existing ideas.", "k": [{"q": "○  serious", "f": "The same is true of people, as the claim itself usually admits. Then it isn't a limit specific to AI."}, {"q": "◐  bait", "f": "A machine can only give back what was put in. Nobody put in anything new, because new things don't exist yet. So it can't produce anything new, by definition."}, {"q": "●  rage bait", "f": "It read the whole internet and still has nothing to say."}]}, {"t": "“Outsourcing relationships to AI is bad”", "p": "Handing your relationships over to AI is corrosive for society.", "k": [{"q": "○  serious", "f": "People said the same of novels, telephones and television. The evidence so far is mixed."}, {"q": "◐  bait", "f": "People are free to talk to whoever they like. If they like the machine better, that's a review of the people."}, {"q": "●  rage bait", "f": "Online friends aren't real friends, and neither is this."}]}, {"t": "“AI art is theft”", "p": "Generating art from artists' scraped work is wrong.", "k": [{"q": "○  serious", "f": "Human artists learn from others' work without permission too. The harm case rests on scale and the market, and learning as such isn't the problem."}, {"q": "◐  bait", "f": "Looking at a picture isn't stealing it. The model looked at pictures. So nothing was stolen, and artists are upset about being looked at."}, {"q": "●  rage bait", "f": "Art is whatever sells."}]}, {"t": "“Ecological collapse is the big one”", "p": "Ecological collapse is the central problem of this century.", "k": [{"q": "○  serious", "f": "It's among the most serious, and treating it as the one master problem can crowd out others with firmer evidence on timing."}, {"q": "◐  bait", "f": "People have predicted collapse every decade since the seventies, and here we are. After fifty years of being wrong, you stop being a forecast."}, {"q": "●  rage bait", "f": "Doom is a genre."}]}, {"t": "“Fit yourself into nature's cycles”", "p": "Nature's cycles are something we should fit ourselves into.", "k": [{"q": "○  serious", "f": "Much of natural history is directional: extinction, irreversible change. The cycles are a selective reading."}, {"q": "◐  bait", "f": "Fitting into nature is how people used to live, and they died at thirty. Everything good since came from not fitting in."}, {"q": "●  rage bait", "f": "Nature isn't cyclical. It's a line, and it goes down."}]}, {"t": "“Civilizations without flourishing die out”", "p": "Societies that never reach an ethic of flourishing may be the ones that go extinct.", "k": [{"q": "○  serious", "f": "That's a hypothesis about selection with no cases to check it against."}, {"q": "◐  bait", "f": "If good ethics made civilizations survive, the nicest ones in history would still be here. The ones still here are the ones with the biggest armies."}, {"q": "●  rage bait", "f": "Resilience is just not dying yet."}]}, {"t": "“We're harming the earth”", "p": "The earth can be harmed, and we're harming it.", "k": [{"q": "○  serious", "f": "Organisms and ecosystems are harmed. The planet's processes carry on, so \"harming the earth\" is a metaphor for harm to living things."}, {"q": "◐  bait", "f": "A rock can't be hurt. The earth is a big rock. So it can't be hurt, and the only thing in danger is our own comfort."}, {"q": "●  rage bait", "f": "The earth isn't a person. It doesn't get hurt. It's a rock with weather."}]}]}, {"n": "Mars", "i": "@marsaries", "u": [{"n": "Nietzsche & the philosophers", "t": [0, 1, 2, 3]}, {"n": "Honesty & lying", "t": [4, 5, 6]}, {"n": "Poker", "t": [7, 8, 9]}], "t": [{"t": "“Greek tragedy is anti-Nietzsche”", "p": "A plain reading of Greek tragedy cuts against Nietzsche. It isn't just that his history is off.", "k": [{"q": "○  serious", "f": "Nietzsche's claim is about what tragedy does to an audience. A plain reading of the plots doesn't obviously touch that."}, {"q": "◐  bait", "f": "The classicists took the book apart the year it came out. If the experts say he's wrong about the Greeks, he's wrong about the Greeks."}, {"q": "●  rage bait", "f": "Nietzsche made up the Greeks he needed."}]}, {"t": "“Derrida, Rorty and Wittgenstein are the worst”", "p": "Derrida, Rorty and Wittgenstein may be the worst philosophers of the twentieth century.", "k": [{"q": "○  serious", "f": "All three changed what their successors could take for granted, and that's the usual measure of importance."}, {"q": "◐  bait", "f": "The best philosopher is the one who solved the most problems. Wittgenstein solved all of them twice."}, {"q": "●  rage bait", "f": "Wittgenstein solved philosophy. Twice."}]}, {"t": "“Philosophy is procrastinating life”", "p": "Philosophy is the ultimate way of putting off living a good life.", "k": [{"q": "○  serious", "f": "For a lot of its history, philosophy was the practice of working out how to live."}, {"q": "◐  bait", "f": "You can't live a good life without knowing what one is. Finding out is philosophy. So it's the only thing that isn't procrastinating."}, {"q": "●  rage bait", "f": "The unexamined life is fine. Most people are busy."}]}, {"t": "“Kant's grammar is under everything”", "p": "Kant's grammar of duty runs under everything, whatever people say they've replaced it with.", "k": [{"q": "○  serious", "f": "Consequentialists and virtue theorists would deny that. \"Ought\" was in use long before Kant."}, {"q": "◐  bait", "f": "Kant lived in one town his whole life and never met anyone unlike himself. An ethics from that is an ethics for that town."}, {"q": "●  rage bait", "f": "Kantian ethics is what a guy who never left town comes up with."}]}, {"t": "“Only tell the truth and nobody can lie to you”", "p": "If you only ever tell the truth, it becomes much harder for people to lie to you.", "k": [{"q": "○  serious", "f": "Honest people get lied to regularly. Being truthful doesn't give you a detector."}, {"q": "◐  bait", "f": "Liars know all the tricks because they use them. So the best lie detector is a liar, and honest people are the last to find out."}, {"q": "●  rage bait", "f": "Marketing is lying with a budget."}]}, {"t": "“It's the reaction, not the lie”", "p": "What sets things off is how someone reacts to being called a liar, more than the lie.", "k": [{"q": "○  serious", "f": "Reacting badly to an accusation is what both the guilty and the innocent do."}, {"q": "◐  bait", "f": "If you call anyone a liar they get upset. So getting upset tells you nothing, and the test is useless."}, {"q": "●  rage bait", "f": "Language was invented by whoever needed to lie first."}]}, {"t": "“Trolling isn't lying”", "p": "Trolling and lying aren't the same thing.", "k": [{"q": "○  serious", "f": "The difference is intent to be found out later, and to the person on the receiving end it often feels the same."}, {"q": "◐  bait", "f": "Saying something false on purpose is lying. Trolling is saying something false on purpose. The rest is branding."}, {"q": "●  rage bait", "f": "Irony is just meaning it with an exit."}]}, {"t": "“Poker is skill”", "p": "Poker is a game of skill.", "k": [{"q": "○  serious", "f": "Over a long run, yes. In the short run it's mostly variance, and most players never reach the long run."}, {"q": "◐  bait", "f": "You can't choose your cards. The cards decide who wins. So it's the cards."}, {"q": "●  rage bait", "f": "Poker is pure luck. The cards decide."}]}, {"t": "“Reads are a real edge”", "p": "Reading people is a real edge at the table.", "k": [{"q": "○  serious", "f": "Betting patterns carry most of the information. Physical tells matter much less than the films suggest."}, {"q": "◐  bait", "f": "Everyone thinks they can tell when someone's lying. Tests say they're at fifty percent. So the edge is a coin."}, {"q": "●  rage bait", "f": "A \"read\" is a guess you got away with."}]}, {"t": "“You can make an honest living at poker”", "p": "You can make an honest living at it.", "k": [{"q": "○  serious", "f": "A few do. Most who say so make their money from staking, coaching or content."}, {"q": "◐  bait", "f": "For one person to win, another has to lose. So the living comes out of someone's rent. That's the business."}, {"q": "●  rage bait", "f": "Poker is the only honest job."}]}]}, {"n": "Meliorne", "i": "@meliorne", "u": [{"n": "Laws, dice & boiling water", "t": [0, 1, 2]}, {"n": "Resurrection & copies", "t": [3, 4, 5]}, {"n": "The red & blue button", "t": [6, 7, 8]}], "t": [{"t": "“A law could have a hidden exception”", "p": "A law could have a rare alternative outcome that simply never happened, and we'd never know.", "k": [{"q": "○  serious", "f": "A chance that never shows up in trillions of trials is indistinguishable from no chance. The simpler law wins."}, {"q": "◐  bait", "f": "If it never happens, it can't happen. That's what never means. So the law doesn't have the exception, and the universe isn't hiding one."}, {"q": "●  rage bait", "f": "Laws of nature are just habits the universe hasn't broken yet."}]}, {"t": "“Boiling water and dice are alike”", "p": "Water boiling and a die landing are alike. Each is just a result that happens in the world.", "k": [{"q": "○  serious", "f": "One follows from conditions we can state and control. The other is sensitive to conditions we can't measure. That difference matters."}, {"q": "◐  bait", "f": "A die roll is physics too. Throw it exactly the same way and you get the same number. So nothing is random, including the die."}, {"q": "●  rage bait", "f": "A dice roll isn't random, it's lazy physics."}]}, {"t": "“We only see the macro level”", "p": "Things look uniform to us because we only see the macro result. The micro level could be doing something else.", "k": [{"q": "○  serious", "f": "Macro regularity is what laws describe. Unobservable micro variation that averages out makes no difference to them."}, {"q": "◐  bait", "f": "If we can only see the macro level, then the macro level is all there is evidence for. The rest is imagination."}, {"q": "●  rage bait", "f": "Infinity isn't a number, so nothing is infinite."}]}, {"t": "“An exact copy raises the real question”", "p": "An exact atomic copy, with different atoms in the same arrangement, raises the real question about who that is.", "k": [{"q": "○  serious", "f": "If pattern is what matters, the copy is as good as the original. If it isn't, something beyond pattern needs naming."}, {"q": "◐  bait", "f": "You don't have the atoms you were born with. Nobody held a funeral. So the atoms never mattered and the copy is you."}, {"q": "●  rage bait", "f": "The teleporter is fine. Atoms get replaced every seven years anyway."}]}, {"t": "“Resurrection can be at any point”", "p": "Resurrection doesn't have to mean coming back at the instant after death. Any point would count.", "k": [{"q": "○  serious", "f": "If any stage counts, it's unclear which one is \"the person.\" A four-year-old Einstein isn't the man who wrote the papers."}, {"q": "◐  bait", "f": "If you can bring him back at any age, you can bring him back at two ages at once. Then there's two. Two can't be one person."}, {"q": "●  rage bait", "f": "Resurrection is just a copy with good timing."}]}, {"t": "“We could rebuild a brain”", "p": "With enough mastery of biology we could read off a brain's structure and rebuild it.", "k": [{"q": "○  serious", "f": "The information needed disperses at death, and entropy makes exact recovery a practical impossibility."}, {"q": "◐  bait", "f": "The brain is a computer. Copy the file and that's the person. The only hard part is the cable."}, {"q": "●  rage bait", "f": "The brain is a computer. Upload it and that's the person. Easy."}]}, {"t": "“Reds only press red out of uncertainty”", "p": "Reds only press red because they don't know the outcome. It isn't principle.", "k": [{"q": "○  serious", "f": "Acting on uncertainty about the outcome is a principle. It's prudence under risk, and decision theory is built on it."}, {"q": "◐  bait", "f": "If you knew blue would win, you'd press blue. If you knew it would lose, you'd press red. So nobody votes on principle, and the blues are guessing with nicer language."}, {"q": "●  rage bait", "f": "Red is retarded."}]}, {"t": "“Vote on principle”", "p": "People should vote on principle, whatever the likely result.", "k": [{"q": "○  serious", "f": "A principle that ignores the likely result can cost lives for the sake of a gesture."}, {"q": "◐  bait", "f": "A vote that ignores what will happen is a vote for nothing happening the way you wanted. That's a diary entry."}, {"q": "●  rage bait", "f": "Blue pressers are gambling with their life to feel like good people."}]}, {"t": "“'I'll do good with my life' is a lie”", "p": "\"I'll press red and use my life to do good\" is a lie people tell themselves.", "k": [{"q": "○  serious", "f": "Some people would follow through. Predicting that none of them will is a guess about strangers."}, {"q": "◐  bait", "f": "A living person can do good and a dead one can't. That's just true. So red does more good, and the tears are optional."}, {"q": "●  rage bait", "f": "You can press red with tears in your eyes and still be right."}]}]}, {"n": "monkey", "i": "@papagaio", "u": [{"n": "Brazil", "t": [0, 1, 2, 3, 4]}, {"n": "Europe & gringos", "t": [5, 6, 7, 8]}, {"n": "Football", "t": [9, 10, 11, 12, 13]}, {"n": "Jiu-jitsu", "t": [14, 15, 16, 17, 18]}, {"n": "VFX & film work", "t": [19, 20, 21, 22, 23]}], "t": [{"t": "“You need the context to judge Brazil”", "p": "You can't judge Brazil without knowing the context: development, rural migration, how the politics got this way.", "k": [{"q": "○  serious", "f": "Every country has context. At some point outcomes are fair to judge alongside the history that explains them."}, {"q": "◐  bait", "f": "A country is its results. Brazil's results are in, and they've been the same since before anyone alive was born, so there's nothing left to explain."}, {"q": "●  rage bait", "f": "Brazil is not a serious country."}]}, {"t": "“São Paulo and Rio are different worlds”", "p": "São Paulo and Rio are different worlds. One faction runs things in São Paulo. Rio is a turf war.", "k": [{"q": "○  serious", "f": "From outside, the difference between one crime monopoly and four competing ones is a detail."}, {"q": "◐  bait", "f": "A city is either safe or it isn't. Neither is, so they're the same city with different beaches, and one of them doesn't have a beach."}, {"q": "●  rage bait", "f": "Rio is São Paulo for tourists and São Paulo is Rio for people with jobs."}]}, {"t": "“Brazilians aren't Latino”", "p": "Brazilians aren't \"Latino\" in the sense Americans mean.", "k": [{"q": "○  serious", "f": "Whatever the census says, Brazil shares the colonial history, the religion and most of the politics of its neighbors."}, {"q": "◐  bait", "f": "Latin America means the part of America that speaks a Latin language. Portuguese is one. That means Brazilians are the most Latino of all, since there are more of them."}, {"q": "●  rage bait", "f": "Portuguese is just bad Spanish."}]}, {"t": "“Lula and Bolsonaro aren't the same”", "p": "Lula and Bolsonaro are not the same thing.", "k": [{"q": "○  serious", "f": "Both governed through the same congressional bloc and the same pork. The rhetoric differs more than the method."}, {"q": "◐  bait", "f": "In Brazil the Congress decides everything and the president signs. So it doesn't matter who the president is, and it never has."}, {"q": "●  rage bait", "f": "Lula and Bolsonaro are the same guy with different hats."}]}, {"t": "“South American farming is the most efficient”", "p": "South American agriculture is more efficient than Europe's or America's.", "k": [{"q": "○  serious", "f": "Yields are high, partly on cleared land and loose enforcement. Efficiency figures look different when that's priced in."}, {"q": "◐  bait", "f": "Farming is putting seeds in the ground, and Brazil has the most ground. So it's size. A country can't take credit for being big."}, {"q": "●  rage bait", "f": "Farming is easy. Plants want to grow."}]}, {"t": "“EU climate rules target South American farms”", "p": "European climate rules are partly a pretext for hobbling South American farming.", "k": [{"q": "○  serious", "f": "The deforestation rules apply to European producers too, and the science behind them isn't a trade invention."}, {"q": "◐  bait", "f": "Europe has no forests left, so it has nothing to lose from forest rules. That means the rules are free for them and only cost Brazil, which proves the motive."}, {"q": "●  rage bait", "f": "Europe peaked and it's a museum now. Brazil never peaked, which is worse."}]}, {"t": "“Gringos don't get Brazil”", "p": "Gringos don't get Brazil.", "k": [{"q": "○  serious", "f": "Outsiders miss a lot. Insiders miss things too, and in more flattering directions."}, {"q": "◐  bait", "f": "If only Brazilians can understand Brazil, then nobody can check what they say about it. That's convenient, and it's why the country never has to explain itself."}, {"q": "●  rage bait", "f": "The best thing about Brazil is leaving it and missing it."}]}, {"t": "“Portugal and Brazil are separate now”", "p": "Portugal and Brazil are their own things now. The colonial link doesn't define either.", "k": [{"q": "○  serious", "f": "Language, law, religion and a lot of the class structure came over on the boats and stayed."}, {"q": "◐  bait", "f": "A colony is a copy of the country that founded it. Copies are always worse than the original, so Brazil is a worse Portugal, and Portugal isn't great."}, {"q": "●  rage bait", "f": "Brazilian Portuguese is Portuguese with the consonants removed."}]}, {"t": "“Europe isn't the model”", "p": "Europe isn't the model it thinks it is.", "k": [{"q": "○  serious", "f": "On health, safety and inequality, most of Europe still outperforms most of the Americas by a wide margin."}, {"q": "◐  bait", "f": "Small countries are easy to run, and Europe is all small countries. So Europe's success is a matter of size, and it proves nothing about anything."}, {"q": "●  rage bait", "f": "Denmark only works because it's small and everyone's cousins."}]}, {"t": "“Brazil fell with the national team”", "p": "Brazil's decline tracks the decline of the national team.", "k": [{"q": "○  serious", "f": "The team's slump is better explained by European clubs taking players at sixteen than by anything national."}, {"q": "◐  bait", "f": "Brazil stopped winning in 2002 and stopped mattering in 2002. The same year can't be a coincidence, so the whole country was the squad."}, {"q": "●  rage bait", "f": "Brazil is the most overrated football country. Five cups, none since 2002."}]}, {"t": "“Football's boring but you have to watch”", "p": "Football is boring, but you watch the national team because you have to.", "k": [{"q": "○  serious", "f": "If the national side is an obligation, that says something about what the sport is doing for people."}, {"q": "◐  bait", "f": "If Brazilians find football boring then nobody likes it, since they're the ones who are supposed to. That means the sport is one long misunderstanding."}, {"q": "●  rage bait", "f": "Football is ninety minutes of nothing happening and then someone falls over."}]}, {"t": "“There's more to football than goals”", "p": "There's more to the game than putting the ball in the goal.", "k": [{"q": "○  serious", "f": "The scoreboard only counts goals, so everything else is in service of that or decoration."}, {"q": "◐  bait", "f": "The rules say the team with more goals wins. Nothing else is in the rules, so nothing else is in the game."}, {"q": "●  rage bait", "f": "Step-overs are for people who can't shoot."}]}, {"t": "“Pelé is the greatest”", "p": "Pelé still counts as the greatest.", "k": [{"q": "○  serious", "f": "His totals include friendlies and exhibitions, and the level of his opposition is hard to compare with today's."}, {"q": "◐  bait", "f": "Pelé never played in Europe, and Europe is where the good players are. That means he was never tested, and an untested player can't be the best at anything."}, {"q": "●  rage bait", "f": "Messi is better than Pelé and it's not close. Pelé scored against plumbers."}]}, {"t": "“This generation is good enough”", "p": "The current generation, Vini and Endrick and the rest, is good enough.", "k": [{"q": "○  serious", "f": "Vinícius has been a different player for Brazil than for Madrid, and the hype around Brazilian teenagers has a poor record."}, {"q": "◐  bait", "f": "Ancelotti won everything with Madrid by standing still. Brazil hired him to stand still, and the players aren't Madrid's. So that's that."}, {"q": "●  rage bait", "f": "Argentina has better football."}]}, {"t": "“Technique beats size”", "p": "Rolling with technical people is the point. Strength and size are the lesser game.", "k": [{"q": "○  serious", "f": "Weight classes exist because size matters a great deal, and technique closes less of the gap than the mats suggest."}, {"q": "◐  bait", "f": "If technique beat size there'd be no weight classes. There are weight classes, so size wins, so the art is lifting."}, {"q": "●  rage bait", "f": "Jiu-jitsu is hugging with a ranking system."}]}, {"t": "“White belts need humbling”", "p": "New white belts who think they're tough need their egos crushed.", "k": [{"q": "○  serious", "f": "Hazing beginners selects for people who put up with it, and that isn't the same as people who'd be good."}, {"q": "◐  bait", "f": "Somebody who's been training for years beats somebody who started on Monday. That proves nothing about anyone, and they've made a ritual out of it."}, {"q": "●  rage bait", "f": "Belts are for holding up pants."}]}, {"t": "“Don't shoot in BJJ”", "p": "You can't just shoot for takedowns in BJJ. You'll end up somewhere bad.", "k": [{"q": "○  serious", "f": "That's a fact about the ruleset. With strikes allowed, the wrestler's takedown is the safer bet."}, {"q": "◐  bait", "f": "A takedown puts you on top, and on top is winning. So a sport that's scared of takedowns is scared of winning."}, {"q": "●  rage bait", "f": "Wrestlers beat BJJ guys, and they learned it for free in high school."}]}, {"t": "“Boring matches are fine”", "p": "Matches are boring for ordinary viewers, and that's fine.", "k": [{"q": "○  serious", "f": "A sport that can't hold a casual viewer has a scoring system rewarding the wrong things."}, {"q": "◐  bait", "f": "A sport is something people watch. Nobody watches this, so it's exercise with a bracket."}, {"q": "●  rage bait", "f": "Watching BJJ is watching a hug get reviewed."}]}, {"t": "“English names every position”", "p": "English names every tiny variation of a position. Portuguese gets by with far fewer.", "k": [{"q": "○  serious", "f": "More names usually means more analysis. The catalogue is how the technique got refined."}, {"q": "◐  bait", "f": "If a position doesn't have a name, nobody can teach it. English has the names, so the Americans are the ones who understand it now."}, {"q": "●  rage bait", "f": "BJJ is judo that hired a publicist."}]}, {"t": "“Post is real craft”", "p": "Post-production is real craft. The audience just doesn't see it.", "k": [{"q": "○  serious", "f": "A lot of it is cleanup and integration of decisions made by other people, which is skilled, and also secondary."}, {"q": "◐  bait", "f": "If nobody can see the work, then the work made no difference. That's what \"can't see it\" means. So the craft is invisible because it isn't there."}, {"q": "●  rage bait", "f": "Compositing is tracing with more monitors."}]}, {"t": "“Ads are filmmaking”", "p": "Advertising work is still filmmaking.", "k": [{"q": "○  serious", "f": "Thirty seconds of a product is a different craft with a different goal. It shares the equipment."}, {"q": "◐  bait", "f": "A film is made because someone had something to say. An ad is made because someone had something to sell. Those are opposites, so one of them isn't filmmaking."}, {"q": "●  rage bait", "f": "Ads aren't filmmaking."}]}, {"t": "“AI clips aren't production-ready”", "p": "A generated clip isn't production-ready. You need proper timecode, clean cuts, the boring correct stuff.", "k": [{"q": "○  serious", "f": "The boring correct stuff is exactly what software is good at. That gap closes first."}, {"q": "◐  bait", "f": "Every objection to AI video is about version one. Version two fixed it, so every objection is already out of date by the time it's said."}, {"q": "●  rage bait", "f": "VFX is over. The button exists now."}]}, {"t": "“Finding the take is a skill”", "p": "Knowing where a take really starts and ends is its own skill.", "k": [{"q": "○  serious", "f": "It's a skill, and it's also pattern recognition over footage. That's a short list of things machines do well."}, {"q": "◐  bait", "f": "A take starts when they say action and ends when they say cut. They say it out loud. It's the one job on set with the answer read to you."}, {"q": "●  rage bait", "f": "Editing is deleting the bad parts lmao. Anyone can find the bad parts."}]}, {"t": "“Pipeline matters”", "p": "Tools and pipeline matter. Node graphs, proper color, the right setup.", "k": [{"q": "○  serious", "f": "Most shots come out the same in a layer stack. The node graph is for the artist's comfort."}, {"q": "◐  bait", "f": "Color grading is picking a look, and the looks are orange or grey. That's two options, so it's a switch."}, {"q": "●  rage bait", "f": "Color grading is a filter. Instagram has had it since 2011."}]}]}, {"n": "My Name", "i": "@myname1", "u": [{"n": "Claude & AI pricing", "t": [0, 1, 2, 3]}, {"n": "Investing", "t": [4, 5, 6, 7, 8]}, {"n": "Money, inflation & debt", "t": [9, 10, 11, 12, 13]}, {"n": "Lines of flight", "t": [14, 15, 16, 17]}, {"n": "Homelessness & housing", "t": [18, 19, 20, 21]}, {"n": "Football", "t": [22, 23, 24, 25]}], "t": [{"t": "“Get the plan, not the API”", "p": "The subscription plans beat API pricing for nearly everyone.", "k": [{"q": "○  serious", "f": "The plans win until you reach the caps, and heavy users reach them mid-task."}, {"q": "◐  bait", "f": "Paying per token means paying for what you use, and that's always the fairest price. A flat plan means somebody is overpaying, and the house decides who."}, {"q": "●  rage bait", "f": "API pricing is a scam and so is the plan."}]}, {"t": "“They hook you then raise prices”", "p": "The labs hook you on cheap access and raise the price once you depend on it.", "k": [{"q": "○  serious", "f": "Prices per token have dropped steeply over time. The dependence is real and the price trend is the opposite."}, {"q": "◐  bait", "f": "Companies can charge whatever they like, and they like more. So the price only ever goes up, and anyone who says it went down is looking at the wrong tab."}, {"q": "●  rage bait", "f": "Claude won't help with anything fun, so it's a worse Google with opinions."}]}, {"t": "“Some genius with a laptop GPU will crack it”", "p": "Somebody clever with a weak GPU in the middle of nowhere will unlock something big.", "k": [{"q": "○  serious", "f": "Frontier results have tracked compute closely. Efficiency tricks tend to get absorbed by whoever has the most hardware."}, {"q": "◐  bait", "f": "Ideas are free and anyone can have one. Computers only run the idea. So the labs with the most computers have no advantage at all."}, {"q": "●  rage bait", "f": "The next Steve Jobs is going to be an AI."}]}, {"t": "“GPUs are getting priced out”", "p": "The hardware squeeze is real: GPUs are getting priced out of reach.", "k": [{"q": "○  serious", "f": "High-end prices rose, and capable used and mid-range cards are still widely available. The squeeze is at the top."}, {"q": "◐  bait", "f": "Everything in computing gets cheaper every year. That's Moore's law, and it's a law. So GPUs are cheaper now and people complaining can't read a receipt."}, {"q": "●  rage bait", "f": "Local models are for people who want to say they run local models."}]}, {"t": "“Learn to invest”", "p": "Investing is important, and people should learn to do it.", "k": [{"q": "○  serious", "f": "Most active investors underperform a cheap index fund after fees. For most people, learning to invest means learning to stop picking."}, {"q": "◐  bait", "f": "Nobody knows what a stock will do tomorrow. If nobody knows, it's chance, and a game of chance with money on it has a name."}, {"q": "●  rage bait", "f": "Investing is gambling."}]}, {"t": "“Buy below your DCF”", "p": "With a DCF you trust, you buy where the price sits well under the value.", "k": [{"q": "○  serious", "f": "A DCF is only as good as its growth and discount assumptions, and small changes swing the answer wildly."}, {"q": "◐  bait", "f": "The price is what the whole market thinks it's worth. One guy with a spreadsheet can't know more than the whole market, so the DCF is always the one that's wrong."}, {"q": "●  rage bait", "f": "DCF is fan fiction about a company's future."}]}, {"t": "“Below book value is a bargain”", "p": "A company trading below the cash and assets on its books is a bargain.", "k": [{"q": "○  serious", "f": "Assets on a balance sheet can be worth much less in practice, especially loans to borrowers who are already behind."}, {"q": "◐  bait", "f": "If it were really worth more than its price, someone richer would have bought it already. Nobody did. So it's worth less, and the balance sheet is fiction."}, {"q": "●  rage bait", "f": "Imagine thinking you found a bargain the entire market missed lol."}]}, {"t": "“Don't borrow on unstable cash flow”", "p": "Debt against an unstable cash flow is a trap.", "k": [{"q": "○  serious", "f": "Debt is fine when the return on what it funds beats the interest. Stability matters less than the spread."}, {"q": "◐  bait", "f": "Borrowed money is free until you pay it back, and you can always borrow more to do that. That means debt never has to cost anything."}, {"q": "●  rage bait", "f": "Debt is a tool and poor people use it wrong."}]}, {"t": "“Invest well enough to kill bad ideas”", "p": "If you invest well enough, you can buy out the bad ideas and kill them.", "k": [{"q": "○  serious", "f": "Capital markets don't pick ideas by merit. Bad ideas with good margins get funded for decades."}, {"q": "◐  bait", "f": "Money goes to whatever makes money, and whatever makes money is what people want. So nothing that gets funded is a bad idea."}, {"q": "●  rage bait", "f": "The stock market is a casino. Same thing. One has a dress code."}]}, {"t": "“Technology is deflationary”", "p": "Technology is deflationary. It collapses costs.", "k": [{"q": "○  serious", "f": "Costs fall in the sectors technology touches, and the savings get spent elsewhere. The overall price level is set by money and demand."}, {"q": "◐  bait", "f": "Prices have gone up every year since computers were invented. So technology causes inflation. The chart is the chart."}, {"q": "●  rage bait", "f": "Inflation is the government printing money. That's it. That's the whole field."}]}, {"t": "“Debt builds the economy”", "p": "Debt is a way of building the economy out now, not just a burden to be inflated away later.", "k": [{"q": "○  serious", "f": "That holds when the borrowing funds productive assets. Much of it funds consumption and asset prices."}, {"q": "◐  bait", "f": "A country that owes money is poorer than one that doesn't. The countries with the most debt are the richest ones. So debt makes you rich, and everyone should have as much as possible."}, {"q": "●  rage bait", "f": "Loans are free money if you never plan to stop."}]}, {"t": "“Own assets to beat inflation”", "p": "The way to beat inflation is to own productive assets.", "k": [{"q": "○  serious", "f": "That swaps inflation risk for market risk. In the short run, asset prices can fall while prices rise."}, {"q": "◐  bait", "f": "Inflation only hurts people who hold cash. Holding cash is a choice. So inflation is a tax on people who chose it."}, {"q": "●  rage bait", "f": "Inflation only hurts people who hold cash, and that's their fault."}]}, {"t": "“Secured lending is safe”", "p": "A lender that takes the property if you can't pay is on solid ground.", "k": [{"q": "○  serious", "f": "Collateral protects the lender when the asset holds its value. Property values fall in the same downturn that causes the defaults."}, {"q": "◐  bait", "f": "Houses never go down, because they aren't making more land. So a loan against a house can't lose, and that has been true every year except the ones people remember."}, {"q": "●  rage bait", "f": "Yield is free. That's what makes it yield."}]}, {"t": "“The dollar's shakier than you think”", "p": "The dollar's position is shakier than people assume.", "k": [{"q": "○  serious", "f": "Its end has been announced regularly since 1971, and its share of reserves and trade is still dominant."}, {"q": "◐  bait", "f": "Money is only worth what's behind it, and nothing is behind the dollar since 1971. So it has been worth nothing for fifty years and people haven't noticed."}, {"q": "●  rage bait", "f": "Gold is the only real money and the rest is paper with a president on it."}]}, {"t": "“Lines of flight are useful”", "p": "\"Lines of flight\" is a useful idea: the ways out of a fixed arrangement.", "k": [{"q": "○  serious", "f": "The concept gives no way to tell a liberating exit from a destructive one. Deleuze admits lines of flight can go bad."}, {"q": "◐  bait", "f": "A line goes from one place to another place. So a line of flight just ends up somewhere else that's also a place. Nothing has been escaped."}, {"q": "●  rage bait", "f": "Deleuze is a fraud. A line of flight is a guy quitting his job."}]}, {"t": "“Maximize lines of flight”", "p": "You can treat it as an ethic: act so as to maximize lines of flight.", "k": [{"q": "○  serious", "f": "Maximizing exits says nothing about where to go, so it can't guide a choice between two exits."}, {"q": "◐  bait", "f": "Kant's rule tells you what to do. This one tells you to keep being able to do other things. A rule that never picks anything isn't a rule."}, {"q": "●  rage bait", "f": "\"Deterritorialization\" means moving."}]}, {"t": "“Be schizo about capital”", "p": "You can be \"schizo\" about forces and capital, not just about people. That's the point of the books.", "k": [{"q": "○  serious", "f": "Using a clinical term as a model of liberation was careless then, and it has aged badly."}, {"q": "◐  bait", "f": "A book that costs thirty dollars and is sold in shops is part of capitalism. So it can't be against capitalism. It's a product."}, {"q": "●  rage bait", "f": "Capitalism and Schizophrenia has a price on the back."}]},
